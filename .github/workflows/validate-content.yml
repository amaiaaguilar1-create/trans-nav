name: Validate content and build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate content against schemas
        run: npm run validate
      - name: Regenerate content types and fail if stale
        run: |
          npm run gen-types -w pipeline
          git diff --exit-code -- site/src/types/content.d.ts || (echo "::error::site/src/types/content.d.ts is stale; run npm run gen-types -w pipeline" && exit 1)
      - name: Type-check site
        run: npx astro check
        working-directory: site
      - name: Build site
        run: npm run build
