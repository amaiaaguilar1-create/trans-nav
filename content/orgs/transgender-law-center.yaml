description:
  en: >-
    National trans-led legal organization based in Oakland. Runs a free legal information helpdesk (510-587-9696 in
    English, 415-296-2029 in Spanish, and a collect line at 510-380-8229 for people who are incarcerated or detained),
    an online intake form, and publishes the "ID Please" guide to changing California and federal identity documents.
  es: >-
    Organización legal nacional dirigida por personas trans con sede en Oakland. Ofrece una línea gratuita de
    información legal (510-587-9696 en inglés, 415-296-2029 en español y una línea de cobro revertido 510-380-8229 para
    personas encarceladas o detenidas), un formulario de admisión en línea y publica la guía "ID Please" sobre cambios
    de documentos de identidad en California y a nivel federal.
