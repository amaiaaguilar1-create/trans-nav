description:
  en: National organization formed by the 2024 merger of the National Center for Transgender Equality and the Transgender Legal Defense & Education Fund. Runs the ID Documents Center (state-by-state guides), the Name Change Project (pro bono attorneys in some metros), the Trans Legal Services Network directory, and the Trans Health Project (insurance appeals).
  es: Organización nacional formada en 2024 por la fusión del National Center for Transgender Equality y el Transgender Legal Defense & Education Fund. Administra el ID Documents Center (guías por estado), el Name Change Project (abogados pro bono en algunas ciudades), el directorio Trans Legal Services Network y el Trans Health Project (apelaciones de seguros).
