program_status: active
notes:
  en: >-
    Hotline is active. Microgrants: no individual application is open. In 2025 the program distributed $100,000 through
    five regional partners; it plans $150,000 in 2026 prioritizing Black, Brown, and Indigenous trans people in the
    South and rural areas. Sign up on the microgrants page to hear when a channel opens.
  es: >-
    La línea está activa. Microsubvenciones: no hay solicitud individual abierta. En 2025 el programa distribuyó
    $100,000 a través de cinco socios regionales; planea $150,000 en 2026 con prioridad para personas trans negras,
    morenas e indígenas del Sur y zonas rurales. Suscríbete en la página de microsubvenciones para saber cuándo se abre un canal.
