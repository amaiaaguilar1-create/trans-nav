description:
  en: Peer-support and crisis hotline run by and for trans people (877-565-8860, English and Spanish), with no nonconsensual active rescue. Its microgrant program, which historically paid name change and ID document fees, now moves money through trans-led regional partner organizations rather than individual applications.
  es: Línea de apoyo y crisis dirigida por y para personas trans (877-565-8860, inglés y español). Su programa de microsubvenciones, que históricamente pagaba tarifas de cambio de nombre y documentos, ahora canaliza fondos a través de organizaciones regionales dirigidas por personas trans en lugar de solicitudes individuales.
