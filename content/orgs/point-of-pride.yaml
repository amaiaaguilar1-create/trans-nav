description:
  en: >-
    National nonprofit that pays for gender-affirming care for trans people who cannot afford it. Programs: the HRT
    Access Fund (18 months of free hormone therapy through partner telehealth providers Plume, FOLX, QueerMed, QueerDoc,
    TrueU, Spectrum, and Outpatient Family Medicine Transformed; applications open each May), the Annual Trans Surgery
    Fund (formerly the Jim Collins Foundation; applications November 1 to 30), the Electrolysis Support Fund, the Thrive
    Fund (wigs, prosthetics, fertility preservation, voice training), and free chest binders and femme shapewear by waitlist.
  es: >-
    Organización nacional que paga atención de afirmación de género para personas trans sin recursos. Programas: el
    Fondo de Acceso a TRH (18 meses de terapia hormonal gratuita con proveedores de telesalud asociados; solicitudes cada
    mayo), el Fondo Anual de Cirugía Trans (antes Jim Collins Foundation; solicitudes del 1 al 30 de noviembre), el Fondo
    de Electrólisis, el Fondo Thrive (pelucas, prótesis, preservación de fertilidad, entrenamiento de voz) y binders y
    prendas moldeadoras gratis por lista de espera.
scope: national
states_served: [ALL]
