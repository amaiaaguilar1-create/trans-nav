program_status: active
notes:
  en: >-
    2026 HRT Access Fund cycle (May 1 to 31) is closed; 153 people were funded. Next expected May 2027. Trans Surgery
    Fund applications open November 1 to 30, 2026 (very competitive: 28 of 1,588 applicants funded in 2026). Binder and
    shapewear programs are first-come, first-served with no deadline. Eligibility for funds: 18 or older, trans or
    nonbinary, financial need, living where a partner provider is licensed.
  es: >-
    El ciclo 2026 del Fondo de Acceso a TRH (1 al 31 de mayo) está cerrado; 153 personas recibieron fondos. El próximo
    se espera en mayo de 2027. Las solicitudes del Fondo de Cirugía Trans abren del 1 al 30 de noviembre de 2026 (muy
    competitivo). Los programas de binders y prendas moldeadoras no tienen fecha límite. Requisitos: 18 años o más,
    persona trans o no binaria, necesidad económica.
