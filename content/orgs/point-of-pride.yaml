description:
  en: National nonprofit funding gender-affirming care for trans people who cannot afford it, including an HRT Access Fund (a year of hormone therapy through partner telehealth providers), an Electrolysis Fund, a Thrive Fund for surgery and other costs, and a free chest binder and femme shapewear program.
  es: >-
    Organización nacional que financia atención de afirmación de género para personas trans sin recursos: un Fondo de Acceso a TRH (un año de terapia hormonal con proveedores de telesalud asociados), un Fondo de Electrólisis, un Fondo Thrive para cirugía y otros costos, y un programa gratuito de binders y prendas moldeadoras.
