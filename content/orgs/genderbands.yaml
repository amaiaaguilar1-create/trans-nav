description:
  en: Volunteer-run nonprofit giving small grants to trans people for surgery and for "social transition" costs, including hormone therapy, electrolysis, clothing, name change fees, and travel. Open to people 18 and older by the treatment date in the US, US territories, Canada, and Mexico.
  es: Organización sin fines de lucro dirigida por voluntarios que otorga pequeñas becas a personas trans para cirugía y para costos de transición social, incluidos terapia hormonal, electrólisis, ropa, tarifas de cambio de nombre y viajes. Para personas de 18 años o más en EE. UU., territorios, Canadá y México.
