notes:
  en: Surgery grant applications open each year October 1 to November 30. Check the site for social transition grant windows.
  es: Las solicitudes de becas para cirugía abren cada año del 1 de octubre al 30 de noviembre. Consulta el sitio para las fechas de becas de transición social.
