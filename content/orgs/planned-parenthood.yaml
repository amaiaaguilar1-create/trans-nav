description:
  en: >-
    Many Planned Parenthood affiliates provide informed-consent gender-affirming hormone therapy alongside sexual and
    reproductive health care, on a sliding scale and with Medicaid. Most affiliates see adults 18 and older; a few see
    16- and 17-year-olds with parental consent and a readiness letter. Many start hormone care by telehealth. Self-pay
    initial consults typically run about $120 to $250 before sliding-scale discounts.
  es: >-
    Muchas afiliadas de Planned Parenthood ofrecen terapia hormonal de afirmación de género por consentimiento
    informado junto con salud sexual y reproductiva, en escala móvil y con Medicaid. La mayoría atiende a adultos de 18
    años o más; algunas atienden a jóvenes de 16 y 17 con consentimiento de los padres y carta de preparación. Muchas
    inician la atención hormonal por telesalud.
