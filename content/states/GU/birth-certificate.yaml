    title:
      en: Correction and Amendment of Vital Records (name change by court order; sex change on surgeon's sworn statement)
      es: Corrección y enmienda de registros vitales (nombre por orden judicial; sexo con declaración jurada del cirujano)
    url: https://col.guamcourts.gov/sites/default/files/10gc003_Q.pdf
