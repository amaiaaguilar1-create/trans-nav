    accessed: "2026-09-24"
    quote: Upon receipt of a sworn statement from the physician performing the surgery certifying the sex of an individual has been changed by surgical procedure, and upon written request of an individual born in Guam, the sex of the individual shall be amended on the birth certificate to reflect such change.
