  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate is a judgment call for a territory with few written rules. Name change is a routine Superior Court petition
    (7 GCA ch. 36) with public posting, not newspaper publication. The birth certificate sex marker still requires a
    surgeon's sworn statement under 10 GCA § 3222(e) (Compiler of Laws text dated 2026-04-23). No written policy was found
    for driver's license sex markers. MAP's Guam profile, checked 2026-09-24, shows no youth care ban, no shield law, and
    no insurance nondiscrimination law.
overview:
  en: >-
    In Guam you can change your name through a standard Superior Court petition. Instead of a newspaper notice, the
    court's order is posted in public places for four weeks. Changing the sex marker is harder. A Guam birth certificate
    can be amended only with a sworn statement from the surgeon who performed gender-affirming surgery, and the Department
    of Revenue and Taxation has no written policy for driver's licenses. No Guam law bans gender-affirming care, but no law
    protects it either, and there are no known local informed-consent hormone clinics. The major national telehealth
    services do not currently serve Guam.
  es: >-
    En Guam puedes cambiar tu nombre mediante una petición estándar ante el Tribunal Superior. En lugar de un aviso en el
    periódico, la orden del tribunal se coloca en lugares públicos durante cuatro semanas. Cambiar el marcador de sexo es
    más difícil. El acta de nacimiento de Guam solo se puede enmendar con una declaración jurada del cirujano que realizó
    la cirugía de afirmación de género, y el Departamento de Ingresos e Impuestos no tiene una política escrita para las
    licencias de conducir. Ninguna ley de Guam prohíbe la atención de afirmación de género, pero tampoco la protege, y no
    se conocen clínicas locales de hormonas por consentimiento informado. Los principales servicios nacionales de
    telesalud no atienden Guam por ahora.
