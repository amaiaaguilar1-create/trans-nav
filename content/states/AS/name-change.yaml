status: restricted
status_summary:
  en: >-
    You can ask the High Court of American Samoa to change your name, but there is no statute or official form. The
    court requires notice in a newspaper and notice to your matai and immediate family, and no waiver or sealing is
    known. Talk to a lawyer before you file.
  es: >-
    Puedes pedir al Tribunal Superior de Samoa Americana que cambie tu nombre, pero no hay ley ni formulario oficial. El
    tribunal exige aviso en un periódico y aviso a tu matai y familia inmediata, y no se conoce exención ni sellado.
    Habla con un abogado antes de presentar.
summary:
  en: |
    American Samoa has **no name change statute**. The High Court recognizes the common-law right to change your name, and will grant a petition unless it is for a fraudulent purpose or infringes on others' rights (*Application of Amataga*, 1995; *In re Mase*, 2004).

    Based on those decisions and A4TE's guide:
    - You file a written **Petition for Name Change** and a **Notice of Hearing** with the High Court. There is no court form, so you or a lawyer draft them.
    - The court sets a hearing date. You **publish the notice twice in a newspaper of general circulation**, the first time at least 30 days before the hearing.
    - The court has also required **actual notice to your matai (family chief) and immediate family**.
    - At the hearing, you show proof of publication and notice. If granted, the order is sent to the Registrar of Vital Statistics.
  es: |
    Samoa Americana **no tiene ley de cambio de nombre**. El Tribunal Superior reconoce el derecho común a cambiar de nombre y concede la petición salvo que sea con fines fraudulentos o afecte derechos de otros (*Application of Amataga*, 1995; *In re Mase*, 2004).

    Según esas decisiones y la guía de A4TE:
    - Presentas por escrito una **Petición de Cambio de Nombre** y un **Aviso de Audiencia** ante el Tribunal Superior. No hay formulario, así que los redactas tú o un abogado.
    - El tribunal fija la audiencia. **Publicas el aviso dos veces en un periódico de circulación general**, la primera al menos 30 días antes.
    - El tribunal también ha exigido **aviso directo a tu matai (jefe familiar) y familia inmediata**.
    - En la audiencia muestras prueba de publicación y aviso. Si se concede, la orden se envía al Registro de Estadísticas Vitales.
steps:
  - id: draft
    title:
      en: Draft the petition and notice of hearing
      es: Redacta la petición y el aviso de audiencia
    body:
      en: |
        Include your citizenship or nationality and village of residence, your date of birth, your current name and the name you want, your reasons, and a statement that you are not changing your name to avoid law enforcement, legal process, or creditors and know of no pending legal action against you. Ask the court to set a hearing, grant the change, and send a certified copy of the order to the Registrar of Vital Statistics. Sign under oath before a notary.
      es: |
        Incluye tu ciudadanía o nacionalidad y aldea de residencia, tu fecha de nacimiento, tu nombre actual y el que quieres, tus motivos y una declaración de que no cambias tu nombre para evadir a la ley, procesos legales o acreedores y que no sabes de acciones legales pendientes en tu contra. Pide al tribunal que fije audiencia, conceda el cambio y envíe copia certificada de la orden al Registro de Estadísticas Vitales. Firma bajo juramento ante notario.
    sources: [a4te-as, amataga]
  - id: file
    title:
      en: File with the High Court
      es: Presenta ante el Tribunal Superior
    body:
      en: File in person at the High Court or by mail to High Court of American Samoa, P.O. Box 309, Pago Pago, AS 96799. Ask the clerk for the current filing fee and whether it can be waived.
      es: Presenta en persona en el Tribunal Superior o por correo a High Court of American Samoa, P.O. Box 309, Pago Pago, AS 96799. Pregunta en la secretaría la tarifa actual y si se puede eximir.
    sources: [a4te-as]
  - id: publish
    title:
      en: Publish the notice and notify your family
      es: Publica el aviso y notifica a tu familia
    body:
      en: When the court returns the notice with a hearing date, have it published twice in a local newspaper, the first time at least 30 days before the hearing. Give notice to your matai and immediate family. Keep proof of both.
      es: Cuando el tribunal devuelva el aviso con la fecha, publícalo dos veces en un periódico local, la primera al menos 30 días antes de la audiencia. Notifica a tu matai y familia inmediata. Guarda prueba de ambas cosas.
    sources: [a4te-as, amataga]
  - id: hearing
    title:
      en: Attend the hearing
      es: Asiste a la audiencia
    body:
      en: Bring proof of publication and notice. If notice is missing, the court may postpone the hearing and order you to give notice.
      es: Lleva prueba de publicación y aviso. Si falta, el tribunal puede posponer la audiencia y ordenarte dar aviso.
    sources: [amataga, a4te-as]
  - id: vital-stats
    title:
      en: File the order with Vital Statistics
      es: Presenta la orden en Estadísticas Vitales
    body:
      en: Send a certified copy of the order to the Office of Vital Statistics, P.O. Box 6894, Pago Pago, AS 96799, (684) 633-1405 or 633-1406. This records the name change but may not change your birth certificate (see the American Samoa birth certificate guide).
      es: Envía copia certificada de la orden a la Oficina de Estadísticas Vitales, P.O. Box 6894, Pago Pago, AS 96799, (684) 633-1405 o 633-1406. Esto registra el cambio, pero quizá no modifique tu acta de nacimiento (ver la guía de acta de Samoa Americana).
    sources: [a4te-as, mase]
publication:
  required: "yes"
  detail:
    en: Publication twice in a newspaper of general circulation, the first at least 30 days before the hearing, plus actual notice to your matai and immediate family.
    es: Publicación dos veces en un periódico de circulación general, la primera al menos 30 días antes de la audiencia, más aviso directo a tu matai y familia inmediata.
  waiver_available: false
  sources: [amataga, a4te-as]
hearing:
  required: "yes"
  sources: [amataga, a4te-as]
confidentiality:
  sealing_available: false
  detail:
    en: No procedure for sealing a name change case is known.
    es: No se conoce un procedimiento para sellar un caso de cambio de nombre.
  sources: [a4te-as]
minors:
  summary:
    en: There is no specific process for minors. A parent or guardian should consult an attorney.
    es: No hay un proceso específico para menores. El padre, madre o tutor debe consultar a un abogado.
  sources: [a4te-as]
after:
  en: |
    1. **Social Security** first (see the federal Social Security guide). The Office of Motor Vehicles expects your Social Security card to show the new name.
    2. **Driver's license or ID** (see the American Samoa driver's license guide).
    3. **Passport** (see the federal passport guide).
  es: |
    1. **Seguro Social** primero (ver la guía federal). La Oficina de Vehículos espera que tu tarjeta del Seguro Social muestre el nuevo nombre.
    2. **Licencia o identificación** (ver la guía de licencia de Samoa Americana).
    3. **Pasaporte** (ver la guía federal).
