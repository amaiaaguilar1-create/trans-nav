name_change_status: available
status_summary:
  en: >-
    You can update your name on an American Samoa license or ID after updating Social Security. American Samoa has no
    established policy for changing the sex marker.
  es: >-
    Puedes actualizar tu nombre en la licencia o identificación de Samoa Americana después de actualizar el Seguro
    Social. Samoa Americana no tiene una política establecida para cambiar el marcador de sexo.
summary:
  en: |
    Licenses and ID cards are issued by the **Department of Public Safety, Office of Motor Vehicle**.

    **Name:** there is no official guidance. Advocates recommend changing your name with Social Security first, then bringing the application, your certified High Court name change order, and your Social Security card showing the new name.

    **Sex marker:** there is no established policy. Ask the Office of Motor Vehicle in writing what it would accept. A lawyer can help if you are refused.
  es: |
    Las licencias e identificaciones las emite el **Departamento de Seguridad Pública, Oficina de Vehículos de Motor**.

    **Nombre:** no hay guía oficial. Organizaciones de defensa recomiendan cambiar primero el nombre en el Seguro Social y luego llevar la solicitud, la orden certificada del Tribunal Superior y tu tarjeta del Seguro Social con el nuevo nombre.

    **Marcador de sexo:** no hay una política establecida. Pregunta por escrito a la Oficina de Vehículos qué aceptaría. Un abogado puede ayudarte si te lo niegan.
steps:
  - id: ssa
    title:
      en: Update Social Security first
      es: Actualiza primero el Seguro Social
    body:
      en: Change your name with Social Security using your High Court order (see the federal Social Security guide).
      es: Cambia tu nombre en el Seguro Social con tu orden del Tribunal Superior (ver la guía federal).
    applies_to: [name_change]
    sources: [a4te-as]
  - id: omv
    title:
      en: Visit the Office of Motor Vehicle
      es: Visita la Oficina de Vehículos de Motor
    body:
      en: Bring your current license or ID, your certified name change order, your new Social Security card, and any ASG Immigration ID if you are not a U.S. citizen or national. Fill out the application at the office and pay the fee. For renewals, the office also requires a traffic history clearance from the District Court.
      es: Lleva tu licencia o identificación actual, la orden certificada de cambio de nombre, tu nueva tarjeta del Seguro Social y, si no eres ciudadano o nacional de EE. UU., tu identificación de inmigración de ASG. Llena la solicitud en la oficina y paga la tarifa. Para renovaciones, también piden una constancia de historial de tránsito del Tribunal de Distrito.
    applies_to: [in_person]
    sources: [a4te-as, as-omv-guide]
delivery:
  in_person: true
  sources: [as-omv-guide]
after:
