review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    The only official source found is the Department of Public Safety, Office of Motor Vehicle driver education study
    guide (PDF linked from americansamoa.gov), which covers documents for new licenses and renewals but not name or sex
    marker changes. Everything else is from A4TE's undated page. That includes updating Social Security first, bringing
    the court order and SSA card, the $12 fee for a 3-year license or ID, and the statement that there is "no established
    policy for amending the gender marker." The fee is not listed here because it could not be confirmed.
