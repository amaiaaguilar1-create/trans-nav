  es_status: machine_draft
  notes: >-
    American Samoa has no name change statute. The process comes from High Court decisions (Application of Amataga,
    1995; In re Mase, 9 Am. Samoa 3d 125, 2004) and A4TE's page. In Mase, the High Court held that A.S.C.A. § 13.0530
    does not let the Registrar amend a birth certificate after a name change, reasoning from Littleton v. Prange (Tex.
    1999). This supports "restrictive" for ID documents. asbar.org returns 403 to scripts but loads through a browser
    fetch. MAP's AS profile (2026-09-24) shows no youth care ban, no shield law, and a negative score for name change
    publication requirements. American Samoa Legal Aid's name change page (linked by A4TE) now returns 404, and no
    working site for the organization was found.
overview:
  en: >-
    American Samoa has no name change statute. The High Court grants name changes under common law after newspaper
    publication and notice to your matai and immediate family. There is no written procedure for changing the sex marker
    on a birth certificate or driver's license. A 2004 High Court decision held that the Registrar may not amend a birth
    certificate for a later name change, and its reasoning suggests sex marker changes would also be refused. No law bans
    gender-affirming care, but local access is very limited, and national telehealth services do not serve the
    territory.
  es: >-
    Samoa Americana no tiene una ley de cambio de nombre. El Tribunal Superior otorga cambios de nombre según el derecho
    común, tras publicación en el periódico y aviso a tu matai y familia inmediata. No hay un procedimiento escrito para
    cambiar el marcador de sexo en el acta de nacimiento ni en la licencia. Una decisión del Tribunal Superior de 2004
    determinó que el Registro no puede enmendar un acta por un cambio de nombre posterior, y su razonamiento sugiere que
    también se negarían los cambios de sexo. Ninguna ley prohíbe la atención de afirmación de género, pero el acceso
    local es muy limitado, y los servicios nacionales de telesalud no atienden el territorio.
