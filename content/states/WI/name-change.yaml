    title: Wis. Stat. § 786.37, Change of name, notice of petition
    publisher: Wisconsin State Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: >-
      The court may require the petitioner to comply with sub. (1) if the petitioner is unable to show, by a
