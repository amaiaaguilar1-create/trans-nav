sources:
  - id: wis-786-36
    url: https://docs.legis.wisconsin.gov/document/statutes/786.36
    title: Wis. Stat. § 786.36, Changing names, court procedure
    publisher: Wisconsin State Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: >-
      any resident of this state, whether a minor or adult, upon petition to the circuit court of the county where he or
      she resides and upon filing a copy of the notice required under s. 786.37 (1), with proof of publication, may, if no
      sufficient cause is shown to the contrary, have his or her name changed
  - id: wis-786-37
