status: available
status_summary:
  en: >-
    Adults and teens 14 and older can change their name by petitioning the circuit court in their county ($164.50, or
    free with a fee waiver). You must publish a notice in a local newspaper for three weeks before the hearing, unless
    you ask for a confidential name change and prove to the judge that publication could endanger you.
  es: >-
    Adultos y jóvenes de 14 años o más pueden cambiar su nombre con una petición al tribunal de circuito de su condado
    ($164.50, o gratis con exención de tarifas). Debes publicar un aviso en un periódico local durante tres semanas antes
    de la audiencia, a menos que pidas un cambio de nombre confidencial y demuestres al juez que la publicación podría
    ponerte en peligro.
summary:
  en: |
    Wisconsin name changes are governed by Wis. Stat. §§ 786.36 and 786.37. You file a petition with the clerk of circuit court in the **county where you live**, the clerk sets a hearing date, and a judge grants the change "if no sufficient cause is shown to the contrary." There is no special process for gender identity; trans people use the same petition as everyone else, and you do not need to give a medical reason.

    There are two paths:
    - **Standard name change** (CV-450): you must publish a notice of the hearing in a local newspaper once a week for three weeks before the hearing. The record is public.
    - **Confidential name change** (CV-451): no newspaper notice, and the clerk keeps the file confidential from the moment you file. At the hearing you must prove it is more likely than not that publication **could endanger you**, and that you are not changing your name to avoid a debt or hide a criminal record. If the judge says no, you can refile as a standard name change.

    Everyone has a hearing. Plan for one court appearance.
  es: |
    Los cambios de nombre en Wisconsin se rigen por los §§ 786.36 y 786.37 de los Estatutos de Wisconsin. Presentas una petición ante el secretario del tribunal de circuito del **condado donde vives**, se fija una audiencia y un juez concede el cambio "si no se demuestra causa suficiente en contra". No hay un proceso especial por identidad de género; las personas trans usan la misma petición que todos y no necesitas dar una razón médica.

    Hay dos vías:
    - **Cambio de nombre estándar** (CV-450): debes publicar un aviso de la audiencia en un periódico local una vez por semana durante tres semanas antes de la audiencia. El expediente es público.
    - **Cambio de nombre confidencial** (CV-451): sin aviso en el periódico, y el secretario mantiene el expediente confidencial desde que lo presentas. En la audiencia debes demostrar que es más probable que no que la publicación **podría ponerte en peligro**, y que no cambias tu nombre para evitar una deuda u ocultar antecedentes penales. Si el juez lo niega, puedes volver a presentar como cambio estándar.

    Todas las personas tienen una audiencia. Prepárate para comparecer una vez ante el tribunal.
eligibility:
  residency:
    en: You must be a Wisconsin resident and file in the circuit court of the county where you live.
    es: Debes residir en Wisconsin y presentar la petición en el tribunal de circuito del condado donde vives.
  age:
    en: Adults and minors 14 and older sign their own petition (CV-450 or CV-451). For children under 14, parents or a guardian petition; see Minors.
    es: Adultos y menores de 14 años o más firman su propia petición (CV-450 o CV-451). Para menores de 14, los padres o un tutor presentan la petición; ver Menores.
  criminal_history:
    en: >-
      People required to register as sex offenders may not change their name (Wis. Stat. § 301.47). Otherwise a
      criminal record does not bar a name change, but a court may deny a petition from someone in prison or on parole,
      and you cannot use the confidential process to hide a criminal record.
    es: >-
      Las personas obligadas a registrarse como delincuentes sexuales no pueden cambiar su nombre (§ 301.47). Fuera de
      eso, los antecedentes penales no impiden el cambio, pero un tribunal puede negar la petición de alguien en prisión
      o en libertad condicional, y no puedes usar el proceso confidencial para ocultar antecedentes.
  other:
    en: If you hold a state professional license (other than a public school teaching license), your licensing board can object to the new name; the petition asks you to confirm you have notified the board.
    es: Si tienes una licencia profesional estatal (que no sea de maestro de escuela pública), tu junta de licencias puede objetar el nuevo nombre; la petición te pide confirmar que notificaste a la junta.
  sources: [wis-786-36, wis-301-47, cv-490, cv-450-pdf]
forms:
  - id: CV-450
    name:
      en: Petition for Name Change for Adult or Minor 14 or Older
      es: Petición de cambio de nombre para adulto o menor de 14 años o más
    url: https://www.wicourts.gov/formdisplay/CV-450.pdf?formNumber=CV-450&formType=Form&formatId=2&language=en
    required: conditional
    condition:
      en: Use for a standard (published) name change.
      es: Úsalo para un cambio de nombre estándar (con publicación).
    how_to_fill:
      en: |
        - Items 1 to 5: your address, county, date and state of birth, and the name exactly as it appears on your birth certificate.
        - Items 6 and 7: your job and whether you hold a state professional license.
        - Item 8: whether you are a registered sex offender.
        - Item 9: the new name you want. Double-check spelling; the order copies it exactly.
        - "For the following reason(s)": a short, honest reason is enough, for example "to match my gender identity and the name I use." You do not need a doctor's letter.
        - Item 10: check this box if you were born (or married) in Wisconsin and want the birth (or marriage) certificate updated. The clerk then sends the change to Vital Records for a fee.
      es: |
        - Puntos 1 a 5: tu dirección, condado, fecha y estado de nacimiento, y el nombre tal como aparece en tu acta de nacimiento.
        - Puntos 6 y 7: tu trabajo y si tienes una licencia profesional estatal.
        - Punto 8: si estás registrado como delincuente sexual.
        - Punto 9: el nuevo nombre. Revisa la ortografía; la orden lo copia exactamente.
        - "Por las siguientes razones": basta una razón breve y honesta, por ejemplo "para que coincida con mi identidad de género y el nombre que uso". No necesitas carta médica.
        - Punto 10: marca esta casilla si naciste (o te casaste) en Wisconsin y quieres actualizar el acta. El secretario envía el cambio a Registros Vitales por una tarifa.
    sources: [cv-450-pdf]
  - id: CV-451
    name:
      en: Petition for Confidential Name Change for Adult or Minor 14 or Older
      es: Petición de cambio de nombre confidencial para adulto o menor de 14 años o más
    url: https://www.wicourts.gov/formdisplay/CV-451.pdf?formNumber=CV-451&formType=Form&formatId=2&language=en
    required: conditional
    condition:
      en: Use if newspaper publication could put you in danger. No publication; the file is confidential from filing.
      es: Úsalo si la publicación en el periódico podría ponerte en peligro. Sin publicación; el expediente es confidencial desde que se presenta.
    how_to_fill:
      en: |
        - Same personal information as CV-450.
        - Item 9 is the key item: explain **specifically** why publishing your old and new names could endanger you. Concrete facts carry weight: past threats, harassment, stalking, or violence (especially connected to being trans), a protective order, an abusive ex-partner or family member who could find you. The appeals court has said you must show it is more likely than not that you could be physically endangered, so general statements about risks to trans people may not be enough on their own.
        - Bring any evidence to the hearing: police reports, restraining orders, screenshots of threats, letters from an advocate or counselor.
        - Check the statement that you are not seeking the change to avoid a debt or conceal a criminal record.
      es: |
        - La misma información personal que el CV-450.
        - El punto 9 es el más importante: explica **de forma concreta** por qué publicar tu nombre anterior y el nuevo podría ponerte en peligro. Los hechos concretos pesan: amenazas, acoso, persecución o violencia previa (sobre todo por ser trans), una orden de protección, una expareja o familiar abusivo que podría encontrarte. El tribunal de apelaciones ha dicho que debes demostrar que es más probable que no que podrías correr peligro físico, así que las declaraciones generales sobre riesgos para personas trans pueden no bastar por sí solas.
        - Lleva pruebas a la audiencia: informes policiales, órdenes de restricción, capturas de amenazas, cartas de un defensor o consejero.
    sources: [cv-451-pdf, cv-491, wis-786-37]
