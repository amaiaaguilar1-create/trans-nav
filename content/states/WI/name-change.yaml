steps:
  - id: choose-path
    title:
      en: Decide between a standard and a confidential name change
      es: Decide entre un cambio de nombre estándar y uno confidencial
    body:
      en: |
        If you have real reasons to fear that someone could use a newspaper notice to find or hurt you, file the **confidential** petition (CV-451). Otherwise use the **standard** petition (CV-450). If a confidential petition is denied, the file stays confidential and you can start over with CV-450.

        Free help choosing and filling in forms: Trans Law Help Wisconsin clinics, and the Milwaukee Justice Center in the Milwaukee County Courthouse.
      es: |
        Si tienes razones reales para temer que alguien use un aviso en el periódico para encontrarte o hacerte daño, presenta la petición **confidencial** (CV-451). Si no, usa la petición **estándar** (CV-450). Si se niega la petición confidencial, el expediente sigue siendo confidencial y puedes empezar de nuevo con el CV-450.
    forms: [CV-450, CV-451]
    sources: [cv-490, cv-491]
  - id: fill-forms
    title:
      en: Fill out the petition, notice, and order, and make two copies
      es: Llena la petición, el aviso y la orden, y haz dos copias
    body:
      en: Complete the petition. Ask your clerk whether you also need to prepare the notice (CV-460 or CV-461) and the order (CV-470 or CV-471); some clerks prepare them. Make at least two copies of each. Also ask whether to bring your original or certified birth certificate to the hearing.
      es: Completa la petición. Pregunta al secretario si también debes preparar el aviso (CV-460 o CV-461) y la orden (CV-470 o CV-471). Haz al menos dos copias de cada uno. Pregunta también si debes llevar tu acta de nacimiento original o certificada a la audiencia.
    forms: [CV-450, CV-451, CV-460, CV-461, CV-470, CV-471]
    sources: [cv-490, cv-491]
  - id: fee-waiver
    title:
      en: Ask for a fee waiver if you qualify
      es: Pide una exención de tarifas si calificas
    body:
      en: File CV-410A with your petition. The court must waive the fee if you receive Medicaid (BadgerCare), FoodShare, SSI, or other means-tested assistance, or have a legal aid lawyer; otherwise the judge looks at your household size, income, expenses, and debts.
      es: Presenta el CV-410A con tu petición. El tribunal debe exentar la tarifa si recibes Medicaid (BadgerCare), FoodShare, SSI u otra asistencia basada en ingresos, o tienes un abogado de asistencia legal; si no, el juez considera el tamaño de tu hogar, ingresos, gastos y deudas.
    forms: [CV-410A, CV-410B]
    optional: true
    sources: [wis-814-29, cv-410a]
  - id: file
    title:
      en: File with the clerk of circuit court in your county
      es: Presenta los documentos ante el secretario del tribunal de circuito de tu condado
    body:
      en: File the originals and pay the $164.50 fee (or hand in your fee waiver). The clerk gives you a hearing date and returns stamped copies. Many counties also accept electronic filing.
      es: Presenta los originales y paga la tarifa de $164.50 (o entrega tu exención). El secretario te da una fecha de audiencia y te devuelve copias selladas.
    fees: [filing]
    sources: [cv-490, wi-fee-table]
  - id: publish
    title:
      en: Publish the notice for three weeks (standard path only)
      es: Publica el aviso durante tres semanas (solo vía estándar)
    body:
      en: |
        Contact a newspaper that prints legal notices where you live and ask it to publish the Notice of Name Change Hearing as a **class 3 notice** (once a week for three consecutive weeks) before your hearing date. The newspaper charges you directly and then sends you a proof of publication. Bring or file that proof before the hearing. Skip this step if you filed a confidential petition.
      es: |
        Contacta un periódico que publique avisos legales donde vives y pide que publique el Aviso de Audiencia como **aviso de clase 3** (una vez por semana durante tres semanas seguidas) antes de tu audiencia. El periódico te cobra directamente y luego te envía una prueba de publicación. Llévala o preséntala antes de la audiencia. Omite este paso si presentaste una petición confidencial.
    fees: [publication]
    estimated_time:
      en: 3 weeks before the hearing
      es: 3 semanas antes de la audiencia
    sources: [wis-786-37, cv-490, wicourts-namechange]
  - id: hearing
    title:
      en: Go to the hearing
      es: Asiste a la audiencia
    body:
      en: Arrive on time and tell the clerk you are there. You may be placed under oath and asked about your petition. On the confidential path, this is where you present your evidence of danger. If the judge grants the petition, they sign the order; if not, they sign an order denying it.
      es: Llega a tiempo y avisa al secretario. Te pueden tomar juramento y hacer preguntas sobre la petición. En la vía confidencial, aquí presentas tus pruebas de peligro. Si el juez concede la petición, firma la orden; si no, firma una orden de denegación.
    sources: [cv-490, cv-491]
  - id: certified-copies
    title:
      en: Buy certified copies and record the order
      es: Compra copias certificadas y registra la orden
    body:
      en: Buy at least two or three certified copies of the signed order from the clerk. The order must also be recorded with the county Register of Deeds ($30); in many counties the clerk collects this fee and handles it. If you were born in Wisconsin, the clerk sends the change to state Vital Records and collects that fee from you.
      es: Compra al menos dos o tres copias certificadas de la orden firmada. La orden también debe registrarse en el Registro de Escrituras del condado ($30); en muchos condados el secretario cobra la tarifa y se encarga. Si naciste en Wisconsin, el secretario envía el cambio a Registros Vitales y te cobra esa tarifa.
    fees: [certified-copies, register-of-deeds, vital-records-filing]
    sources: [wis-786-36, cv-491, wi-fee-table, wis-59-43, dhs-amend]
fees:
  - id: filing
    label:
      en: Circuit court filing fee, name change petition
      es: Tarifa de presentación en el tribunal de circuito, petición de cambio de nombre
    amount: 164.5
    waivable: true
    note:
      en: $75 filing fee plus $68 court support services and $21.50 justice information surcharges. Same for standard and confidential petitions.
      es: $75 de presentación más recargos de $68 y $21.50. Igual para peticiones estándar y confidenciales.
    sources: [wi-fee-table, name-change-chart]
  - id: publication
    label:
      en: Newspaper publication (standard path only)
      es: Publicación en el periódico (solo vía estándar)
    varies_by: vendor
    waivable: false
    note:
      en: Set by the newspaper and paid to it directly. A court fee waiver does not cover it; Trans Law Help Wisconsin's grant can.
      es: La fija el periódico y se le paga directamente. La exención de tarifas del tribunal no la cubre; la beca de Trans Law Help Wisconsin sí puede.
    sources: [wicourts-namechange, tlh-grant]
  - id: certified-copies
    label:
      en: Certified copy of the order (clerk of court)
      es: Copia certificada de la orden (secretario del tribunal)
    amount: 5
    varies_by: court
    note:
      en: $5 to certify each document plus $1.25 per page copied.
      es: $5 por certificar cada documento más $1.25 por página copiada.
    sources: [wi-fee-table]
  - id: register-of-deeds
    label:
      en: Recording the order with the Register of Deeds
      es: Registro de la orden en el Registro de Escrituras
    amount: 30
    sources: [wis-59-43, wis-786-36]
  - id: vital-records-filing
    label:
      en: Vital Records fee to amend a Wisconsin birth record after a name change
      es: Tarifa de Registros Vitales para enmendar el acta de nacimiento de Wisconsin tras un cambio de nombre
    amount: 10
    note:
      en: Does not include a copy. The first certified copy of the amended birth certificate is $20; each extra copy ordered at the same time is $3.
      es: No incluye copia. La primera copia certificada del acta enmendada cuesta $20; cada copia adicional pedida al mismo tiempo cuesta $3.
    sources: [dhs-amend]
fee_waiver:
  available: true
  forms: [CV-410A, CV-410B]
  eligibility:
    en: |
      The court must waive fees if **any one** applies (Wis. Stat. § 814.29(1)(d)):
      - You receive means-tested public assistance, such as Medicaid/BadgerCare, FoodShare, SSI, Wisconsin Works, or county relief.
      - A legal services program for low-income people represents you.
      - You otherwise cannot pay because of poverty (the judge considers household size, income, expenses, assets, debts, and the federal poverty guidelines).
    es: |
      El tribunal debe exentar las tarifas si se cumple **cualquiera** de estas condiciones (§ 814.29(1)(d)):
      - Recibes asistencia pública basada en ingresos, como Medicaid/BadgerCare, FoodShare, SSI, Wisconsin Works o ayuda del condado.
      - Te representa un programa de servicios legales para personas de bajos ingresos.
      - De otro modo no puedes pagar por pobreza (el juez considera el tamaño del hogar, ingresos, gastos, bienes, deudas y las guías federales de pobreza).
  how:
    en: File CV-410A with your petition. A waiver covers court fees but not the newspaper's publication charge.
    es: Presenta el CV-410A con tu petición. La exención cubre las tarifas del tribunal, pero no el cobro del periódico por la publicación.
  sources: [wis-814-29, cv-410a, tlh-grant]
publication:
  required: conditional
  detail:
    en: >-
      For a standard petition you must publish a class 3 notice (once a week for three weeks) in a local newspaper before
      the hearing (Wis. Stat. § 786.37(1)). Publication is not required if you file a confidential petition and prove, by
      a preponderance of the evidence, that publication could endanger you and that you are not trying to avoid a debt
      or conceal a criminal record (§ 786.37(4)). There is no automatic exemption for gender identity.
    es: >-
      Para una petición estándar debes publicar un aviso de clase 3 (una vez por semana durante tres semanas) en un
      periódico local antes de la audiencia (§ 786.37(1)). No se requiere publicación si presentas una petición
      confidencial y demuestras, por preponderancia de la prueba, que la publicación podría ponerte en peligro y que no
      intentas evitar una deuda ni ocultar antecedentes penales (§ 786.37(4)). No hay exención automática por identidad
      de género.
  waiver_available: true
  waiver_how:
    en: File CV-451 instead of CV-450, write specific reasons in item 9, and bring evidence to the hearing.
    es: Presenta el CV-451 en lugar del CV-450, escribe razones concretas en el punto 9 y lleva pruebas a la audiencia.
  sources: [wis-786-37, name-change-chart, cv-491]
hearing:
  required: "yes"
  detail:
    en: Every petition is decided at a hearing. On the standard path the hearing is set after the three-week publication period; on the confidential path it is set as soon as practicable.
    es: Toda petición se decide en una audiencia. En la vía estándar se fija después de las tres semanas de publicación; en la confidencial, lo antes posible.
  sources: [cv-490, cv-491]
background_check:
  required: "no"
  detail:
    en: No fingerprinting or background check. You state on the petition whether you are a registered sex offender (who cannot change their name).
    es: No hay huellas ni verificación de antecedentes. Declaras en la petición si estás registrado como delincuente sexual (quienes no pueden cambiar de nombre).
  sources: [cv-450-pdf, wis-301-47]
confidentiality:
  sealing_available: true
  detail:
    en: >-
      Standard name change records are public, and the order is recorded with the Register of Deeds. If a confidential
      petition is granted, all records are confidential and exempt from public records requests; the Register of Deeds,
      Vital Records, and local registrars may disclose them only by court order. The confidential petition is kept
      confidential from filing even if it is later denied.
    es: >-
      Los expedientes de cambios de nombre estándar son públicos y la orden se registra en el Registro de Escrituras. Si
      se concede una petición confidencial, todos los registros son confidenciales y están exentos de solicitudes de
      registros públicos; solo se pueden revelar por orden judicial. La petición confidencial se mantiene confidencial
      desde que se presenta, aunque luego se niegue.
  how:
    en: Use CV-451 from the start. After a confidential change, Vital Records needs a court order to release future copies of your birth certificate, so order the copies you need when the change is processed.
    es: Usa el CV-451 desde el principio. Después de un cambio confidencial, Registros Vitales necesita una orden judicial para emitir futuras copias de tu acta, así que pide las copias que necesites cuando se procese el cambio.
  sources: [wis-786-36, cv-491, dhs-amend]
minors:
  summary:
    en: |
      **Ages 14 to 17**: the young person signs and files their own petition (CV-450, or CV-451 for a confidential change); no parent signature is required on the form.

      **Under 14**: use CV-455. The petition is filed by both living parents, the surviving parent, a guardian or legal custodian (if both parents have died or lost parental rights), or the mother of a nonmarital child whose paternity is not established. One parent may file alone, but must have the other parent personally served with the petition and notice by a sheriff or process server at least five business days before the hearing. If the other parent appears and shows they have not abandoned the child or failed to assume parental responsibility, the court requires their consent. Service is not required if the other parent was convicted of one of the serious crimes listed in § 786.36(1m)(c) (use CV-481). Newspaper publication still applies. The court forms note that the law does not say whether confidential name changes are allowed under 14 (CV-456), so a judge may refuse one.
    es: |
      **De 14 a 17 años**: el joven firma y presenta su propia petición (CV-450, o CV-451 para un cambio confidencial); el formulario no exige firma de los padres.

      **Menores de 14**: usa el CV-455. La petición la presentan ambos padres con vida, el padre sobreviviente, un tutor o custodio legal, o la madre de un hijo extramatrimonial sin paternidad establecida. Un padre puede presentar solo, pero debe hacer notificar personalmente al otro padre por un sheriff o notificador al menos cinco días hábiles antes de la audiencia. Si el otro padre comparece y demuestra que no abandonó al menor, el tribunal exige su consentimiento. No se requiere notificación si el otro padre fue condenado por uno de los delitos graves del § 786.36(1m)(c). La publicación en el periódico sigue siendo obligatoria. Los formularios señalan que la ley no aclara si se permiten cambios confidenciales para menores de 14 años (CV-456), así que un juez puede negarlo.
  forms: [CV-450, CV-451, CV-455]
  sources: [wis-786-36, wis-786-37, cv-490, cv-491, name-change-chart]
delivery:
  online: true
  by_mail: false
  in_person: true
  detail:
    en: File in person at the clerk of circuit court's office, or electronically through the Wisconsin courts eFiling system where available. You must attend the hearing (some courts allow video; ask your clerk).
    es: Presenta en persona en la oficina del secretario del tribunal de circuito, o electrónicamente mediante eFiling donde esté disponible. Debes asistir a la audiencia.
  sources: [cv-490, wicourts-namechange]
timeline:
  en: Standard path, plan on roughly one to two months from filing to the hearing because of the three-week publication period, then a week or two for certified copies. The confidential path can be faster because there is no publication. Hearing dates depend on each county's calendar.
  es: En la vía estándar, calcula aproximadamente uno a dos meses desde la presentación hasta la audiencia por las tres semanas de publicación, y luego una o dos semanas para las copias certificadas. La vía confidencial puede ser más rápida. Las fechas dependen del calendario de cada condado.
after:
  en: |
    1. **Social Security** first (free; bring a certified copy of the order and photo ID). The name changes; the sex field currently cannot be changed.
    2. Wait **48 hours**, then go to a **Wisconsin DMV** service center for a new license ($14) or ID card ($16); see the driver's license guide.
    3. **Birth certificate**: if you were born in Wisconsin, the clerk sends your order to Vital Records ($10); order new copies ($20, then $3 each). Changing the sex on it is a separate court process; see the birth certificate guide.
    4. **Passport**, banks, employer, insurance, school records, and voter registration.
  es: |
    1. **Seguro Social** primero (gratis; lleva una copia certificada de la orden e identificación con foto). El nombre cambia; el campo de sexo actualmente no se puede cambiar.
    2. Espera **48 horas** y ve a un centro del **DMV de Wisconsin** para una nueva licencia ($14) o tarjeta de identificación ($16); ver la guía de licencia de conducir.
    3. **Acta de nacimiento**: si naciste en Wisconsin, el secretario envía tu orden a Registros Vitales ($10); pide copias nuevas ($20, luego $3 cada una). Cambiar el sexo es un proceso judicial aparte; ver la guía del acta de nacimiento.
    4. **Pasaporte**, bancos, empleador, seguro, expedientes escolares y registro de votante.
tips:
  - en: If you were born in Wisconsin and also want your sex marker changed on your birth certificate, you can file the gender-change petition (CV-452) in the same county; the form asks for your name change case number.
    es: Si naciste en Wisconsin y también quieres cambiar el marcador de sexo en tu acta, puedes presentar la petición de cambio de género (CV-452) en el mismo condado; el formulario pide el número de tu caso de cambio de nombre.
  - en: Trans Law Help Wisconsin's Emma Katherine grant pays court and newspaper publication fees for trans and nonbinary Wisconsinites who cannot afford them; apply for a court fee waiver first.
    es: La beca Emma Katherine de Trans Law Help Wisconsin paga tarifas judiciales y de publicación a personas trans y no binarias de Wisconsin que no pueden pagarlas; pide primero la exención del tribunal.
  - en: Wisconsin also recognizes a common-law name change through consistent use, but agencies like Social Security and the DMV require a court order, so most people need the petition.
    es: Wisconsin también reconoce el cambio de nombre por uso constante, pero agencias como el Seguro Social y el DMV exigen una orden judicial, así que la mayoría necesita la petición.
