  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate ratings are an editorial judgment drawn from the guide files. id_documents is "mixed" because the driver's
    license marker can be changed with a physician's note, but the birth certificate requires a court order based on a
    "surgical sex-change procedure" (Wis. Stat. 69.15(4)(b)), which is being challenged in Dane County Circuit Court (filed
    July 31, 2026). care is "mixed" because care is legal for all ages and Medicaid must cover it under a federal
    injunction (Flack, 2019), but Wisconsin has no statutory shield law and no state insurance nondiscrimination law, and
    the Legislature passed a ban on minors' care (AB 104) that was vetoed on March 31, 2026. Reviewer: confirm there is no
    shield law or executive order that should set shield_law to true.
overview:
  en: >-
    Wisconsin sits in the middle. Adults and minors can legally get gender-affirming care, and Wisconsin Medicaid
    (BadgerCare Plus) must cover hormones and surgery under a 2019 federal court order. Bills to ban care for minors
    passed the Legislature and were vetoed by the governor in 2023 and again in March 2026. Documents are harder: a name
    change normally requires a newspaper notice unless you convince a judge that publication could endanger you, the
    driver's license needs a physician's note or a court order, and the birth certificate can be changed only with a
    court order tied to surgery (a lawsuit filed in July 2026 challenges that rule).
  es: >-
    Wisconsin está en un punto intermedio. Adultos y menores pueden recibir legalmente atención de afirmación de género,
    y Medicaid de Wisconsin (BadgerCare Plus) debe cubrir hormonas y cirugía por una orden judicial federal de 2019. Los
    proyectos de ley para prohibir la atención a menores fueron aprobados por la Legislatura y vetados por el gobernador
    en 2023 y de nuevo en marzo de 2026. Los documentos son más difíciles: un cambio de nombre normalmente requiere un
    aviso en el periódico a menos que convenzas a un juez de que la publicación podría ponerte en peligro, la licencia
    de conducir requiere una nota de un médico o una orden judicial, y el acta de nacimiento solo se puede cambiar con
    una orden judicial ligada a una cirugía (una demanda presentada en julio de 2026 impugna esa regla).
