status_summary:
  en: >-
    Gender-affirming care is legal in Wisconsin for adults and minors. The Legislature passed bans on care for minors in
    2023 and 2026, and the governor vetoed both; the 2026 vetoes were sustained in May 2026. Wisconsin Medicaid
    (BadgerCare Plus) must cover hormones and surgery under a 2019 federal court injunction. There is no state shield law
    and no state rule requiring private insurers to cover this care.
  es: >-
    La atención de afirmación de género es legal en Wisconsin para adultos y menores. La Legislatura aprobó prohibiciones
    de atención a menores en 2023 y 2026, y el gobernador vetó ambas; los vetos de 2026 se mantuvieron en mayo de 2026.
    Medicaid de Wisconsin (BadgerCare Plus) debe cubrir hormonas y cirugía por una orden judicial federal de 2019. No
    hay ley escudo estatal ni norma estatal que obligue a las aseguradoras privadas a cubrir esta atención.
adult_care:
  status: available
  detail:
    en: |
      No state restriction on adult care. Planned Parenthood of Wisconsin prescribes hormones on an **informed consent** basis (no therapist letter) to people 18 and older, by telehealth or at health centers statewide. Telehealth services such as Plume and FOLX also serve Wisconsin.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **BadgerCare Plus** (Wisconsin Medicaid). Adults 19 to 64 qualify with income up to 100% of the federal poverty level ($1,330 a month for one person in 2026). It covers hormones and, with prior approval, surgery. Wisconsin did not expand Medicaid, so if you earn more than that, look at HealthCare.gov marketplace plans instead.
      2. Go to a **community health center** (FQHC) or free clinic. They charge on a sliding scale; ask whether they prescribe gender-affirming hormones. Find one with the HRSA locator or DHS's free and low-cost clinic search.
      3. **Planned Parenthood of Wisconsin** offers sliding-scale hormone care and telehealth.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for people who cannot afford it.
    es: |
      No hay restricciones estatales para adultos. Planned Parenthood of Wisconsin receta hormonas mediante **consentimiento informado** (sin carta de terapeuta) a personas de 18 años o más, por telesalud o en centros de todo el estado. Servicios de telesalud como Plume y FOLX también atienden Wisconsin.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **BadgerCare Plus** (Medicaid de Wisconsin). Los adultos de 19 a 64 años califican con ingresos hasta el 100% del nivel federal de pobreza ($1,330 al mes para una persona en 2026). Cubre hormonas y, con aprobación previa, cirugía. Wisconsin no amplió Medicaid, así que si ganas más, busca planes del mercado en HealthCare.gov.
      2. Acude a un **centro de salud comunitario** (FQHC) o clínica gratuita. Cobran en escala móvil; pregunta si recetan hormonas de afirmación de género.
      3. **Planned Parenthood of Wisconsin** ofrece atención hormonal en escala móvil y por telesalud.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud a quienes no pueden pagarla.
  sources: [pp-wi, bc-fpl, dhs-107-03, hrsa, dhs-clinics, pop-hrt]
minor_care:
  status: available
  detail:
    en: |
      Legal. There is no Wisconsin law banning gender-affirming care for minors. The Legislature passed **2025 Assembly Bill 104** (a ban on puberty blockers, hormones, surgery, and referrals for people under 18) and **Senate Bill 405** (a lawsuit right against providers); Governor Evers vetoed both on March 31, 2026, and override votes failed on May 13, 2026. He vetoed a similar ban (2023 AB 465) in December 2023. Care for minors requires parental consent and is offered mainly through specialty clinics; Planned Parenthood of Wisconsin's hormone therapy is for adults 18 and older. Wisconsin has no shield law protecting patients or providers from other states' laws.
    es: |
      Legal. No hay ley en Wisconsin que prohíba la atención de afirmación de género a menores. La Legislatura aprobó el **Proyecto de Ley 104 de la Asamblea de 2025** (prohibición de bloqueadores, hormonas, cirugía y referencias para menores de 18) y el **Proyecto de Ley 405 del Senado** (derecho a demandar a proveedores); el gobernador Evers vetó ambos el 31 de marzo de 2026 y los intentos de anular los vetos fracasaron el 13 de mayo de 2026. Vetó una prohibición similar (AB 465 de 2023) en diciembre de 2023. La atención a menores requiere consentimiento de los padres y se ofrece principalmente en clínicas especializadas; la terapia hormonal de Planned Parenthood of Wisconsin es para mayores de 18. Wisconsin no tiene ley escudo.
  sources: [veto-ab104, hist-ab104, veto-sb405, hist-sb405, veto-ab465, pp-wi]
medicaid:
  program_name: BadgerCare Plus (Wisconsin Medicaid, ForwardHealth)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Wisconsin's Medicaid rules still list "transsexual surgery" and related hormone therapy as excluded (Wis. Admin. Code DHS 107.03(23)-(24)), but in **Flack v. Wisconsin Department of Health Services** (W.D. Wis. 2019) a federal court held those exclusions illegal and **permanently barred DHS from enforcing them**. Medically necessary gender-affirming hormones and surgery are therefore covered, typically with prior authorization for surgery.

      **Who qualifies**: adults 19 to 64 with income up to 100% of the federal poverty level ($1,330 a month for one person, February 2026 to January 2027); children and pregnant people up to 306%. There is no open enrollment. Starting in early 2027 a new federal work requirement will apply to some adults 19 to 64 without dependent children; DHS says it will notify affected members.

      **Apply** online at ACCESS (access.wi.gov, also in Spanish), by phone, or at your county or tribal income maintenance agency.
    es: |
      Las reglas de Medicaid de Wisconsin todavía mencionan la exclusión de "cirugía transexual" y la terapia hormonal relacionada (DHS 107.03(23)-(24)), pero en **Flack v. Wisconsin Department of Health Services** (2019) un tribunal federal declaró ilegales esas exclusiones y **prohibió permanentemente a DHS aplicarlas**. Por eso se cubren las hormonas y cirugías de afirmación de género médicamente necesarias, normalmente con autorización previa para la cirugía.

      **Quién califica**: adultos de 19 a 64 años con ingresos hasta el 100% del nivel federal de pobreza ($1,330 al mes para una persona); niños y embarazadas hasta el 306%. No hay periodo de inscripción. A partir de principios de 2027 se aplicará un requisito federal de trabajo a algunos adultos de 19 a 64 años sin hijos dependientes.

      **Solicita** en línea en ACCESS (access.wi.gov, también en español), por teléfono o en tu agencia local.
  how_to_apply_url: https://access.wi.gov/s/?language=en_US
  sources: [dhs-107-03, bc-home, bc-fpl, dhs-work]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Wisconsin has no state law that bars private health plans from excluding gender-affirming care, so coverage depends on your plan. Read your plan's exclusions and ask for the medical policy on "gender dysphoria" or "gender-affirming care." If you are denied, file an internal appeal with the plan, then ask for an independent external review; you can also file a complaint with the **Office of the Commissioner of Insurance** (1-800-236-8517) for state-regulated plans. Employer self-funded plans are federally regulated. The Trans Health Project has appeal templates.

      Wisconsin **state employee** health plans must cover this care after a federal court struck down the state's exclusion (Boyden v. Conlin, 2018).
    es: |
      Wisconsin no tiene ley estatal que prohíba a los planes privados excluir la atención de afirmación de género, así que la cobertura depende de tu plan. Revisa las exclusiones y pide la política médica sobre "disforia de género" o "atención de afirmación de género". Si te la niegan, apela ante el plan y luego pide una revisión externa independiente; también puedes presentar una queja ante la **Oficina del Comisionado de Seguros** (1-800-236-8517). Los planes autofinanciados de empleadores están regulados a nivel federal.

      Los planes de salud de **empleados estatales** de Wisconsin deben cubrir esta atención desde que un tribunal federal anuló la exclusión (Boyden v. Conlin, 2018).
  complaint_url: https://oci.wi.gov/Pages/Consumers/Filing-a-Complaint.aspx
  sources: [oci-complaint, aclu-boyden, thp]
