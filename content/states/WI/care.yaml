statutes:
  - cite: Wis. Admin. Code DHS 107.03(23)-(24)
    title:
      en: Medicaid exclusions for gender-affirming hormones and surgery, permanently enjoined in Flack v. Wisconsin DHS (2019)
    url: https://docs.legis.wisconsin.gov/document/administrativecode/DHS%20107.03
litigation:
  - case: Flack v. Wisconsin Department of Health Services, 395 F. Supp. 3d 1001 (W.D. Wis. 2019)
    court: U.S. District Court for the Western District of Wisconsin
    summary:
      en: Held that Wisconsin Medicaid's exclusion of gender-affirming hormones and surgery violated the Equal Protection Clause, Section 1557 of the Affordable Care Act, and the Medicaid Act, and permanently enjoined DHS from enforcing it.
      es: Declaró que la exclusión de hormonas y cirugía de afirmación de género en Medicaid de Wisconsin violaba la Cláusula de Igual Protección, la Sección 1557 de la Ley de Cuidado de Salud Asequible y la Ley de Medicaid, y prohibió permanentemente a DHS aplicarla.
    effect_today:
      en: BadgerCare Plus covers medically necessary gender-affirming care. The exclusion text remains in the code but cannot be enforced.
      es: BadgerCare Plus cubre la atención de afirmación de género médicamente necesaria. El texto de la exclusión sigue en el código pero no se puede aplicar.
    last_update: "2019-09-16"
    sources: [dhs-107-03]
