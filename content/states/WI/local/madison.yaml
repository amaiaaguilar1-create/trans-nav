  notes: >-
    Short starter list from org websites on 2026-09-24. The Dane County Circuit Court site loaded but its name change
    page and clerk's filing location were not checked; the filing fee is the statewide $164.50. UW Health's pages render
    only with JavaScript, so its services and age policies are unverified. OutReach announced a move ("The Big Move") on
    its home page; the address below is the one shown on 2026-09-24 and should be rechecked. Trans Law Help's Madison
    in-person clinic is listed as "TBD November 2026".
intro:
  en: >-
    Madison has the OutReach LGBTQ+ Community Center with a dedicated transgender advocate, a public health sexual health
    clinic with sliding-scale fees, Vivent Health for PrEP and HIV care, and the University of Wisconsin health system.
    Name change petitions are filed with the Dane County Clerk of Circuit Court.
  es: >-
    Madison cuenta con el OutReach LGBTQ+ Community Center con un defensor trans dedicado, una clínica de salud sexual de
    salud pública con tarifas en escala móvil, Vivent Health para PrEP y atención de VIH, y el sistema de salud de la
    Universidad de Wisconsin. Las peticiones de cambio de nombre se presentan ante el secretario del Tribunal de Circuito
    del Condado de Dane.
court:
  name: Dane County Circuit Court (Clerk of Circuit Court)
  url: https://courts.countyofdane.com/
  self_help_url: https://www.wicourts.gov/services/public/selfhelp/namechange.htm
  filing_fee: 164.5
  notes:
    en: Use the statewide forms (CV-450, or CV-451 for a confidential change). Ask the clerk whether you need to prepare the notice and order yourself.
    es: Usa los formularios estatales (CV-450, o CV-451 para un cambio confidencial). Pregunta al secretario si debes preparar el aviso y la orden.
  sources: [dane-courts, wicourts-namechange, wi-fee-table]
