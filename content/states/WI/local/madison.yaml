      en: Madison's LGBTQ+ center, with a Transgender Advocate, resources and referrals, the Madison Area Transgender Association (M.A.T.A.), support groups, and the EverStrong drop-in center. Open Tuesday to Friday, noon to 6 pm.
      es: Centro LGBTQ+ de Madison, con un defensor trans, recursos y referencias, la Madison Area Transgender Association (M.A.T.A.), grupos de apoyo y el centro EverStrong. Abierto de martes a viernes, de mediodía a 6 pm.
    url: https://www.outreachmadisonlgbt.org/transgender-services
