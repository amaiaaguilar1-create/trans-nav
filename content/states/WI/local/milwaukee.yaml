  es: Condado de Milwaukee y el área metropolitana
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Org details from each org's own website on 2026-09-24. Milwaukee County's court website (county.milwaukee.gov)
    returned 403 to automated requests, so court details come from the Milwaukee Justice Center (a county, bar, and
    Marquette Law School project located in the courthouse) and the statewide fee table. Reviewer: confirm the Milwaukee
    County Clerk of Circuit Court civil filing location for name changes, the Milwaukee LGBT Community Center's phone
    number, and whether Froedtert's Inclusion Health Clinic prescribes hormones directly. Trans Law Help's September 18,
    2026 in-person clinic has passed; the next Milwaukee date was not yet posted.
intro:
  en: >-
    Milwaukee has a free self-help center inside the county courthouse for name change forms, regular Trans Law Help
    Wisconsin clinics at the Milwaukee LGBT Community Center, free STI testing through Diverse & Resilient, and
    LGBTQ-focused primary care at Froedtert's Inclusion Health Clinic. Name change petitions are filed with the Milwaukee
    County Clerk of Circuit Court.
  es: >-
    Milwaukee tiene un centro de autoayuda gratuito dentro del tribunal del condado para formularios de cambio de nombre,
    clínicas regulares de Trans Law Help Wisconsin en el Milwaukee LGBT Community Center, pruebas gratuitas de ITS a
    través de Diverse & Resilient y atención primaria enfocada en LGBTQ en la Inclusion Health Clinic de Froedtert. Las
    peticiones de cambio de nombre se presentan ante el secretario del Tribunal de Circuito del Condado de Milwaukee.
court:
  name: Milwaukee County Circuit Court (Clerk of Circuit Court), Milwaukee County Courthouse
  url: https://county.milwaukee.gov/EN/Courts
  self_help_url: https://www.milwaukeejusticecenter.org/name-change.html
  filing_fee: 164.5
  notes:
    en: >-
      The courthouse is at 901 N 9th St. The Milwaukee Justice Center (Room G-9, ground floor near the Wells Street
      entrance) helps with name change forms on a walk-in basis, and also posts the birth certificate gender-change forms.
      Walk-in hours were Monday 8:30 am to noon and 1 to 4 pm, Tuesday 1 to 4 pm, Wednesday 8:30 am to noon, Thursday 1 to
      4 pm, and Friday 8:30 am to noon; capacity is limited.
    es: >-
      El tribunal está en 901 N 9th St. El Milwaukee Justice Center (Sala G-9, planta baja cerca de la entrada de Wells
      Street) ayuda sin cita con formularios de cambio de nombre y publica los formularios de cambio de género en el acta
      de nacimiento. La capacidad es limitada.
  sources: [mjc-hours, mjc-nc, wi-fee-table]
resources:
  - id: milwaukee-justice-center
    name: Milwaukee Justice Center
    type: legal_aid
    pillars: [name_change, gender_marker]
    description:
      en: Free self-help center in the Milwaukee County Courthouse run by the Clerk of Courts, Milwaukee Bar Association, and Marquette Law School. Walk-in forms help for name changes; Marquette Volunteer Legal Clinics give brief free legal advice on civil matters.
      es: Centro de autoayuda gratuito en el Tribunal del Condado de Milwaukee. Ayuda sin cita con formularios de cambio de nombre; las Clínicas Legales Voluntarias de Marquette dan asesoría breve y gratuita en asuntos civiles.
    url: https://www.milwaukeejusticecenter.org/
    address: 901 N 9th St, Room G-9, Milwaukee, WI 53233
    cost: free
    verification: org_website
    sources: [mjc-hours, mjc-nc]
  - id: trans-law-help-mke
    name: Trans Law Help Wisconsin, name and sex marker clinics
    type: name_change_clinic
    pillars: [name_change, gender_marker]
    description:
      en: Attorney and student volunteers explain Wisconsin's process and help you complete court forms, at in-person clinics at the Milwaukee LGBT Community Center (no RSVP) and quarterly on Zoom. Also offers the Emma Katherine grant for court and newspaper publication fees.
      es: Voluntarios explican el proceso de Wisconsin y ayudan a completar formularios en clínicas presenciales en el Milwaukee LGBT Community Center (sin reservación) y trimestralmente por Zoom. También ofrece la beca Emma Katherine para tarifas judiciales y de publicación.
    url: https://www.translawhelp.com/legal-clinic
    cost: free
    verification: org_website
    sources: [tlh-clinic, tlh-grant]
  - id: mke-lgbt-center
    name: Milwaukee LGBT Community Center
    type: lgbtq_center
    pillars: [mental_health]
    description:
      en: Counseling services, a weekly TGNC peer support group (Thursdays 6 to 8 pm, adults 18+), a monthly group for parents of young trans children, a food pantry, and a free gender-affirming clothing boutique.
      es: Servicios de consejería, un grupo semanal de apoyo entre pares para personas trans y de género no conforme (jueves de 6 a 8 pm, mayores de 18), un grupo mensual para padres de niños trans, despensa de alimentos y una boutique gratuita de ropa de afirmación de género.
    url: https://www.mkelgbt.org/tgncprogram
    address: 161 S 1st St, Milwaukee, WI 53204
    cost: free
    verification: org_website
    sources: [mke-tgnc, tlh-clinic]
  - id: froedtert-inclusion
    name: Froedtert & MCW Inclusion Health Clinic
    type: primary_care
    pillars: [hrt, sexual_health]
    description:
      en: LGBTQ+ primary and specialty care on the Froedtert Hospital campus. Accepts private insurance, Medicare, and Medicaid; virtual visits available. Call 414-805-2018 and ask about gender-affirming hormone therapy.
      es: Atención primaria y especializada LGBTQ+ en el campus del Froedtert Hospital. Acepta seguro privado, Medicare y Medicaid; hay visitas virtuales. Llama al 414-805-2018 y pregunta por terapia hormonal de afirmación de género.
    url: https://www.froedtert.com/lgbtq
    phone: "414-805-2018"
    address: 9200 W. Wisconsin Ave, Milwaukee, WI 53226
    cost: insurance
    accepts_medicaid: true
    telehealth: true
    verification: org_website
    sources: [froedtert]
