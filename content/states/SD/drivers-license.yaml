  confidence: low
  es_status: machine_draft
  notes: >-
    The Department of Public Safety's driver licensing pages now live on the sd.gov ServiceNow portal, which renders
    only with JavaScript. The fee article KB0043708 was read through the portal's search API (Duplicate/Replacement
    Driver License $20); fees were confirmed against SDCL 32-12-16 as amended by SB 3 (2025): $38 original/renewal,
    $20 duplicate, name change, or address change; ID card fees are the same (SDCL 32-12-17.2). NO official DPS page on
    changing the sex marker was found; portal searches for "gender" and "sex" returned nothing relevant. A4TE's South
    Dakota page (undated; links a retired DPS URL) says DPS accepted a court order or a licensed physician's affidavit
    that the applicant's gender "has been medically altered." That policy predates HB 1184 (2026, effective July 1,
    2026), which defines "sex" as biological sex throughout state law and requires every state agency to "strictly
    adhere" to it in its "policies, practices." SDCL 32-12-17.10 requires the license to show "the holder's sex." Taken
    together, a marker change is very likely no longer granted, but no DPS statement confirms it, so status is
    "unclear." MAP shows no negative driver's license law for South Dakota (0/1), which is consistent with the absence
    of a DL-specific statute. HB 1260 (2025), which would have required documents to reflect biological sex,
    failed in the House 35-35 on February 19, 2025. Reviewer: call DPS Driver Licensing (605-773-6883 is commonly
    listed, not verified) to confirm current practice and whether previously changed markers are being reversed.
