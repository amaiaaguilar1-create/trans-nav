pending_bills:
  - bill: HB 1260 (2025)
    summary:
      en: Would have required birth certificates and other official documents, including driver licenses, to reflect biological sex. Failed on the House floor 35-35; reconsideration failed.
      es: Habría exigido que las actas de nacimiento y otros documentos oficiales reflejaran el sexo biológico. Fracasó en la Cámara 35-35.
    status: dead
    last_action: "2025-02-20"
    url: https://sdlegislature.gov/Session/Bill/26071
    sources: [hb1260-2025]
