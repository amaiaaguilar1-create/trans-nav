markers_available: [M, F]
name_change_status: available
status_summary:
  en: >-
    You can update your name on a South Dakota driver license or ID for $20. Changing the sex marker is very likely no
    longer possible: since July 1, 2026, state law requires every agency to use biological sex, and the license must
    show "the holder's sex." The state has not published a policy either way; there is no X option.
  es: >-
    Puedes actualizar tu nombre en la licencia o identificación de Dakota del Sur por $20. Es muy probable que ya no se
    pueda cambiar el marcador de sexo: desde el 1 de julio de 2026 la ley obliga a todas las agencias a usar el sexo
    biológico, y la licencia debe mostrar "el sexo del titular". El estado no ha publicado una política; no existe la
    opción X.
summary:
  en: |
    **Name change:** bring your certified court order (or another document proving the new legal name, such as a passport in that name) to a Driver Licensing exam station and pay the $20 name change fee. The name on the card must be your full legal name.

    **Sex marker:** South Dakota law requires the license to show "the holder's sex" (SDCL 32-12-17.10). HB 1184 (2026) now defines "sex" in all state law as "an individual's biological sex, either male or female," and requires state agencies to strictly follow that definition in their policies and practices. Before this law, advocates reported that the Department of Public Safety changed the marker with a court order or a physician's statement. We could not find any current DPS policy. Expect a request to be refused, and ask before you pay.

    Only **M** and **F** are printed on South Dakota cards; there is no X.
  es: |
    **Cambio de nombre:** lleva tu orden judicial certificada (u otro documento que pruebe el nuevo nombre legal, como un pasaporte con ese nombre) a una estación de licencias y paga $20. La tarjeta debe mostrar tu nombre legal completo.

    **Marcador de sexo:** la ley exige que la licencia muestre "el sexo del titular" (SDCL 32-12-17.10). HB 1184 (2026) define ahora "sexo" en toda la ley estatal como "el sexo biológico de una persona, masculino o femenino" y obliga a las agencias a seguir esa definición. Antes de esta ley, se informaba que el Departamento de Seguridad Pública cambiaba el marcador con una orden judicial o una declaración médica. No encontramos una política actual. Espera una negativa y pregunta antes de pagar.

    Las tarjetas de Dakota del Sur solo muestran **M** y **F**; no hay X.
eligibility:
  residency:
    en: South Dakota residents. Name and identity documents must meet the state's REAL ID document rules (SDCL 32-12-3.1 to 32-12-3.5).
    es: Residentes de Dakota del Sur. Los documentos deben cumplir las reglas de identificación del estado.
  sources: [sdcl-32-12-3]
steps:
  - id: gather-name-documents
    title:
      en: Gather proof of your new legal name
      es: Reúne la prueba de tu nuevo nombre legal
    body:
      en: Bring a certified copy of the court order changing your name (or a U.S. passport in the new name), plus your current license or ID. Update your name with Social Security first, since the license record is checked against it.
      es: Lleva una copia certificada de la orden judicial de cambio de nombre (o un pasaporte con el nuevo nombre) y tu licencia o identificación actual. Actualiza primero tu nombre en el Seguro Social.
    applies_to: [name_change]
    sources: [dps-name-change-news, sdcl-32-12-3]
  - id: visit-exam-station
    title:
      en: Visit a Driver Licensing exam station and pay $20
      es: Visita una estación de licencias y paga $20
    body:
      en: A name change requires a new card with a new photo, so go in person. Some offices, including Sioux Falls, work by appointment; schedule on the state's driver licensing site. The fee for a name change or duplicate is $20 for a driver license or ID card.
      es: Un cambio de nombre requiere una nueva tarjeta con foto, así que ve en persona. Algunas oficinas, como la de Sioux Falls, atienden con cita. La tarifa es $20 para licencia o identificación.
    fees: [name-change]
    applies_to: [name_change, in_person]
    sources: [dps-fees, sdcl-32-12-16, dps-sioux-falls-appointments]
  - id: ask-about-marker
    title:
      en: Ask before trying to change the sex marker
      es: Pregunta antes de intentar cambiar el marcador de sexo
    body:
      en: |
        If you want to try, call Driver Licensing first and ask whether it accepts any document to change the sex on a license after HB 1184 took effect on July 1, 2026. Ask for the answer in writing. If you are refused, contact the ACLU of South Dakota or the Transformation Project, which track how the law is applied.
      es: |
        Si quieres intentarlo, llama primero a Licencias de Conducir y pregunta si acepta algún documento para cambiar el sexo después de que HB 1184 entró en vigor el 1 de julio de 2026. Pide la respuesta por escrito. Si te lo niegan, contacta a la ACLU de Dakota del Sur o al Transformation Project.
    applies_to: [gender_marker]
    optional: true
    sources: [hb1184-2026, sdcl-32-12-17-10, a4te-sd]
fees:
  - id: name-change
    label:
      en: Name change, duplicate, or address change (driver license or ID card)
      es: Cambio de nombre, duplicado o cambio de dirección (licencia o identificación)
    amount: 20
    note:
      en: An original or renewal license is $38. A one-time free ID card or duplicate is available if you are homeless, with an affidavit from a homeless services provider (SDCL 32-12-17.16).
      es: Una licencia original o renovación cuesta $38. Si no tienes hogar, puedes obtener una vez una identificación o duplicado gratis con una declaración de un proveedor de servicios (SDCL 32-12-17.16).
    sources: [dps-fees, sdcl-32-12-16, sdcl-32-12-17-2, sdcl-32-12-17-16]
delivery:
  online: false
  by_mail: false
  in_person: true
  detail:
    en: Name changes require a visit to an exam station for a new photo.
    es: Los cambios de nombre requieren visitar una estación para una nueva foto.
  sources: [dps-sioux-falls-appointments, sdcl-32-12-17-10]
after:
  en: If you have a South Dakota birth certificate, you can amend the name on it with your court order (see the birth certificate guide). Keep your old card until the new one arrives.
  es: Si tienes acta de nacimiento de Dakota del Sur, puedes modificar el nombre con tu orden judicial (ver la guía del acta de nacimiento). Guarda tu tarjeta anterior hasta recibir la nueva.
tips:
  - en: Bring the certified court order, not a photocopy.
    es: Lleva la orden judicial certificada, no una fotocopia.
