  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate is based on primary statutes read on sdlegislature.gov 2026-09-24: HB 1184 (2026, SL 2026 ch 19, signed
    March 30, 2026, no emergency clause so effective July 1, 2026 under SDCL 2-14-16) defines "sex" as biological sex
    in SDCL 2-14-2 and orders every state agency and political subdivision to "strictly adhere" to it; HB 1080 (2023,
    SDCL 34-24-33 to 34-24-38) bans puberty blockers, hormones, and surgery for minors; HB 1259 (2025) and HB 1161 (2026)
    restrict multi-occupancy restrooms and changing rooms in public buildings by biological sex (SDCL 20-13-58 to 20-13-63).
    Reviewer: confirm HB 1184 was not referred to the ballot and has no pending court challenge. The Center for
    Equality (Sioux Falls) was requested as a key resource, but its website returned an empty page and could not be
    verified, so it is not listed.
overview:
  en: >-
    South Dakota is restrictive. Since July 1, 2026, state law (HB 1184) defines "sex" as biological sex everywhere in
    state law and requires every state agency to follow that definition, so changing the sex on a South Dakota birth
    certificate is not available and a driver's license change is doubtful. You can still change your **name**, but the
    court process requires a hearing and four weeks of newspaper publication. Gender-affirming care is legal for adults
    (Medicaid excludes "elective gender transition procedures"), and banned for anyone under 18.
  es: >-
    Dakota del Sur es restrictivo. Desde el 1 de julio de 2026, la ley estatal (HB 1184) define "sexo" como sexo
    biológico en toda la ley estatal y obliga a todas las agencias a usar esa definición, por lo que no es posible
    cambiar el sexo en el acta de nacimiento y el cambio en la licencia de conducir es dudoso. Todavía puedes cambiar
    tu **nombre**, pero el proceso judicial exige una audiencia y cuatro semanas de publicación en un periódico. La
    atención de afirmación de género es legal para adultos (Medicaid excluye los "procedimientos electivos de
    transición de género") y está prohibida para menores de 18 años.
