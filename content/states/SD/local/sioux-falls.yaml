review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court address and clerk phone from the UJS Minnehaha County court-finder page (read 2026-09-24). Lincoln County
    residents file at the Lincoln County courthouse in Canton; that page was not read. Falls Community Health's
    walk-in STI clinic at 521 N. Main Ave. was listed as "temporarily closed" on the city's page; the page refers people
    to the SD Department of Health office at 1501 S. Highline Ave. (605-367-5363) for free testing. Safe Space SD is run
    through the Helpline Center and reached via 988; its own phone number was not shown. The Center for Equality could
    not be verified (empty website) and is not listed. Sanford and Avera gender care pages could not be found or
    loaded.
intro:
  en: >-
    Sioux Falls is South Dakota's largest city and home to the state's main trans organization, the Transformation
    Project, and its Prism Community Center. Name change petitions for Minnehaha County residents are filed at the
    Minnehaha County Courthouse. Adults can get hormone therapy at Planned Parenthood; care for anyone under 18 is
    banned statewide.
  es: >-
    Sioux Falls es la ciudad más grande de Dakota del Sur y sede de la principal organización trans del estado, el
    Transformation Project, y su Prism Community Center. Las peticiones de cambio de nombre de residentes del condado
    de Minnehaha se presentan en el tribunal del condado. Los adultos pueden recibir terapia hormonal en Planned
    Parenthood; la atención para menores de 18 está prohibida en todo el estado.
court:
  name: Minnehaha County Clerk of Courts, Second Judicial Circuit (425 N. Dakota Ave., Sioux Falls, SD 57104; 605-367-5900)
  url: https://ujs.sd.gov/court-finder/second-judicial-circuit/minnehaha-county/
  self_help_url: https://ujs.sd.gov/self-help/pro-se-forms/name-change-forms/
  filing_fee: 72
  notes:
    en: >-
      Office hours 8 a.m. to 5 p.m., Monday through Friday; email minnehahacoclerk@ujs.state.sd.us. The $72 fee is the
      statewide name change fee. Because of Minnesota Avenue construction, approach the courthouse from Dakota or Main
      Avenue. Lincoln County residents file in Lincoln County.
    es: >-
      Horario de 8 a.m. a 5 p.m., de lunes a viernes; correo minnehahacoclerk@ujs.state.sd.us. La tarifa de $72 es la
      estatal. Por obras en Minnesota Avenue, llega al tribunal por Dakota o Main Avenue. Los residentes del condado de
      Lincoln presentan en su condado.
  sources: [minnehaha-court, second-circuit, court-costs]
resources:
  - id: transformation-project
    name: The Transformation Project and Prism Community Center
    type: lgbtq_center
    pillars: [name_change, gender_marker, mental_health]
    description:
      en: >-
        Trans-led nonprofit. Free help with name change paperwork (susan@transformationprojectsd.org), a statewide
        provider referral list, weekly "Safe Space" peer support group for adults 18+ (Tuesdays 5:30 to 6:30 pm, in
        person and virtual), youth and adult hang-out hours, a Discord server for rural members, and Marty's Closet
        (free clothing). Ring the doorbell to the right of the recycling bins.
      es: >-
        Organización dirigida por personas trans. Ayuda gratuita con trámites de cambio de nombre, lista de proveedores,
        grupo de apoyo semanal para adultos (martes de 5:30 a 6:30 pm, en persona y virtual), horarios para jóvenes y
        adultos, un servidor de Discord y Marty's Closet (ropa gratuita).
    url: https://www.transformationprojectsd.org/
    phone: "605-610-8579"
    address: 500 N. Western Ave., Sioux Falls, SD
