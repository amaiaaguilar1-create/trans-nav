  confidence: medium
  es_status: machine_draft
  notes: >-
    Minors' ban text read on sdlegislature.gov (HB 1080, 2023, codified SDCL 34-24-33 to 34-24-38; signed February 14,
    2023). No lawsuit challenging it was found; SB 216 (2024), which would have modified it, died in committee. After
    United States v. Skrmetti (2025) a federal challenge is unlikely to succeed. Medicaid: the South Dakota Medicaid
    Physician Services billing and policy manual (updated June 2026) lists "Elective gender transition procedures" as
    not covered; no provision on hormones was found in the physician, pharmacy, FQHC, or hospital manuals or in ARSD
    67:16:01:08, so covers_hrt is "unclear." MAP lists South Dakota's Medicaid policy as a negative law. HB 1184 (2026)
    defines sex as biological sex but contains no health care provision; reviewer should watch whether agencies or
    licensing boards cite it to limit adult care. Sanford Health and Avera did not have findable gender care pages
    (Sanford URLs 404; Avera 403), so neither is listed. Planned Parenthood Sioux Falls lists "Gender-Affirming Care"
    and accepts Medicaid; the minimum age (18 under state law) and informed-consent model were not confirmed on its
    page. Falls Community Health (city FQHC) offers primary care and PrEP but its site does not mention hormone
    therapy. QueerMed coverage of South Dakota was not checked; FOLX and QueerDoc do not list South Dakota.
status_summary:
  en: >-
    Adults can get hormone therapy and surgery in South Dakota, but South Dakota Medicaid excludes "elective gender
    transition procedures" and state law does not stop private plans from excluding care. For anyone under 18,
    puberty blockers, hormones, and surgery for gender transition are banned (HB 1080, since July 1, 2023). There is
    no shield law.
  es: >-
    Los adultos pueden recibir terapia hormonal y cirugía en Dakota del Sur, pero Medicaid excluye los "procedimientos
    electivos de transición de género" y la ley estatal no impide que los planes privados excluyan la atención. Para
    menores de 18 años, los bloqueadores, las hormonas y la cirugía de transición están prohibidos (HB 1080, desde el
    1 de julio de 2023). No hay ley escudo.
adult_care:
  status: available
  detail:
    en: |
      No South Dakota law restricts gender-affirming care for adults 18 and older. The barriers are cost and access: Medicaid excludes "elective gender transition procedures," and few clinics outside Sioux Falls and Rapid City advertise trans care.

      **If you have little money**, in rough order of what to try:
      1. **Planned Parenthood North Central States, Sioux Falls** lists gender-affirming care, in person or by telehealth anywhere in the state, and accepts Medicaid and most insurance.
      2. **Telehealth**: Plume serves South Dakota. Point of Pride's HRT Access Fund and GenderBands can help with costs.
      3. **Community health centers** (FQHCs) such as Falls Community Health in Sioux Falls charge on a sliding scale; ask whether a provider there prescribes hormones.
      4. **The Transformation Project** keeps a statewide referral list of affirming medical and mental health providers.
    es: |
      Ninguna ley de Dakota del Sur restringe la atención de afirmación de género para adultos de 18 años o más. Las barreras son el costo y el acceso: Medicaid excluye los "procedimientos electivos de transición de género" y pocas clínicas fuera de Sioux Falls y Rapid City ofrecen atención trans.

      **Si tienes poco dinero**, en orden aproximado:
      1. **Planned Parenthood North Central States, Sioux Falls** ofrece atención de afirmación de género, en persona o por telesalud en todo el estado, y acepta Medicaid y la mayoría de los seguros.
      2. **Telesalud**: Plume atiende en Dakota del Sur. El HRT Access Fund de Point of Pride y GenderBands ayudan con los costos.
      3. Los **centros de salud comunitarios** como Falls Community Health en Sioux Falls cobran en escala móvil; pregunta si recetan hormonas.
      4. **The Transformation Project** tiene una lista estatal de proveedores médicos y de salud mental que afirman la identidad.
  sources: [pp-sioux-falls, medicaid-physician-manual, tp-get-help, fch]
minor_care:
  status: prohibited
  detail:
    en: |
      **HB 1080 (2023)**, codified at SDCL 34-24-33 to 34-24-38 and in effect since **July 1, 2023**, bans health care professionals from giving anyone **under 18**, for gender transition:

      - puberty blockers;
      - testosterone, estrogen, or progesterone above normal levels for the minor's age and birth sex;
      - sterilizing surgery, genital surgery, or removal of healthy body parts.

      **Exceptions**: intersex conditions (disorders of sex development) and treating complications caused by prohibited care. Minors already on blockers or hormones before July 1, 2023 had to be tapered off by December 31, 2023.

      **Penalties**: the provider's licensing board **must revoke** the license. A person harmed can sue until age 25 or within three years of discovering the harm.

      No court has blocked the law. South Dakota has **no shield law**. The Transformation Project's SD Trans Resilience Fund helps families with travel costs for care in other states (not medical bills). Mental health care, including counseling about gender, is not banned.
    es: |
      **HB 1080 (2023)**, codificada en las SDCL 34-24-33 a 34-24-38 y vigente desde el **1 de julio de 2023**, prohíbe a los profesionales de salud dar a **menores de 18 años**, con fines de transición:

      - bloqueadores de pubertad;
      - testosterona, estrógeno o progesterona por encima de los niveles normales para su edad y sexo al nacer;
      - cirugía esterilizante, genital o la extirpación de partes sanas del cuerpo.

      **Excepciones**: condiciones intersexuales y el tratamiento de complicaciones. Quienes ya recibían tratamiento antes del 1 de julio de 2023 debían dejarlo antes del 31 de diciembre de 2023.

      **Sanciones**: la junta de licencias **debe revocar** la licencia del profesional. Una persona afectada puede demandar hasta los 25 años o dentro de tres años de descubrir el daño.

      Ningún tribunal ha bloqueado la ley. Dakota del Sur **no tiene ley escudo**. El SD Trans Resilience Fund del Transformation Project ayuda a las familias con gastos de viaje para atención en otros estados. La atención de salud mental no está prohibida.
  sources: [sdcl-34-24-33, sdcl-34-24-34, sdcl-34-24-35, sdcl-34-24-36, sdcl-34-24-37, sdcl-34-24-38, hb1080-2023, tp-resilience-fund]
medicaid:
  program_name: South Dakota Medicaid
  covers_hrt: unclear
  covers_surgery: "no"
  detail:
    en: The South Dakota Medicaid Physician Services manual lists "elective gender transition procedures" among services that are not covered. It does not say whether hormone prescriptions are covered; ask your provider to check before you start, and appeal any denial. Low-income adults may qualify for Medicaid; apply through the Department of Social Services.
    es: El manual de Servicios Médicos de Medicaid de Dakota del Sur incluye los "procedimientos electivos de transición de género" entre los servicios no cubiertos. No dice si cubre recetas de hormonas; pide a tu proveedor que lo verifique y apela cualquier negativa. Los adultos de bajos ingresos pueden calificar; solicita en el Departamento de Servicios Sociales.
  how_to_apply_url: https://dss.sd.gov/economicassistance/medical_eligibility.aspx
  sources: [medicaid-physician-manual, dss-medical-eligibility, map-sd]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: South Dakota has no law barring health plans from excluding gender-affirming care. Read your plan's exclusions list. If a claim for a covered benefit is denied, you can file a complaint with the Division of Insurance; self-funded employer plans are regulated federally.
    es: Dakota del Sur no tiene ley que prohíba a los planes excluir la atención de afirmación de género. Lee las exclusiones de tu plan. Si te niegan un beneficio cubierto, puedes presentar una queja ante la División de Seguros.
  complaint_url: https://dlr.sd.gov/insurance/doi_complaint.aspx
  sources: [doi-complaint, map-sd]
