status_summary:
  en: >-
    Adults in Idaho can legally get hormone therapy from private providers, Planned Parenthood, and telehealth, but no
    public money may pay for it: Idaho Medicaid will not cover hormones or surgery for gender transition at any age, and
    state and local government clinicians may not provide it. Hormones, puberty blockers, and surgery for gender
    transition are banned for everyone under 18, and a provider who violates the ban commits a felony. Idaho has no
    shield law.
  es: >-
    Los adultos en Idaho pueden obtener legalmente terapia hormonal con proveedores privados, Planned Parenthood y
    telesalud, pero ningún dinero público puede pagarla: Medicaid de Idaho no cubre hormonas ni cirugía de transición a
    ninguna edad, y los clínicos empleados por el gobierno estatal o local no pueden proporcionarla. Las hormonas, los
    bloqueadores de pubertad y la cirugía de transición están prohibidos para menores de 18 años, y un proveedor que
    viole la prohibición comete un delito grave. Idaho no tiene ley escudo.
adult_care:
  status: restricted
  detail:
    en: |
      Hormone therapy is **legal for adults 18 and older**, but Idaho Code § 18-8901 (HB 668, effective July 1, 2024) cuts off public money at every age:
      - **Idaho Medicaid will not pay** for hormones, puberty blockers, or surgery for gender transition, except for people with a medically verified difference of sex development or to treat complications of past transition care.
      - **Doctors and nurses employed by the state, a county, or a city** may not provide this care on the job, and it may not be provided in state buildings.
      - Amounts paid for this care cannot be deducted on Idaho taxes.
      - A federal court has blocked the funding ban on hormone therapy only for a class of people in Idaho prisons (*Robinson v. Labrador*); that order does not help Medicaid members.

      **If you have no insurance or only Medicaid**, in rough order of what to try:
      1. **Telehealth**: QueerDoc and Plume serve Idaho and prescribe by informed consent. Point of Pride's HRT Access Fund can pay for telehealth care through partners.
      2. **Planned Parenthood Great Northwest** runs health centers in Boise and Meridian; call to ask whether they currently offer hormone therapy and the self-pay price.
      3. **Community health centers** charge on a sliding scale; find one at findahealthcenter.hrsa.gov and ask whether a provider will prescribe hormones (you pay out of pocket for the prescription if you are on Medicaid).
      4. Generic estradiol and spironolactone are inexpensive with a pharmacy discount coupon; compare cash prices for testosterone.
    es: |
      La terapia hormonal es **legal para adultos de 18 años o más**, pero el Código de Idaho § 18-8901 (HB 668, vigente desde el 1 de julio de 2024) prohíbe usar dinero público a cualquier edad:
      - **Medicaid de Idaho no paga** hormonas, bloqueadores de pubertad ni cirugía de transición, salvo para personas con una diferencia del desarrollo sexual verificada o para tratar complicaciones de una transición previa.
      - **Los médicos y enfermeros empleados por el estado, un condado o una ciudad** no pueden proporcionar esta atención en su trabajo, ni puede darse en edificios estatales.
      - Estos gastos no se pueden deducir de los impuestos de Idaho.
      - Una corte federal bloqueó la prohibición de fondos para terapia hormonal solo para un grupo de personas en prisiones de Idaho (*Robinson v. Labrador*); esa orden no ayuda a los miembros de Medicaid.

      **Si no tienes seguro o solo tienes Medicaid**, en orden aproximado:
      1. **Telesalud**: QueerDoc y Plume atienden Idaho por consentimiento informado. El Fondo de Acceso a TRH de Point of Pride puede pagar la atención por telesalud.
      2. **Planned Parenthood Great Northwest** tiene centros en Boise y Meridian; llama para preguntar si ofrecen terapia hormonal y su precio.
      3. Los **centros de salud comunitarios** cobran en escala móvil; búscalos en findahealthcenter.hrsa.gov.
      4. El estradiol y la espironolactona genéricos son baratos con un cupón de descuento de farmacia.
  sources: [ic-18-8901, hb668, robinson-order]
minor_care:
  status: prohibited
  detail:
    en: |
      Idaho's **Vulnerable Child Protection Act** (Idaho Code § 18-1506C, HB 71, effective January 1, 2024) bans, for anyone under 18, puberty blockers, testosterone or estrogen for gender transition, mastectomy, and genital or sterilizing surgery. A medical professional convicted of violating it faces a **felony with up to 10 years** in prison. Exceptions are for people with a medically verified difference of sex development and for treating complications of past transition care.

      The ban was challenged in *Poe v. Labrador*. After the US Supreme Court upheld Tennessee's similar law in *United States v. Skrmetti* (June 2025), the families dismissed their case, so the ban is **fully in effect**. There is no exception for young people who started treatment before 2024.

      A 2026 law, HB 822 (effective July 1, 2026), bars health care providers, schools, and child care providers from helping a minor with a medical or social transition (including new names or pronouns at school) without telling the parents and getting their consent, and lets parents sue.

      Families often travel to states such as Washington or Oregon for care; talk to a lawyer before doing so.
    es: |
      La **Ley de Protección del Niño Vulnerable** de Idaho (Código de Idaho § 18-1506C, HB 71, vigente desde el 1 de enero de 2024) prohíbe, para menores de 18 años, bloqueadores de pubertad, testosterona o estrógeno para la transición, mastectomía y cirugías genitales o esterilizantes. Un profesional médico condenado por violarla enfrenta un **delito grave con hasta 10 años** de prisión.

      La prohibición fue impugnada en *Poe v. Labrador*. Después de que la Corte Suprema confirmó la ley similar de Tennessee en *United States v. Skrmetti* (junio de 2025), las familias retiraron su demanda, así que la prohibición está **plenamente vigente**.

      Una ley de 2026, HB 822 (vigente desde el 1 de julio de 2026), prohíbe a proveedores de salud, escuelas y guarderías ayudar a un menor con una transición médica o social sin informar a los padres y obtener su consentimiento, y permite a los padres demandar.
  sources: [ic-18-1506c, hb71, poe-dismissal, hb822]
medicaid:
  program_name: Idaho Medicaid
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: Idaho Code § 18-8901(4) forbids Idaho Medicaid from covering hormones, puberty blockers, or surgery for gender transition at any age. Medicaid still covers other care, including primary care, labs unrelated to transition, and mental health care.
    es: El Código de Idaho § 18-8901(4) prohíbe que Medicaid de Idaho cubra hormonas, bloqueadores de pubertad o cirugía de transición a cualquier edad. Medicaid sigue cubriendo otra atención, como atención primaria y salud mental.
  how_to_apply_url: https://idalink.idaho.gov/
  sources: [ic-18-8901, dhw-medicaid]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: Idaho has no law barring private health plans from excluding gender-affirming care. Check your plan documents; employer plans regulated federally may have different rules. You can file a complaint with the Idaho Department of Insurance, and A4TE's Trans Health Project helps with insurance appeals.
    es: Idaho no tiene ninguna ley que prohíba a los seguros privados excluir la atención de afirmación de género. Revisa los documentos de tu plan. Puedes presentar una queja ante el Departamento de Seguros de Idaho.
  complaint_url: https://doi.idaho.gov/consumers/file-a-complaint/
  sources: [doi, map-id]
