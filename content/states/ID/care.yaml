litigation:
  - case: Robinson v. Labrador, No. 1:24-cv-00306
    court: US District Court for the District of Idaho
    summary:
      en: People in Idaho Department of Correction custody challenge § 18-8901's ban on public funding of gender-affirming care. The court has issued a series of 90-day preliminary injunctions, most recently on September 14, 2026.
      es: Personas bajo custodia del Departamento de Corrección de Idaho impugnan la prohibición de fondos públicos. La corte ha emitido varias órdenes preliminares de 90 días, la más reciente el 14 de septiembre de 2026.
    effect_today:
      en: Only class members in state prisons can keep receiving hormone therapy paid by the state. Medicaid coverage is still banned.
      es: Solo los miembros del grupo en prisiones estatales pueden seguir recibiendo terapia hormonal pagada por el estado. La cobertura de Medicaid sigue prohibida.
    last_update: "2026-09-14"
    url: https://www.courtlistener.com/docket/68900092/robinson-v-labrador/
    sources: [robinson-order]
