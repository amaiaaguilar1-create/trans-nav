jurisdiction: ID
slug: boise
name: Boise
area:
  en: Boise and the Treasure Valley (Ada and Canyon counties, including Meridian, Nampa, and Caldwell)
  es: Boise y el Valle del Tesoro (condados de Ada y Canyon, incluidos Meridian, Nampa y Caldwell)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Ada County Court Assistance Office address and phones read on courtselfhelp.idaho.gov/Local/Ada 2026-09-24. The $166
    filing fee is the statewide magistrate-division fee; Ada County charges no different amount as far as we found. The
    Ada County designated newspaper for name-change notices is on the court's county newspaper list (not read). TCC
    address and hours read on tccidaho.org. Full Circle Health's site lists PrEP and HIV care and a sliding fee but not
    hormone therapy. Planned Parenthood's Boise and Meridian health-center pages did not render for automated requests;
    their services (including whether they prescribe hormones) are unverified. Idaho Legal Aid Services' site returned
    HTTP 403; its details come from A4TE's Idaho page. Central District Health (cdh.idaho.gov) resolved but its STI/PrEP
    page was not read. St. Luke's and Add the Words were not listed (see state notes).
intro:
  en: >-
    Boise is Idaho's largest city and has most of the state's LGBTQIA+ services. You file a name change at the Ada
    County Courthouse (or the Canyon County courthouse if you live there). For hormone therapy, most people in the
    Treasure Valley use telehealth or private clinics, because Idaho law bars public funds, Medicaid, and
    government-employed clinicians from providing it.
  es: >-
    Boise es la ciudad más grande de Idaho y concentra la mayoría de los servicios LGBTQIA+ del estado. El cambio de
    nombre se presenta en el Juzgado del Condado de Ada (o en el del Condado de Canyon si vives allí). Para la terapia
    hormonal, la mayoría de las personas usa telesalud o clínicas privadas, porque la ley de Idaho prohíbe usar fondos
    públicos, Medicaid y clínicos empleados por el gobierno para proporcionarla.
court:
  name: Ada County District Court (Fourth Judicial District), magistrate division
  url: https://courtselfhelp.idaho.gov/Local/Ada
  self_help_url: https://courtselfhelp.idaho.gov/Local/Ada
  filing_fee: 166
  notes:
    en: The Court Assistance Office is at the Ada County Courthouse, 200 W. Front Street, Room 1171, Boise, ID 83702, phone 208-287-6963 or 208-287-6944, Monday to Friday 8 to 5. Staff help with forms but cannot give legal advice.
    es: La Oficina de Asistencia de la Corte está en el Juzgado del Condado de Ada, 200 W. Front Street, sala 1171, Boise, ID 83702, teléfono 208-287-6963 o 208-287-6944, de lunes a viernes de 8 a 5.
  sources: [ada-cao, isc-fees]
