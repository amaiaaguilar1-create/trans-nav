litigation:
  - case: F.V. v. Charron (formerly F.V. v. Barron), No. 1:17-cv-00170
    court: US District Court for the District of Idaho
    summary:
      en: >-
        A 2018 permanent injunction barred Idaho from automatically rejecting transgender people's applications to change
        the sex on their birth certificates, and a 2020 order held that it applied despite § 39-245A. The state moved to
        dissolve it in October 2025; the remaining plaintiff stipulated, relying on the state's statement that it would
        not rescind past amendments, and the court dissolved the injunction on January 8, 2026.
      es: >-
        Una orden permanente de 2018 impedía a Idaho rechazar automáticamente las solicitudes de personas transgénero para
        cambiar el sexo en sus actas. La corte disolvió la orden el 8 de enero de 2026, por acuerdo de las partes.
    effect_today:
      en: New sex-marker changes are not accepted. Certificates already amended remain in place based on the state's representation.
      es: No se aceptan nuevos cambios del marcador de sexo. Las actas ya modificadas se mantienen según lo declarado por el estado.
    last_update: "2026-01-08"
    url: https://www.courtlistener.com/docket/4845783/fv-v-barron/
    sources: [fv-order, fv-stipulation]
