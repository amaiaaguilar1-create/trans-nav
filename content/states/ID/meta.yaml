overview:
  en: >-
    Idaho is one of the most restrictive states for trans people. You can change your **name** in court, but you must
    publish a notice in a newspaper for four weeks and attend a hearing. Since a federal court injunction was dissolved in
    January 2026, Idaho no longer changes the sex on birth certificates, and because the Transportation Department ties
    the license sex marker to the birth certificate, most people can no longer change it on a license either. Hormone
    therapy and surgery for gender transition are banned for everyone under 18 (a felony for providers), and public
    money, including Medicaid, may not pay for this care at any age. Adults can still get hormones from private clinics,
    Planned Parenthood, and telehealth.
  es: >-
    Idaho es uno de los estados más restrictivos para las personas trans. Puedes cambiar tu **nombre** en la corte,
    pero debes publicar un aviso en un periódico durante cuatro semanas y asistir a una audiencia. Desde que se disolvió
    una orden judicial federal en enero de 2026, Idaho ya no cambia el sexo en las actas de nacimiento, y como el
    Departamento de Transporte vincula el sexo de la licencia al acta de nacimiento, la mayoría de las personas ya no
    puede cambiarlo en la licencia. La terapia hormonal y la cirugía de transición están prohibidas para menores de 18
    años (un delito grave para los proveedores), y el dinero público, incluido Medicaid, no puede pagar esta atención a
    ninguna edad. Los adultos todavía pueden obtener hormonas en clínicas privadas, Planned Parenthood y por telesalud.
