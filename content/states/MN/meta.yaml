  notes: >-
    Climate is based on statutes read on revisor.mn.gov 2026-09-24: the 2023 trans refuge law (HF 146, Laws 2023
    ch. 29), Medical Assistance coverage of gender-affirming care (Minn. Stat. 256B.0625 subd. 3a), and the health plan
    coverage mandate (Minn. Stat. 62Q.585, Laws 2024 ch. 114). ID documents are rated protective even though the birth
    certificate needs a physician letter or court order, because the driver's license is self-attestation with X and
    name changes need no publication. The mncourts.gov and mn.gov sites (courts, DHS, Commerce, MNsure) blocked
    automated fetching, so court and agency details come from LawHelpMN and other secondary pages; see each guide's
    notes. Rainbow Health closed July 19, 2024 and the Minnesota Transgender Health Coalition's domain now hosts an
    unrelated site; neither is listed.
overview:
  en: >-
    Minnesota is one of the more protective states for trans people. You can choose M, F, or X on a driver's license
    or state ID without any medical proof, name changes need no newspaper publication, Medical Assistance and
    state-regulated health plans must cover medically necessary gender-affirming care, and a 2023 "trans refuge" law
    (HF 146) shields patients, families, and providers from other states' bans. Two things take more effort than in
    some states: a name change requires a short court hearing with two witnesses, and changing the sex on a Minnesota
    birth certificate needs a physician's letter or a court order.
  es: >-
    Minnesota es uno de los estados que más protege a las personas trans. Puedes elegir M, F o X en tu licencia de
    conducir o identificación estatal sin prueba médica, los cambios de nombre no requieren publicación en el
    periódico, Medical Assistance y los planes de salud regulados por el estado deben cubrir la atención de afirmación
    de género médicamente necesaria, y una ley "refugio trans" de 2023 (HF 146) protege a pacientes, familias y
    proveedores de las prohibiciones de otros estados. Dos trámites requieren más esfuerzo: el cambio de nombre
    necesita una audiencia breve con dos testigos, y cambiar el sexo en un acta de nacimiento de Minnesota requiere una
    carta de un médico o una orden judicial.
