  notes: >-
    Legal framework read on revisor.mn.gov 2026-09-24: Minn. Stat. 256B.0625 subd. 3a (MA covers gender-affirming care
    as defined in 62Q.585), 62Q.585 (new in Laws 2024 ch. 114; effective date not confirmed), and Laws 2023 ch. 29 (HF
    146). mn.gov (DHS, Commerce) and mnsure.org blocked automated fetching, so: the Commerce complaint URL is not
    verified; MA income limits are not stated; MinnesotaCare coverage of gender-affirming care was not confirmed and is
    not claimed. Federal MA changes (immigration eligibility from October 1, 2026; work requirements from January 2027)
