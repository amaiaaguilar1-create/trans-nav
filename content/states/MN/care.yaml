    located and is not listed. Rainbow Health (closed July 19, 2024) and the Minnesota Transgender Health Coalition
    (domain now hosts an unrelated site) are intentionally omitted. No bill restricting care was confirmed to have passed
    a chamber in the 2026 session; pending_bills is omitted and should be checked. Point of Pride fund timing, the Commerce vs. MDH complaint routing for HMOs, and PP North Central States' Medicaid participation were not verified.
status_summary:
  en: >-
    Gender-affirming care is legal for adults and minors in Minnesota. Medical Assistance and state-regulated health
    plans must cover medically necessary gender-affirming care, and the 2023 trans refuge law protects patients,
    families, and providers from other states' subpoenas, extradition, and custody claims. Informed-consent hormone
    care is available from Planned Parenthood (16 and older) and sliding-scale clinics in the Twin Cities.
  es: >-
    La atención de afirmación de género es legal para adultos y menores en Minnesota. Medical Assistance y los planes
    de salud regulados por el estado deben cubrir la atención de afirmación de género médicamente necesaria, y la ley
    refugio trans de 2023 protege a pacientes, familias y proveedores de citaciones, extradiciones y reclamos de
    custodia de otros estados. Hay atención hormonal por consentimiento informado en Planned Parenthood (desde los 16
    años) y en clínicas con escala móvil en las Ciudades Gemelas.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Planned Parenthood North Central States and several Twin Cities clinics prescribe hormones on an **informed consent** basis: no therapist letter or referral is needed. Telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **Medical Assistance** (Minnesota Medicaid) through MNsure or your county. It covers gender-affirming care by statute.
      2. Go to a **sliding-scale clinic** such as Family Tree Clinic in Minneapolis, which does not turn people away for inability to pay, or a community health center (findahealthcenter.hrsa.gov).
      3. **Planned Parenthood North Central States** offers hormone therapy in person and by telehealth and helps uninsured patients figure out costs.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for people who qualify (applications open once a year).
    es: |
      Sin restricciones estatales. Planned Parenthood North Central States y varias clínicas de las Ciudades Gemelas recetan hormonas por **consentimiento informado**: no se necesita carta de terapeuta ni referencia. La telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medical Assistance** (Medicaid de Minnesota) a través de MNsure o tu condado. Por ley cubre la atención de afirmación de género.
      2. Acude a una **clínica con escala móvil** como Family Tree Clinic en Minneapolis, que no rechaza a nadie por no poder pagar, o a un centro de salud comunitario (findahealthcenter.hrsa.gov).
      3. **Planned Parenthood North Central States** ofrece terapia hormonal en persona y por telesalud y ayuda a pacientes sin seguro con los costos.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud a quienes califican (solicitudes una vez al año).
  sources: [stat-256b-0625, ppncs-hrt, familytree-pay, hrsa, pop-hrt]
minor_care:
  status: available
  detail:
    en: |
      Legal with parental consent. Minnesota's 2023 trans refuge law (HF 146) bars enforcement of other states' laws that would remove a child from a parent for allowing gender-affirming care, blocks subpoenas seeking information about gender-affirming care received or provided in Minnesota, lets Minnesota courts take emergency custody jurisdiction when a child is in the state to get this care, and limits extradition for providing or receiving it.

      Planned Parenthood North Central States sees patients in Minnesota from **age 16** (post-puberty; a parent or guardian comes to the first visit). Family Tree Clinic offers hormone care from **age 14** with a parent or guardian consent form. RECLAIM provides sliding-scale therapy for queer and trans youth 12 to 25. Federal actions in 2025 and 2026 led some hospital systems nationally to pause youth gender care, so call a hospital program to confirm what it currently offers.
    es: |
      Legal con consentimiento de los padres. La ley refugio trans de 2023 (HF 146) impide aplicar leyes de otros estados que quitarían a un menor a sus padres por permitir atención de afirmación de género, bloquea citaciones que buscan información sobre esa atención recibida o dada en Minnesota, permite a los tribunales de Minnesota asumir jurisdicción de custodia de emergencia cuando un menor está en el estado para recibirla, y limita la extradición por darla o recibirla.

      Planned Parenthood North Central States atiende en Minnesota desde los **16 años** (después de la pubertad; un padre o tutor asiste a la primera visita). Family Tree Clinic ofrece atención hormonal desde los **14 años** con un formulario de consentimiento de padre o tutor. RECLAIM ofrece terapia con escala móvil para jóvenes queer y trans de 12 a 25 años. Acciones federales en 2025 y 2026 llevaron a algunos hospitales del país a pausar la atención para jóvenes, así que llama para confirmar lo que ofrece cada programa.
  sources: [hf146, ppncs-hrt, familytree-hrt, reclaim]
medicaid:
  program_name: Medical Assistance (Minnesota Medicaid)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Minnesota law says "Medical assistance covers gender-affirming care, as defined in section 62Q.585" (Minn. Stat. § 256B.0625, subd. 3a). That definition includes all medical, surgical, counseling, and referral services, including telehealth, that support a person's gender identity or expression and are legal in Minnesota, when medically necessary.

      **Federal changes are coming**: starting October 1, 2026, federal law changes who can qualify for MA based on immigration status; from January 1, 2027 some adults may need to meet work or community engagement reporting requirements, and some will renew every six months. If you are enrolled, watch your mail and renew on time.

      **Apply** through MNsure (online), or at your county or tribal human services office.
    es: |
      La ley de Minnesota dice que "Medical Assistance cubre la atención de afirmación de género, según la define la sección 62Q.585" (§ 256B.0625, subd. 3a). Esa definición incluye todos los servicios médicos, quirúrgicos, de consejería y de referencia, incluida la telesalud, que apoyan la identidad o expresión de género y son legales en Minnesota, cuando son médicamente necesarios.

      **Vienen cambios federales**: desde el 1 de octubre de 2026, la ley federal cambia quién califica para MA según su estatus migratorio; desde el 1 de enero de 2027 algunos adultos quizá deban cumplir requisitos de trabajo o participación comunitaria, y algunos renovarán cada seis meses. Si estás inscrito, revisa tu correo y renueva a tiempo.

      **Solicita** por MNsure (en línea) o en la oficina de servicios humanos de tu condado o tribu.
  how_to_apply_url: https://www.mnsure.org/
  sources: [stat-256b-0625, stat-62q-585, lawhelp-ma]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Since the 2024 law (Minn. Stat. § 62Q.585), no health plan offered, sold, issued, or renewed in Minnesota may exclude coverage for medically necessary gender-affirming care or apply a more restrictive definition of medical necessity to it. If your plan denies care, file an internal appeal, then request an external review or file a complaint with the Minnesota Department of Commerce, which regulates insurers (HMO complaints may go to the Minnesota Department of Health; Commerce can route you). Self-funded employer plans are federally regulated and may not be covered by this law; the Trans Health Project has appeal templates for those.
    es: |
      Desde la ley de 2024 (§ 62Q.585), ningún plan de salud ofrecido, vendido, emitido o renovado en Minnesota puede excluir la atención de afirmación de género médicamente necesaria ni aplicarle una definición más restrictiva de necesidad médica. Si tu plan niega la atención, presenta una apelación interna y luego una revisión externa o queja ante el Departamento de Comercio de Minnesota (o el Departamento de Salud para HMO). Los planes autofinanciados de empleadores están regulados federalmente y pueden no estar cubiertos; el Trans Health Project tiene plantillas de apelación.
  complaint_url: https://mn.gov/commerce/consumers/file-a-complaint/
  sources: [stat-62q-585, thp]
