sources:
  - id: stat-259-10
    url: https://www.revisor.mn.gov/statutes/cite/259.10
    title: Minn. Stat. § 259.10, General requirements
    publisher: Minnesota Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: A person who shall have resided in this state for six months may apply to the district court in the county where the person resides ... no minor child's name may be changed without both parents having notice of the pending of the application for change of name, whenever practicable
  - id: stat-259-11
    url: https://www.revisor.mn.gov/statutes/cite/259.11
    title: Minn. Stat. § 259.11, Order; filing copies
    publisher: Minnesota Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: Upon meeting the requirements of section 259.10, the court shall grant the application unless (1) it finds that there is an intent to defraud or mislead
  - id: stat-259-13
    url: https://www.revisor.mn.gov/statutes/cite/259.13
    title: Minn. Stat. § 259.13, Persons with felony conviction; name changes
    publisher: Minnesota Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: A person with a felony conviction ... shall serve a notice of application for a name change on the prosecuting authority that obtained the conviction
  - id: stat-357-021
    url: https://www.revisor.mn.gov/statutes/cite/357.021
    title: Minn. Stat. § 357.021, Court administrator fees
    publisher: Minnesota Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: "In every civil action or proceeding in said court ... for filing the first paper, $310 ... Certified copy of any instrument from a civil or criminal proceeding, $14"
  - id: stat-134a-09
    url: https://www.revisor.mn.gov/statutes/cite/134A.09
    title: Minn. Stat. § 134A.09, County law library fees
    publisher: Minnesota Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: The law library board of trustees shall, with the approval of the board of commissioners, set the amount of the law library fee
  - id: stat-563-01
    url: https://www.revisor.mn.gov/statutes/cite/563.01
    title: Minn. Stat. § 563.01, In forma pauperis
    publisher: Minnesota Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: A person who is receiving public assistance ... who is represented by an attorney on behalf of a civil legal services program ... or who has an annual income not greater than 125 percent of the poverty line ... is presumed to be unable to pay
  - id: lawhelp-diy
    url: https://www.lawhelpmn.org/self-help-library/legal-resource/name-change-application-do-it-yourself
    title: Name Change Application, Do It Yourself (last updated 07/2025)
    publisher: LawHelpMN / Education for Justice
    kind: org
    accessed: "2026-09-24"
    quote: Go to your hearing. You must bring 2 witnesses who have known you for at least 1 year. If you are married, 1 witness must be your spouse.
  - id: lawhelp-ifp
    url: https://www.lawhelpmn.org/self-help-library/legal-resource/court-fee-waiver-do-it-yourself
    title: Court Fee Waiver, Do It Yourself
    publisher: LawHelpMN
    kind: org
    accessed: "2026-09-24"
    quote: You may be able to get a fee waiver if you fit into 1 of these 4 categories
