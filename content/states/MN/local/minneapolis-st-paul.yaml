    description:
      en: Peer-support hotline by and for trans people, 877-565-8860.
      es: Línea de apoyo entre pares por y para personas trans, 877-565-8860.
    url: https://translifeline.org/
    phone: "877-565-8860"
    cost: free
    languages: [English, Español]
    verification: org_website
    sources: [translifeline]
