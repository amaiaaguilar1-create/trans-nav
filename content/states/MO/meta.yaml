  notes: >-
    Climate ratings follow the statutes read on revisor.mo.gov on 2026-09-24 (RSMo 191.1720, 208.152.15, 217.230,
    193.215.9, 527.290) and the MAP state profile. No shield law exists. Amendment 3 (HJR 73) is on the November 3,
