    August 28, 2027 sunset would no longer end it. Reviewer: update this file after the election.
overview:
  en: >-
    Missouri is one of the harder states for trans people. A name change is possible in circuit court, but the new
    name must be published in a newspaper three times, and the only waiver is for abuse survivors. Changing the sex on
    a Missouri birth certificate takes a court order saying the sex was changed "by surgical procedure", and the
    Department of Revenue no longer uses its old gender-change form for licenses. Since August 28, 2023, the SAFE Act
    (SB 49) bars hormones, puberty blockers, and surgery for gender transition for anyone under 18 (with a
    grandfather clause), MO HealthNet (Medicaid) does not pay for this care at any age, and prisons may not provide
    gender transition surgery. Adults with private insurance or who pay cash can still get hormone therapy.
    **November 3, 2026 ballot**: Amendment 3 would write the ban on care for minors into the state constitution.
  es: >-
    Misuri es uno de los estados más difíciles para las personas trans. Se puede cambiar el nombre en el tribunal de
    circuito, pero el nuevo nombre debe publicarse tres veces en un periódico, y solo se exime a sobrevivientes de
    abuso. Cambiar el sexo en un acta de nacimiento de Misuri requiere una orden judicial que diga que el sexo se
    cambió "mediante procedimiento quirúrgico", y el Departamento de Ingresos ya no usa su antiguo formulario de cambio
    de género para licencias. Desde el 28 de agosto de 2023, la Ley SAFE (SB 49) prohíbe hormonas, bloqueadores de
    pubertad y cirugía de transición para menores de 18 años (con una excepción para quienes ya recibían tratamiento),
    MO HealthNet (Medicaid) no paga esta atención a ninguna edad, y las prisiones no pueden ofrecer cirugía de
    transición. Los adultos con seguro privado o que pagan en efectivo todavía pueden recibir terapia hormonal.
    **Boleta del 3 de noviembre de 2026**: la Enmienda 3 incluiría en la constitución estatal la prohibición de
    atención a menores.
