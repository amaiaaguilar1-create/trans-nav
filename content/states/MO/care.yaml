status_summary:
  en: >-
    Adults in Missouri can get hormone therapy, but MO HealthNet (Medicaid) will not pay for hormones or surgery for
    gender transition at any age, and state prisons may not provide gender transition surgery. For anyone under 18,
    Missouri bans hormones, puberty blockers, and surgery for gender transition (SB 49, upheld by the Missouri Supreme
    Court in January 2026). On November 3, 2026, voters decide Amendment 3, which would write the ban for minors into
    the state constitution.
  es: >-
    Los adultos en Misuri pueden recibir terapia hormonal, pero MO HealthNet (Medicaid) no paga hormonas ni cirugía
    de transición a ninguna edad, y las prisiones estatales no pueden ofrecer cirugía de transición. Para menores de
    18 años, Misuri prohíbe hormonas, bloqueadores de pubertad y cirugía de transición (SB 49, confirmada por la Corte
    Suprema de Misuri en enero de 2026). El 3 de noviembre de 2026 los votantes deciden la Enmienda 3, que incluiría la
    prohibición para menores en la constitución estatal.
adult_care:
  status: restricted
  detail:
    en: |
      Hormone therapy is legal for adults 18 and older, and Missouri has no law limiting which providers can prescribe it. Planned Parenthood Great Rivers prescribes on an **informed consent** basis (no therapist letter), in St. Louis-area health centers and by telehealth, with financial assistance for those who qualify. Telehealth services FOLX and Plume also serve Missouri.

      The restrictions are about money and custody:
      - **MO HealthNet (Medicaid) will not pay** for cross-sex hormones, puberty blockers, or gender transition surgery, for adults or minors (RSMo 208.152.15). If you rely on MO HealthNet, you will need to pay cash for these medications or use a fund.
      - **State prisons** may not provide gender transition surgery (RSMo 217.230).

      **If you have no insurance and little money**:
      1. **Planned Parenthood Great Rivers**: financial assistance for hormone therapy; call 314-531-7526.
      2. **Community health centers** (find one at findahealthcenter.hrsa.gov) charge on a sliding scale; ask whether a provider manages gender-affirming hormones.
      3. **Point of Pride's HRT Access Fund** pays for telehealth hormone care (applications open once a year).
      4. Generic estradiol and spironolactone are usually inexpensive at cash prices with a discount coupon; ask the pharmacy for the cash price.
    es: |
      La terapia hormonal es legal para adultos de 18 años o más, y Misuri no tiene una ley que limite qué proveedores pueden recetarla. Planned Parenthood Great Rivers receta con **consentimiento informado** (sin carta de terapeuta), en centros del área de St. Louis y por telesalud, con ayuda financiera para quienes califican. Los servicios de telesalud FOLX y Plume también atienden Misuri.

      Las restricciones tienen que ver con el pago y la custodia:
      - **MO HealthNet (Medicaid) no paga** hormonas, bloqueadores de pubertad ni cirugía de transición, ni para adultos ni para menores (RSMo 208.152.15). Si dependes de MO HealthNet, tendrás que pagar estos medicamentos en efectivo o usar un fondo.
      - Las **prisiones estatales** no pueden ofrecer cirugía de transición (RSMo 217.230).

      **Si no tienes seguro ni mucho dinero**:
      1. **Planned Parenthood Great Rivers**: asistencia financiera para terapia hormonal; llama al 314-531-7526.
      2. Los **centros de salud comunitarios** (búscalos en findahealthcenter.hrsa.gov) cobran en escala móvil; pregunta si algún proveedor maneja hormonas de afirmación de género.
      3. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud (solicitudes una vez al año).
      4. El estradiol y la espironolactona genéricos suelen ser económicos en efectivo con un cupón de descuento; pregunta el precio en efectivo en la farmacia.
  sources: [rsmo-208-152, rsmo-217-230, pp-great-rivers-hrt, hrsa, pop-hrt]
minor_care:
  status: prohibited
  detail:
    en: |
      Since **August 28, 2023**, the Missouri SAFE Act (SB 49, RSMo 191.1720) bars health care providers from performing gender transition surgery on anyone under 18 and from prescribing or giving cross-sex hormones or puberty blockers for gender transition to anyone under 18.

      - **Grandfather clause**: young people who were already receiving hormones or blockers for gender transition before August 28, 2023 may continue.
      - **Exceptions**: disorders of sex development, treating complications of earlier transition care, and emergencies.
      - **Penalties**: a violation is unprofessional conduct and the provider's license must be revoked. Patients can sue for at least $500,000, with damages tripled, up to 15 years after turning 21.
      - **Court challenge**: the Missouri Supreme Court upheld the law on January 13, 2026 (E.N. v. Kehoe); it is fully in effect.
      - **Sunset and ballot**: the ban on hormones and blockers is written to expire on **August 28, 2027**; the surgery ban has no end date. **Amendment 3** on the **November 3, 2026** ballot would add a ban on "gender transition procedures for minors, including gender transition surgeries, cross-sex hormones or puberty-blocking drugs" to the state constitution. If it passes, the 2027 statutory sunset would no longer end the ban.

      Planned Parenthood Great Rivers sends minors who want to start hormones to its **Fairview Heights, Illinois** health center (Illinois allows this care); its Regional Logistics Center (618-607-5080) helps with travel. The Campaign for Southern Equality keeps a guide for Missouri families.
    es: |
      Desde el **28 de agosto de 2023**, la Ley SAFE de Misuri (SB 49, RSMo 191.1720) prohíbe a los proveedores de salud realizar cirugía de transición a menores de 18 años y recetar o administrar hormonas cruzadas o bloqueadores de pubertad para la transición a menores de 18 años.

      - **Excepción de continuidad**: quienes ya recibían hormonas o bloqueadores antes del 28 de agosto de 2023 pueden continuar.
      - **Excepciones**: trastornos del desarrollo sexual, tratamiento de complicaciones de atención previa y emergencias.
      - **Sanciones**: una violación es conducta no profesional y se debe revocar la licencia del proveedor. Los pacientes pueden demandar por al menos $500,000, con daños triplicados, hasta 15 años después de cumplir 21.
      - **Impugnación**: la Corte Suprema de Misuri confirmó la ley el 13 de enero de 2026 (E.N. v. Kehoe); está plenamente vigente.
      - **Vencimiento y boleta**: la prohibición de hormonas y bloqueadores está redactada para vencer el **28 de agosto de 2027**; la prohibición de cirugía no tiene fecha de fin. La **Enmienda 3** en la boleta del **3 de noviembre de 2026** añadiría a la constitución estatal una prohibición de "procedimientos de transición de género para menores". Si se aprueba, el vencimiento de 2027 ya no pondría fin a la prohibición.

      Planned Parenthood Great Rivers envía a los menores que quieren empezar hormonas a su centro de **Fairview Heights, Illinois** (Illinois permite esta atención); su Centro Regional de Logística (618-607-5080) ayuda con el traslado. La Campaign for Southern Equality tiene una guía para familias de Misuri.
  sources: [rsmo-191-1720, lambda-en-v-kehoe, sos-2026-ballot, pp-great-rivers-hrt, promo-tj]
medicaid:
  program_name: MO HealthNet
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: |
      State law says "there shall be no payments made" by MO HealthNet for gender transition surgeries, cross-sex hormones, or puberty-blocking drugs for the purpose of a gender transition (RSMo 208.152.15, added by SB 49 in 2023). This applies to adults as well as minors. MO HealthNet still covers your other care, including primary care, lab work, mental health care, PrEP, and STI testing, so it is still worth enrolling if you qualify.

      Apply online through the Department of Social Services.
    es: |
      La ley estatal dice que MO HealthNet "no hará pagos" por cirugías de transición, hormonas cruzadas ni bloqueadores de pubertad con fines de transición de género (RSMo 208.152.15, añadido por SB 49 en 2023). Esto aplica a adultos y menores. MO HealthNet sigue cubriendo el resto de tu atención, incluida atención primaria, laboratorios, salud mental, PrEP y pruebas de ITS, así que vale la pena inscribirte si calificas.

      Solicita en línea en el Departamento de Servicios Sociales.
  how_to_apply_url: https://dss.mo.gov/healthcare/apply
  sources: [rsmo-208-152, dss-apply]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Missouri has no state law requiring private insurers to cover gender-affirming care or forbidding exclusions. Coverage depends on your plan. If a claim is denied, appeal with the plan first, then ask for an external review; you can file a complaint with the Missouri Department of Commerce and Insurance for state-regulated plans. Employer self-funded plans are federally regulated. The Trans Health Project has free appeal templates, and LSEM's Marketplace Assistance Program helps St. Louis-area residents choose and use marketplace coverage.
    es: |
      Misuri no tiene una ley estatal que obligue a las aseguradoras privadas a cubrir atención de afirmación de género ni que prohíba exclusiones. La cobertura depende de tu plan. Si te niegan un reclamo, apela primero con el plan y luego pide una revisión externa; puedes presentar una queja ante el Departamento de Comercio y Seguros de Misuri para planes regulados por el estado. Los planes autofinanciados de empleadores están regulados a nivel federal. El Trans Health Project tiene plantillas de apelación gratuitas, y el programa de asistencia del Mercado de LSEM ayuda a residentes del área de St. Louis a elegir y usar su cobertura.
  complaint_url: https://insurance.mo.gov/consumer-complaints/insurance-complaints
  sources: [map-profile, dci-complaints, thp, lsem-services]
