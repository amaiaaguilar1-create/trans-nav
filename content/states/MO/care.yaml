litigation:
  - case: E.N. v. Kehoe (formerly Noe v. Parson)
    court: Circuit Court of Cole County; Missouri Supreme Court
    summary:
      en: Families of trans youth, medical providers, PFLAG, and GLMA challenged SB 49 under the Missouri Constitution. The trial court upheld the law in November 2024, and the Missouri Supreme Court affirmed on January 13, 2026.
      es: Familias de jóvenes trans, proveedores médicos, PFLAG y GLMA impugnaron SB 49 bajo la Constitución de Misuri. El tribunal de primera instancia confirmó la ley en noviembre de 2024 y la Corte Suprema de Misuri la ratificó el 13 de enero de 2026.
    effect_today:
      en: The ban on care for minors is fully in effect. The case is closed.
      es: La prohibición de atención para menores está plenamente vigente. El caso está cerrado.
    last_update: "2026-01-13"
    url: https://lambdalegal.org/case/en-v-kehoe/
    sources: [lambda-en-v-kehoe]
pending_bills:
  - bill: HCS HJR 73 (2025), Amendment 3 on the November 3, 2026 ballot
    summary:
      en: Constitutional amendment that would repeal the 2024 reproductive rights amendment and "prohibit gender transition procedures for minors including gender transition surgeries, cross-sex hormones or puberty-blocking drugs." Passed by the legislature in 2025; voters decide on November 3, 2026.
      es: Enmienda constitucional que derogaría la enmienda de derechos reproductivos de 2024 y "prohibiría los procedimientos de transición de género para menores, incluidas cirugías, hormonas cruzadas y bloqueadores de pubertad". Aprobada por la legislatura en 2025; los votantes deciden el 3 de noviembre de 2026.
    status: passed
    last_action: "2025-05-30"
    url: https://www.sos.mo.gov/elections/petitions/2026BallotMeasures
    sources: [sos-2026-ballot, hjr73]
