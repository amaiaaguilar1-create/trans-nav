  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Drafted 2026-09-24. Legal framework from Executive Order 11 (June 20, 2025), Insurance Bulletin No. 86 (2016,
    revised 2020), the DHSS notice on the CMS rule for minors (effective October 13, 2026), and the legislature's bill
    records. Open items: (1) SHIELD LAW: Delaware's protections are an executive order, not a statute. HB 346 (2024),
    which would have written shield protections into Titles 10 and 24, stopped at "Out of Committee" on 3/27/24 and died
    with the 152nd General Assembly. The task prompt's "2024 shield law (HB 346)" is therefore not law. MAP lists
    Delaware as having a "shield law or executive order" (2025), consistent with EO 11. (2) MEDICAID: no DMMA page
    stating adult coverage of hormones or surgery could be fetched (the provider manual portal redirects to a cookie
    check). "Yes" for HRT and surgery rests on MAP's Delaware profile scoring Medicaid policy as explicitly inclusive,
    plus the fact that DHSS is now acting on a federal rule limiting care for minors. Confirm with the DMMA policy
    manual or a Diamond State Health Plan MCO (Highmark Health Options, AmeriHealth Caritas Delaware, Delaware First
    Health). (3) Exactly which services for minors Delaware Medicaid will stop covering on October 13, 2026 is not
    spelled out on the DHSS page; affected people are to receive notices. (4) Westside Family Healthcare's site does
    not mention gender-affirming care; it is listed as a sliding-scale primary care FQHC only. (5) ChristianaCare's
    site search returned no gender-affirming care program page; only the Holloway Community Program (HIV/PrEP) is
    listed. (6) Planned Parenthood of Delaware: 18+ for hormone therapy per its own page.
status_summary:
  en: >-
    Gender-affirming care is legal in Delaware for adults and minors. State-regulated insurance may not exclude it, and
    a 2025 executive order bars state agencies from helping other states punish patients or providers. Starting
    October 13, 2026, a federal rule stops Medicaid and CHIP from paying for certain gender-affirming care for minors.
  es: >-
    La atención de afirmación de género es legal en Delaware para adultos y menores. Los seguros regulados por el
    estado no pueden excluirla, y una orden ejecutiva de 2025 impide que las agencias estatales ayuden a otros estados
    a castigar a pacientes o proveedores. Desde el 13 de octubre de 2026, una regla federal impide que Medicaid y CHIP
    paguen ciertos servicios de afirmación de género para menores.
adult_care:
  status: available
  detail:
    en: |
      No state restriction on adult care. Planned Parenthood of Delaware prescribes feminizing and masculinizing hormones to patients 18 and older at its centers in Wilmington, Newark, Dover, and Seaford, and telehealth providers (Plume, FOLX) serve Delaware.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **Delaware Medicaid** through ASSIST. It is free for adults with low incomes.
      2. Go to a **community health center** (FQHC) such as Westside Family Healthcare; they charge on a sliding scale. Ask whether the clinic prescribes hormones or can refer you. Find one at findahealthcenter.hrsa.gov.
      3. **Planned Parenthood of Delaware** (1-800-230-7526) for hormone therapy, ages 18+.
      4. **Point of Pride's HRT Access Fund** pays for up to 18 months of telehealth hormone care (applications each May).
    es: |
      No hay restricciones estatales para adultos. Planned Parenthood de Delaware receta hormonas feminizantes y masculinizantes a pacientes de 18 años o más en Wilmington, Newark, Dover y Seaford, y proveedores de telesalud (Plume, FOLX) atienden en Delaware.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medicaid de Delaware** en ASSIST. Es gratis para adultos de bajos ingresos.
      2. Acude a un **centro de salud comunitario** (FQHC) como Westside Family Healthcare; cobran en escala móvil. Pregunta si recetan hormonas o pueden referirte. Búscalo en findahealthcenter.hrsa.gov.
      3. **Planned Parenthood de Delaware** (1-800-230-7526) para terapia hormonal, desde los 18 años.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga hasta 18 meses de atención hormonal por telesalud (solicitudes cada mayo).
  sources: [pp-de-ght, pp-de-centers, hrsa, pop, dmma-eligibility]
minor_care:
  status: available
  detail:
    en: |
      Legal. Delaware has no law banning gender-affirming care for minors, and Executive Order 11 (June 20, 2025) directs state agencies not to share records or help with out-of-state investigations, refuses extradition for care lawful in Delaware, and bars state licensing boards from disciplining providers for it. Care for minors requires parental consent. Planned Parenthood of Delaware sees hormone patients from age 18 only.

      **Medicaid change on October 13, 2026**: DHSS says a new federal CMS rule prohibits federal Medicaid and CHIP funding for certain gender-affirming care for minors, and Delaware must comply. People and providers affected will receive a notice. Private insurance is not affected by that rule.
    es: |
      Legal. Delaware no tiene ninguna ley que prohíba la atención de afirmación de género para menores, y la Orden Ejecutiva 11 (20 de junio de 2025) indica a las agencias estatales no compartir expedientes ni ayudar en investigaciones de otros estados, niega la extradición por atención legal en Delaware e impide que las juntas de licencias sancionen a proveedores. La atención a menores requiere consentimiento de los padres. Planned Parenthood de Delaware atiende pacientes de hormonas solo desde los 18 años.

      **Cambio en Medicaid el 13 de octubre de 2026**: DHSS informa que una nueva regla federal de CMS prohíbe usar fondos federales de Medicaid y CHIP para ciertos servicios de afirmación de género para menores, y Delaware debe cumplirla. Las personas y proveedores afectados recibirán un aviso. Esa regla no afecta a los seguros privados.
  sources: [eo11, dhss-cms-minors, pp-de-ght]
medicaid:
  program_name: Delaware Medicaid (Diamond State Health Plan)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Delaware Medicaid is scored by the Movement Advancement Project as having a policy that explicitly covers transgender-related care; we could not load a state Medicaid page confirming exactly which services are covered, so ask your managed care plan for its gender-affirming care policy and prior-authorization rules before scheduling surgery.

      **Minors**: from October 13, 2026, a federal rule prohibits federal Medicaid and CHIP funding for certain gender-affirming care for people under 18. DHSS says it will comply and send notices to affected members and providers.

      **Apply** online through ASSIST or at a State Service Center.
    es: |
      El Movement Advancement Project califica a Medicaid de Delaware como con una política que cubre explícitamente la atención trans; no pudimos cargar una página estatal que confirme exactamente qué servicios cubre, así que pregunta a tu plan su política de atención de afirmación de género y los requisitos de autorización previa antes de programar una cirugía.

      **Menores**: desde el 13 de octubre de 2026, una regla federal prohíbe usar fondos federales de Medicaid y CHIP para ciertos servicios de afirmación de género para menores de 18 años. DHSS dice que cumplirá y enviará avisos.

      **Solicita** en línea en ASSIST o en un State Service Center.
  how_to_apply_url: https://assist.dhss.delaware.gov/
  sources: [map-de, dhss-cms-minors, dmma-eligibility]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Delaware's Gender Identity Nondiscrimination Act of 2013 made it an unfair insurance practice to discriminate based on gender identity (18 Del. C. § 2304(22)). The Department of Insurance's **Bulletin No. 86** (2016, reissued 2020) says state-regulated insurers may not deny, limit, or exclude coverage because of gender identity, transgender status, or gender transition. If your plan denies care, appeal with the plan first, then file a complaint or appeal with the Department of Insurance. Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates for those.
    es: |
      La Ley de No Discriminación por Identidad de Género de 2013 hizo ilegal que las aseguradoras discriminen por identidad de género (18 Del. C. § 2304(22)). El **Boletín No. 86** del Departamento de Seguros (2016, reemitido en 2020) dice que las aseguradoras reguladas por el estado no pueden negar, limitar ni excluir cobertura por identidad de género, condición trans o transición. Si tu plan niega la atención, apela primero con el plan y luego presenta una queja o apelación ante el Departamento de Seguros. Los planes autofinanciados por empleadores están regulados federalmente; el Trans Health Project tiene plantillas de apelación.
  complaint_url: https://insurance.delaware.gov/services/filecomplaint/
  sources: [bulletin-86, doi-complaint, thp]
