  - id: gx-form
    url: https://dmv.de.gov/forms/driver_serv_forms/pdfs/Gender-Designation-Change-Consent-Form_2021.pdf
    title: Gender Designation Change Consent Form (listed as Request for Gender X)
    publisher: Delaware Division of Motor Vehicles
    kind: form
    accessed: "2026-09-24"
    quote: request to have my gender designation changed from M/F/X to M/F/X on my driver license or identification card
