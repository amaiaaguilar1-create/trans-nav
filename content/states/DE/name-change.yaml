    pillars: [name_change, gender_marker, mental_health]
    description:
      en: LGBTQ+ community center in Sussex County. A4TE lists it as a place to get help and resource referrals for name and gender marker changes in Delaware.
      es: Centro comunitario LGBTQ+ en el condado de Sussex. A4TE lo recomienda para ayuda y referencias sobre cambios de nombre y marcador de género.
    url: https://www.camprehoboth.org/
    phone: "302-227-5620"
    address: 37 Baltimore Avenue, Rehoboth Beach, DE 19971
    cost: free
    verification: org_website
    sources: [camp-rehoboth, a4te-de]
  - id: trans-lifeline
