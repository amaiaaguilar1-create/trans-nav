      es: Ayuda legal civil en todo el estado para personas de bajos ingresos, personas mayores y personas con discapacidad, con oficinas en Wilmington, Dover y Georgetown. Llama para preguntar si pueden ayudar con un cambio de nombre o referirte.
    url: https://www.declasi.org/
    phone: "302-575-0660"
    address: 100 W. 10th St., Suite 801, Wilmington, DE 19801
    areas_served:
      en: Statewide
      es: Todo el estado
    cost: free
    verification: org_website
