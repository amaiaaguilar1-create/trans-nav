      en: Peer support hotline (877-565-8860) run by and for trans people; offers microgrants for ID and name change costs when funding allows.
      es: Línea de apoyo entre pares (877-565-8860) dirigida por y para personas trans; ofrece microsubvenciones para costos de identificación y cambio de nombre cuando hay fondos.
    url: https://translifeline.org/
    phone: "877-565-8860"
    cost: free
    verification: org_website
    sources: [translifeline]
