name: Wilmington
area:
  en: New Castle County (Wilmington, Newark, and surrounding areas)
  es: Condado de New Castle (Wilmington, Newark y alrededores)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details from the Court of Common Pleas name change packet. Resources from each organization's own website on
    2026-09-24. Westside does not advertise gender-affirming care; the Holloway program is HIV/PrEP-focused. Delaware
    Pride's site mentions mental health support but no specific program details were confirmed. Verify hours and
    new-patient availability before marking reviewed.
intro:
  en: >-
    Wilmington is Delaware's largest city. Adult name change petitions for New Castle County are filed at the Court of
    Common Pleas in the Leonard L. Williams Justice Center downtown. Planned Parenthood's Wilmington center offers
    hormone therapy for adults, and community health centers, HIV/PrEP programs, and statewide legal aid all have
    offices in the city.
  es: >-
    Wilmington es la ciudad más grande de Delaware. Las peticiones de cambio de nombre de adultos en el condado de
    New Castle se presentan en el Tribunal de Causas Comunes, en el centro de la ciudad. El centro de Planned
    Parenthood en Wilmington ofrece terapia hormonal para adultos, y hay centros de salud comunitarios, programas de
    VIH/PrEP y ayuda legal estatal con oficinas en la ciudad.
court:
  name: Court of Common Pleas, New Castle County
  url: https://courts.delaware.gov/commonpleas/
  self_help_url: https://courts.delaware.gov/help/changename/
  filing_fee: 85
  notes:
    en: 500 N. King Street, Wilmington, DE 19801; 302-255-0900; CCP_NCCCivilFilings@delaware.gov. Minors' name changes go to New Castle County Family Court instead.
    es: 500 N. King Street, Wilmington, DE 19801; 302-255-0900; CCP_NCCCivilFilings@delaware.gov. Los cambios de nombre de menores van al Tribunal de Familia del condado de New Castle.
  sources: [ccp-packet, ccp-changename]
