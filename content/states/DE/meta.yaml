  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate: ID documents rated "mixed" because license and birth certificate changes need a provider's signature and
    offer only M or F (HB 375 of 2026, which would have allowed X by self-attestation, did not pass), while name changes
    need no publication. Care rated "protective": no bans, insurance nondiscrimination (Bulletin 86), and a shield
    executive order. shield_law is true on the strength of Executive Order 11 (2025); it is not a statute (HB 346 of
    2024 died in committee). Reviewer: decide whether the site treats an executive order as a shield law.
overview:
  en: >-
    Delaware lets adults change their name in the Court of Common Pleas with no newspaper publication, and lets people
    change the sex on their driver's license and Delaware birth certificate to M or F with a signed statement from a
    licensed provider (no surgery or court order). An X marker is not yet available. Gender-affirming care is legal
    for all ages, state-regulated insurance may not exclude it, and a 2025 executive order protects patients and
    providers from other states' investigations. A federal rule stops Medicaid from paying for certain care for
    minors starting October 13, 2026.
  es: >-
    Delaware permite a los adultos cambiar su nombre en el Tribunal de Causas Comunes sin publicación en periódico, y
    cambiar el sexo en la licencia de conducir y en el acta de nacimiento de Delaware a M o F con una declaración
    firmada por un proveedor con licencia (sin cirugía ni orden judicial). El marcador X aún no está disponible. La
    atención de afirmación de género es legal para todas las edades, los seguros regulados por el estado no pueden
    excluirla y una orden ejecutiva de 2025 protege a pacientes y proveedores de investigaciones de otros estados. Una
    regla federal impide que Medicaid pague ciertos servicios para menores desde el 13 de octubre de 2026.
