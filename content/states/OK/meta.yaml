  notes: >-
    Climate ratings follow statutes read on OSCN on 2026-09-24 (63 O.S. 1-321 as amended by HB 1225 (2026); 25 O.S. 16
    as amended by HB 1449 (2024); 63 O.S. 2607.1 (SB 613, 2023); 63 O.S. 1-800 (SB 904, 2026)) and agree with MAP's
    Oklahoma profile (negative on both ID documents, youth care ban, Medicaid exclusion, no shield law). The driver's
    license rating rests on Executive Order 2023-20 as described by ACLU of Oklahoma and A4TE; the Service Oklahoma
    site says nothing about sex markers. Only Oklahoma City has a local file; Tulsa County court pages could not be
