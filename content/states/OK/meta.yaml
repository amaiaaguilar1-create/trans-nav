overview:
  en: >-
    Oklahoma is one of the most restrictive states for trans people. You can still change your **name** through a
    district court petition (one newspaper notice, which a judge can waive for good cause), but the state will not
    change the sex on an Oklahoma birth certificate or driver's license, and state law defines "sex" as biological
    sex at birth. Hormones, puberty blockers, and surgery for gender transition are a felony to provide to anyone
    under 18. Since May 12, 2026, SoonerCare (Medicaid), public funds, and state facilities such as OU Health may not
    be used for this care at any age. Adults can still get hormones from private clinics, Planned Parenthood, and
    telehealth.
  es: >-
    Oklahoma es uno de los estados más restrictivos para las personas trans. Todavía puedes cambiar tu **nombre** con
    una petición ante el tribunal de distrito (un aviso en el periódico, que un juez puede dispensar por causa
    justificada), pero el estado no cambia el sexo en el acta de nacimiento ni en la licencia de conducir de
    Oklahoma, y la ley estatal define "sexo" como el sexo biológico al nacer. Dar hormonas, bloqueadores de pubertad o
    cirugía de transición a menores de 18 años es un delito grave. Desde el 12 de mayo de 2026, SoonerCare
    (Medicaid), los fondos públicos y las instalaciones estatales como OU Health no pueden usarse para esta atención a
    ninguna edad. Los adultos todavía pueden obtener hormonas en clínicas privadas, Planned Parenthood y telesalud.
