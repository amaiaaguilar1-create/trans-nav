litigation:
  - case: Poe v. Drummond, No. 23-5110
    court: US Court of Appeals for the Tenth Circuit
    summary:
      en: Families of trans minors and a physician challenged SB 613. The district court denied a preliminary injunction in October 2023; the Tenth Circuit affirmed on August 6, 2025, and the plaintiffs voluntarily dismissed the case on August 29, 2025.
      es: Familias de menores trans y una médica impugnaron SB 613. El tribunal de distrito negó una orden preliminar en octubre de 2023; el Décimo Circuito lo confirmó el 6 de agosto de 2025 y los demandantes desistieron del caso el 29 de agosto de 2025.
    effect_today:
      en: The case is over. The ban on care for minors is fully in effect.
      es: El caso terminó. La prohibición de atención para menores está plenamente vigente.
    last_update: "2025-08-29"
    url: https://www.courtlistener.com/docket/67313661/poe-v-drummond/
    sources: [poe-10th, poe-dismissal]
