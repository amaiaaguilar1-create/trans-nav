status_summary:
  en: >-
    Adults in Oklahoma can still legally get hormone therapy from private clinics, Planned Parenthood, and telehealth.
    Since May 12, 2026, SoonerCare (Medicaid) may not cover hormones, puberty blockers, or surgery for gender transition
    at any age, public funds may not pay for it, and state-owned facilities (such as OU Health) may not provide it.
    Providing this care to anyone under 18 has been a felony since May 1, 2023, and a federal appeals court let that ban
    stand in 2025. Oklahoma has no shield law.
  es: >-
    Los adultos en Oklahoma todavía pueden obtener legalmente terapia hormonal en clínicas privadas, Planned
    Parenthood y telesalud. Desde el 12 de mayo de 2026, SoonerCare (Medicaid) no puede cubrir hormonas, bloqueadores
    de pubertad ni cirugía de transición a ninguna edad, los fondos públicos no pueden pagarla y las instalaciones
    estatales (como OU Health) no pueden proveerla. Dar esta atención a menores de 18 años es un delito grave desde el
    1 de mayo de 2023, y un tribunal federal de apelaciones dejó vigente esa prohibición en 2025. Oklahoma no tiene
    ley escudo.
adult_care:
  status: restricted
  detail:
    en: |
      Hormone therapy is **legal for adults 18 and older**, but **SB 904** (63 O.S. § 1-800, effective May 12, 2026) limits who can pay for and provide it, at any age:
      - **SoonerCare will not pay** for puberty blockers, hormones, or surgery for gender transition.
      - **No public funds** may be paid to any person or organization to provide or subsidize this care.
      - **No state property, facility, or building** may be used to provide it. Freedom Oklahoma reports this ended care at state facilities such as OU Health and OSU Medical Center and for people in state prisons.
      - State officers or employees who intentionally violate the law can be charged with a misdemeanor.
      - Mental health counseling is not affected.

      **If you have no insurance and little money**, in rough order of what to try:
      1. **Planned Parenthood Great Plains** prescribes hormones to patients **18 and older** at its Oklahoma health centers (Oklahoma City, Edmond, Tulsa) with **no therapy requirement**, in person or by telehealth. Financial counselors help uninsured patients. Call 1-800-230-7526.
      2. **Diversity Family Health** (Oklahoma City, Norman, Tulsa) and the **OKEQ Health Clinic** (Tulsa) are private LGBTQ+ clinics that offer hormone therapy and self-pay options.
      3. **Telehealth**: Plume serves Oklahoma. Point of Pride's HRT Access Fund pays for 18 months of telehealth hormone care through partner providers.
      4. For the medications themselves, generic estradiol and spironolactone are inexpensive with a pharmacy discount coupon; compare cash prices for testosterone.

      If you were getting care through SoonerCare or a state facility and it stopped, move your prescription to a private provider as soon as possible so you do not run out.
    es: |
      La terapia hormonal es **legal para adultos de 18 años o más**, pero **SB 904** (63 O.S. § 1-800, vigente desde el 12 de mayo de 2026) limita quién puede pagarla y proveerla, a cualquier edad:
      - **SoonerCare no pagará** bloqueadores de pubertad, hormonas ni cirugía de transición.
      - **Ningún fondo público** puede pagarse a una persona u organización para proveer o subsidiar esta atención.
      - **Ninguna propiedad, instalación o edificio estatal** puede usarse para proveerla. Freedom Oklahoma informa que esto terminó la atención en instalaciones estatales como OU Health y OSU Medical Center y para personas en prisiones estatales.
      - Los funcionarios o empleados estatales que violen la ley a propósito pueden ser acusados de un delito menor.
      - La consejería de salud mental no se ve afectada.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. **Planned Parenthood Great Plains** receta hormonas a pacientes de **18 años o más** en sus centros de Oklahoma (Oklahoma City, Edmond, Tulsa) **sin requisito de terapia**, en persona o por telesalud. Sus asesores financieros ayudan a personas sin seguro. Llama al 1-800-230-7526.
      2. **Diversity Family Health** (Oklahoma City, Norman, Tulsa) y la **OKEQ Health Clinic** (Tulsa) son clínicas privadas LGBTQ+ que ofrecen terapia hormonal y opciones de pago directo.
      3. **Telesalud**: Plume atiende Oklahoma. El Fondo de Acceso a TRH de Point of Pride paga 18 meses de atención hormonal por telesalud con proveedores asociados.
      4. Los medicamentos genéricos como estradiol y espironolactona son económicos con un cupón de descuento de farmacia; compara precios de testosterona.

      Si recibías atención por SoonerCare o en una instalación estatal y se suspendió, pasa tu receta a un proveedor privado lo antes posible para no quedarte sin medicamento.
  sources: [sb904, sb904-bill, freedom-ok-health, ppgp-gac, pp-ok-centers, dfh-gac, okeq-clinic, pop-hrt]
minor_care:
  status: prohibited
  detail:
    en: |
      **Banned since May 1, 2023** (SB 613, 63 O.S. § 2607.1). A health care provider may not knowingly give anyone under 18 puberty blockers, cross-sex hormones, or surgery to affirm a gender different from their biological sex. A six-month taper for minors already on treatment ended in November 2023. Exceptions cover mental health care, depression and anxiety medication, precocious or delayed puberty, intersex conditions, and complications.

      **Penalties**: providing this care is a **felony** (prosecution can begin until the patient turns 45) and unprofessional conduct for licensing boards. Parents or the patient can sue the provider until the patient turns 45, and the Attorney General can enforce the law.

      **The ban is in full effect.** In **Poe v. Drummond**, the Tenth Circuit upheld the denial of a preliminary injunction on August 6, 2025, and the families dismissed the case later that month. Since May 12, 2026, SB 904 also bars SoonerCare and public funds from paying for this care. Oklahoma has no shield law. Mental health care and social support remain legal. Families considering care in another state should talk to a lawyer first.
    es: |
      **Prohibida desde el 1 de mayo de 2023** (SB 613, 63 O.S. § 2607.1). Un proveedor de salud no puede dar a sabiendas a menores de 18 años bloqueadores de pubertad, hormonas cruzadas ni cirugía para afirmar un género distinto a su sexo biológico. El periodo de retiro gradual de seis meses terminó en noviembre de 2023. Las excepciones cubren salud mental, medicamentos para depresión y ansiedad, pubertad precoz o tardía, condiciones intersexuales y complicaciones.

      **Sanciones**: proveer esta atención es un **delito grave** (se puede procesar hasta que el paciente cumpla 45 años) y conducta no profesional ante las juntas de licencias. Los padres o el paciente pueden demandar al proveedor hasta que el paciente cumpla 45, y el Fiscal General puede hacer cumplir la ley.

      **La prohibición está plenamente vigente.** En **Poe v. Drummond**, el Décimo Circuito confirmó el rechazo de una orden preliminar el 6 de agosto de 2025, y las familias desistieron del caso ese mismo mes. Desde el 12 de mayo de 2026, SB 904 también impide que SoonerCare y los fondos públicos paguen esta atención. Oklahoma no tiene ley escudo. La atención de salud mental sigue siendo legal. Las familias que consideren atención en otro estado deben hablar primero con un abogado.
  sources: [sb613, poe-10th, poe-dismissal, sb904]
medicaid:
  program_name: SoonerCare
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: |
      Under 63 O.S. § 1-800(C) (SB 904, effective May 12, 2026), "the state Medicaid program shall not reimburse or provide coverage for any gender transition procedures, regardless of whether the procedures are provided to a minor or an adult." That covers puberty blockers, hormones, and surgery for gender transition. SoonerCare still covers mental health care, primary care, PrEP, and STI testing, so it is still worth enrolling if you qualify. Apply online or call the SoonerCare helpline at 1-800-987-7767.
    es: |
      Según 63 O.S. § 1-800(C) (SB 904, vigente desde el 12 de mayo de 2026), el programa estatal de Medicaid no reembolsará ni cubrirá ningún procedimiento de transición de género, sea para menores o adultos. Eso incluye bloqueadores de pubertad, hormonas y cirugía. SoonerCare sigue cubriendo salud mental, atención primaria, PrEP y pruebas de ITS, así que vale la pena inscribirse si calificas. Solicita en línea o llama a la línea de SoonerCare al 1-800-987-7767.
  how_to_apply_url: https://www.apply.okhca.org/Site/UserAccountLogin.aspx
  sources: [sb904, ohca-apply]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Oklahoma has no law requiring private health plans to cover gender-affirming care or banning trans-specific exclusions. Check your plan documents for an exclusion. If your plan wrongly denies a claim, you can appeal with the insurer, file a complaint with the Oklahoma Insurance Department (800-522-0071), and get free appeal help from A4TE's Trans Health Project. Employer self-funded plans are regulated federally, not by the state.
    es: |
      Oklahoma no tiene una ley que obligue a los planes privados a cubrir la atención de afirmación de género ni que prohíba exclusiones específicas. Revisa si tu plan tiene una exclusión. Si tu plan niega un reclamo indebidamente, puedes apelar ante la aseguradora, presentar una queja ante el Departamento de Seguros de Oklahoma (800-522-0071) y obtener ayuda gratuita con apelaciones del Trans Health Project de A4TE. Los planes autofinanciados por empleadores se regulan a nivel federal.
  complaint_url: https://www.oid.ok.gov/consumers/file-an-online-complaint/
  sources: [map-ok, oid, a4te-thp]
