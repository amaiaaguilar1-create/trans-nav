litigation:
  - case: Fowler v. Stitt, No. 23-5080
    court: US Court of Appeals for the Tenth Circuit (question certified to the Oklahoma Supreme Court)
    summary:
      en: >-
        Three transgender people born in Oklahoma challenge OSDH's refusal to amend the sex on their birth
        certificates. The Tenth Circuit held in June 2024 that the policy likely violates equal protection; the US
        Supreme Court vacated that decision on June 30, 2025 for reconsideration after United States v. Skrmetti. On
        April 16, 2026 the Tenth Circuit certified questions to the Oklahoma Supreme Court about whether Oklahoma law
        has always barred such changes, and abated the appeal. The parties briefed the effect of HB 1225 in June and
        July 2026.
      es: >-
        Tres personas trans nacidas en Oklahoma impugnan la negativa de OSDH a enmendar el sexo en sus actas. El
        Décimo Circuito decidió en junio de 2024 que la política probablemente viola la igualdad ante la ley; la Corte
        Suprema de EE. UU. anuló esa decisión el 30 de junio de 2025 para reconsiderarla tras United States v.
        Skrmetti. El 16 de abril de 2026 el Décimo Circuito envió preguntas a la Corte Suprema de Oklahoma y pausó la
        apelación.
    effect_today:
      en: No sex marker changes are available while the case is pending. The Oklahoma Supreme Court's answer was requested by January 11, 2027.
      es: No hay cambios de marcador de sexo mientras el caso sigue pendiente. Se pidió la respuesta de la Corte Suprema de Oklahoma para el 11 de enero de 2027.
    last_update: "2026-07-15"
    url: https://www.courtlistener.com/docket/67661338/fowler-v-stitt/
    sources: [fowler-cert, fowler-status]
