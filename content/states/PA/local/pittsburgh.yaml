  notes: >-
    Short list. Allegheny County's name change filing fee could not be confirmed (fee page lists "Petitions -
    Miscellaneous $174.75" without naming name changes). The Civil Division assigns "Special Name Change" cases to
    designated judges; confirm this is the track for safety-waiver and sealed petitions. UPMC ending care for patients
    under 19 (June 30, 2025) is community-reported. Planned Parenthood of Western PA could not be fetched (HTTP 403).
    Allies for Health + Wellbeing and Persad Center were not listed because their sites did not load.
intro:
  en: >-
    Pittsburgh has a trans-led name change project, an LGBTQ clinic with consent-based hormone care, and community
    mutual aid. Name change petitions are filed in the Allegheny County Court of Common Pleas.
  es: >-
    Pittsburgh tiene un proyecto de cambio de nombre dirigido por personas trans, una clínica LGBTQ con atención
    hormonal basada en consentimiento y ayuda mutua comunitaria. Las peticiones se presentan en el Tribunal de Causas
    Comunes del condado de Allegheny.
court:
  name: Court of Common Pleas of Allegheny County, Civil Division (Fifth Judicial District)
  url: https://www.alleghenycourts.us/civil/about/general-motions/
  notes:
    en: >-
      Petitions are filed with the Allegheny County Department of Court Records with your fingerprint card attached.
      Questions about name change procedures go to Civilnamechanges@alleghenycourts.us. The Civil Division lists
      designated judges for "Special Name Change" cases.
    es: >-
      Las peticiones se presentan en el Department of Court Records del condado de Allegheny con la tarjeta de huellas.
      Preguntas: Civilnamechanges@alleghenycourts.us.
  sources: [allegheny-general-motions, allegheny-special-cases]
