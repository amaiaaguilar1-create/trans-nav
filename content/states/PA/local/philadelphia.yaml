  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details from the First Judicial District's name change packet (rev. 1/20/26). Two 2026 changes a reviewer
    should know: Mazzoni Center's legal services program has ended (its page now refers people to CLS, PLA, and the
    AIDS Law Project), and A4TE's Name Change Project stopped accepting applications on March 11, 2026. Mazzoni's
    gender-affirming care pages returned "not authorized" to automated access; confirm it still prescribes hormones.
    Philadelphia FIGHT's site does not list a trans-specific program on its home page; the entry is general. Planned
    Parenthood Southeastern PA could not be fetched (HTTP 403). Galaei was not listed because its old domain now
    redirects to an unrelated site.
intro:
  en: >-
    Philadelphia has the state's largest set of trans services: free legal help with IDs, LGBTQ primary care and sexual
    health clinics, and peer support. Name change petitions are filed at the Civil Filing Center in City Hall.
  es: >-
    Filadelfia tiene la mayor cantidad de servicios trans del estado: ayuda legal gratuita con documentos, clínicas LGBTQ
    de atención primaria y salud sexual, y apoyo entre pares. Las peticiones de cambio de nombre se presentan en el Civil
    Filing Center del City Hall.
court:
  name: Court of Common Pleas of Philadelphia County, Trial Division, Civil (First Judicial District)
  url: https://www.courts.phila.gov/forms/
  filing_fee: 349.23
  notes:
    en: >-
      File adult petitions (form 01-101A) at the Civil Filing Center, Room 296, City Hall, with your fingerprint card,
      copies of your birth certificate and Social Security card, and Pennsylvania photo ID. Minors' petitions go to
      Family Court, 1501 Arch Street, 11th floor (215-686-3805). Questions about the steps go to the Discovery Court
      Program, 215-686-7914. A conference hearing is usually set within 90 days, and total costs can exceed $900 unless
      fees and publication are waived.
    es: >-
      Presenta las peticiones de adultos (formulario 01-101A) en el Civil Filing Center, sala 296 del City Hall, con tu
      tarjeta de huellas, copias de tu acta de nacimiento y tarjeta del Seguro Social, e identificación con foto de
      Pensilvania. Las de menores van al Tribunal de Familia, 1501 Arch Street, piso 11 (215-686-3805). Preguntas:
      Discovery Court Program, 215-686-7914.
  sources: [phila-packet]
