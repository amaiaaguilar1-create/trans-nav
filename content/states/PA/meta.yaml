  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate ratings are editorial. MAP (read 2026-09-24) scores PA 1/1 for Medicaid and private insurance, 1/1 for
    driver's license, 0.75 for birth certificate, 0/1 for name-change publication, and 0/1 for shield law. PA has no
    statutory shield law; Executive Order 2022-02 (Gov. Wolf) addresses conversion therapy and LGBTQIA+ support but is
    not a shield law. Mazzoni Center's legal services program has ended and A4TE's Name Change Project stopped taking
    applications on March 11, 2026, so neither is listed as a key resource.
overview:
  en: >-
    Pennsylvania is a mixed state for ID documents and a generally protective one for care. The driver's license is
    easy to update: you choose M, F, or X on PennDOT form DL-32 with no doctor's letter. A name change goes through the
    county Court of Common Pleas and still involves fingerprints, a hearing, judgment searches, and newspaper
    publication (the court can waive publication and seal the file if publishing would put you in danger). A birth
    certificate change to M or F needs a physician's letter but no surgery. Gender-affirming care is legal for adults
    and minors, Medical Assistance (Medicaid) has covered it since 2016, and state insurance guidance bars blanket
    exclusions. There is no shield law.
  es: >-
    Pensilvania es un estado mixto para documentos de identidad y en general protector para la atención médica. La
    licencia de conducir es fácil de actualizar: eliges M, F o X en el formulario DL-32 de PennDOT sin carta médica.
    El cambio de nombre se tramita en el Tribunal de Causas Comunes del condado y todavía requiere huellas digitales,
    audiencia, búsquedas de sentencias y publicación en periódicos (el tribunal puede eximir la publicación y sellar el
    expediente si publicar te pondría en peligro). El cambio en el acta de nacimiento a M o F requiere una carta de un
    médico, pero no cirugía. La atención de afirmación de género es legal para adultos y menores, Medical Assistance
    (Medicaid) la cubre desde 2016 y las pautas estatales de seguros prohíben exclusiones generales. No hay ley escudo.
