jurisdiction: AL
slug: birmingham
name: Birmingham
area:
  en: Jefferson County and the surrounding Birmingham metro (Shelby, St. Clair, Walker, Blount counties)
  es: Condado de Jefferson y el área metropolitana de Birmingham (condados de Shelby, St. Clair, Walker y Blount)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    The Jefferson County Commission site (jccal.org), including the Probate Court pages, returned HTTP 403 to automated
    access on 2026-09-24, so the probate court's name change fee, form, and background-check requirement are NOT
    confirmed; no court URL or fee is given. Jefferson County Probate Court has a Birmingham division and a Bessemer
    division; reviewer should add the current address, fee, and URL. Resource details (addresses, phones, services)
    read on each organization's own site the same day. MCAC's contact page lists phone numbers with a 447 area code
    that look like typos, so no phone is listed. Planned Parenthood Southeast's site returned 403; its Birmingham
    center is omitted.
intro:
  en: >-
    Birmingham has Alabama's largest cluster of trans-affirming services: UAB's Gender Health Clinic for adult hormone
    therapy, the Magic City Acceptance Center for LGBTQ+ community and case management, and several free sexual health
    clinics. Name changes are filed in the Jefferson County Probate Court. Remember that care for anyone under 19 is
    banned statewide.
  es: >-
    Birmingham tiene la mayor concentración de servicios de afirmación trans en Alabama: la Clínica de Salud de Género de
    UAB para terapia hormonal de adultos, el Magic City Acceptance Center para comunidad LGBTQ+ y manejo de casos, y
    varias clínicas gratuitas de salud sexual. Los cambios de nombre se presentan en el Tribunal Testamentario del
    Condado de Jefferson. Recuerda que la atención para menores de 19 años está prohibida en todo el estado.
court:
  name: Jefferson County Probate Court (Birmingham and Bessemer divisions)
  notes:
    en: File where you live in Jefferson County. Call the probate office before you go to confirm the fee, whether it uses form PS-12, and whether it wants an ALEA background check. For free help preparing the petition, visit a Birmingham Volunteer Lawyers Program help desk.
    es: Presenta donde vives en el condado de Jefferson. Llama antes para confirmar la tarifa, si usa el formulario PS-12 y si pide una verificación de antecedentes de ALEA. Para ayuda gratuita, visita una mesa de ayuda del Programa de Abogados Voluntarios de Birmingham.
  sources: [ala-12-13-1, ps-12]
resources:
  - id: bbvlp
    name: Birmingham Bar Volunteer Lawyers Program
    type: legal_aid
    pillars: [name_change]
    description:
      en: In-person help desks where income-eligible people meet a volunteer attorney the same day, get the court process explained, and start forms. Bring a pay stub or benefits letter.
      es: Mesas de ayuda en persona donde personas con ingresos elegibles ven a un abogado voluntario el mismo día y reciben ayuda con los formularios. Lleva un talón de pago o carta de beneficios.
    url: https://vlpbirmingham.org/
    cost: free
    verification: org_website
    sources: [bbvlp]
