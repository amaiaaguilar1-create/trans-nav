  notes: >-
    Climate is based on primary sources read 2026-09-24: Ala. Code 22-9A-19(d) (birth certificate sex change needs a
    court order that sex was changed by surgery), ALEA Policy Order 63 as quoted by the Eleventh Circuit in Corbitt v.
    Secretary (Sept. 20, 2024), Act 2022-289 (V-CAP, Ala. Code 26-26-1 to -8), and Act 2025-3 (SB 79, the "What Is a
    Woman Act", effective Oct. 1, 2025). MAP's Alabama profile agrees (negative law for both documents, youth care ban,
    no shield law). Not confirmed: whether ALEA and ADPH still process surgery-based changes after SB 79 took effect.
    equalityalabama.org is no longer an LGBTQ organization (the domain now hosts unrelated content); do not link it.
overview:
  en: >-
    Alabama is a restrictive state for trans people. You can change your name in probate court with a short petition
    and no publication, but changing the sex on an Alabama birth certificate or driver's license requires proof of
    gender-affirming surgery, and a 2025 law (SB 79) defines sex in state law as sex "observed or clinically verified at
    birth." Hormones, puberty blockers, and surgery are banned for anyone under 19 (Alabama's age of majority). Adults
    can get care, and there is no shield law.
  es: >-
    Alabama es un estado restrictivo para las personas trans. Puedes cambiar tu nombre en el tribunal testamentario
    (probate) con una petición breve y sin publicación, pero cambiar el sexo en un acta de nacimiento o licencia de
    Alabama requiere prueba de cirugía de afirmación de género, y una ley de 2025 (SB 79) define el sexo en la ley
    estatal como el sexo "observado o verificado clínicamente al nacer". Las hormonas, los bloqueadores de pubertad y la
    cirugía están prohibidos para menores de 19 años (la mayoría de edad en Alabama). Los adultos pueden recibir
    atención y no hay ley escudo.
