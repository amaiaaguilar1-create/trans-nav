statutes:
  - cite: Ala. Code §§ 26-26-1 to 26-26-8 (Act 2022-289, SB 184)
    title:
      en: Alabama Vulnerable Child Compassion and Protection Act; bans blockers, hormones, and surgery for minors under 19
    url: https://alison.legislature.state.al.us/code-of-alabama?section=26-26-4
  - cite: Ala. Code § 43-8-1(18)
    title:
      en: Defines minor as a person under 19
    url: https://alison.legislature.state.al.us/code-of-alabama?section=43-8-1
litigation:
  - case: Eknes-Tucker v. Governor of Alabama, No. 22-11707
    court: U.S. Court of Appeals for the Eleventh Circuit
    summary:
      en: Families and providers challenged the V-CAP ban. The district court preliminarily blocked the hormone and blocker provisions in May 2022; on August 21, 2023 the Eleventh Circuit vacated that injunction.
      es: Familias y proveedores impugnaron la prohibición. El tribunal de distrito bloqueó las disposiciones sobre hormonas y bloqueadores en mayo de 2022; el 21 de agosto de 2023 el Undécimo Circuito anuló esa orden.
    effect_today:
      en: The ban is in effect. No court order protects providers or patients under 19.
      es: La prohibición está vigente. Ninguna orden judicial protege a proveedores o pacientes menores de 19 años.
    last_update: "2023-08-21"
    url: https://media.ca11.uscourts.gov/opinions/pub/files/202211707.pdf
    sources: [eknes-tucker]
