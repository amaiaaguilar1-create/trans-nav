  notes: >-
    V-CAP (Ala. Code 26-26-1 to -8, Act 2022-289) read on ALISON 2026-09-24; minor = under 19 via 43-8-1. Eknes-Tucker
    v. Governor (11th Cir. Aug. 21, 2023) vacated the preliminary injunction; we did not confirm the current posture of
    the district court case (reviewer: check whether it was dismissed after United States v. Skrmetti, June 18, 2025).
    Medicaid: all 65 chapter PDFs of the Alabama Medicaid Administrative Code (medicaid.alabama.gov) were searched for
    "gender", "transgender", "sex change", "sex reassignment", "sex transformation", and "transsexual" with no match, so
    there is no written exclusion there, but no coverage policy either; coverage marked unclear. Pharmacy/PDL and
    provider manual not checked. Planned Parenthood Southeast pages returned 403; whether its Birmingham center offers
    hormone therapy is NOT confirmed. Thrive Alabama's "LGBTQ healthcare" page no longer names hormone therapy
    explicitly; confirm by phone. QueerMed lists Alabama as a service state (queermed.com/locations) but is not in
    content/orgs, so it is an inline resource. FOLX's state list excludes AL. UAB Gender Health Clinic confirmed on
    uabmedicine.org.
status_summary:
  en: >-
    Adults can get hormone therapy and surgery in Alabama; no state law restricts adult care. For anyone under 19,
    Alabama makes it a felony to provide puberty blockers, hormones, or gender-affirming surgery, and that ban has been in
    effect since August 2023. Alabama has no shield law and no insurance protections. UAB's Gender Health Clinic in
    Birmingham and telehealth services such as Plume and QueerMed serve adults.
  es: >-
    Los adultos pueden recibir terapia hormonal y cirugía en Alabama; ninguna ley estatal restringe la atención para
    adultos. Para menores de 19 años, Alabama considera delito grave proporcionar bloqueadores de pubertad, hormonas o
    cirugía de afirmación de género, y esa prohibición está vigente desde agosto de 2023. Alabama no tiene ley escudo ni
    protecciones de seguros. La Clínica de Salud de Género de UAB en Birmingham y servicios de telesalud como Plume y
    QueerMed atienden a adultos.
adult_care:
  status: available
  detail:
    en: |
      No Alabama law restricts gender-affirming care for adults (19 and older). Options:
      - **UAB Gender Health Clinic** (Birmingham) offers hormone therapy, sexual and reproductive health, and referrals for voice therapy, mental health, and some surgeries. Call 205-975-5854.
      - **Telehealth**: Plume and QueerMed both serve Alabama. QueerMed lists self-pay at $99 a month including labs (medications extra).
      - **Community health centers** charge on a sliding scale; find one at findahealthcenter.hrsa.gov and ask whether they prescribe hormones.

      **If you are 18**: you are still a minor under Alabama law, so in-state providers cannot start or continue hormones until you turn 19. The Campaign for Southern Equality's Trans Youth Emergency Project helps 18-year-olds in Alabama find care in other states and offers travel grants.

      **If you have no insurance and little money**: compare telehealth self-pay prices, apply to Point of Pride's HRT Access Fund, and check generic prices with GoodRx (generic estradiol and spironolactone are often inexpensive).
    es: |
      Ninguna ley de Alabama restringe la atención de afirmación de género para adultos (19 años o más). Opciones:
      - **Clínica de Salud de Género de UAB** (Birmingham): terapia hormonal, salud sexual y reproductiva, y referencias para terapia de voz, salud mental y algunas cirugías. Llama al 205-975-5854.
      - **Telesalud**: Plume y QueerMed atienden en Alabama. QueerMed indica $99 al mes con laboratorios (medicamentos aparte).
      - **Centros de salud comunitarios** con escala móvil; búscalos en findahealthcenter.hrsa.gov y pregunta si recetan hormonas.

      **Si tienes 18 años**: sigues siendo menor según la ley de Alabama, así que los proveedores del estado no pueden iniciar ni continuar hormonas hasta que cumplas 19. El Trans Youth Emergency Project de Campaign for Southern Equality ayuda a jóvenes de 18 años en Alabama a encontrar atención en otros estados y ofrece becas de viaje.

      **Si no tienes seguro ni mucho dinero**: compara precios de telesalud, solicita el Fondo de Acceso a TRH de Point of Pride y revisa precios de genéricos en GoodRx.
  sources: [uab-ghc, queermed-locations, queermed-costs, cse-tyep, hrsa, pop-hrt, ala-43-8-1]
minor_care:
  status: prohibited
  detail:
    en: |
      The **Alabama Vulnerable Child Compassion and Protection Act** (SB 184, Act 2022-289, Ala. Code §§ 26-26-1 to 26-26-8) bans, for anyone **under 19**, puberty blockers, "supraphysiologic" doses of testosterone or estrogen, sterilizing surgeries, genital surgeries, and removal of healthy tissue when done to affirm a gender different from the minor's sex at birth. A violation is a **Class C felony** for the person who provides it. The only exception is for minors with a medically verified disorder (difference) of sex development. Mental health counseling is not banned. The law also bars school staff from keeping a student's gender identity from parents.

      A federal court blocked the hormone and blocker provisions in May 2022, but the Eleventh Circuit vacated that injunction on **August 21, 2023** (*Eknes-Tucker v. Governor of Alabama*). The ban is fully in effect. In June 2025, the U.S. Supreme Court upheld Tennessee's similar law in *United States v. Skrmetti*.

      Families can get navigation help and $500 travel grants from the Campaign for Southern Equality's Trans Youth Emergency Project.
    es: |
      La **Ley de Compasión y Protección del Niño Vulnerable de Alabama** (SB 184, Ley 2022-289, §§ 26-26-1 a 26-26-8) prohíbe, para menores de **19 años**, bloqueadores de pubertad, dosis "suprafisiológicas" de testosterona o estrógeno, cirugías esterilizantes, cirugías genitales y la extirpación de tejido sano cuando se hacen para afirmar un género distinto al sexo al nacer. Violarla es un **delito grave de clase C** para quien la proporciona. La única excepción es para menores con un trastorno (diferencia) del desarrollo sexual verificado médicamente. La consejería de salud mental no está prohibida. La ley también prohíbe al personal escolar ocultar a los padres la identidad de género de un estudiante.

      Un tribunal federal bloqueó las disposiciones sobre hormonas y bloqueadores en mayo de 2022, pero el Undécimo Circuito anuló esa orden el **21 de agosto de 2023** (*Eknes-Tucker v. Governor of Alabama*). La prohibición está plenamente vigente. En junio de 2025, la Corte Suprema confirmó la ley similar de Tennessee en *United States v. Skrmetti*.

      Las familias pueden recibir ayuda de navegación y becas de viaje de $500 del Trans Youth Emergency Project de Campaign for Southern Equality.
  sources: [ala-26-26-4, ala-26-26-3, sb184, eknes-tucker, skrmetti, cse-tyep]
medicaid:
  program_name: Alabama Medicaid
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: Alabama Medicaid's administrative code has no written exclusion of gender-affirming care, but also no policy covering it, so coverage is decided case by case. Alabama has not expanded Medicaid, so most adults without children or a disability do not qualify. If you are denied, ask for the denial in writing and appeal; A4TE's Trans Health Project can help.
    es: El código administrativo de Alabama Medicaid no tiene una exclusión escrita de la atención de afirmación de género, pero tampoco una política que la cubra, así que la cobertura se decide caso por caso. Alabama no ha ampliado Medicaid, así que la mayoría de los adultos sin hijos ni discapacidad no califican. Si te niegan, pide la negativa por escrito y apela; el Trans Health Project de A4TE puede ayudar.
  how_to_apply_url: https://medicaid.alabama.gov/content/3.0_Apply/default.aspx
  sources: [medicaid-admin-code, medicaid-apply, a4te-thp]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: No Alabama law prohibits insurers from excluding gender-affirming care. Read your plan's exclusions list. If a claim is denied, appeal with the insurer first, then file a complaint with the Alabama Department of Insurance. Employer self-funded plans are regulated federally, not by the state.
    es: Ninguna ley de Alabama prohíbe a las aseguradoras excluir la atención de afirmación de género. Revisa la lista de exclusiones de tu plan. Si te niegan un reclamo, apela primero con la aseguradora y luego presenta una queja ante el Departamento de Seguros de Alabama. Los planes autofinanciados de empleadores se regulan a nivel federal.
  complaint_url: https://aldoi.gov/Consumers/FileComplaint.aspx
  sources: [map-al, aldoi-complaint]
