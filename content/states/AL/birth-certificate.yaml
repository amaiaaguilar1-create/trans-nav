sources:
  - id: ala-22-9a-19
    url: https://alison.legislature.state.al.us/code-of-alabama?section=22-9A-19
    title: Ala. Code § 22-9A-19, amendment of vital records
    publisher: Alabama Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: Upon receipt of a certified copy of an order of a court of competent jurisdiction indicating that the sex of an individual born in this state has been changed by surgical procedure and that the name of the individual has been changed, the certificate of birth of the individual shall be amended as prescribed by rules to reflect the changes.
  - id: h33
    url: https://www.alabamapublichealth.gov/vitalrecords/assets/h33-full-amendment-package.pdf
    title: Amendment Packet for Alabama Birth and Death Certificates (ADPH-HS-33)
    publisher: Alabama Department of Public Health
    kind: form
    accessed: "2026-09-24"
    quote: The fee to amend a birth certificate is $20.00 which includes one certified copy of the amended birth certificate. Additional copies of the same record ordered at the same time are $6.00 each. There is an additional fee of $15.00 to expedite a request.
  - id: adph-bc
    url: https://www.alabamapublichealth.gov/vitalrecords/birth-certificates.html
    title: Birth Certificates
    publisher: Alabama Department of Public Health
    kind: official
    accessed: "2026-09-24"
    quote: You may go to any county health department in the State of Alabama to obtain a certified copy of an Alabama birth certificate.
  - id: sb79
    url: https://alison.legislature.state.al.us/files/pdf/SearchableInstruments/2025RS/SB79-enr.pdf
    title: SB 79 (2025), Act 2025-3
    publisher: Alabama Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: shall identify each individual who is part of the collected data set as either male or female.
