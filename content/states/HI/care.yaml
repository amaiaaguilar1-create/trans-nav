jurisdiction: HI
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Shield law: ACLU of Hawaii's legislation page (read 2026-09-24) lists HB 1875 (2026 session) as "Signed by
    governor", expanding Act 2, SLH 2023 (the reproductive health shield law) to gender-affirming care; act number and
    effective date not confirmed because capitol.hawaii.gov blocked automated access. Private insurance: HRS
    431:10A-118.3 (from 2016) is cited from secondary knowledge and MAP's profile (1/1 for nondiscrimination and
    exclusion bans); statute text not read. Parallel provisions for mutual benefit societies and HMOs (ch. 432 and
    432D) were not checked. MEDICAID IS A GAP: no Med-QUEST policy on gender-affirming care could be found on
    medquest.hawaii.gov (its memo pages render by JavaScript), and MAP scores Hawaii 0/1 for a Medicaid coverage
    policy, so covers_hrt and covers_surgery are "unclear". Reviewer: look for a Med-QUEST memo or health plan policies
    (HMSA QUEST, AlohaCare, Kaiser, Ohana, UHC Community Plan) and update. Clinic details are from org websites.
    Planned Parenthood's minimum age for hormone care in Hawaii was not stated on its pages. Kalihi-Palama Health
    Center's site blocked automated access and is not listed.
status_summary:
  en: >-
    Gender-affirming care is legal for adults and minors in Hawaii. State law bars private insurers from excluding
    transition care, and a 2026 shield law protects patients and providers from other states' bans. In Honolulu you can
    get hormones at HHHRC's clinic or Planned Parenthood, and QueerDoc, Plume, and Planned Parenthood offer telehealth.
    Whether Med-QUEST (Medicaid) covers transition care is not clearly stated in any published policy.
  es: >-
    La atención de afirmación de género es legal para adultos y menores en Hawái. La ley estatal prohíbe a las
    aseguradoras privadas excluir la atención de transición, y una ley escudo de 2026 protege a pacientes y proveedores
    de las prohibiciones de otros estados. En Honolulu puedes recibir hormonas en la clínica de HHHRC o en Planned
    Parenthood, y QueerDoc, Plume y Planned Parenthood ofrecen telesalud. No hay una política publicada clara sobre si
    Med-QUEST (Medicaid) cubre la atención de transición.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Hormone therapy is available in person in Honolulu and statewide by telehealth.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **Med-QUEST** (Hawaii Medicaid) at medical.mybenefits.hawaii.gov. Coverage for transition care is not spelled out publicly, but hormones and labs are ordinary prescriptions and office visits; ask your health plan.
      2. Contact **HHHRC** in Honolulu (808-521-2437). Its clinic offers hormone therapy with primary care and peer navigators who help with insurance.
      3. **Planned Parenthood** offers gender-affirming hormone care at all its health centers, including Honolulu, and by telehealth. Insurance is not required.
      4. **Community health centers** (FQHCs) charge on a sliding scale. Find one at findahealthcenter.hrsa.gov.
      5. **Point of Pride's HRT Access Fund** pays for up to 18 months of telehealth hormone care (applications open each year).
    es: |
      Sin restricciones estatales. La terapia hormonal está disponible en persona en Honolulu y por telesalud en todo el estado.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Med-QUEST** (Medicaid de Hawái) en medical.mybenefits.hawaii.gov. La cobertura de transición no está detallada públicamente, pero las hormonas y los análisis son recetas y consultas comunes; pregunta a tu plan.
      2. Contacta a **HHHRC** en Honolulu (808-521-2437). Su clínica ofrece terapia hormonal con atención primaria y navegadoras que ayudan con el seguro.
      3. **Planned Parenthood** ofrece atención hormonal de afirmación de género en todos sus centros, incluido Honolulu, y por telesalud. No se requiere seguro.
      4. Los **centros de salud comunitarios** cobran en escala móvil. Búscalos en findahealthcenter.hrsa.gov.
      5. El **Fondo de Acceso a TRH de Point of Pride** paga hasta 18 meses de atención hormonal por telesalud.
  sources: [hhhrc-hormone, pp-hrt, hrsa, pop-hrt, medquest-apply]
minor_care:
  status: available
  detail:
    en: >-
      Legal. Hawaii has no ban on gender-affirming care for minors (MAP). HB 1875 (2026) extends the protections of Act 2,
      SLH 2023 to gender-affirming care, shielding patients, families, and providers from other states' legal actions and
      restricting disclosure of health information. Care for minors follows clinical guidelines and generally requires a
      parent's consent. Planned Parenthood did not publish a minimum age for hormone care in Hawaii; call to ask.
    es: >-
      Legal. Hawái no prohíbe la atención de afirmación de género para menores (MAP). HB 1875 (2026) extiende las
      protecciones de la Ley 2 de 2023 a la atención de afirmación de género, protegiendo a pacientes, familias y
      proveedores de acciones legales de otros estados. La atención a menores sigue guías clínicas y en general requiere
      consentimiento de un padre o madre. Planned Parenthood no publica una edad mínima en Hawái; llama para preguntar.
  sources: [map-hi, aclu-hb1875, pp-hrt]
medicaid:
  program_name: Med-QUEST (QUEST Integration)
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: >-
      No published Med-QUEST policy on gender-affirming care was found, and MAP does not list Hawaii as having an
      explicit Medicaid coverage policy. There is also no known exclusion. Hormones are usually covered like other
      prescriptions, sometimes with prior authorization; surgery coverage is decided by your QUEST health plan. If you
      are denied, ask the plan for the written reason, request a grievance or appeal, and contact the Trans Health
      Project for appeal templates.
    es: >-
      No se encontró una política publicada de Med-QUEST sobre atención de afirmación de género, y MAP no registra una
      política explícita de cobertura en Hawái. Tampoco se conoce una exclusión. Las hormonas suelen cubrirse como otras
      recetas, a veces con autorización previa; la cobertura de cirugía la decide tu plan QUEST. Si te niegan, pide el
      motivo por escrito, presenta una queja o apelación y contacta al Trans Health Project.
  how_to_apply_url: https://medquest.hawaii.gov/en/members-applicants/get-started/how-to-apply.html
  sources: [medquest-apply, map-hi, thp]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: >-
      Since 2016, HRS § 431:10A-118.3 prohibits health insurers regulated by Hawaii from denying or limiting coverage
      because of gender identity, including blanket exclusions of transition-related care. It does not reach
      self-funded employer plans, which are governed by federal law. File complaints with the Insurance Division of the
      Department of Commerce and Consumer Affairs.
    es: >-
      Desde 2016, HRS § 431:10A-118.3 prohíbe a las aseguradoras reguladas por Hawái negar o limitar la cobertura por
      identidad de género, incluidas las exclusiones generales de atención de transición. No aplica a planes
      autofinanciados de empleadores, regidos por ley federal. Presenta quejas ante la División de Seguros del DCCA.
  complaint_url: https://cca.hawaii.gov/ins/complaint/
  sources: [map-hi, cca-complaint]
