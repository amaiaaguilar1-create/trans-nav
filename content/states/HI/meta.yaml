  notes: >-
    Climate ratings are based on official pages read 2026-09-24 (Lieutenant Governor name change guide, DOH vital
    records, Honolulu DCS forms) and MAP's Hawaii profile. The Hawaii Legislature site (capitol.hawaii.gov) blocked
    automated access, so statute and bill text (HRS 574-5, 338-17.7, 431:10A-118.3, HB 1165 (2019), HB 1875 (2026))
    were not read directly. id_documents is "mixed" because the driver's license is self-attestation with X, but the
    birth certificate still requires a physician affidavit and has no X, and name changes require newspaper
    publication. Reviewer: confirm the HB 1875 (2026) act number and effective date.
overview:
  en: >-
    Hawaii is generally protective. Driver's licenses and state IDs show M, F, or X based on your own statement, private
    insurers may not exclude transition care, there is no ban on care for minors, and a 2026 shield law (HB 1875)
    extends Hawaii's 2023 protections to gender-affirming care. Two things are harder than in some states: name changes
    are handled by the Lieutenant Governor's office and must be **published in a newspaper**, and a new birth
    certificate needs a **notarized affidavit from a physician** and offers only male or female.
  es: >-
    Hawái es en general protector. Las licencias de conducir y las identificaciones estatales muestran M, F o X según
    tu propia declaración, las aseguradoras privadas no pueden excluir la atención de transición, no hay prohibición
    de atención para menores, y una ley escudo de 2026 (HB 1875) extiende las protecciones de 2023 a la atención de
    afirmación de género. Dos trámites son más difíciles que en otros estados: los cambios de nombre los tramita la
    oficina del Vicegobernador y deben **publicarse en un periódico**, y una nueva acta de nacimiento requiere una
    **declaración jurada notarizada de un médico** y solo ofrece masculino o femenino.
