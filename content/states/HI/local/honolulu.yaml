      es: >-
        Ayuda legal civil gratuita para personas de bajos ingresos. Admisión telefónica entre semana de 9 a 11:30 am y de
        1 a 3:30 pm al 808-536-4302. No se atiende sin cita.
    url: https://www.legalaidhawaii.org/
    phone: "808-536-4302"
    address: 924 Bethel St, Honolulu, HI 96813
    cost: free
    verification: org_website
    sources: [legal-aid-hi]
  - id: aclu-hawaii
