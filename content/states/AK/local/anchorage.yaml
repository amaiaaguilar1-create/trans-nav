jurisdiction: AK
slug: anchorage
name: Anchorage
area:
  en: Municipality of Anchorage, including Eagle River; the Mat-Su Valley is served by the Palmer court
  es: Municipio de Anchorage, incluido Eagle River; el valle de Mat-Su corresponde al tribunal de Palmer
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Resources checked on their own websites 2026-09-24 unless noted. Identity Inc (the Anchorage LGBTQ center and
    Identity Health Clinic) closed its clinic May 15, 2026 and its site identityalaska.org is now a parked domain, so it
    is not listed; reviewer should check whether any successor LGBTQ center or peer-support group has formed in
    Anchorage. Four A's contact page (alaskanaids.org/contact) currently shows injected spam content; the HIV testing
    page is intact and is the one cited. ANTHC's live site blocks automated access; its HIV page was read from a May
    2025 Wayback snapshot. The courthouse street address was not verified and is omitted.
intro:
  en: >-
    Anchorage has the state's main Superior Court for name changes, a Planned Parenthood health center with
    informed-consent hormone care for adults, a sliding-fee community health center, a city sexual health clinic, and
    free HIV testing and PrEP help. The city's dedicated LGBTQ health clinic (Identity) closed in May 2026, so
    telehealth fills more of the gap for hormone care.
  es: >-
    Anchorage tiene el principal Tribunal Superior del estado para cambios de nombre, un centro de Planned Parenthood
    con atención hormonal por consentimiento informado para adultos, un centro de salud comunitario con escala móvil,
    una clínica municipal de salud sexual y pruebas de VIH y ayuda con PrEP gratuitas. La clínica LGBTQ de la ciudad
    (Identity) cerró en mayo de 2026, así que la telesalud cubre más de la atención hormonal.
court:
  name: Alaska Superior Court, Third Judicial District at Anchorage
  url: https://courts.alaska.gov/courtdir/index.htm
  self_help_url: https://courts.alaska.gov/shc/family/change-name.htm
  filing_fee: 200
  notes:
    en: File through TrueFiling where available, or in person at the Anchorage courthouse if you are exempt. Court clerks notarize the petition for free. The statewide Family Law Self-Help Center helpline, (907) 264-0851, answers questions about the forms.
    es: Presenta por TrueFiling donde esté disponible, o en persona en el tribunal de Anchorage si estás exento. Los secretarios notarizan la petición gratis. La línea del Centro de Autoayuda, (907) 264-0851, responde preguntas sobre los formularios.
  sources: [court-fees, shc-name-change, shc-about]
