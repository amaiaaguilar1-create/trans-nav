  notes: >-
    Climate ratings are an editorial judgment from the guides: ID documents "mixed" (provider letter for DL and birth
    certificate, M/F only, court-website posting for name changes with a safety waiver); care "mixed" (no statutory
    restrictions and Medicaid coverage since 2021, but no shield law, no private-insurance protection, a proposed
    medical board rule on minors, the state joining the June 2026 FTC suit against WPATH, and the May 2026 closure of
    Anchorage's LGBTQ clinic). MAP's equality map was not fetched for cross-checking. Identity Inc, previously the main
    statewide LGBTQ center, is omitted from key_resources because its clinic closed and its domain is parked.
overview:
  en: >-
    Alaska has no laws targeting trans people's documents or health care, but also few explicit protections. You can
    change your name in Superior Court (the court posts notice online, and you can ask to skip it for safety), and
    change the sex on your driver's license and Alaska birth certificate to M or F with a provider's letter; X is not
    offered. Gender-affirming care is legal for all ages, Alaska Medicaid covers it, and Planned Parenthood offers
    informed-consent hormones statewide by telehealth. There is no shield law, and a medical board proposal to restrict
    care for minors is pending.
  es: >-
    Alaska no tiene leyes dirigidas contra los documentos o la atención médica de las personas trans, pero tampoco
    muchas protecciones explícitas. Puedes cambiar tu nombre en el Tribunal Superior (el tribunal publica el aviso en
    línea y puedes pedir que no se publique por seguridad) y cambiar el sexo en tu licencia y acta de nacimiento de
    Alaska a M o F con una carta de un proveedor; no se ofrece X. La atención de afirmación de género es legal a
    cualquier edad, Medicaid de Alaska la cubre y Planned Parenthood ofrece hormonas por consentimiento informado en
    todo el estado por telesalud. No hay ley escudo, y hay una propuesta de la junta médica para restringir la
    atención a menores.
