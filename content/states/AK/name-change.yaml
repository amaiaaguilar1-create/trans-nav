sources:
  - id: as-09-55-010
    url: https://www.akleg.gov/basis/statutes.asp#09.55.010
    title: AS 09.55.010, Jurisdiction in action for change of name; notice
    publisher: Alaska Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: A person may bring an action for change of name in the superior court. A change of name of a person may not be made unless the court finds sufficient reasons for the change and also finds it consistent with the public interest.
  - id: shc-name-change
    url: https://courts.alaska.gov/shc/family/change-name.htm
    title: Change of Name (self-help forms)
    publisher: Alaska Court System
    kind: official
    accessed: "2026-09-24"
    quote: "Adult Change of Name Forms: CIV-698 Cover Sheet; CIV-699 Instructions for Adult Change of Name; CIV-700 Petition for Change of Name; VS-405 Application or Report of Change of Name"
  - id: civ-699
    url: https://public.courts.alaska.gov/web/forms/docs/civ-699.pdf
    title: CIV-699 (7/25), Instructions for Adult Change of Name
    publisher: Alaska Court System
    kind: form
    accessed: "2026-09-24"
    quote: The court will automatically post notice on the Alaska Court System's legal notice website for four consecutive weeks, unless the court waived this requirement in a written order.
  - id: civ-700
    url: https://public.courts.alaska.gov/web/forms/docs/civ-700.pdf
    title: CIV-700 (7/25), Petition for Change of Name
    publisher: Alaska Court System
    kind: form
    accessed: "2026-09-24"
    quote: I request a court order to change my birth certificate to the new name in section 2.
  - id: civ-708
    url: https://public.courts.alaska.gov/web/forms/docs/civ-708.pdf
    title: CIV-708 (4/26), Request to Waive Posting in Adult Change of Name Case
    publisher: Alaska Court System
    kind: form
    accessed: "2026-09-24"
    quote: I ask the Court to not post my proposed name change and hearing date on the Alaska Court System's legal notice website, as is normally required by Civil Rule 84(b), because I have concerns about my personal safety.
  - id: civ-693
    url: https://public.courts.alaska.gov/web/forms/docs/civ-693.pdf
    title: CIV-693 (7/25), Instructions for Child's Change of Name
    publisher: Alaska Court System
    kind: form
    accessed: "2026-09-24"
    quote: With a child, there is an extra requirement that both parents consent to the name change. The judge can waive (not require) this with good cause.
  - id: tf-920
    url: https://public.courts.alaska.gov/web/forms/docs/tf-920.pdf
    title: TF-920 (9/25), Request and Order for Exemption from Payment of Fees
    publisher: Alaska Court System
    kind: form
    accessed: "2026-09-24"
    quote: I request exemption from payment of the following fees because I am unable to pay
  - id: court-fees
    url: https://courts.alaska.gov/shc/courtfees.htm
    title: Court Fees and Fee Waiver
    publisher: Alaska Court System
    kind: official
    accessed: "2026-09-24"
    quote: "Change of Name (child or adult) $200 ... Certification of documents $10/first, $3 each additional"
  - id: shc-about
    url: https://courts.alaska.gov/shc/family/about.htm
    title: About the Family Law Self-Help Center
    publisher: Alaska Court System
    kind: official
    accessed: "2026-09-24"
    quote: "Telephone Helpline Hours: Monday - Friday: 7:30 a.m. - 5:00 p.m. Statewide Telephone Helpline Number: (907) 264-0851"
  - id: alsc-apply
    url: https://www.alsc-law.org/apply-for-services/
    title: Apply for Help
    publisher: Alaska Legal Services Corporation
    kind: org
    accessed: "2026-09-24"
    quote: Apply for legal aid services online or by calling our toll-free statewide intake number ... 1-888-478-2572
  - id: aclu-ak
    url: https://www.acluak.org/get-help/
    title: Get Help
    publisher: ACLU of Alaska
    kind: org
    accessed: "2026-09-24"
  - id: a4te-ak
    url: https://transequality.org/documents/alaska-identity-documents
    title: Alaska Identity Documents
    publisher: Advocates for Trans Equality
    kind: org
    accessed: "2026-09-24"
    quote: Alaska has a publication requirement, which requires notice of your name change to be posted on the Court's website for four weeks leading up to the hearing.
