  notes: >-
    Drafted 2026-09-24 from AS 09.55.010 (akleg.gov), the court self-help name change page, and the court's own PDFs
    (CIV-699 rev. 7/25, CIV-700 rev. 7/25, CIV-708 rev. 4/26, CIV-693, TF-920 rev. 9/25), plus the court fee page
    ($200 filing fee, effective 5/1/2023; certification $10 first, $3 each additional). Alaska no longer uses
