litigation:
  - case: Being v. Crum, No. 3:19-cv-00060 (D. Alaska)
    court: US District Court for the District of Alaska
    summary:
      en: Challenge to Alaska Medicaid's refusal to cover gender-affirming surgery. The parties reached a stipulated settlement (December 2020) approved by the court on January 25, 2021; the court retained jurisdiction. The exclusion was repealed from 7 AAC 105.110 effective July 25, 2021.
      es: Demanda contra la negativa de Medicaid de Alaska a cubrir cirugía de afirmación de género. Se resolvió con un acuerdo aprobado el 25 de enero de 2021; la exclusión se derogó el 25 de julio de 2021.
    effect_today:
      en: Alaska Medicaid may not categorically exclude gender-affirming care; requests are reviewed for medical necessity.
      es: Medicaid de Alaska no puede excluir categóricamente la atención de afirmación de género.
    last_update: "2021-02-03"
    url: https://www.courtlistener.com/docket/14599433/being-v-crum/
    sources: [being-v-crum, aac-105-110]
