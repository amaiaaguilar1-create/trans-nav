  confidence: medium
  es_status: machine_draft
  notes: >-
    No Alaska statute restricts gender-affirming care for adults or minors (34th Legislature bill list checked
    2026-09-24: HB 342, on physician liability for procedures on minors, is still in House HSS; no bill passed a
    chamber). Open items for the reviewer: (1) In August 2025 the State Medical Board approved a DRAFT regulation
    declaring gender-transition care for under-18s "unprofessional conduct" (Alaska Beacon, 2025-08-22). The current
    12 AAC 40.967 text on akleg.gov (read 2026-09-24) does not contain it, and the board later had quorum problems, so
    it appears not to be in effect; confirm with the Division of Corporations, Business and Professional Licensing
    before publishing. (2) Medicaid: 7 AAC 105.110(12) was "repealed 7/25/2021" (read on akleg.gov); this followed the
    stipulated settlement in Being v. Crum (D. Alaska 3:19-cv-00060, settlement approved 2021-01-25, per CourtListener
    docket). The prompt referred to "Robinson v. Alaska DHSS (2022)"; no such case was found, and the text of the
    repealed paragraph and settlement terms were not read. The April 2025 House budget amendment on gender dysphoria
    care passed the House 21-19 but whether it survived into the enacted budget, and its effect, is unconfirmed.
    (3) Identity Inc's Identity Health Clinic (Anchorage's informed-consent LGBTQ clinic) closed May 15, 2026 per its
    archived website (June 2026 Wayback snapshot); its domain is now a parked page. It is intentionally not listed.
    (4) Division of Insurance pages return 403 to automated access; complaint URL taken from a Wayback snapshot
    (2026-08-22). No Alaska law or bulletin barring trans exclusions in private plans was found. (5) Alaska joined the
    FTC's June 2026 lawsuit against WPATH (Alaska Beacon, 2026-06-17); noted as context only. (6) Anchorage
    Neighborhood Health Center does not list gender-affirming hormone therapy on its services page; listed for primary
    care, PrEP and sliding-fee care only. MAP's healthcare map was not fetched for cross-checking.
status_summary:
  en: >-
    Gender-affirming care is legal in Alaska for adults and minors; no state law bans it. Alaska Medicaid removed its
    exclusion of transition-related care in 2021 after a federal lawsuit. There is no state shield law and no state
    ban on exclusions in private insurance. Planned Parenthood offers informed-consent hormones to adults in Anchorage,
    Fairbanks, and statewide by telehealth. Anchorage's LGBTQ health clinic (Identity) closed in May 2026, and the
    state medical board has proposed, but not adopted, a rule against care for minors.
  es: >-
    La atención de afirmación de género es legal en Alaska para adultos y menores; ninguna ley estatal la prohíbe.
    Medicaid de Alaska eliminó su exclusión de la atención de transición en 2021 tras una demanda federal. No hay ley
    escudo ni prohibición estatal de exclusiones en seguros privados. Planned Parenthood ofrece hormonas por
    consentimiento informado a adultos en Anchorage, Fairbanks y por telesalud en todo el estado. La clínica LGBTQ de
    Anchorage (Identity) cerró en mayo de 2026, y la junta médica estatal propuso, pero no adoptó, una regla contra la
    atención a menores.
adult_care:
  status: available
  detail:
    en: |
      No Alaska law limits gender-affirming care for adults. Any licensed provider can prescribe hormones, and Planned Parenthood Great Northwest, Hawaiʻi, Alaska, Indiana, Kentucky uses an **informed consent** model for patients 18 and older: no therapist letter is needed. Its Anchorage and Fairbanks health centers and its Alaska Virtual Health Center (telehealth) all offer hormone care.

      Because Alaska is large and rural, telehealth is often the most practical option outside Anchorage and Fairbanks: QueerDoc, Plume, and Planned Parenthood serve Alaska.

      The state has no shield law protecting patients or providers from out-of-state legal action, and in June 2026 the state joined a federal lawsuit against WPATH, the professional body behind the main standards of care. Neither changes what care is legal for adults in Alaska today.
    es: |
      Ninguna ley de Alaska limita la atención de afirmación de género para adultos. Planned Parenthood usa un modelo de **consentimiento informado** para pacientes de 18 años o más: no se necesita carta de un terapeuta. Sus centros de Anchorage y Fairbanks y su Centro Virtual de Alaska ofrecen atención hormonal.

      Fuera de Anchorage y Fairbanks, la telesalud suele ser la opción más práctica: QueerDoc, Plume y Planned Parenthood atienden Alaska.

      El estado no tiene ley escudo y en junio de 2026 se unió a una demanda federal contra WPATH. Nada de esto cambia qué atención es legal para adultos hoy.
  sources: [pp-hrt, pp-ak-centers, beacon-wpath]
minor_care:
  status: available
  detail:
    en: |
      Alaska has **no law banning** gender-affirming care for people under 18. With parental consent, a licensed provider may prescribe puberty blockers or hormones.

      However, access is thin and under pressure:
      - In **August 2025** the State Medical Board approved a **draft regulation** that would make providing puberty blockers, hormones, or surgery for gender transition to anyone under 18 "unprofessional conduct" subject to discipline. As of September 2026 it does not appear in the published regulation (12 AAC 40.967); check for updates.
      - **Identity Health Clinic** in Anchorage, which served minors, **closed on May 15, 2026**.
      - Planned Parenthood's hormone care starts at 18.

      Families should ask pediatric and adolescent providers directly, and can contact the ACLU of Alaska if a provider or school refuses care or information.
    es: |
      Alaska **no tiene ley que prohíba** la atención de afirmación de género para menores de 18 años. Con consentimiento de los padres, un proveedor con licencia puede recetar bloqueadores o hormonas.

      Sin embargo, el acceso es limitado:
      - En **agosto de 2025** la Junta Médica Estatal aprobó un **borrador de regulación** que consideraría "conducta no profesional" dar bloqueadores, hormonas o cirugía de transición a menores de 18. A septiembre de 2026 no aparece en la regulación publicada (12 AAC 40.967).
      - **Identity Health Clinic** en Anchorage, que atendía a menores, **cerró el 15 de mayo de 2026**.
      - La atención hormonal de Planned Parenthood empieza a los 18 años.
  sources: [beacon-medboard, aac-40-967, identity-closure, pp-hrt]
medicaid:
  program_name: Alaska Medicaid (Denali KidCare for children and pregnant people)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Alaska Medicaid's regulation listing non-covered services (7 AAC 105.110) previously included an exclusion that was **repealed on July 25, 2021**, after the state settled **Being v. Crum**, a federal lawsuit challenging the denial of gender-affirming surgery. Hormone therapy and surgery are now reviewed like other care: they must be medically necessary and some services need prior authorization. Cosmetic-surgery limits in the same regulation still apply to procedures judged cosmetic.

      In April 2025 the state House added budget language against gender dysphoria care; its final status and effect are unclear, and it does not change the regulation.

      **Who qualifies**: low-income adults 19 to 64 (Alaska expanded Medicaid), children, pregnant people, seniors, and people with disabilities. Apply at HealthCare.gov or Alaska Connect.
    es: |
      La regulación de servicios no cubiertos de Medicaid de Alaska (7 AAC 105.110) incluía una exclusión que fue **derogada el 25 de julio de 2021**, después de que el estado resolviera **Being v. Crum**, una demanda federal. La terapia hormonal y la cirugía ahora se evalúan como otra atención: deben ser médicamente necesarias y algunas requieren autorización previa.

      **Quién califica**: adultos de bajos ingresos de 19 a 64 años, niños, personas embarazadas, mayores y personas con discapacidad. Solicita en HealthCare.gov o Alaska Connect.
  how_to_apply_url: https://health.alaska.gov/en/services/division-of-public-assistance-dpa-services/apply-for-medicaid/
  sources: [aac-105-110, being-v-crum, beacon-budget, medicaid-apply]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Alaska has no state law or insurance bulletin that forbids private health plans from excluding gender-affirming care. Whether your plan covers it depends on the plan documents; many employer plans are self-funded and regulated federally, not by the state.

      If a claim is denied, appeal with the plan first, then ask for an **external review**. For state-regulated plans, the Alaska Division of Insurance takes complaints (907-269-7900, or 1-800-INSURAK in state). The Trans Health Project (A4TE) has free appeal templates.
    es: |
      Alaska no tiene ley ni boletín de seguros que prohíba a los planes privados excluir la atención de afirmación de género. Si te niegan una reclamación, apela ante el plan, luego pide una **revisión externa**. Para planes regulados por el estado, la División de Seguros de Alaska recibe quejas (907-269-7900).
  complaint_url: https://www.commerce.alaska.gov/web/ins/Consumers/FileaComplaint.aspx
  sources: [doi-complaint]
