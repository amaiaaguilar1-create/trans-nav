  notes: >-
    Climate ratings based on ORS 33.460 (self-attested legal sex change), ORS 432.235 (administrative birth record
    amendment), the Oregon DMV gender marker page (M, F, X with no documentation), ORS 743A.325 and HB 2002 (2023).
    Legal Aid Services of Oregon's site blocked automated access, so its entry is linked but its phone number was not
    confirmed. Reviewer: confirm no 2025 or 2026 Oregon bill changed these rules (web search was unavailable while drafting).
overview:
  en: >-
    Oregon is one of the most protective states for trans people. You can change your name and legal sex (male, female,
    or nonbinary) in circuit court for a $124 fee, with no newspaper notice and usually no hearing. The DMV offers M, F,
    or X with no documentation, and if you were born in Oregon you can amend your birth certificate by notarized form
    without a court order. HB 2002 (2023) requires state-regulated insurance to cover gender-affirming care and protects
    patients and providers from other states' laws. The Oregon Health Plan covers hormones and surgery. Federal documents
    (passport, Social Security) are the exception: their sex fields are currently frozen nationwide.
  es: >-
    Oregón es uno de los estados que más protege a las personas trans. Puedes cambiar tu nombre y tu sexo legal
    (masculino, femenino o no binario) en el tribunal de circuito por una tarifa de $124, sin aviso en periódico y
    normalmente sin audiencia. El DMV ofrece M, F o X sin documentación, y si naciste en Oregón puedes enmendar tu acta
    de nacimiento con un formulario notarizado sin orden judicial. La ley HB 2002 (2023) exige que los seguros regulados
    por el estado cubran la atención de afirmación de género y protege a pacientes y proveedores de las leyes de otros
    estados. El Oregon Health Plan cubre hormonas y cirugía. Los documentos federales (pasaporte, Seguro Social) son la
    excepción: sus campos de sexo están congelados a nivel nacional.
