  notes: >-
    Legal framework from ORS 743A.325, ORS 109.640, HB 2002 (2023) on OLIS, and OHA's Oregon Health Plan gender-affirming
    care page, all read 2026-09-24. OHA's page says it is reviewing a federal rule "proposed to take effect Oct. 13, 2026"
    that would bar federal Medicaid/CHIP reimbursement for some gender-affirming medications and surgery for patients under
    18; the reviewer should check its status after that date and whether Oregon has sued. Planned Parenthood Columbia
    Willamette and Outside In pages returned 403 to automated fetching, so their hormone-therapy details (minimum age,
    informed consent) are unverified. Prism Health's site lists primary care, PrEP, and behavioral health; CAP Northwest's
    site says gender-affirming care is provided through Prism Health. Could not confirm whether any Oregon hospital system
    has curtailed care for minors in response to federal pressure in 2025-2026; the reviewer should check OHSU Doernbecher
    and Legacy. Web search was unavailable, so 2025-2026 Oregon bills were not surveyed.
status_summary:
  en: >-
    Gender-affirming care is legal and protected in Oregon for adults and minors. The Oregon Health Plan covers hormones,
    surgery, and related care, state-regulated private plans may not exclude it (HB 2002), and state law shields patients
    and providers from other states' bans. A federal rule proposed to take effect October 13, 2026 could cut federal
    Medicaid funding for some care for patients under 18; OHA says there is no change to coverage today.
  es: >-
    La atención de afirmación de género es legal y está protegida en Oregón para adultos y menores. El Oregon Health Plan
    cubre hormonas, cirugía y atención relacionada, los planes privados regulados por el estado no pueden excluirla
    (HB 2002) y la ley estatal protege a pacientes y proveedores de las prohibiciones de otros estados. Una regla federal
    propuesta para entrar en vigor el 13 de octubre de 2026 podría quitar fondos federales de Medicaid para parte de la
    atención de menores de 18; OHA dice que hoy no hay cambios en la cobertura.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Gender-affirming care is protected under the Reproductive Health Equity Act (2017) and HB 2002 (2023), which also protects Oregon patients and providers from out-of-state legal action. Telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order:
      1. Apply for the **Oregon Health Plan** (Oregon's Medicaid). It covers hormones, labs, and surgery.
      2. Go to a **community health center**. They charge on a sliding scale; find one at findahealthcenter.hrsa.gov. In Portland, Outside In and Prism Health serve LGBTQ+ patients regardless of ability to pay.
      3. **Planned Parenthood Columbia Willamette** offers hormone therapy at Oregon health centers and by telehealth.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for people who qualify.
    es: |
      Sin restricciones estatales. La atención de afirmación de género está protegida por la Ley de Equidad en Salud Reproductiva (2017) y la HB 2002 (2023), que también protege a pacientes y proveedores de Oregón de acciones legales de otros estados. La telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita el **Oregon Health Plan** (el Medicaid de Oregón). Cubre hormonas, laboratorios y cirugía.
      2. Acude a un **centro de salud comunitario** con escala móvil; búscalo en findahealthcenter.hrsa.gov. En Portland, Outside In y Prism Health atienden a personas LGBTQ+ sin importar su capacidad de pago.
      3. **Planned Parenthood Columbia Willamette** ofrece terapia hormonal en centros de Oregón y por telesalud.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud a quienes califican.
  sources: [ohp-gac, hb2002, hrsa, prism]
minor_care:
  status: available
  detail:
    en: |
      Legal. Oregon has no ban on gender-affirming care for minors, and HB 2002 protects families and providers. Under ORS 109.640, a minor **15 or older** may consent to medical diagnosis and treatment by a physician, physician associate, or nurse practitioner without a parent's consent; many clinics still involve parents for hormone therapy. The Oregon Health Plan covers puberty blockers and hormones for adolescents who have entered stage 2 of puberty, and surgery after at least 12 months of hormone therapy.

      **Watch**: OHA is reviewing a federal rule proposed to take effect October 13, 2026 that would bar federal Medicaid and CHIP reimbursement for some gender-affirming medications and surgery for patients under 18. OHA says the rule is not in effect and OHP coverage has not changed.
    es: |
      Legal. Oregón no prohíbe la atención de afirmación de género para menores, y la HB 2002 protege a familias y proveedores. Según ORS 109.640, un menor de **15 años o más** puede consentir diagnóstico y tratamiento médico sin el consentimiento de sus padres; muchas clínicas igual involucran a los padres para la terapia hormonal. El Oregon Health Plan cubre bloqueadores de pubertad y hormonas para adolescentes en etapa 2 de la pubertad, y cirugía tras al menos 12 meses de terapia hormonal.

      **Atención**: OHA está revisando una regla federal propuesta para el 13 de octubre de 2026 que prohibiría el reembolso federal de Medicaid y CHIP para algunos medicamentos y cirugías de afirmación de género para menores de 18. OHA dice que la regla no está vigente y la cobertura de OHP no ha cambiado.
  sources: [ors-109-640, hb2002, ohp-gac, ohsu-thp]
medicaid:
  program_name: Oregon Health Plan (OHP)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      OHP covers medically necessary gender-affirming care prescribed under the WPATH Standards of Care, Version 8: hormone therapy, puberty blockers, mental health therapy, hair removal, speech therapy, physical therapy, lab work, and medical tattooing, plus facial surgery, chest surgery, gonadectomy, genital surgery, and body contouring. For adults, OHP criteria include a mental health and medical assessment, documented gender dysphoria, informed consent, and fertility counseling. OHP Client Services: 1-800-273-0557.

      Apply online at ONE.Oregon.gov, by phone, or with a free community partner.
    es: |
      OHP cubre la atención de afirmación de género médicamente necesaria según los Estándares de Atención de WPATH, versión 8: terapia hormonal, bloqueadores de pubertad, terapia de salud mental, depilación, terapia del habla, fisioterapia, laboratorios y tatuaje médico, además de cirugía facial, de pecho, gonadectomía, cirugía genital y contorno corporal. Para adultos, los criterios incluyen una evaluación médica y de salud mental, disforia de género documentada, consentimiento informado y asesoría de fertilidad. Servicios al Cliente de OHP: 1-800-273-0557.

      Solicita en línea en ONE.Oregon.gov, por teléfono o con un socio comunitario gratuito.
  how_to_apply_url: https://one.oregon.gov/
  sources: [ohp-gac, ohp-apply]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Since January 1, 2024, ORS 743A.325 (HB 2002) bars state-regulated health plans from denying or limiting medically necessary gender-affirming treatment prescribed under accepted standards of care, from applying blanket or cosmetic exclusions (it names tracheal shave, electrolysis, facial feminization, and revisions), and from denying care unless a provider experienced in gender-affirming treatment has reviewed the denial. If a plan denies care, appeal with the plan first, then file a complaint with the Oregon Division of Financial Regulation. Self-funded employer plans are federally regulated and may not be covered.
    es: |
      Desde el 1 de enero de 2024, ORS 743A.325 (HB 2002) prohíbe a los planes regulados por el estado negar o limitar tratamientos de afirmación de género médicamente necesarios, aplicar exclusiones generales o "cosméticas" (menciona afeitado traqueal, electrólisis, feminización facial y revisiones) y negar atención sin que la revise un proveedor con experiencia en afirmación de género. Si el plan niega la atención, apela primero ante el plan y luego presenta una queja ante la División de Regulación Financiera de Oregón. Los planes autofinanciados de empleadores están regulados federalmente y pueden no estar cubiertos.
  complaint_url: https://dfr.oregon.gov/help/complaints-licenses/Pages/file-complaint.aspx
  sources: [ors-743a-325, dfr-complaint]
