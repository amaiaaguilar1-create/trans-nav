delivery:
  online: false
  by_mail: true
  in_person: false
  detail:
    en: By mail or the Portland drop box. Payment by check or money order.
    es: Por correo o en el buzón de Portland. Pago con cheque o giro.
  sources: [oha-2673]
timeline:
  en: Varies; check OHA's weekly amendment processing times. The $30 expedite option targets about 3 business days.
  es: Varía; revisa los tiempos semanales de OHA. La opción acelerada de $30 apunta a unos 3 días hábiles.
after:
  en: |
    Use the new certificate for anything that asks for a birth certificate. OHA cannot guarantee that other agencies will accept an administratively amended certificate, so keep a court judgment if you have one. Social Security and US passports currently do not change sex markers even with an amended birth certificate; the name still changes.
  es: |
    Usa el acta nueva para cualquier trámite que pida acta de nacimiento. OHA no puede garantizar que otras agencias acepten un acta enmendada administrativamente, así que guarda una sentencia judicial si la tienes. El Seguro Social y los pasaportes de EE. UU. actualmente no cambian el marcador de sexo ni con acta enmendada; el nombre sí.
tips:
  - en: Order a copy of your current certificate before filling the form if you are unsure of the exact names on it; a mismatch gets the application rejected.
    es: Pide una copia de tu acta actual antes de llenar el formulario si no estás seguro de los nombres exactos; una diferencia causa el rechazo.
  - en: A false statement on OHA 2673 is a Class C felony, so answer carefully.
    es: Una declaración falsa en el OHA 2673 es un delito grave de Clase C, así que responde con cuidado.
