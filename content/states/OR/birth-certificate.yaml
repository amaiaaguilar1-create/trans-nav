    quote: House Bill 2673 allows an administrative change to a birth record for anyone who was born in Oregon and who needs to change their name and/or sex designation to reflect their gender identity without a court order.
  - id: ors-432-235
    url: https://www.oregonlegislature.gov/bills_laws/ors/ors432.html
    title: ORS 432.235, Requirements for amending or correcting vital record
    publisher: Oregon State Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: A statement signed by the applicant in which the applicant attests, as prescribed by the state registrar by rule, to making the request for the purpose of affirming the applicant's gender identity.
