  notes: >-
    Process from the Oregon DMV gender marker page and February 2025 fact sheet, read 2026-09-24. Fees from ORS 807.370
    (driver license replacement $30) and ORS 807.410 (ID card replacement $40; free for people experiencing homelessness);
    the DMV fee page loads its fee tables with JavaScript and could not be read, so the reviewer should confirm current
    amounts and the extra REAL ID fee (ORS 807.460, amount not captured). The task brief suggested a form "735-7325"; the
