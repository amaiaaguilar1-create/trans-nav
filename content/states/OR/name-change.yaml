    name: Legal Aid Services of Oregon and Oregon Law Center
    type: legal_aid
    pillars: [name_change, gender_marker]
    description:
      en: Free civil legal aid for people with low incomes across Oregon. Find your county's office and self-help information at oregonlawhelp.org; Oregon Law Center's statewide number is 1-800-672-4919.
      es: Ayuda legal civil gratuita para personas de bajos ingresos en Oregón. Encuentra la oficina de tu condado e información de autoayuda en oregonlawhelp.org; el número estatal de Oregon Law Center es 1-800-672-4919.
    url: https://oregonlawhelp.org/
    phone: "1-800-672-4919"
    cost: free
    verification: org_website
    sources: [oregonlawhelp, olc-portland]
