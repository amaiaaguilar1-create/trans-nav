    name: Oregon State Bar Lawyer Referral Service
    type: legal_aid
    pillars: [name_change, gender_marker]
    description:
      en: Referral to a private lawyer if you want advice, for example on a minor's petition or a contested case. Listed in the court's own packet.
      es: Referencia a un abogado privado si quieres asesoría, por ejemplo para la petición de un menor o un caso impugnado. Aparece en el paquete del tribunal.
    url: https://www.oregonstatebar.org/
    phone: "503-684-3763"
    cost: varies
