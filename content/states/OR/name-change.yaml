      es: Centro LGBTQIA2S+ de Portland con orientación sobre recursos, grupos de apoyo y el Fondo Comunitario Marsha P. Johnson, que da microsubvenciones de emergencia a personas trans negras e indígenas.
    url: https://www.pdxqcenter.org/
    phone: "503-234-7837"
    address: 4115 N Mississippi Ave, Portland, OR 97217
    cost: free
    verification: org_website
    sources: [qcenter]
