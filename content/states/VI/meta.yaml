review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    Few official sources describe these procedures. The Virgin Islands Code is hosted on LexisNexis and could not be
    fetched, so no statute sections are cited. The Superior Court's forms library loads by script and returned no
    documents. Much of the procedure comes from A4TE's USVI page (undated, based on staff interviews). MAP's USVI profile
    (2026-09-24) lists a negative Medicaid policy on transgender coverage, no youth care ban, no shield law, and no
    insurance nondiscrimination law.
overview:
  en: >-
    In the U.S. Virgin Islands you change your name by petitioning the Superior Court, which requires notices in a local
    newspaper. There is no written procedure for changing the sex marker on a Virgin Islands birth certificate or driver's
    license. A Bureau of Motor Vehicles representative told advocates that a court order would be needed, but court staff
    knew of no such petition ever being filed. No territorial law bans gender-affirming care. Advocates report that the
    Medicaid program excludes transition-related care, and there are no known local informed-consent clinics.
  es: >-
    En las Islas Vírgenes de EE. UU. cambias tu nombre con una petición al Tribunal Superior, que exige avisos en un
    periódico local. No hay un procedimiento escrito para cambiar el marcador de sexo en el acta de nacimiento ni en la
    licencia de conducir. Un representante de la Oficina de Vehículos dijo a organizaciones de defensa que se necesitaría
    una orden judicial, pero el personal del tribunal no conocía ninguna petición así. Ninguna ley territorial prohíbe la
    atención de afirmación de género. Organizaciones de defensa informan que Medicaid excluye la atención de transición,
    y no se conocen clínicas locales de consentimiento informado.
