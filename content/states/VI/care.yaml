jurisdiction: VI
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    MAP's USVI profile (checked 2026-09-24) scores the territory's Medicaid policy on transgender coverage as a
    "Negative Law" (an exclusion) and shows no youth care ban, no shield law, and no insurance nondiscrimination law. The
    exclusion could not be found in the Medicaid Providers General Information Manual (January 2026) or on the DHS Office
    of Medicaid page, so covers_hrt and covers_surgery are "unclear," not "no." Reviewer: locate the exclusion in the
    USVI Medicaid state plan or regulations. No informed-consent clinic could be verified. Plume's map lists no
    territories.
status_summary:
  en: >-
    Gender-affirming care is legal in the U.S. Virgin Islands for adults and minors, and no territorial law bans it.
    Advocates report that Virgin Islands Medicaid excludes transition-related care. No local informed-consent hormone
    clinic is known, and the main telehealth services do not serve the territory.
  es: >-
    La atención de afirmación de género es legal en las Islas Vírgenes de EE. UU. para adultos y menores, y ninguna ley
    territorial la prohíbe. Organizaciones de defensa informan que Medicaid de las Islas Vírgenes excluye la atención de
    transición. No se conoce ninguna clínica local de consentimiento informado, y los principales servicios de telesalud
    no atienden el territorio.
adult_care:
  status: available
  detail:
    en: |
      No territorial law restricts adult care. Finding a prescriber is the main barrier.

      **What to try:**
      1. Ask a primary care doctor or a community health center to prescribe or continue hormones. Use the HRSA finder to locate federally funded centers on St. Thomas and St. Croix.
      2. The Department of Health's family planning clinics serve people regardless of ability to pay and may be a starting point for sexual health care and referrals.
      3. Apply to national funds (Point of Pride, Genderbands). Check whether they accept Virgin Islands residents.
    es: |
      Ninguna ley territorial restringe la atención para adultos. El obstáculo principal es encontrar quien recete.

      **Qué intentar:**
      1. Pide a un médico de atención primaria o a un centro de salud comunitario que recete o continúe tus hormonas. Usa el buscador de HRSA para ubicar centros con fondos federales en St. Thomas y St. Croix.
      2. Las clínicas de planificación familiar del Departamento de Salud atienden sin importar la capacidad de pago y pueden ser un punto de partida para salud sexual y referencias.
      3. Solicita fondos nacionales (Point of Pride, Genderbands). Verifica si aceptan residentes de las Islas Vírgenes.
  sources: [map-vi, hrsa, vi-family-planning]
minor_care:
  status: available
  detail:
    en: No territorial law bans gender-affirming care for minors, and there is no shield law. Parental consent is required, and pediatric specialists are very limited.
    es: Ninguna ley territorial prohíbe la atención de afirmación de género para menores, y no hay ley escudo. Se requiere consentimiento de los padres, y los especialistas pediátricos son muy limitados.
  sources: [map-vi]
medicaid:
  program_name: Virgin Islands Medicaid (Medical Assistance Program)
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: >-
      The Department of Human Services' Office of Medicaid runs the program. The Movement Advancement Project lists the
      Virgin Islands as having a Medicaid policy that excludes transgender-related care, but we could not find the
      exclusion in the program's published materials. Ask for a written coverage decision and appeal any denial. Legal
      Services of the Virgin Islands handles health benefit cases.
    es: >-
      La Oficina de Medicaid del Departamento de Servicios Humanos administra el programa. El Movement Advancement Project
      indica que Medicaid de las Islas Vírgenes tiene una política que excluye la atención relacionada con personas trans,
      pero no encontramos la exclusión en los materiales publicados. Pide una decisión de cobertura por escrito y apela
      cualquier negación. Legal Services of the Virgin Islands atiende casos de beneficios de salud.
  how_to_apply_url: https://dhs.vi.gov/office-of-medicaid/
  sources: [vi-medicaid, map-vi]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: No Virgin Islands law bars insurers from excluding gender-affirming care. Check your plan's exclusions.
    es: Ninguna ley de las Islas Vírgenes prohíbe a las aseguradoras excluir la atención de afirmación de género. Revisa las exclusiones de tu plan.
  sources: [map-vi]
