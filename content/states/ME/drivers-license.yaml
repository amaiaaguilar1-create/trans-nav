sources:
  - id: mvl20
    url: "https://www.maine.gov/sos/sites/maine.gov.sos/files/inline-files/GENDER%20DESIGNATION%20FORM2019.pdf"
    title: Gender Designation Form (MVL-20, rev. 11/04/2019)
    publisher: Maine Bureau of Motor Vehicles
    kind: form
    accessed: "2026-09-24"
    quote: I hereby swear, under the penalty of perjury, that this request for the selected gender designation to appear on my Driver's License/ID Card is for the purpose of ensuring that my Driver's License/ID Card accurately reflects my gender identity and is not for any fraudulent or other unlawful purpose.
  - id: sos-guidance
    url: "https://www.maine.gov/sos/sites/maine.gov.sos/files/inline-files/Guidance%20about%20Gender%20Designations%20on%20Maine%20Drivers%20Licenses_1.pdf"
    title: Guidance about Gender Designations on Maine Driver's Licenses (as of March 3, 2025)
    publisher: Maine Department of the Secretary of State
    kind: official
    accessed: "2026-09-24"
    quote: Maine-issued driver's licenses and state IDs are governed by state laws, not the federal executive order. That means that individuals may receive or update a credential to reflect their gender identity.
  - id: sos-news
    url: https://www.maine.gov/sos/news/secretary-state-offers-public-guidance-regarding-gender-designations-maine-drivers-licenses
    title: Secretary of State Offers Public Guidance Regarding Gender Designations on Maine Driver's Licenses (3/03/2025)
    publisher: Maine Department of the Secretary of State
    kind: official
    accessed: "2026-09-24"
    quote: The Maine Bureau of Motor Vehicles will continue to offer the option of a gender marker "X" designation on driver's licenses and identification cards upon receipt of a completed gender designation form. This policy has been in place in Maine since 2018.
  - id: bmv-duplicate
    url: https://www.maine.gov/sos/bmv/driver-licenses-and-ids/update-my-current-license/replacement-duplicate-license-identification-card
    title: I Need a Replacement (Duplicate) License/Identification Card
    publisher: Maine Bureau of Motor Vehicles
    kind: official
    accessed: "2026-09-24"
    quote: There is a $5 fee for a duplicate non-compliant license/identification card. There is a $30 fee for a duplicate REAL ID license/identification card.
  - id: mv10
    url: "https://www.maine.gov/sos/sites/maine.gov.sos/files/inline-files/MV-10%20Duplicate%20Credential%20Application%20Rev%2008-25_3.pdf"
    title: MV-10, Request for Duplicate Driver's License, Identification Card, or Learner's Permit (rev. 08/2025)
    publisher: Maine Bureau of Motor Vehicles
    kind: form
    accessed: "2026-09-24"
    quote: $5.00 for a learner's permit or a non-compliant license or identification card, or $30.00 for a REAL ID license or identification card
  - id: bmv-id
    url: https://www.maine.gov/sos/bmv/driver-licenses-and-ids/id
    title: State Identification Cards
    publisher: Maine Bureau of Motor Vehicles
    kind: official
    accessed: "2026-09-24"
    quote: Identification cards will be mailed within two-to-three weeks from the date ordered.
  - id: ptla-guide
    url: https://www.ptla.org/maine-name-gender-change-guide
    title: How to change your name and gender marker in Maine (last updated September 2025)
    publisher: Pine Tree Legal Assistance
    kind: org
    accessed: "2026-09-24"
    quote: You no longer need a medical provider to fill out this form - you are now able to 'self-attest' ... You will have 30 days to do this once your name change is official!
