      es: Nueva acta de nacimiento tras cambio de marcador de género
    url: https://legislature.maine.gov/statutes/22/title22sec2765.html
  - cite: 22 M.R.S. § 2705
    title:
      en: Amendment of vital statistics records; gender marker changes governed by § 2765
      es: Enmienda de registros vitales
    url: https://legislature.maine.gov/statutes/22/title22sec2705.html
