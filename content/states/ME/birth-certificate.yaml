      es: Partes están desactualizadas (aún menciona una declaración médica).
sources:
  - id: mrs-2765
    url: https://legislature.maine.gov/statutes/22/title22sec2765.html
    title: 22 M.R.S. § 2765, New certificate of birth following adoption, legitimation or gender marker change
    publisher: Maine Legislature, Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: When a new birth certificate is established after changes are made to the gender marker ... the requested gender marker and, if requested at the same time, the first and middle names ... must be entered on the new birth certificate. A new birth certificate may be requested by a parent on behalf of a minor. The new birth certificate may not be marked "amended."
  - id: mrs-2705
    url: https://legislature.maine.gov/statutes/22/title22sec2705.html
    title: 22 M.R.S. § 2705, Amendment of vital statistics records
    publisher: Maine Legislature, Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
    quote: Amendment of a certificate following adoption, legitimation or gender marker change is governed by section 2765, subsections 2-A and 2-B.
  - id: dhhs-gender
    url: https://www.maine.gov/dhhs/mecdc/vital-records/amend-correct-or-complete-vital-records/change-the-gender-marker-on-your-birth-record
    title: Change the Gender Marker on Your Birth Record
    publisher: Maine DHHS, Data, Research, and Vital Statistics
    kind: official
    accessed: "2026-09-24"
    quote: A replacement certificate will be created, and the original certificate will be sealed from public inspection ... The completed application and the $60.00 fee may be mailed to the address below or an in-person appointment may be made by calling (207) 287-3181.
  - id: vs7
    url: "https://www.maine.gov/dhhs/mecdc/sites/maine.gov.dhhs.mecdc/files/Application%20to%20Correct%20a%20Vital%20Record%20in%20Maine%20%28VS-7%29.pdf"
    title: VS-7, Application to Correct a Vital Record in Maine (with instructions)
    publisher: Maine DHHS, Data, Research, and Vital Statistics
    kind: form
    accessed: "2026-09-24"
    quote: A change of gender of an adult 18 years or older and the change of their first and middle names on a birth record may be amended to align with the gender identity at any point in time by completing the application with the applicant's signature notarized. ... The processing time for corrections may be up to 4 to 6 weeks.
  - id: dhhs-request
    url: https://www.maine.gov/dhhs/mecdc/vital-records/request-documents
    title: Request Documents
    publisher: Maine DHHS, Data, Research, and Vital Statistics
    kind: official
    accessed: "2026-09-24"
    quote: $15.00 per certificate, $6.00 for each additional copy ordered at the same time. ... Corrections or amendments of any vital record [by appointment only]
