  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate ratings based on primary sources read 2026-09-24: self-attestation with X on licenses (MVL-20) and birth
    certificates (VS-7, 22 M.R.S. § 2765), no publication for adult name changes (18-C M.R.S. § 1-701), MaineCare
    coverage (MBM Ch. II § 90), private-plan nondiscrimination (24-A M.R.S. § 4320-L), and the shield law (14 M.R.S.
    ch. 763, LD 227, PL 2023 c. 648, signed 2024). The task brief called LD 227 a 2023 law; it was introduced in 2023
    and enacted April 22, 2024. Consistent with MAP's Maine profile. No 2025-2026 rollback found, but WebSearch was
    unavailable, so the 132nd Legislature's bills were not reviewed.
overview:
  en: >-
    Maine is protective for trans people. Adult name changes need no newspaper publication, and you can choose M, F, or
    X on your driver's license and your Maine birth certificate by signing a form, with no doctor's letter. MaineCare
    covers hormone therapy and surgery, state-regulated private plans may not exclude transition care, and a 2024 shield
    law protects patients and providers from other states' bans. Federal documents (passport, Social Security) are the
    exception: their sex fields are currently frozen nationwide.
  es: >-
    Maine protege a las personas trans. Los cambios de nombre de adultos no requieren publicación en periódico, y puedes
    elegir M, F o X en tu licencia y en tu acta de nacimiento de Maine firmando un formulario, sin carta médica.
    MaineCare cubre la terapia hormonal y la cirugía, los planes privados regulados no pueden excluir la atención de
    transición, y una ley escudo de 2024 protege a pacientes y proveedores. Los documentos federales (pasaporte, Seguro
    Social) son la excepción: sus campos de sexo están congelados a nivel nacional.
