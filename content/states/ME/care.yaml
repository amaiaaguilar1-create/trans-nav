  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Legal framework read 2026-09-24 from primary sources: shield law (LD 227, 131st Legislature, enacted as PL 2023 c. 648,
    signed 4/22/2024; codified at 14 M.R.S. ch. 763, § 9001 et seq.), private insurance nondiscrimination (24-A M.R.S.
    § 4320-L), and MaineCare Benefits Manual Ch. II § 90 (Word file dated 05.14.2022 on the SOS rules page; 90.04-33
    Transgender Services and 90.05-1(A)(4) surgery prior authorization with two letters). The brief referred to
    "10-144 CMR ch. 101"; the MaineCare Benefits Manual is 10-144 CMR ch. 101, and § 90 is the relevant section.
    Reviewer: (1) confirm § 90 has not been amended since 2022 and whether MaineCare's pharmacy benefit restricts any
    hormone formulations; (2) federal 2025-2026 actions affecting Medicaid or marketplace coverage of gender-affirming
    care were not researched here (WebSearch unavailable); check CMS and CoverME.gov; (3) Maine Family Planning and
    PPNNE minimum age (16 with parental consent) read on their sites; (4) Greater Portland Health's site does not
    describe gender-affirming hormone therapy, so it is listed as sliding-scale primary care only; (5) no statewide
    Maine PrEP payment program was verified; PrEP207 is navigation. MaineHealth's pediatric gender clinic page could not
    be located after the site redesign and is omitted. Minor care: no ban; LD 1735 (2023), a separate shield bill,
    died; the enacted shield law is LD 227. MAP lists Medicaid explicit inclusion, private insurance nondiscrimination,
    shield law, and no youth ban, consistent with the primary sources.
status_summary:
  en: >-
    Gender-affirming care is legal and protected in Maine for adults and for minors with parental consent. MaineCare
    (Medicaid) covers hormone therapy and, with prior authorization, surgery; state-regulated private plans may not
    exclude transition care; and a 2024 shield law protects patients and providers from other states' bans. Maine
    Family Planning and Planned Parenthood of Northern New England offer hormone therapy from age 16 with sliding fees.
  es: >-
    La atención de afirmación de género es legal y está protegida en Maine para adultos y para menores con
    consentimiento de sus padres. MaineCare (Medicaid) cubre la terapia hormonal y, con autorización previa, la cirugía;
    los planes privados regulados por el estado no pueden excluir la atención de transición; y una ley escudo de 2024
    protege a pacientes y proveedores de las prohibiciones de otros estados. Maine Family Planning y Planned Parenthood
    of Northern New England ofrecen terapia hormonal desde los 16 años con tarifas en escala móvil.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Maine Family Planning and Planned Parenthood of Northern New England both prescribe hormones and teach self-injection, and telehealth prescribing is legal statewide.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **MaineCare** (Medicaid). It covers hormone therapy and related care; see below.
      2. Call **Maine Family Planning** (207-922-3222). It has a sliding fee scale for gender-affirming care for people without insurance and serves much of the state through its clinics and telehealth.
      3. **Planned Parenthood of Northern New England** offers hormone therapy at its Maine health centers (Portland, Biddeford, Sanford, Topsham) and by telehealth; payment plans are available.
      4. A **community health center** (federally qualified health center) charges on a sliding scale. Find one at findahealthcenter.hrsa.gov.
      5. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for a year and a half (applications open each May).
    es: |
      Sin restricciones estatales. Maine Family Planning y Planned Parenthood of Northern New England recetan hormonas y enseñan a autoinyectarse, y la telesalud es legal en todo el estado.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **MaineCare** (Medicaid). Cubre la terapia hormonal y la atención relacionada.
      2. Llama a **Maine Family Planning** (207-922-3222). Tiene escala móvil para atención de afirmación de género para personas sin seguro.
      3. **Planned Parenthood of Northern New England** ofrece terapia hormonal en sus centros de Maine (Portland, Biddeford, Sanford, Topsham) y por telesalud.
      4. Un **centro de salud comunitario** cobra en escala móvil. Búscalo en findahealthcenter.hrsa.gov.
      5. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud (solicitudes cada mayo).
  sources: [mfp-gaht, ppnne-portland, hrsa, pop-hrt]
minor_care:
  status: available
  detail:
    en: |
      Legal. Maine has no ban on gender-affirming care for minors. Its shield law (14 M.R.S. ch. 763, enacted 2024) declares access to gender-affirming care a legal right in Maine and treats other states' attempts to punish people for care lawfully provided in Maine as against public policy. Maine Family Planning and Planned Parenthood of Northern New England offer hormone therapy from **age 16**; PPNNE requires parental consent for 16- and 17-year-olds. For a minor's birth certificate change, a licensed provider must sign a declaration (see the birth certificate guide).
    es: |
      Legal. Maine no prohíbe la atención de afirmación de género para menores. Su ley escudo (14 M.R.S. cap. 763, promulgada en 2024) declara que el acceso a esta atención es un derecho legal en Maine y considera contrarios al orden público los intentos de otros estados de castigar la atención legal brindada en Maine. Maine Family Planning y Planned Parenthood of Northern New England ofrecen terapia hormonal desde los **16 años**; PPNNE exige consentimiento de los padres para jóvenes de 16 y 17 años.
  sources: [shield-9001, ld227, mfp-gaht, ppnne-portland]
medicaid:
  program_name: MaineCare
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      The MaineCare Benefits Manual reimburses providers for covered services "to treat a member with gender dysphoria" (Ch. II § 90.04-33, Transgender Services). **Surgery** requires prior authorization and letters from **two qualified Maine-licensed health professionals** who assessed you independently; medical necessity may be judged using WPATH Standards of Care (§ 90.05-1(A)(4)).

      Maine expanded Medicaid, so adults with income up to about 138% of the federal poverty level can qualify. **Apply** online at My Maine Connection, by phone, or at a DHHS Office for Family Independence office. Maine Family Planning can also enroll uninsured people in MaineCare's limited family planning benefit, but that benefit does **not** cover gender-affirming care or hormones.
    es: |
      El Manual de Beneficios de MaineCare reembolsa a los proveedores por servicios cubiertos "para tratar a un miembro con disforia de género" (Cap. II § 90.04-33). La **cirugía** requiere autorización previa y cartas de **dos profesionales de salud con licencia en Maine** que te evaluaron por separado; la necesidad médica puede juzgarse con los Estándares de Atención de WPATH.

      Maine expandió Medicaid, así que adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza pueden calificar. **Solicita** en My Maine Connection o en una oficina de DHHS. El beneficio limitado de planificación familiar **no** cubre la atención de afirmación de género.
  how_to_apply_url: https://www.mymaineconnection.gov/benefits/s/?language=en_US
  sources: [mainecare-90, ofi-health, mfp-gaht]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Maine's Health Plan Improvement Act (24-A M.R.S. § 4320-L, since 2019) bars state-regulated health plans from categorical exclusions of "all health services related to gender transition," from denying sex-specific care to trans people, and from other discriminatory limits on transition care. Plans may still decide medical necessity case by case. If your plan denies care, appeal with the plan first, then file a complaint with the **Maine Bureau of Insurance**. Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates.

      **CoverME.gov** is Maine's health insurance marketplace, where you can compare plans and get help paying premiums.
    es: |
      La ley de Maine (24-A M.R.S. § 4320-L, desde 2019) prohíbe a los planes regulados por el estado excluir de forma categórica "todos los servicios de salud relacionados con la transición de género" y negar atención específica de un sexo a personas trans. Si tu plan niega la atención, apela ante el plan y luego presenta una queja ante el **Buró de Seguros de Maine**. Los planes autofinanciados de empleadores se rigen por la ley federal.

      **CoverME.gov** es el mercado de seguros médicos de Maine.
  complaint_url: https://www.maine.gov/pfr/insurance/consumers/file-a-complaint-dispute/life-health-complaint-form
  sources: [mrs-4320l, boi-complaint, coverme]
telehealth_hrt: [plume, planned-parenthood]
