sources:
  - id: mrs-1-701
    url: https://legislature.maine.gov/statutes/18-C/title18-Csec1-701.html
    title: 18-C M.R.S. § 1-701, Process to change name
    publisher: Maine Legislature, Office of the Revisor of Statutes
    kind: statute
    accessed: "2026-09-24"
