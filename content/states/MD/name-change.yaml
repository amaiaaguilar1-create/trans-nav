sources:
  - id: mdcourts-namechange
    url: https://www.mdcourts.gov/legalhelp/family/namechange
    title: Name Change
    publisher: Maryland Judiciary
    kind: official
    accessed: "2026-09-24"
    quote: If you are an adult changing your own name, go to the circuit court in the county (or Baltimore City) where you live, carry on a regular business, work, habitually engage in a vocation, or where you were born.
  - id: mdcourts-genderidentity
    url: https://www.mdcourts.gov/genderidentity
    title: Judicial Declarations of Gender Identity
    publisher: Maryland Judiciary
    kind: official
    accessed: "2026-09-24"
    quote: Judicial declarations of gender identity cases are confidential. You do not need to do anything to prevent the public from seeing records in your case.
  - id: ccdr060
    url: https://www.mdcourts.gov/sites/default/files/court-forms/ccdr060.pdf
    title: Form CC-DR-060, Petition for Change of Name of an Adult (Rev. 08/2025)
    publisher: Maryland Judiciary
    kind: form
    accessed: "2026-09-24"
    quote: The Clerk of Court is required by law to notify the State Board of Elections (SBE) of a court-ordered change of name.
  - id: ccdr120
    url: https://www.mdcourts.gov/sites/default/files/court-forms/ccdr120.pdf
    title: Form CC-DR-120, Petition for Judicial Declaration of Gender Identity of an Adult With/Without a Name Change (Rev. 08/2025)
    publisher: Maryland Judiciary
    kind: form
    accessed: "2026-09-24"
    quote: A court order is not necessary to update your gender marker on records with the Social Security Administration, Maryland Motor Vehicle Administration, Maryland Division of Vital Records (for your Maryland birth certificate), or the U.S. Department of State (for your passport).
  - id: ccdr062
    url: https://www.mdcourts.gov/sites/default/files/court-forms/ccdr062.pdf
    title: Form CC-DR-062, Petition for Change of Name of a Minor (Rev. 01/2023)
    publisher: Maryland Judiciary
    kind: form
    accessed: "2026-09-24"
  - id: rules-order-211
    url: https://www.mdcourts.gov/sites/default/files/rules/order/ro211.pdf
    title: Rules Order adopting the 211th Report (Rules 15-901 and 15-902), filed September 30, 2022
    publisher: Court of Appeals of Maryland
    kind: court
    accessed: "2026-09-24"
    quote: Although there is no publication or other required notice of a requested name change of an adult, if a person learns of a requested name change, the 30-day delay in the entry of an order after the petition is filed affords a period of time within which an objection could be filed.
  - id: cj-3-2201
    url: https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=gcj&section=3-2201&enactments=false
    title: Courts and Judicial Proceedings § 3-2201
    publisher: Maryland General Assembly
    kind: statute
    accessed: "2026-09-24"
    quote: On motion by an individual who has filed an action for change of name under Maryland Rule 15-901, the court shall waive the publication requirement under the rule.
  - id: circuit-fees
    url: https://www.mdcourts.gov/sites/default/files/import/circuit/feesummaryschedule.pdf
    title: Summary of Charges, Costs, and Fees of the Clerks of the Circuit Court (effective September 2, 2026)
    publisher: Maryland Judiciary
    kind: official
    accessed: "2026-09-24"
    quote: CERTIFICATION $5 each + 50¢/ page
  - id: mdcourts-feewaiver
    url: https://www.mdcourts.gov/legalhelp/filingfeewaivers
    title: Filing Fee Waivers
    publisher: Maryland Judiciary
    kind: official
    accessed: "2026-09-24"
    quote: The court will consider the MLSC Client Income Eligibility Guidelines in evaluating your request, although it is ultimately up to the court to decide whether or not to grant the waiver.
  - id: mva-gender
    url: https://mva.maryland.gov/about-mva/Pages/changing-gender.aspx
    title: Changing Gender Designation
    publisher: Maryland Motor Vehicle Administration
    kind: official
    accessed: "2026-09-24"
    quote: Name changes on a driver's license or ID card are completed via submission of appropriate documentation of the name change and must also be reflected in the Social Security Card.
  - id: transmd-ncp
    url: https://transmaryland.org/name-change-program
    title: Name and Gender Change Program
    publisher: Trans Maryland
    kind: org
    accessed: "2026-09-24"
    quote: All costs covered for those who cannot afford them (costs above $1000 per person may require external referral).
  - id: transmd-clinics
    url: https://transmaryland.org/clinics
    title: Trans Maryland Document Assistance Clinics
    publisher: Trans Maryland
    kind: org
    accessed: "2026-09-24"
