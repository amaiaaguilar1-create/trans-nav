  - cite: Ch. 649, 2019 Laws of Maryland (SB 196)
    title:
      en: Created the X option and self-certification, effective October 1, 2019
    url: https://mgaleg.maryland.gov/2019RS/Chapters_noln/CH_649_sb0196t.pdf
