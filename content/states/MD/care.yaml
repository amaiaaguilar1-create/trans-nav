  notes: >-
    Legal framework read on mgaleg.maryland.gov 2026-09-24: Health-Gen. § 15-151 (Trans Health Equity Act, Ch. 252/253
    of 2023, Medicaid coverage from January 1, 2024) and SB 119 / HB 691 (Ch. 863 of 2024, effective October 1, 2024),
    which added gender-affirming treatment to "legally protected health care" (shield law). The task brief called
    the shield law "HB 691"; HB 691 itself died in committee and its crossfile SB 119 was enacted, so SB 119 is cited.
    Bills checked in the 2024 to 2026 master lists: HB 722 (2024, minors) and HB 679 (2026, cross-sex hormones for
    minors) had hearings only and did not advance; HB 1283 (2024, insurance discrimination) and HB 1380 (2026,
    prescription supply) did not pass. Private insurance: no single statute found that expressly bans trans
    exclusions; the MIA's Bulletin 14-02 (2014) relies on Ins. § 27-208 to bar discrimination based on gender identity,
    and MAP's healthcare map (fetched 2026-09-24) says Maryland "bans insurance exclusions of transgender health
    care." Reviewer: confirm the current MIA position or any later bulletin. health.maryland.gov and
    insurance.maryland.gov return HTTP 403 to automated fetches, so the Medicaid program page was not read directly
    and the MIA complaint page was read via a February 2024 Wayback snapshot. Johns Hopkins's Center for Transgender
    and Gender Expansive Health page returned 403; it is not listed and whether it currently treats minors was not
    checked. Chase Brexton's current website no longer describes a gender-affirming care program (services pages
    list primary care, sexual health, mental health); reviewer should call to confirm hormone therapy is still
    offered before describing it that way. Planned Parenthood of Maryland details (age 16+, informed consent,
    $200/$160 self-pay, Medicaid accepted) are from its own page.
status_summary:
  en: >-
    Gender-affirming care is legal for adults and minors in Maryland. Maryland Medicaid must cover medically
    necessary gender-affirming treatment, including hormones and surgery, under the Trans Health Equity Act, and a 2024
    shield law protects patients and providers from other states' investigations. Planned Parenthood of Maryland
    offers informed-consent hormone therapy at every health center and by telehealth, and accepts Medicaid.
  es: >-
    La atención de afirmación de género es legal para adultos y menores en Maryland. Medicaid de Maryland debe
    cubrir el tratamiento de afirmación de género médicamente necesario, incluidas hormonas y cirugía, según la Ley de
    Equidad en Salud Trans, y una ley escudo de 2024 protege a pacientes y proveedores de investigaciones de otros
    estados. Planned Parenthood de Maryland ofrece terapia hormonal por consentimiento informado en todos sus centros
    y por telesalud, y acepta Medicaid.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Many providers prescribe hormones on an **informed consent** basis, with no therapist letter required. Telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **Maryland Medicaid** through Maryland Health Connection. Adults with income up to about 138% of the federal poverty level qualify, and Medicaid must cover hormones, labs, and surgery.
      2. **Planned Parenthood of Maryland** offers informed-consent hormone therapy at all its health centers and by telehealth: $200 first visit and $160 follow-ups if you pay yourself, and it takes Medicaid.
      3. **Community health centers** (FQHCs) charge on a sliding scale. Find one at findahealthcenter.hrsa.gov.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care; applications open once a year.
      5. Generic spironolactone and estradiol tablets are inexpensive with a pharmacy discount coupon; ask for the cash price.
    es: |
      Sin restricciones estatales. Muchos proveedores recetan hormonas por **consentimiento informado**, sin carta de terapeuta. La telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medicaid de Maryland** en Maryland Health Connection. Los adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza califican, y Medicaid debe cubrir hormonas, laboratorios y cirugía.
      2. **Planned Parenthood de Maryland** ofrece terapia hormonal por consentimiento informado en todos sus centros y por telesalud: $200 la primera visita y $160 las siguientes si pagas tú, y acepta Medicaid.
      3. Los **centros de salud comunitarios** cobran según ingresos. Búscalos en findahealthcenter.hrsa.gov.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud; las solicitudes abren una vez al año.
      5. La espironolactona y las tabletas de estradiol genéricas son baratas con un cupón de descuento; pregunta el precio en efectivo.
  sources: [pp-md-gac, hg-15-151, mhc, hrsa]
minor_care:
  status: available
  detail:
    en: |
      Legal. Maryland has no ban on gender-affirming care for minors; bills to restrict it (HB 722 in 2024, HB 679 in 2026) received hearings but did not advance. Since October 1, 2024, Maryland's shield law (SB 119, Ch. 863) treats gender-affirming treatment as "legally protected health care": it limits cooperation with out-of-state investigations and subpoenas, extradition, and license discipline based on providing that care. Maryland Medicaid's coverage duty covers recipients of all ages, including puberty blockers. Parental consent is required. Planned Parenthood of Maryland treats patients 16 and older with a parent's or guardian's consent. Federal actions in 2025 and 2026 have led some hospital programs nationally to pause care for minors; call ahead.
    es: |
      Legal. Maryland no prohíbe la atención de afirmación de género para menores; los proyectos para restringirla (HB 722 en 2024, HB 679 en 2026) no avanzaron. Desde el 1 de octubre de 2024, la ley escudo de Maryland (SB 119, Cap. 863) trata el tratamiento de afirmación de género como "atención médica legalmente protegida": limita la cooperación con investigaciones y citaciones de otros estados, la extradición y las sanciones a licencias. La cobertura de Medicaid aplica a beneficiarios de todas las edades. Se requiere consentimiento de los padres. Planned Parenthood de Maryland atiende desde los 16 años con consentimiento de un padre o tutor. Algunas acciones federales han llevado a programas hospitalarios a pausar la atención a menores; llama antes.
  sources: [sb119-2024, hg-15-151, pp-md-gac, hb679-2026]
medicaid:
  program_name: Maryland Medicaid (Maryland Medical Assistance Program / HealthChoice)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Since January 1, 2024, the **Trans Health Equity Act** (Health-General § 15-151) requires Maryland Medicaid to cover medically necessary gender-affirming treatment in a nondiscriminatory manner, consistent with current clinical standards (WPATH). Covered care listed in the law includes hormone therapy and puberty blockers; hair removal; voice therapy; chest, abdomen, face, neck, genital, and gonadal procedures; fertility preservation; and revisions. Medicaid may not call this care cosmetic, may not have categorical exclusions, and may not deny it unless a provider experienced in gender-affirming care has reviewed the denial. Managed care organizations must list which in-network providers offer gender-affirming care in their directories.

      **Apply** online at Maryland Health Connection, by phone, or through your local department of social services.
    es: |
      Desde el 1 de enero de 2024, la **Ley de Equidad en Salud Trans** (Salud General § 15-151) exige que Medicaid de Maryland cubra el tratamiento de afirmación de género médicamente necesario sin discriminación, según los estándares clínicos actuales (WPATH). Incluye terapia hormonal y bloqueadores de pubertad, depilación, terapia de voz, procedimientos de pecho, abdomen, rostro, cuello, genitales y gónadas, preservación de fertilidad y revisiones. Medicaid no puede considerarla cosmética, no puede tener exclusiones categóricas y no puede negarla sin la revisión de un proveedor con experiencia. Las organizaciones de atención administrada deben indicar en sus directorios qué proveedores ofrecen esta atención.

      **Solicita** en línea en Maryland Health Connection, por teléfono o en tu departamento local de servicios sociales.
  how_to_apply_url: https://www.marylandhealthconnection.gov/
  sources: [hg-15-151, thea-2023, mhc]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Maryland's insurance law bars unfair discrimination in health insurance benefits (Insurance Article § 27-208(b)), and the Maryland Insurance Administration has said this prohibits carriers from discriminating based on gender identity (Bulletin 14-02). If a state-regulated plan denies gender-affirming care, file a grievance with the plan, then a complaint with the MIA online or at 1-800-492-6116; allow about 90 days for a decision. Self-funded employer plans are federally regulated and may not be covered by state rules; the Trans Health Project has appeal help for those.
    es: |
      La ley de seguros de Maryland prohíbe la discriminación injusta en los beneficios de seguros de salud (Artículo de Seguros § 27-208(b)), y la Administración de Seguros de Maryland ha dicho que esto prohíbe discriminar por identidad de género (Boletín 14-02). Si un plan regulado por el estado niega atención, presenta una queja formal al plan y luego una queja ante la MIA en línea o al 1-800-492-6116. Los planes autofinanciados de empleadores se rigen por leyes federales.
  complaint_url: https://insurance.maryland.gov/Consumer/Pages/FileAComplaint.aspx
  sources: [ins-27-208, mia-bulletin-1402, mia-complaint, map-health]
