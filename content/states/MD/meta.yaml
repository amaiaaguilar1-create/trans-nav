overview:
  en: >-
    Maryland is protective for trans people. You can change the sex on a driver's license or ID to M, F, or X just
    by checking a box at the MVA; name changes need no newspaper publication; and a birth certificate can be updated
    with a provider's statement or a court order. Maryland Medicaid must cover gender-affirming care, including
    hormones and surgery, and a 2024 shield law protects patients and providers from other states' bans. Federal
    documents (passport, Social Security) are the exception: their sex fields are currently frozen nationwide.
  es: >-
    Maryland protege a las personas trans. Puedes cambiar el sexo en tu licencia o identificación a M, F o X
    marcando una casilla en la MVA; los cambios de nombre no requieren publicación en periódico; y el acta de
    nacimiento se puede actualizar con una declaración de un proveedor o una orden judicial. Medicaid de Maryland
    debe cubrir la atención de afirmación de género, incluidas hormonas y cirugía, y una ley escudo de 2024 protege a
    pacientes y proveedores de las prohibiciones de otros estados. Los documentos federales (pasaporte, Seguro
    Social) son la excepción: sus campos de sexo están congelados a nivel nacional.
