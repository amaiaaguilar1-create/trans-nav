overview:
  en: >-
    California is among the most protective states for trans people. Name changes to match gender identity need no
    publication or hearing, driver's licenses and birth certificates offer M, F, or X by self-attestation, Medi-Cal and
    regulated private insurance must cover gender-affirming care, and a shield law (SB 107) protects patients and
    providers from other states' bans. Federal documents (passport, Social Security) are the exception: their sex
    fields are currently frozen nationwide.
  es: >-
    California es uno de los estados que más protege a las personas trans. Los cambios de nombre por identidad de
    género no requieren publicación ni audiencia, las licencias y actas de nacimiento ofrecen M, F o X por declaración
    propia, Medi-Cal y los seguros privados regulados deben cubrir la atención de afirmación de género, y una ley
    escudo (SB 107) protege a pacientes y proveedores de las prohibiciones de otros estados. Los documentos federales
    (pasaporte, Seguro Social) son la excepción: sus campos de sexo están congelados a nivel nacional.
