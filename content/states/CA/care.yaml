status_summary:
  en: >-
    Gender-affirming care is legal and protected for adults and minors in California. Medi-Cal covers hormone therapy,
    surgery, and related care, state-regulated private plans may not exclude it, and a shield law protects patients and
    providers. Informed-consent hormone clinics, Planned Parenthood affiliates, and sliding-scale community health centers
    operate in every major metro, and several state and city programs pay for care if you are uninsured.
  es: >-
    La atención de afirmación de género es legal y está protegida para adultos y menores en California. Medi-Cal cubre
    terapia hormonal, cirugía y atención relacionada, los planes privados regulados por el estado no pueden excluirla, y
    una ley escudo protege a pacientes y proveedores. Hay clínicas de hormonas por consentimiento informado, afiliadas de
    Planned Parenthood y centros de salud comunitarios con escala móvil en cada área metropolitana, y varios programas
    estatales y municipales pagan la atención si no tienes seguro.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Most community clinics and Planned Parenthood affiliates prescribe hormones on an **informed consent** basis: you discuss risks and benefits with the prescriber and sign a consent form, with no therapist letter required. Telehealth prescribing is legal statewide.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **Medi-Cal** (free for adults up to about 138% of the federal poverty level; see below). It covers hormones, labs, and surgery.
      2. Go to a **community health center** (federally qualified health center). They charge on a sliding scale, many run informed-consent hormone programs, and their pharmacies often sell generics at cost. Find one at findahealthcenter.hrsa.gov.
      3. **Planned Parenthood** affiliates offer sliding-scale hormone care; several start by telehealth.
      4. **Point of Pride's HRT Access Fund** pays for 18 months of telehealth hormone care each year (applications in May).
      5. For the medications themselves, generic spironolactone runs about $5 to $10 a month and generic estradiol tablets about $13 to $35 with a GoodRx coupon; Cost Plus Drugs also carries estradiol tablets at cost. Testosterone prices vary more; ask the pharmacy about cash price versus insurance.
    es: |
      Sin restricciones estatales. La mayoría de las clínicas comunitarias y afiliadas de Planned Parenthood recetan hormonas mediante **consentimiento informado**: hablas de riesgos y beneficios con quien receta y firmas un consentimiento, sin carta de terapeuta. La telesalud es legal en todo el estado.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medi-Cal** (gratis para adultos hasta aproximadamente el 138% del nivel federal de pobreza). Cubre hormonas, laboratorios y cirugía.
      2. Acude a un **centro de salud comunitario**. Cobran en escala móvil, muchos tienen programas de hormonas por consentimiento informado y sus farmacias suelen vender genéricos a costo. Búscalo en findahealthcenter.hrsa.gov.
      3. Las afiliadas de **Planned Parenthood** ofrecen atención hormonal en escala móvil; varias empiezan por telesalud.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga 18 meses de atención hormonal por telesalud cada año (solicitudes en mayo).
      5. Para los medicamentos, la espironolactona genérica cuesta unos $5 a $10 al mes y las tabletas de estradiol genérico unos $13 a $35 con un cupón de GoodRx; Cost Plus Drugs también vende estradiol a costo.
  sources: [dmhc-tgi, pp-norcal, hrsa, pop-hrt, goodrx]
minor_care:
  status: available
  detail:
    en: |
      Legal. California's shield law (SB 107, 2022) bars state courts and agencies from cooperating with other states' attempts to punish families or providers for gender-affirming care, and protects medical records from out-of-state subpoenas. Care for minors follows clinical guidelines and requires parental consent. Some Planned Parenthood affiliates see 16- and 17-year-olds with a parent and a readiness letter (Northern California, California Central Coast); most other affiliates are 18 and older. Santa Clara County's Gender Health Center and several LGBTQ community health centers see all ages.
    es: |
      Legal. La ley escudo de California (SB 107, 2022) impide que tribunales y agencias estatales cooperen con intentos de otros estados de castigar a familias o proveedores por atención de afirmación de género, y protege los expedientes médicos de citaciones de otros estados. La atención a menores sigue guías clínicas y requiere consentimiento de los padres. Algunas afiliadas de Planned Parenthood atienden a jóvenes de 16 y 17 años con un padre y carta de preparación (Northern California, California Central Coast); la mayoría de las demás atienden desde los 18.
  sources: [sb107, pp-norcal, pp-central-coast, scc-ghc]
medicaid:
  program_name: Medi-Cal
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Medi-Cal covers medically necessary transgender health services, including hormone therapy, puberty blockers, mental health care, hair removal, voice therapy, and chest, genital, and facial surgeries, following recognized standards of care (DHCS All Plan Letter 25-014 and Policy Letter 24-03). Since March 2025, Medi-Cal managed care plans must mark in their provider directories which in-network providers offer gender-affirming care (SB 923).

      **Who qualifies**: adults with income up to about 138% of the federal poverty level; higher limits for children and pregnant people. Immigration status does not matter for people already enrolled, but **new enrollment of undocumented adults 19 and older into full-scope Medi-Cal was frozen on January 1, 2026** under the 2025 state budget. If you were enrolled before then, keep renewing on time to keep full coverage. Dental benefits for adults with unsatisfactory immigration status end July 1, 2026, and a $30 monthly premium for ages 19 to 59 in that group begins July 1, 2027.

      **Apply** at BenefitsCal.com, through Covered California, or at your county human services office. Dental and county specialty mental health are included benefits.
    es: |
      Medi-Cal cubre servicios de salud trans médicamente necesarios, incluidos terapia hormonal, bloqueadores de pubertad, salud mental, depilación, terapia de voz y cirugías de pecho, genitales y rostro (Carta a Todos los Planes 25-014 y Carta de Política 24-03 de DHCS). Desde marzo de 2025, los planes de Medi-Cal deben indicar en sus directorios qué proveedores ofrecen atención de afirmación de género (SB 923).

      **Quién califica**: adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza. El estatus migratorio no importa para quienes ya están inscritos, pero **la nueva inscripción de adultos indocumentados de 19 años o más en Medi-Cal de alcance completo se congeló el 1 de enero de 2026**. Si te inscribiste antes, renueva a tiempo para mantener la cobertura completa. Los beneficios dentales para adultos con estatus migratorio no satisfactorio terminan el 1 de julio de 2026.

      **Solicita** en BenefitsCal.com, a través de Covered California o en la oficina de servicios humanos de tu condado.
  how_to_apply_url: https://benefitscal.com/
  sources: [dhcs-apl, dhcs-pl, sb923, dhcs-eligibility, lao-budget]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      The Insurance Gender Nondiscrimination Act (Health & Safety Code § 1365.5; Insurance Code § 10140) bars state-regulated health plans and insurers from denying, limiting, or excluding gender-affirming benefits based on sex or gender identity. If a plan denies care, file a grievance with the plan; if it is not resolved in 30 days (or the situation is urgent), file a complaint or request an Independent Medical Review with the Department of Managed Health Care (free; 1-888-466-2219). Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates for those.

      **Covered California** plans must include gender-affirming care. State subsidies bring the benchmark plan to $0 premium for households up to 150% of the federal poverty level, with partial help up to 165%, on top of federal subsidies. Note: a 2025 federal rule bars federal premium subsidies from covering the portion of a premium attributed to gender-affirming care; check coveredca.com for how this affects your quote.
    es: |
      La Ley de No Discriminación de Género en Seguros prohíbe a los planes y aseguradoras regulados por el estado negar, limitar o excluir beneficios de afirmación de género. Si un plan niega la atención, presenta una queja ante el plan; si no se resuelve en 30 días (o es urgente), presenta una queja o solicita una Revisión Médica Independiente ante el Departamento de Atención Médica Administrada (gratis; 1-888-466-2219).

      Los planes de **Covered California** deben incluir atención de afirmación de género. Los subsidios estatales dejan el plan de referencia en $0 de prima para hogares hasta el 150% del nivel federal de pobreza, con ayuda parcial hasta el 165%.
  complaint_url: https://www.dmhc.ca.gov/HealthCareinCalifornia/GettheBestCare/TGICare.aspx
  sources: [dmhc-tgi, coveredca-subsidy]
