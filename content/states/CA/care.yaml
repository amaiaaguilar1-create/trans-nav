status_summary:
  en: >-
    Gender-affirming care is legal and protected for adults and minors in California. Medi-Cal covers hormone therapy,
    surgery, and related care, state-regulated private plans may not exclude it, and a shield law protects patients and
    providers. Informed-consent hormone clinics operate in every major metro.
  es: >-
    La atención de afirmación de género es legal y está protegida para adultos y menores en California. Medi-Cal cubre
    terapia hormonal, cirugía y atención relacionada, los planes privados regulados por el estado no pueden excluirla, y
    una ley escudo protege a pacientes y proveedores. Hay clínicas de hormonas por consentimiento informado en cada área metropolitana.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Most community clinics and Planned Parenthood affiliates prescribe hormones on an **informed consent** basis: you discuss risks and benefits with the prescriber and sign a consent form, with no therapist letter required. Telehealth prescribing is legal statewide.
    es: |
      Sin restricciones estatales. La mayoría de las clínicas comunitarias y afiliadas de Planned Parenthood recetan hormonas mediante **consentimiento informado**: hablas de riesgos y beneficios con quien receta y firmas un consentimiento, sin carta de terapeuta. La telesalud es legal en todo el estado.
  sources: [dmhc-tgi, pp-norcal]
minor_care:
  status: available
  detail:
    en: |
      Legal. California's shield law (SB 107, 2022) bars state courts and agencies from cooperating with other states' attempts to punish families or providers for gender-affirming care, and protects medical records from out-of-state subpoenas. Care for minors follows clinical guidelines and requires parental consent (or the consent of a minor who is legally able to consent to their own care).
    es: |
      Legal. La ley escudo de California (SB 107, 2022) impide que tribunales y agencias estatales cooperen con intentos de otros estados de castigar a familias o proveedores por atención de afirmación de género, y protege los expedientes médicos de citaciones de otros estados.
  sources: [sb107]
medicaid:
  program_name: Medi-Cal
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Medi-Cal covers medically necessary transgender health services, including hormone therapy, puberty blockers, mental health care, hair removal, voice therapy, and chest, genital, and facial surgeries, following recognized standards of care. Since March 2025, Medi-Cal managed care plans must mark in their provider directories which in-network providers offer gender-affirming care (SB 923, TGI Inclusive Care Act). Apply through Covered California or your county; adults up to 138% of the federal poverty level qualify regardless of immigration status.
    es: |
      Medi-Cal cubre servicios de salud trans médicamente necesarios, incluidos terapia hormonal, bloqueadores de pubertad, salud mental, depilación, terapia de voz y cirugías de pecho, genitales y rostro, según estándares de atención reconocidos. Desde marzo de 2025, los planes de Medi-Cal deben indicar en sus directorios qué proveedores ofrecen atención de afirmación de género (SB 923). Solicítalo a través de Covered California o tu condado.
  how_to_apply_url: https://www.coveredca.com/
  sources: [dhcs-apl, sb923]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      The Insurance Gender Nondiscrimination Act (Health & Safety Code § 1365.5; Insurance Code § 10140) bars state-regulated health plans and insurers from denying, limiting, or excluding gender-affirming benefits based on sex or gender identity. If a plan denies care, file a grievance with the plan; if it is not resolved in 30 days (or the situation is urgent), file a complaint or request an Independent Medical Review with the Department of Managed Health Care. Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates for those.
    es: |
      La Ley de No Discriminación de Género en Seguros prohíbe a los planes y aseguradoras regulados por el estado negar, limitar o excluir beneficios de afirmación de género. Si un plan niega la atención, presenta una queja ante el plan; si no se resuelve en 30 días (o es urgente), presenta una queja o solicita una Revisión Médica Independiente ante el Departamento de Atención Médica Administrada (DMHC).
  complaint_url: https://www.dmhc.ca.gov/HealthCareinCalifornia/GettheBestCare/TGICare.aspx
  sources: [dmhc-tgi]
