intro:
  en: >-
    Los Angeles County has the largest concentration of trans-specific services in the state: free legal clinics for
    name and gender marker changes, several informed-consent hormone clinics, and dedicated trans wellness programs.
    Name change petitions are filed with the Los Angeles Superior Court.
  es: >-
    El condado de Los Ángeles tiene la mayor concentración de servicios específicos para personas trans del estado:
    clínicas legales gratuitas para cambios de nombre y marcador de género, varias clínicas de hormonas por
    consentimiento informado y programas de bienestar trans. Las peticiones de cambio de nombre se presentan en el
    Tribunal Superior de Los Ángeles.
court:
  name: Superior Court of California, County of Los Angeles
  url: https://www.lacourt.ca.gov/
  self_help_url: https://www.lacourt.ca.gov/selfhelp
  filing_fee: 435
  notes:
    en: Name change petitions can be filed at any LA Superior Court civil filing window; Stanley Mosk Courthouse downtown handles the largest volume. Self-Help Centers at several courthouses review forms for free.
    es: Las peticiones se pueden presentar en cualquier ventanilla civil del Tribunal Superior de LA; el Stanley Mosk Courthouse en el centro maneja el mayor volumen. Los Centros de Autoayuda revisan formularios gratis.
  sources: [lacourt-fees]
