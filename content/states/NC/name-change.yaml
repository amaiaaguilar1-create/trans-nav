jurisdiction: NC
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Statute text (G.S. 101-2 to 101-6) and S.L. 2025-54 s. 4 read on ncleg.gov 2026-09-24; the S.L. confirms the
    10-day courthouse posting notice was repealed for applications filed on or after December 1, 2025. nccourts.gov
    blocks automated access (HTTP 403), so the AOC-SP-604 form, the $120 filing fee, and the Mecklenburg page were not
    read directly; the fee and fingerprint/background check costs ($10 per fingerprint set, $14 SBI, $18 FBI) come
    from the NC Bar Foundation's Adult Name Change Petition Information sheet (dated October 2024, which still
    describes the now-repealed posting step). Reviewer: (1) confirm $120 filing fee and current AOC-SP-604 revision;
    (2) confirm whether clerks accept a petition to proceed as an indigent for Chapter 101 name changes (no fee waiver
    section is included because it could not be confirmed); (3) confirm certified-copy fee; (4) A4TE's NC page (no
