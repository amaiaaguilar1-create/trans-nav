overview:
  en: >-
    North Carolina is mixed for ID documents and restrictive for care. Name changes go through the county clerk of
    superior court and need fingerprint background checks and two character affidavits, although the courthouse
    posting notice ended on December 1, 2025. Driver's licenses and birth certificates can still be changed to M or F
    with a form signed by a provider, but a 2025 law (HB 805) defines sex as fixed at conception, and changed birth
    certificates are now kept, and copied, as a multi-page record with the original attached. Care for minors is
    banned, state money cannot pay for transition surgery at any age, and the State Health Plan exclusion is back in
    force. North Carolina has no shield law.
  es: >-
    Carolina del Norte es mixto para documentos de identidad y restrictivo para la atención médica. Los cambios de
    nombre se tramitan ante el secretario del tribunal superior del condado y requieren huellas dactilares,
    verificación de antecedentes y dos declaraciones de buena conducta, aunque el aviso público en el tribunal se
    eliminó el 1 de diciembre de 2025. Las licencias y actas de nacimiento todavía pueden cambiarse a M o F con un
    formulario firmado por un proveedor, pero una ley de 2025 (HB 805) define el sexo como fijo desde la concepción, y
    las actas cambiadas ahora se guardan y copian como un documento de varias páginas junto con el original. La
    atención para menores está prohibida, los fondos estatales no pueden pagar cirugías de transición a ninguna edad y
    el plan de salud estatal volvió a excluirlas. Carolina del Norte no tiene ley escudo.
