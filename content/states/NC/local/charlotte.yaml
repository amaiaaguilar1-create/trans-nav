  es: Condado de Mecklenburg y el área metropolitana de Charlotte
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    nccourts.gov blocks automated access, so the Mecklenburg clerk page was not read; the $120 fee is the statewide
    figure from the NC Bar Foundation sheet. Mecklenburg Sheriff fingerprint portal (mcso.permitium.com) resolves; the
    $10 fee plus an online convenience fee is from search-result text, not read on the page. Time Out Youth address and
    phones read from its homepage. Carolinas CARE Partnership and Planned Parenthood pages could not be read (JavaScript
    rendering / HTTP 403); their services are community_reported. Reviewer: verify hours, new-patient status, and
    whether the NCBA LGBTQ+ clinic has upcoming Charlotte dates.
intro:
  en: >-
    Charlotte has North Carolina's largest concentration of trans community services, including Charlotte Trans Health
    (provider directory and financial help for care) and Time Out Youth for LGBTQ+ people 13 to 24. Name change
    applications are filed with the Mecklenburg County Clerk of Superior Court, Special Proceedings. Fingerprints for
    the required background checks are taken by the Mecklenburg County Sheriff's Office after you apply online.
  es: >-
    Charlotte concentra la mayor cantidad de servicios comunitarios trans de Carolina del Norte, incluidos Charlotte
    Trans Health (directorio de proveedores y ayuda financiera para atención) y Time Out Youth para personas LGBTQ+ de
    13 a 24 años. Las solicitudes de cambio de nombre se presentan ante el Secretario del Tribunal Superior del condado
    de Mecklenburg, Procedimientos Especiales. Las huellas para la verificación de antecedentes las toma la Oficina
    del Sheriff del condado de Mecklenburg tras solicitar en línea.
court:
  name: Mecklenburg County Clerk of Superior Court (Special Proceedings)
  url: https://www.nccourts.gov/locations/mecklenburg-county
  self_help_url: https://northcarolina.tylertech.cloud/SRL/SRL
  filing_fee: 120
  notes:
    en: The clerk's office is open 9 a.m. to 5 p.m., Monday through Friday. Get fingerprints through the Mecklenburg County Sheriff's online fingerprint application (about $10 plus a convenience fee), then request your FBI and SBI checks before filing.
    es: La oficina abre de 9 a.m. a 5 p.m., de lunes a viernes. Solicita huellas en línea con el Sheriff del condado de Mecklenburg (unos $10 más un cargo), luego pide tus verificaciones del FBI y del SBI antes de presentar.
  sources: [nccourts-meck, mcso-fingerprint, ncbf-info]
resources:
  - id: charlotte-trans-health
    name: Charlotte Trans Health
    type: insurance_help
    pillars: [hrt, mental_health, insurance]
    description:
      en: Trans-led nonprofit with a Find a Provider directory of gender-affirming clinicians, the Access to Care program (funds mental health care, case management, medical care, prescription refills, and surgery), and the county-funded PATH program. Email info@charlottetranshealth.org.
      es: Organización dirigida por personas trans con un directorio de proveedores, el programa Access to Care (financia salud mental, manejo de casos, atención médica, recetas y cirugía) y el programa PATH financiado por el condado.
    url: https://charlottetranshealth.org/
    cost: free
    verification: org_website
    sources: [cth, cth-access]
  - id: time-out-youth
    name: Time Out Youth
    type: lgbtq_center
    pillars: [mental_health]
    description:
      en: LGBTQ+ youth center for ages 13 to 24 with a drop-in space, free counseling, and youth programs. 704-344-8335.
      es: Centro para jóvenes LGBTQ+ de 13 a 24 años con espacio abierto, consejería gratuita y programas. 704-344-8335.
    url: https://timeoutyouth.org/
    phone: "704-344-8335"
    address: 3800 Monroe Rd, Charlotte, NC 28205
    cost: free
    verification: org_website
    sources: [toy]
