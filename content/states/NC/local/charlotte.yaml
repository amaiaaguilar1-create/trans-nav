    description:
      en: Reported to offer informed-consent hormone therapy for adults 18 and older, plus STI testing and PrEP. Confirm current services by phone.
      es: Se informa que ofrece terapia hormonal por consentimiento informado para adultos de 18 años o más, además de pruebas de ITS y PrEP.
