litigation:
  - case: Kadel v. Folwell, No. 1:19-cv-00272 (M.D.N.C.)
    court: US District Court, Middle District of North Carolina
    summary:
      en: Challenge to the State Health Plan's exclusion of gender-affirming care. The Fourth Circuit (en banc, 2024) upheld an injunction requiring coverage, but the Supreme Court vacated that decision in June 2025 after Skrmetti. On remand the case was stayed, and the parties dismissed it with prejudice on June 22, 2026.
      es: Impugnación de la exclusión del Plan de Salud Estatal. La Corte Suprema anuló en junio de 2025 la decisión que exigía cobertura; las partes desestimaron el caso con perjuicio el 22 de junio de 2026.
    effect_today:
      en: No court order requires the State Health Plan to cover gender-affirming care. Under G.S. 143C-6-5.6, the Plan's carve-out expired November 14, 2025.
      es: Ninguna orden judicial obliga al Plan de Salud Estatal a cubrir esta atención. Según G.S. 143C-6-5.6, la excepción del Plan expiró el 14 de noviembre de 2025.
    last_update: "2026-06-22"
    url: https://www.courtlistener.com/docket/14666925/kadel-v-folwell/
    sources: [kadel-dismissal, anderson-2026, gs-143c-6-5-6]
