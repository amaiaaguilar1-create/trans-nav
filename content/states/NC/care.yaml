  notes: >-
    Statutes read on ncleg.gov 2026-09-24 (G.S. 90-21.150 to 90-21.152, 143C-6-5.6, HB 805). Kadel v. Folwell
    status from the MDNC docket on CourtListener (stay order Feb 25, 2026; stipulation of dismissal with prejudice
    June 22, 2026) and the Fourth Circuit's March 10, 2026 Anderson v. Crouch opinion (footnote 4 says Kadel was
    remanded to the district court in September 2025). G.S. 143C-6-5.6 as codified says the State Health Plan carve-out
    in subsection (c) expired November 14, 2025. Voe v. Mansfield (MDNC 1:23-cv-00864, challenge to the minors' ban)
    shows as terminated June 23, 2026; the outcome was not read. OPEN ITEMS: (1) NC Medicaid's current written policy
    on hormone therapy for adults could not be found (the NC Medicaid site search is JavaScript-only), so covers_hrt is
    "unclear"; MAP scores NC Medicaid as an explicit exclusion. (2) Whether the State Health Plan actually stopped
    covering gender-affirming care, and from what date, was not confirmed on shpnc.org. (3) Planned Parenthood South
    Atlantic pages return HTTP 403 to automated fetches, so its hormone program and age minimum are unverified.
    (4) Carolinas CARE Partnership services were not read (site renders by JavaScript). (5) Penalties section of the
    minors' ban (G.S. 90-21.153 to 90-21.154) not read directly. (6) The August 16, 2023 effective date of HB 808
    and the December 2023 Medicaid expansion date are from background knowledge, not a source read today.
status_summary:
  en: >-
    Adults can legally get hormone therapy and surgery in North Carolina, but state money cannot pay for transition
    surgery at any age, the State Health Plan exclusion is back in force, and a 2025 law extends malpractice claims to
    10 years. Puberty blockers, hormones, and surgery for anyone under 18 have been banned since August 2023, except
    for minors already in treatment on August 1, 2023. There is no shield law and no state insurance protection.
  es: >-
    Los adultos pueden recibir legalmente terapia hormonal y cirugía en Carolina del Norte, pero el dinero estatal no
    puede pagar cirugías de transición a ninguna edad, el plan de salud estatal volvió a excluirlas y una ley de 2025
    amplía a 10 años el plazo para demandas por negligencia. Los bloqueadores, hormonas y cirugías para menores de 18
    años están prohibidos desde agosto de 2023, salvo para quienes ya estaban en tratamiento el 1 de agosto de 2023.
    No hay ley escudo ni protección estatal en seguros.
adult_care:
  status: restricted
  detail:
    en: |
      No law bans care for adults. Hormone therapy is available from Planned Parenthood, community health centers, private practices, and telehealth services, many on an informed-consent basis. Restrictions that affect adults:
      - **No state funds for surgery.** G.S. 143C-6-5.6 bars State funds, directly or indirectly, from paying for surgical gender transition procedures. This affects Medicaid and other state-funded programs.
      - **State Health Plan** (teachers and state employees): the court order in *Kadel v. Folwell* that required coverage no longer applies (the case was dismissed with prejudice on June 22, 2026), and the statute's carve-out for the Plan expired November 14, 2025.
      - **People in state prison** or DAC custody cannot receive state-funded hormones or surgery (G.S. 143C-6-5.6(b1)).
      - **Malpractice:** HB 805 lets adults sue over transition care up to 10 years after discovering an injury and voids liability waivers (G.S. 90-21.175). Some providers may become more cautious.

      **If you have no insurance and little money:**
      1. Go to a **community health center** (findahealthcenter.hrsa.gov); they charge on a sliding scale and many prescribe hormones.
      2. Check **Charlotte Trans Health**'s provider list and Access to Care assistance, and the **Trans in the South** directory.
      3. **Point of Pride's HRT Access Fund** pays for telehealth hormone care (applications each May).
      4. Generic estradiol and spironolactone cost a few dollars to about $35 a month with discount coupons.
    es: |
      Ninguna ley prohíbe la atención para adultos. La terapia hormonal está disponible en Planned Parenthood, centros de salud comunitarios, consultorios privados y telesalud, muchos por consentimiento informado. Restricciones que afectan a adultos:
      - **Sin fondos estatales para cirugía.** G.S. 143C-6-5.6 prohíbe usar fondos estatales para cirugías de transición. Afecta a Medicaid y otros programas estatales.
      - **Plan de Salud Estatal** (maestros y empleados estatales): la orden judicial de *Kadel v. Folwell* ya no aplica (el caso se desestimó el 22 de junio de 2026) y la excepción del Plan expiró el 14 de noviembre de 2025.
      - **Personas en prisiones estatales** no pueden recibir hormonas ni cirugías pagadas por el estado.
      - **Negligencia:** HB 805 permite demandar hasta 10 años después de descubrir un daño y anula las renuncias de responsabilidad.

      **Si no tienes seguro ni mucho dinero:**
      1. Acude a un **centro de salud comunitario** (findahealthcenter.hrsa.gov); cobran en escala móvil.
      2. Consulta la lista de proveedores y la ayuda de **Charlotte Trans Health** y el directorio **Trans in the South**.
      3. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud (solicitudes cada mayo).
      4. El estradiol y la espironolactona genéricos cuestan desde unos pocos dólares hasta unos $35 al mes con cupones.
  sources: [gs-143c-6-5-6, hb805, kadel-dismissal, anderson-2026, aclu-faq, hrsa, cth-access, cse-tits, pop]
minor_care:
  status: prohibited
  detail:
    en: |
      Since **August 16, 2023** (HB 808, S.L. 2023-111; G.S. 90-21.151), medical professionals may not perform surgical gender transition procedures on anyone under 18 or prescribe, provide, or dispense puberty blockers or cross-sex hormones to them. **Exception:** a minor whose course of treatment began before August 1, 2023 and was still active that day may continue if the provider finds it in the minor's best interest and the parents consent (G.S. 90-21.152(b)). Mental health care is not banned. Providers who violate the law face professional discipline and civil lawsuits. The federal challenge (*Voe v. Mansfield*) closed in June 2026, and the law remains in force.

      Families can get navigation and travel grants to reach care in other states through the Campaign for Southern Equality's **Trans Youth Emergency Project**.
    es: |
      Desde el **16 de agosto de 2023** (HB 808, S.L. 2023-111; G.S. 90-21.151), los profesionales médicos no pueden realizar cirugías de transición a menores de 18 años ni recetarles bloqueadores de pubertad u hormonas cruzadas. **Excepción:** un menor que comenzó el tratamiento antes del 1 de agosto de 2023 y seguía activo ese día puede continuar si el proveedor lo considera en su interés y los padres consienten. La atención de salud mental no está prohibida. El caso federal (*Voe v. Mansfield*) se cerró en junio de 2026 y la ley sigue vigente.

      Las familias pueden obtener navegación y becas de viaje para recibir atención en otros estados con el **Trans Youth Emergency Project** de Campaign for Southern Equality.
  sources: [gs-90-21-151, gs-90-21-152, cse-tyep]
medicaid:
  program_name: NC Medicaid
  covers_hrt: unclear
  covers_surgery: "no"
  detail:
    en: |
      G.S. 143C-6-5.6 bars State funds from paying for surgical gender transition procedures at any age and for puberty blockers or hormones for minors, so NC Medicaid does not cover transition surgery. The same statute does not bar hormone therapy for adults, but NC Medicaid's current written coverage policy for adult hormone therapy could not be confirmed; ask your Medicaid health plan or pharmacy before relying on coverage.

      NC expanded Medicaid in December 2023, so many adults with low incomes qualify. Apply through ePASS or your county Department of Social Services.
    es: |
      G.S. 143C-6-5.6 prohíbe usar fondos estatales para cirugías de transición a cualquier edad y para bloqueadores u hormonas en menores, por lo que NC Medicaid no cubre cirugías. La ley no prohíbe la terapia hormonal para adultos, pero no se pudo confirmar la política escrita actual de NC Medicaid; pregunta a tu plan de Medicaid o farmacia.

      Solicita en ePASS o en el Departamento de Servicios Sociales de tu condado.
  how_to_apply_url: https://epass.nc.gov/
  sources: [gs-143c-6-5-6, map-profile, nc-medicaid]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      North Carolina has no state law barring private insurers from excluding gender-affirming care. Whether your plan covers it depends on the plan. If a plan denies care, appeal with the plan first; for state-regulated plans you can then ask the NC Department of Insurance's Health Insurance Smart NC program for help with appeals and external review. Self-funded employer plans are federally regulated; the Trans Health Project has appeal templates.
    es: |
      Carolina del Norte no tiene ley que prohíba a las aseguradoras privadas excluir la atención de afirmación de género. Si tu plan la niega, apela primero con el plan; para planes regulados por el estado puedes pedir ayuda al programa Health Insurance Smart NC del Departamento de Seguros.
  complaint_url: https://www.ncdoi.gov/consumers/health-insurance
  sources: [map-profile, ncdoi, thp]
