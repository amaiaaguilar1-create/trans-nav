  notes: >-
    Climate rated "mixed" for both ID documents and care. The legislature has passed restrictive laws (SB 280 in 2021,
    SB 99 and SB 458 in 2023, SB 437 in 2025), but Montana courts have blocked or struck them down under the state
    constitution, and document changes are currently available under the Kalarchik preliminary injunction. No shield
    law. See each guide's review notes for open items. MAP pages returned 403 and could not be used as a cross-check.
overview:
  en: >-
    Montana's legislature has passed several laws aimed at trans people, but state courts have blocked most of them
    under the Montana Constitution's strong privacy and equal protection guarantees. Right now you can change the sex
    on a Montana birth certificate by affidavit and on a driver's license with that amended certificate, because of an
    injunction the Montana Supreme Court upheld in April 2026. Name changes require newspaper publication and a hearing
    unless your safety is at risk. The 2023 ban on care for minors has been struck down, adults can get hormone therapy,
    and Montana has no shield law.
  es: >-
    La legislatura de Montana ha aprobado varias leyes dirigidas a personas trans, pero los tribunales estatales han
    bloqueado la mayoría según las fuertes garantías de privacidad e igualdad de la Constitución de Montana. Ahora
    mismo puedes cambiar el sexo en un acta de nacimiento de Montana por declaración jurada y en la licencia de conducir
    con esa acta enmendada, gracias a una orden que la Corte Suprema de Montana confirmó en abril de 2026. El cambio de
    nombre requiere publicación en el periódico y audiencia, salvo que tu seguridad esté en riesgo. La prohibición de
    2023 para menores fue anulada, los adultos pueden recibir terapia hormonal y Montana no tiene ley escudo.
