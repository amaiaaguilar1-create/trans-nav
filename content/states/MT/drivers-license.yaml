litigation:
  - case: Kalarchik v. State of Montana
    court: Montana First Judicial District Court (Lewis and Clark County); Montana Supreme Court
    summary:
      en: Challenges the MVD policy that made it impossible to update the sex on a license and the DPHHS birth certificate ban. Preliminary injunction December 16, 2024; affirmed 5-2 by the Montana Supreme Court on April 14, 2026, which held that transgender discrimination is sex discrimination under the Montana Constitution.
      es: Impugna la política del MVD que impedía cambiar el sexo en la licencia y la prohibición de DPHHS. Orden preliminar del 16 de diciembre de 2024; confirmada 5-2 por la Corte Suprema de Montana el 14 de abril de 2026.
    effect_today:
      en: MVD may not enforce the blocked policy while the case continues. Changes are available now.
      es: El MVD no puede aplicar la política bloqueada mientras sigue el caso. Los cambios están disponibles ahora.
    last_update: "2026-04-14"
    url: https://www.aclumontana.org/cases/kalarchik-et-al-v-state-montana-et-al/
    sources: [aclu-kalarchik, dm-kalarchik-2026, mfp-kalarchik-2024]
  - case: Berndt v. Montana Department of Justice
    court: Montana Fourth Judicial District Court (Missoula County)
    summary:
      en: A nonbinary applicant was refused a license after writing "N.B." on the application. On December 4, 2025 the court ruled that gender identity discrimination violates the Montana Constitution and state laws against sex discrimination; attorney fees were awarded April 9, 2026.
      es: A una persona no binaria se le negó la licencia tras escribir "N.B." en la solicitud. El 4 de diciembre de 2025 el tribunal decidió que la discriminación por identidad de género viola la Constitución de Montana.
    effect_today:
      en: The ruling protects applicants from being refused a license because of gender identity, but it did not create an X marker.
      es: El fallo protege contra la negativa de licencia por identidad de género, pero no creó un marcador X.
    last_update: "2026-04-09"
    url: https://www.aclumontana.org/cases/berndt-v-montana-department-justice-et-al/
    sources: [aclu-berndt]
