litigation:
  - case: Kalarchik v. State of Montana
    court: Montana First Judicial District Court (Lewis and Clark County); Montana Supreme Court
    summary:
      en: Class action by two transgender women challenging the 2022 DPHHS rule banning sex-marker changes on birth certificates and the MVD policy blocking changes on driver's licenses. Preliminary injunction granted December 16, 2024; upheld by the Montana Supreme Court 5-2 on April 14, 2026. Trial not yet scheduled.
      es: Demanda colectiva de dos mujeres trans contra la regla de DPHHS de 2022 que prohibía cambiar el sexo en actas de nacimiento y la política del MVD. Orden preliminar concedida el 16 de diciembre de 2024; confirmada por la Corte Suprema de Montana el 14 de abril de 2026.
    effect_today:
      en: The state may not enforce the ban while the case continues. DPHHS is accepting the Gender Designation Form.
      es: El estado no puede aplicar la prohibición mientras sigue el caso. DPHHS acepta el Formulario de Designación de Género.
    last_update: "2026-04-14"
    url: https://www.aclumontana.org/cases/kalarchik-et-al-v-state-montana-et-al/
    sources: [aclu-kalarchik, dm-kalarchik-2026]
  - case: Marquez v. State of Montana
    court: Montana Thirteenth Judicial District Court (Yellowstone County)
    summary:
      en: Challenge to SB 280 (2021), which required a court order showing surgery. The court preliminarily enjoined SB 280 on April 21, 2022. On April 7, 2026 the court awarded the plaintiffs attorney fees.
      es: Impugnación de SB 280 (2021), que exigía una orden judicial que demostrara cirugía. El tribunal bloqueó SB 280 el 21 de abril de 2022. El 7 de abril de 2026 otorgó honorarios a los demandantes.
    effect_today:
      en: The surgery and court-order requirement in MCA 50-15-224 is not being enforced.
      es: El requisito de cirugía y orden judicial de MCA 50-15-224 no se está aplicando.
    last_update: "2026-04-07"
    url: https://www.aclumontana.org/cases/marquez-v-state-montana/
    sources: [aclu-marquez]
