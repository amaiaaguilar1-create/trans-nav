litigation:
  - case: Cross v. State (formerly van Garderen v. State)
    court: Montana Fourth Judicial District Court (Missoula County); Montana Supreme Court
    summary:
      en: Families and providers challenged SB 99. The Montana Supreme Court upheld a preliminary injunction on December 11, 2024, finding the law likely violates the state constitution's right to privacy. The district court granted summary judgment striking SB 99 on May 13, 2025; ACLU of Montana reports the Montana Supreme Court has ruled it unconstitutional (update of July 9, 2026).
      es: Familias y proveedores impugnaron SB 99. La Corte Suprema de Montana confirmó una orden preliminar el 11 de diciembre de 2024. El tribunal anuló SB 99 el 13 de mayo de 2025; la ACLU de Montana informa que la Corte Suprema lo declaró inconstitucional (actualización del 9 de julio de 2026).
    effect_today:
      en: SB 99 is not enforced. Gender-affirming care for minors is legal in Montana with parental consent.
      es: SB 99 no se aplica. La atención de afirmación de género para menores es legal en Montana con consentimiento de los padres.
    last_update: "2026-07-09"
    url: https://www.aclumontana.org/cases/cross-v-state/
    sources: [aclu-cross, dm-sb99-2025]
