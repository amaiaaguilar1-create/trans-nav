  confidence: medium
  es_status: machine_draft
  notes: >-
    Drafted 2026-09-24. Open items: (1) Minor care: ACLU of Montana's Cross v. State page (latest update Jul 9, 2026)
    says the Montana Supreme Court ruled SB 99 unconstitutional under the state privacy clause; the page body only
    documents the Dec 11, 2024 Supreme Court preliminary ruling and the May 13, 2025 district court summary judgment
    striking SB 99. I could not load the July 2026 opinion itself; confirm the date and holding. SB 99 remains
    printed in MCA 50-4-1001 to 1006. (2) MCA 50-4-1405 (Ch. 560, L. 2025) creates a private cause of action against
    providers for injuries from gender-affirming treatment given to minors (2-year discovery rule, tolled until age 23);
    it is not a ban and I found no injunction against it. The bill number for Ch. 560 was not confirmed. (3) Medicaid:
    I found no DPHHS page or rule stating whether Montana Medicaid covers or excludes gender-affirming hormones or
    surgery for adults; MAP pages returned 403. Coverage marked unclear. Blue Mountain Clinic and Bridgercare accept
    Medicaid per their sites, but that is not a coverage statement. (4) Federal: CMS rule announced Aug 13, 2026
    bars Medicaid/CHIP payment for gender-affirming care for under-18s effective Oct 13, 2026 (Daily Montanan repub);
    confirm effective date and any litigation. (5) Private insurance: no Montana statute or CSI bulletin prohibiting
    trans exclusions found; csimt.gov returns 403, complaint URL taken from Wayback. (6) Planned Parenthood of
    Montana pages return 403; hormone therapy availability and minimum age at PP Montana are unverified. (7) SB 437
    (signed 2026-03-24) redefines sex across the MCA; its effect on care is unknown. No shield law in Montana.
status_summary:
  en: >-
    Adults in Montana can get gender-affirming care, including informed hormone therapy at clinics in Missoula and
    Bozeman. Montana's 2023 ban on care for minors (SB 99) has been struck down under the state constitution's privacy
    clause, so care for minors is legal, but a 2025 law lets patients sue providers over care given to minors, and a
    federal Medicaid funding cutoff for minors takes effect October 13, 2026.
  es: >-
    Las personas adultas en Montana pueden recibir atención de afirmación de género, incluida la terapia hormonal en
    clínicas de Missoula y Bozeman. La prohibición de 2023 para menores (SB 99) fue anulada según la cláusula de
    privacidad de la constitución estatal, así que la atención a menores es legal, pero una ley de 2025 permite
    demandar a proveedores por atención dada a menores, y un recorte federal de Medicaid para menores entra en vigor
    el 13 de octubre de 2026.
adult_care:
  status: available
  detail:
    en: |
      No Montana law restricts gender-affirming care for adults. Clinics such as Blue Mountain Clinic in Missoula and Bridgercare in Bozeman prescribe hormones for adults, and telehealth providers (FOLX, QueerDoc, Plume) serve Montana. Montana has **no shield law** protecting patients or providers from other states' actions.
    es: |
      Ninguna ley de Montana restringe la atención de afirmación de género para adultos. Clínicas como Blue Mountain Clinic en Missoula y Bridgercare en Bozeman recetan hormonas a adultos, y proveedores de telesalud (FOLX, QueerDoc, Plume) atienden en Montana. Montana **no tiene ley escudo**.
  sources: [blue-mountain, bridgercare]
minor_care:
  status: available
  detail:
    en: |
      SB 99 (2023, the "Youth Health Protection Act," MCA 50-4-1001 to 1006) banned puberty blockers, hormones, and surgery for minors with gender dysphoria and barred public funds for that care. It never took full effect: a Missoula County district court blocked it in 2023, the Montana Supreme Court upheld that block on December 11, 2024, and the district court struck the law down on May 13, 2025. ACLU of Montana reports that the Montana Supreme Court has since ruled SB 99 unconstitutional under the state privacy clause.

      Two things still affect minors' care:
      - **MCA 50-4-1405** (2025) lets a person treated as a minor sue the provider for injuries caused by a departure from the standard of care, until two years after discovering the injury (and not before age 23).
      - A **federal CMS rule** bars Medicaid and CHIP from paying for gender-affirming medical care for people under 18 starting **October 13, 2026**; current patients get six months of transition coverage.

      Parental consent is required for minors. Ask any clinic about its own age policy.
    es: |
      SB 99 (2023, MCA 50-4-1001 a 1006) prohibía bloqueadores de pubertad, hormonas y cirugías para menores con disforia de género. Nunca entró plenamente en vigor: un tribunal de Missoula la bloqueó en 2023, la Corte Suprema de Montana confirmó el bloqueo el 11 de diciembre de 2024 y el tribunal la anuló el 13 de mayo de 2025. La ACLU de Montana informa que la Corte Suprema declaró SB 99 inconstitucional.

      Dos cosas siguen afectando la atención a menores:
      - **MCA 50-4-1405** (2025) permite demandar al proveedor por daños causados por apartarse del estándar de atención.
      - Una **regla federal de CMS** prohíbe que Medicaid y CHIP paguen la atención médica de afirmación de género para menores de 18 a partir del **13 de octubre de 2026**.
  sources: [aclu-cross, dm-sb99-2025, mca-50-4-1004, mca-50-4-1405, dm-cms-2026]
medicaid:
  program_name: Montana Medicaid / Healthy Montana Kids
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: |
      We could not find a Montana Medicaid rule or policy that states whether gender-affirming hormones or surgery are covered for adults. Some Montana clinics that prescribe hormones accept Medicaid; ask the clinic and your pharmacy to check coverage before you start, and ask for a written denial if a claim is refused so you can appeal. For people under 18, federal rules end Medicaid and CHIP payment for gender-affirming medical care on October 13, 2026.
    es: |
      No encontramos una regla de Medicaid de Montana que diga si cubre hormonas o cirugías de afirmación de género para adultos. Algunas clínicas que recetan hormonas aceptan Medicaid; pide a la clínica y a tu farmacia que verifiquen la cobertura y pide una negación por escrito si rechazan un reclamo. Para menores de 18, las reglas federales terminan el pago de Medicaid y CHIP el 13 de octubre de 2026.
  how_to_apply_url: https://apply.mt.gov/
  sources: [dphhs-medicaid, dm-cms-2026]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: Montana has no law requiring state-regulated health plans to cover gender-affirming care or banning trans-specific exclusions. Plans governed by federal rules (for example the ACA's Section 1557) may have separate protections that are in flux. You can file a complaint with the Commissioner of Securities and Insurance (CSI) if a Montana-regulated insurer denies a claim improperly.
    es: Montana no tiene una ley que obligue a los planes regulados por el estado a cubrir la atención de afirmación de género ni que prohíba exclusiones. Puedes presentar una queja ante el Comisionado de Valores y Seguros (CSI) si una aseguradora de Montana niega un reclamo indebidamente.
  complaint_url: https://csimt.gov/consumer-or-professional-online-complaint-form/
  sources: [csi-complaint]
