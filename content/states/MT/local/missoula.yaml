  - id: mlsa
    name: Montana Legal Services Association
    type: legal_aid
    pillars: [name_change, gender_marker]
    description:
      en: Free civil legal help for low-income Montanans, including a Missoula office. HelpLine Tuesday to Thursday, 9 a.m. to 1 p.m.; response times are currently longer because of reduced staffing.
      es: Ayuda legal civil gratuita para personas de bajos ingresos, con oficina en Missoula. Línea de ayuda de martes a jueves, de 9 a.m. a 1 p.m.
    url: https://www.mtlsa.org/
