review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Missoula chosen over Billings because it has the longest-running trans care provider (Blue Mountain Clinic), HIV
    and testing services (Open Aid Alliance), and the courts where the major trans rights cases were filed. Billings
    has 406 Pride (406pride.org) but I found fewer clinical services there. Open items: (1) the Western Montana LGBTQ+
    Community Center's former site (gaymontana.org) now shows a blank directory listing; I could not find a current
    site, so it is omitted. (2) Montana Human Rights Network's site (mhrn.org) shows "Website Expired"; omitted. (3)
    Planned Parenthood of Montana's Missoula center details and hormone therapy availability are unverified (403).
    (4) Filing fee total at Missoula County Clerk of District Court is not published online; call 406-258-4780.
    Open Aid Alliance details come from a 2026 Wayback capture because the live site returns 403.
intro:
  en: >-
    Missoula has western Montana's most established trans health services, including a clinic that has provided
    hormone therapy for more than a decade, free STI and HIV testing, and statewide legal and advocacy groups. Name
    change petitions for Missoula County residents are filed with the Clerk of District Court at the Missoula County
    Courthouse.
  es: >-
    Missoula tiene los servicios de salud trans más establecidos del oeste de Montana, incluida una clínica que ofrece
    terapia hormonal desde hace más de una década, pruebas gratuitas de ITS y VIH, y grupos legales y de defensa a
    nivel estatal. Las peticiones de cambio de nombre de residentes del condado de Missoula se presentan ante el
    Secretario del Tribunal de Distrito en el Palacio de Justicia del condado.
court:
  name: Montana Fourth Judicial District Court, Missoula County (Clerk of District Court)
  url: https://www.missoulacounty.gov/departments/district-court/
  self_help_url: https://courts.mt.gov/forms/namechange
  notes:
    en: The Clerk of District Court is on the second floor of the Missoula County Courthouse, 200 West Broadway, Missoula, MT 59802 (406-258-4780), open 8 a.m. to 5 p.m. weekdays. The office accepts cash, money orders, and credit/debit cards (with a processing fee), not personal checks. Call to confirm the total filing fee.
    es: El Secretario del Tribunal de Distrito está en el segundo piso del Palacio de Justicia, 200 West Broadway, Missoula, MT 59802 (406-258-4780), de 8 a.m. a 5 p.m. entre semana. Acepta efectivo, giros postales y tarjetas (con cargo), no cheques personales.
  sources: [missoula-clerk, courts-namechange-page]
resources:
  - id: blue-mountain-clinic
    name: Blue Mountain Clinic
    type: hrt_clinic
    pillars: [hrt, sexual_health, name_change]
    description:
      en: Family medicine clinic with more than a decade of gender-affirming care; hormone therapy, walk-in injection support and training, surgery referrals, help with legal name change documents, and an internal Access Fund for patients who cannot afford care.
      es: Clínica de medicina familiar con más de una década de atención de afirmación de género; terapia hormonal, apoyo y capacitación para inyecciones, referencias quirúrgicas, ayuda con documentos de cambio de nombre y un fondo interno de ayuda.
    url: https://www.bluemountainclinic.org/services/gender-affirming-care/
    phone: (406) 721-1646
    address: 610 North California Street, Missoula, MT 59802
    cost: varies
    verification: org_website
    sources: [blue-mountain]
  - id: open-aid-alliance
    name: Open Aid Alliance
    type: sexual_health
    pillars: [sexual_health]
    description:
      en: Confidential STI, HIV, hepatitis C, and syphilis testing; PrEP information; free condoms, lube, naloxone, and safer-use supplies; housing help for people living with HIV. Office open noon to 5 p.m. Monday to Thursday.
      es: Pruebas confidenciales de ITS, VIH, hepatitis C y sífilis; información sobre PrEP; condones, lubricante, naloxona y suministros gratuitos; ayuda de vivienda para personas con VIH.
    url: https://openaidalliance.org/
    phone: 406-543-4770
    address: 715 Ronan St, Missoula, MT 59801
    cost: free
    verification: org_website
    sources: [open-aid]
  - id: pp-missoula
    org: planned-parenthood
    name: Planned Parenthood of Montana, Missoula
    type: informed_consent_clinic
    pillars: [hrt, sexual_health]
    description:
      en: Sexual and reproductive health care. Whether this center offers gender-affirming hormone therapy, and at what minimum age, is unconfirmed; call before you go.
      es: Atención de salud sexual y reproductiva. No está confirmado si este centro ofrece terapia hormonal ni la edad mínima; llama antes de ir.
    url: https://www.plannedparenthood.org/planned-parenthood-montana
    cost: varies
    verification: unverified
