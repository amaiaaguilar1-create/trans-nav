  es: Condado de Clark (Las Vegas, Henderson, North Las Vegas)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Starter list from org and agency websites read 2026-09-24. Huntridge Family Clinic now redirects to CAN Community
    Health Las Vegas, whose page lists HIV, PrEP, and STI services but not gender-affirming care. Verify before listing
    it for hormones. Check hours, phone scheduling, and new-patient availability at The Center's clinics.
intro:
  en: >-
    Las Vegas has free legal help for name and gender marker changes through Legal Aid Center of Southern Nevada, an
    informed-consent hormone clinic at The Center, and low-cost sexual health clinics. Name change petitions are filed
    with the Eighth Judicial District Court, Family Division, at 601 N. Pecos Rd.
  es: >-
    Las Vegas tiene ayuda legal gratuita para cambios de nombre y marcador de género a través de Legal Aid Center of
    Southern Nevada, una clínica de hormonas por consentimiento informado en The Center y clínicas de salud sexual de
    bajo costo. Las peticiones de cambio de nombre se presentan en el Octavo Tribunal Judicial de Distrito, División
    de Familia, en 601 N. Pecos Rd.
court:
  name: Eighth Judicial District Court, Family Division (Family Courts and Services Center)
  url: https://www.clarkcountycourts.us/
  self_help_url: https://www.familylawselfhelpcenter.org/self-help/name-changes/name-changes-for-adults
  filing_fee: 270
  notes:
    en: File in person at 601 N. Pecos Rd, Las Vegas, NV 89101, by mail, or through eFileNV ($3.50 extra). The Family Law Self-Help Center in the same building has free forms and a guided interview.
    es: Presenta en persona en 601 N. Pecos Rd, por correo o por eFileNV ($3.50 adicional). El Centro de Autoayuda en el mismo edificio ofrece formularios gratuitos.
  sources: [flshc-adult]
