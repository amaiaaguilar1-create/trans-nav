    type: legal_aid
    pillars: [name_change, gender_marker]
    description:
      en: Free help with name and gender marker changes for eligible clients. Walk in Monday to Thursday, 9 a.m. to 4 p.m., with proof of income, ID, and your birth certificate if you have it.
      es: Ayuda gratuita con cambios de nombre y marcador de género; atención sin cita de lunes a jueves de 9 a 4.
    url: https://www.lacsn.org/practice-areas/family-justice-project/name-change-gender-marker
