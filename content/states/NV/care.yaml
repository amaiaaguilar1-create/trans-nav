  notes: >-
    Legal framework read 2026-09-24. Sources: NRS 422.272362 and 422.2701 (Medicaid, 2023), NRS 689A.0432 and 689A.033
    (individual insurance), Medicaid Services Manual Chapter 600 section 608 (rev. 2026-05-27; page 2 updated
    2026-01-01), and SB 302 (2023) NELIS history showing a veto. So there is **no** shield law, contrary to the task
    prompt. No Nevada ban on care for minors was found in the NRS as revised with 2025 laws. Not verified: any federal
    2025-2026 action restricting Medicaid funding for gender-affirming care (NRS 422.2702, added 2025, bars the state
    from acting against federal requirements), so reviewer should check CMS rules. Planned Parenthood in Nevada is run
    by Planned Parenthood **Mar Monte**, not Rocky Mountains (plannedparenthood.org health-center pages). Its minimum
    age for hormone care was not confirmed. Huntridge Family Clinic is now CAN Community Health, whose Las Vegas page
    does not mention gender-affirming care, so it is listed only for sexual health in the local file. Gender Justice
    Nevada's domain now redirects to an unrelated site, and Silver State Equality's site blocked fetching; both were
    omitted. Trans Pride Initiative is a Texas organization and was omitted. Plan specifics (step therapy, prior
    authorization for hormones under MSM Chapter 1200) were not reviewed.
status_summary:
  en: >-
    Gender-affirming care is legal for adults and minors in Nevada. State law requires Nevada Medicaid and
    state-regulated health insurance to cover medically necessary hormone therapy, surgery, and mental health care.
    Nevada does **not** have a shield law protecting patients and providers from other states' actions. Informed-consent
    hormone care is available in Las Vegas and Reno, and by telehealth.
  es: >-
    La atención de afirmación de género es legal para adultos y menores en Nevada. La ley estatal exige que Nevada
    Medicaid y los seguros regulados por el estado cubran terapia hormonal, cirugía y salud mental médicamente
    necesarias. Nevada **no** tiene una ley escudo que proteja a pacientes y proveedores de acciones de otros estados.
    Hay atención hormonal por consentimiento informado en Las Vegas, Reno y por telesalud.
adult_care:
  status: available
  detail:
    en: |
      No state restrictions on adult care. The Center's Gavin J Goorjian Community Health Center in Las Vegas prescribes hormones on an **informed consent** basis, meaning no therapist letter is needed. Northern Nevada HOPES in Reno runs a gender and sexual health clinic. Planned Parenthood's North Las Vegas and Reno health centers list gender-affirming care. Telehealth (Plume, FOLX, Planned Parenthood) is also an option.

      **If you have no insurance and little money:**
      1. Apply for **Nevada Medicaid** at Access Nevada. Adults qualify up to about 138% of the federal poverty level, and it covers hormones, surgery, and mental health care.
      2. Go to a **community health center**. Northern Nevada HOPES charges on a sliding scale. Find others at findahealthcenter.hrsa.gov.
      3. The Center in Las Vegas offers free help with Medicaid and Nevada Health Link enrollment.
      4. **Point of Pride** runs funds for hormone care and other gender-affirming needs.
      5. Generic spironolactone and estradiol tablets are often inexpensive with a discount coupon, so ask the pharmacy for the cash price.
    es: |
      No hay restricciones estatales para adultos. El Gavin J Goorjian Community Health Center de The Center en Las Vegas receta hormonas por **consentimiento informado** (sin carta de terapeuta). Northern Nevada HOPES en Reno tiene una clínica de salud de género. Planned Parenthood en North Las Vegas y Reno ofrece atención de afirmación de género. También hay telesalud (Plume, FOLX, Planned Parenthood).

      **Si no tienes seguro ni mucho dinero:**
      1. Solicita **Nevada Medicaid** en Access Nevada (adultos hasta aproximadamente el 138% del nivel federal de pobreza); cubre hormonas, cirugía y salud mental.
      2. Acude a un **centro de salud comunitario** con escala móvil, como Northern Nevada HOPES; busca otros en findahealthcenter.hrsa.gov.
      3. The Center en Las Vegas ayuda gratis con la inscripción en Medicaid y Nevada Health Link.
      4. **Point of Pride** tiene fondos para atención hormonal.
      5. La espironolactona y el estradiol genéricos suelen ser baratos con un cupón; pregunta el precio en efectivo.
  sources: [center-wellness, nnhopes-lgbtq, pp-nlv, center-insurance, hrsa, nrs-422]
minor_care:
  status: available
  detail:
    en: |
      Nevada has no law banning gender-affirming care for minors. Care requires parental consent and follows clinical guidelines. Nevada Medicaid covers hormone therapy based on medical necessity, but genital surgery is covered only at age 18 or older (MSM 608.1). State-regulated insurers may set their own requirements for covering surgery for minors (NRS 689A.0432). Nevada has **no shield law**: SB 302 (2023), which would have barred cooperation with other states' investigations and extradition over gender-affirming care, was vetoed. Families who travel from states with bans should get legal advice.
    es: |
      Nevada no tiene una ley que prohíba la atención de afirmación de género para menores. Requiere consentimiento de los padres y sigue guías clínicas. Medicaid cubre terapia hormonal según necesidad médica, pero la cirugía genital solo desde los 18 años. Nevada **no tiene ley escudo**: la SB 302 (2023) fue vetada. Las familias que vienen de estados con prohibiciones deben buscar asesoría legal.
  sources: [msm-608, nrs-689a, sb302-nelis]
medicaid:
  program_name: Nevada Medicaid
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      NRS 422.272362 (2023) requires Nevada Medicaid to pay for medically necessary treatment of gender dysphoria and gender incongruence, including hormone therapy, surgery, and psychosocial care, following the current WPATH Standards of Care. It may not categorically refuse gender-affirming treatments that it covers for other purposes. NRS 422.2701 bans gender-identity discrimination in coverage. If you appeal a medical-necessity denial, the state must consult a provider experienced in gender-affirming care.

      Under Medicaid Services Manual section 608, hormones are covered by medical necessity (prior-authorization rules are in Chapter 1200). Surgery requires prior authorization, age 18 or older, two letters from mental health professionals, and generally 12 months of hormones and 12 months living in your gender role before genital surgery. Breast augmentation is covered only if 12 months of estrogen did not produce enough growth. Cosmetic procedures, reversals, and fertility preservation are excluded.
    es: |
      NRS 422.272362 (2023) exige que Nevada Medicaid pague el tratamiento médicamente necesario de la disforia e incongruencia de género, incluidas hormonas, cirugía y atención psicosocial, según los Estándares de Atención de WPATH. Si apelas una negación por necesidad médica, el estado debe consultar a un proveedor con experiencia.

      Según el manual de servicios (sección 608), las hormonas se cubren por necesidad médica. La cirugía requiere autorización previa, 18 años o más, dos cartas de profesionales de salud mental y, en general, 12 meses de hormonas antes de la cirugía genital. Se excluyen procedimientos cosméticos, reversiones y preservación de fertilidad.
  how_to_apply_url: https://accessnevada.nv.gov/
  sources: [nrs-422, msm-608]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      NRS 689A.0432 requires state-regulated health insurance to cover medically necessary treatment of gender dysphoria and gender incongruence, including psychosocial and surgical care, and bars categorical refusals. NRS 689A.033 bans discrimination based on gender identity or expression. Self-funded employer plans are governed by federal law and may not follow these rules. To complain about a denial, contact the Nevada Division of Insurance.
    es: |
      NRS 689A.0432 exige que los seguros regulados por el estado cubran el tratamiento médicamente necesario de la disforia de género, incluida la cirugía, y prohíbe negativas categóricas; NRS 689A.033 prohíbe la discriminación por identidad o expresión de género. Los planes autofinanciados de empleadores pueden no estar sujetos a estas normas. Para quejas, contacta a la División de Seguros de Nevada.
  complaint_url: https://doi.nv.gov/Consumers/File-a-Complaint/
  sources: [nrs-689a, doi-complaint]
