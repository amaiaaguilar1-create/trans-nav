  notes: >-
    SB 302 (2023), the proposed shield law for gender-affirming care, was vetoed by Governor Lombardo on June 3, 2023
    (NELIS history, read 2026-09-24). The research request assumed it had passed. It did not. As of the NRS revision that
    includes 2025 laws, the phrase "gender-affirming" shows up only in the Medicaid and insurance chapters (NRS 422,
    689A), not in the licensing chapters (630-633) or the extradition and criminal chapters where a shield law would sit.
    MAP also scores Nevada 0/1 for a trans-care shield law. Reviewer: confirm that no 2025 or 2026 shield bill became law.
