overview:
  en: >-
    Nevada is broadly protective on ID documents. Adults changing their name to match their gender identity do not
    have to publish it in a newspaper. You can pick M, F, or X on your driver's license by self-declaration, and people
    born in Nevada can change the sex on their birth certificate with notarized affidavits, with no court order or
    surgery. Nevada Medicaid and state-regulated insurance must cover medically necessary gender-affirming care, and
    care for minors is not banned. Nevada has **no** shield law for gender-affirming care: the Governor vetoed SB 302 in
    2023. Federal documents (passport, Social Security) are a separate matter: their sex fields are currently frozen
    nationwide.
  es: >-
    Nevada protege bastante en materia de documentos de identidad. Los adultos que cambian su nombre por identidad de
    género no tienen que publicarlo en un periódico. Puedes elegir M, F o X en tu licencia con tu propia declaración, y
    las personas nacidas en Nevada pueden cambiar el sexo en su acta de nacimiento con declaraciones juradas
    notariadas, sin orden judicial ni cirugía. Nevada Medicaid y los seguros regulados por el estado deben cubrir la
    atención de afirmación de género médicamente necesaria, y la atención para menores no está prohibida. Nevada **no**
    tiene ley escudo para la atención de afirmación de género: el Gobernador vetó la SB 302 en 2023.
