litigation:
  - case: Misanin v. Wilson, No. 2:24-cv-04734-BHH
    court: U.S. District Court for the District of South Carolina
    summary:
      en: Three trans adults and two families of trans youth, represented by the ACLU, ACLU of South Carolina, and Selendy Gay, challenge the ban on care for minors, the public-funds ban (at any age), and the Medicaid exclusion under the Equal Protection Clause and federal anti-discrimination laws.
      es: Tres adultos trans y dos familias de jóvenes trans, representados por la ACLU, la ACLU de Carolina del Sur y Selendy Gay, impugnan la prohibición de atención a menores, la prohibición de fondos públicos (a cualquier edad) y la exclusión de Medicaid.
    effect_today:
      en: No injunction has been issued. All three provisions are in effect while the case continues.
      es: No se ha emitido ninguna orden judicial. Las tres disposiciones están vigentes mientras continúa el caso.
    last_update: "2024-08-29"
    url: https://www.aclusc.org/cases/misanin-v-wilson/
    sources: [aclu-misanin]
