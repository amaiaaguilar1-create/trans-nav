  notes: >-
    Act No. 203 of 2024 (H 4624) read in full on scstatehouse.gov (bill text and codified S.C. Code 44-42-310 to -360,
    59-32-36). Key reviewer checks: (1) 44-42-340 ("Public funds may not be used directly or indirectly for gender
    transition procedures") has no age limit; per the ACLU of SC, adults lost care on Medicaid, the state employee
    health plan, and at MUSC. We did not find an SCDHHS or PEBA written policy implementing it; confirm how the State
    Health Plan and public university hospitals (MUSC, Prisma Health is private nonprofit) apply it today. (2) Misanin
    v. Wilson, No. 2:24-cv-04734-BHH (D.S.C.): the ACLU-SC case page still shows "Latest Update: Aug 29, 2024" and
    status Active; we could not confirm later rulings (likely affected by United States v. Skrmetti, June 18, 2025).
    Reviewer must check PACER/CourtListener for the current posture. (3) MUSC's youth gender clinic closure and
    Prisma Health's adult services were not confirmed on their own sites; neither is listed as a resource. (4) Planned
    Parenthood South Atlantic lists Gender-Affirming Care at its Columbia and Charleston centers and in video visits
    for SC residents; minimum age (presumably 18 given SC law) and informed-consent model were not stated on the pages
    we could read. (5) QueerMed lists South Carolina on its locations page; it is not in content/orgs so it is listed as
    a plain resource, not in telehealth_hrt. (6) 2025-2026 session bills (S 540, S 240/H 3094, H 3506) all stayed in
    committee; the two-year session has ended, so no pending_bills are listed. MAP scores SC -1 on Medicaid, -0.5 on
    state employee benefits, and 0 on private insurance nondiscrimination.
status_summary:
  en: >-
    Adults in South Carolina can still legally get hormone therapy, including from Planned Parenthood and telehealth,
    but since May 2024 state law bars any public funds from paying for it at any age, so Medicaid and the state
    employee health plan do not cover it. Puberty blockers, hormones, and surgery for gender transition are banned for
    everyone under 18. A federal lawsuit (Misanin v. Wilson) is pending, but the law is in effect. South Carolina has no
    shield law.
  es: >-
    Los adultos en Carolina del Sur todavía pueden obtener legalmente terapia hormonal, incluso en Planned Parenthood y
    por telesalud, pero desde mayo de 2024 la ley estatal prohíbe usar fondos públicos para pagarla a cualquier edad,
    así que Medicaid y el plan de salud de empleados estatales no la cubren. Los bloqueadores de pubertad, las hormonas
    y la cirugía para la transición de género están prohibidos para menores de 18 años. Hay una demanda federal
    pendiente (Misanin v. Wilson), pero la ley está vigente. Carolina del Sur no tiene ley escudo.
adult_care:
  status: restricted
  detail:
    en: |
      Hormone therapy and surgery are **legal for adults 18 and older**, but Act 203 of 2024 (H 4624) limits who pays:
      - **No public funds, at any age** (S.C. Code § 44-42-340). This covers Medicaid, the State Health Plan for public employees, and other state money. The ACLU of South Carolina reports that after the law passed, adults on Medicaid, on the state employees' plan, and at the Medical University of South Carolina (MUSC) had appointments canceled.
      - **Medicaid** may not cover anything the chapter prohibits (§ 44-42-350).

      **If you have no insurance or only Medicaid**, in rough order of what to try:
      1. **Planned Parenthood South Atlantic** lists gender-affirming care at its Columbia and Charleston health centers and by video visit for South Carolina residents. Call to confirm age and cost.
      2. **Telehealth**: Plume, FOLX, and QueerMed serve South Carolina. Point of Pride's HRT Access Fund pays for 18 months of telehealth care through partners like these.
      3. **Private insurance** you buy yourself or get through a private employer is not covered by the public-funds ban, but South Carolina does not require plans to cover transition care, so check your policy.
      4. **Community health centers** charge on a sliding scale; find one at findahealthcenter.hrsa.gov and ask whether they prescribe hormones and whether state money limits them.
      5. Generic estradiol and spironolactone are inexpensive with a pharmacy discount coupon; compare cash prices for testosterone.
    es: |
      La terapia hormonal y la cirugía son **legales para adultos de 18 años o más**, pero la Ley 203 de 2024 (H 4624) limita quién paga:
      - **Sin fondos públicos, a cualquier edad** (Código de Carolina del Sur § 44-42-340). Esto incluye Medicaid, el Plan de Salud Estatal para empleados públicos y otro dinero estatal. La ACLU de Carolina del Sur informa que, tras la ley, adultos con Medicaid, con el plan de empleados estatales y en la Universidad Médica de Carolina del Sur (MUSC) vieron canceladas sus citas.
      - **Medicaid** no puede cubrir lo que el capítulo prohíbe (§ 44-42-350).

      **Si no tienes seguro o solo tienes Medicaid**, en orden aproximado:
      1. **Planned Parenthood South Atlantic** ofrece atención de afirmación de género en sus centros de Columbia y Charleston y por video para residentes de Carolina del Sur. Llama para confirmar edad y costo.
      2. **Telesalud**: Plume, FOLX y QueerMed atienden Carolina del Sur. El Fondo de Acceso a TRH de Point of Pride paga 18 meses de atención por telesalud.
      3. El **seguro privado** que compras tú o que te da un empleador privado no está afectado por la prohibición de fondos públicos, pero Carolina del Sur no exige que los planes cubran la transición; revisa tu póliza.
      4. Los **centros de salud comunitarios** cobran en escala móvil; búscalos en findahealthcenter.hrsa.gov.
      5. El estradiol y la espironolactona genéricos son económicos con un cupón de descuento; compara precios de testosterona.
  sources: [sc-44-42, h4624, aclu-misanin, ppsat-virtual, ppsat-columbia, pop-hrt, qm-locations, hrsa]
minor_care:
  status: prohibited
  detail:
    en: |
      **Banned since May 21, 2024** (Act 203, H 4624; S.C. Code §§ 44-42-310 to -360). Physicians, mental health providers, and other health care professionals may not provide puberty blockers, cross-sex hormones, or gender reassignment surgery to anyone under 18. Young people already on blockers or hormones before August 1, 2024 could be tapered off only until **January 31, 2025**; that window has closed.

      **Exceptions**: care for precocious puberty, certain cancers, endometriosis, differences of sex development, complications of earlier transition care, and emergencies. **Mental health care remains legal.**

      **Penalties**: licensing board discipline; lawsuits by the patient until 21 years after turning 18, with attorney's fees; enforcement by the Attorney General; and a physician who performs genital surgery on a minor is guilty of inflicting great bodily injury on a child.

      **Schools**: public school staff may not withhold from parents that a student's gender identity differs from their sex, and the principal, vice principal, or counselor must notify parents in writing if a student says so or asks to be called by a different pronoun (§ 59-32-36).

      The ban is **in effect**. It is challenged in Misanin v. Wilson (federal court, filed August 2024), but no court has blocked it, and the US Supreme Court upheld Tennessee's similar ban in June 2025. Families can get navigation help and travel grants for out-of-state care from the Campaign for Southern Equality's Trans Youth Emergency Project.
    es: |
      **Prohibida desde el 21 de mayo de 2024** (Ley 203, H 4624; Código de Carolina del Sur §§ 44-42-310 a -360). Los médicos, proveedores de salud mental y otros profesionales no pueden dar bloqueadores de pubertad, hormonas ni cirugía de reasignación a menores de 18 años. Quienes ya recibían bloqueadores u hormonas antes del 1 de agosto de 2024 solo podían reducirlos gradualmente hasta el **31 de enero de 2025**; ese plazo terminó.

      **Excepciones**: pubertad precoz, ciertos cánceres, endometriosis, diferencias del desarrollo sexual, complicaciones de atención previa y emergencias. **La atención de salud mental sigue siendo legal.**

      **Sanciones**: disciplina de la junta de licencias; demandas del paciente hasta 21 años después de cumplir 18, con honorarios de abogados; acción del Fiscal General; y un médico que haga cirugía genital a un menor comete lesiones corporales graves a un menor.

      **Escuelas**: el personal de escuelas públicas no puede ocultar a los padres que la identidad de género de un estudiante difiere de su sexo, y el director, subdirector o consejero debe notificar por escrito a los padres si el estudiante lo dice o pide otro pronombre (§ 59-32-36).

      La prohibición está **vigente**. Se impugna en Misanin v. Wilson (tribunal federal, agosto de 2024), pero ningún tribunal la ha bloqueado, y la Corte Suprema confirmó en junio de 2025 una prohibición similar de Tennessee. Las familias pueden recibir ayuda y becas de viaje para atención fuera del estado del Trans Youth Emergency Project.
  sources: [sc-44-42, h4624, aclu-misanin, skrmetti, tyep]
medicaid:
  program_name: Healthy Connections Medicaid
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: |
      Section 44-42-340 bars public funds for gender transition procedures at any age, and § 44-42-350 bars Medicaid from covering practices the chapter prohibits. The ACLU reports Medicaid patients lost care after the law passed. Medicaid still covers other health care, including primary care, labs, mental health, and PrEP.

      **Who qualifies**: South Carolina has not expanded Medicaid. Adults generally qualify only if they are 65+, blind, or disabled (about 100% of the poverty level, $1,330 a month for one person as of March 2026), pregnant, or a low-income parent or caretaker. If you are unsure, apply anyway; Healthcare.gov forwards eligible applications to SCDHHS. SC Thrive helps with applications for free.
    es: |
      La sección 44-42-340 prohíbe fondos públicos para procedimientos de transición a cualquier edad, y la § 44-42-350 prohíbe que Medicaid cubra lo que el capítulo prohíbe. Medicaid sigue cubriendo otra atención, como atención primaria, laboratorios, salud mental y PrEP.

      **Quién califica**: Carolina del Sur no ha expandido Medicaid. Los adultos generalmente califican solo si tienen 65 años o más, son ciegos o tienen discapacidad (alrededor del 100% del nivel de pobreza, $1,330 al mes para una persona desde marzo de 2026), están embarazadas o son padres o cuidadores de bajos ingresos. Si no estás seguro, solicita de todas formas. SC Thrive ayuda gratis con la solicitud.
  how_to_apply_url: https://www.scdhhs.gov/members/program-eligibility-and-income-limits
  sources: [sc-44-42, aclu-misanin, scdhhs-elig, scthrive]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      South Carolina has no law stopping private insurers from excluding gender-affirming care. Private plans are not bound by the public-funds ban, but may exclude transition care; read your policy's exclusions. If a claim is denied, appeal with the insurer first (A4TE's Trans Health Project has free templates), then file a complaint with the SC Department of Insurance.
    es: |
      Carolina del Sur no tiene una ley que impida a los seguros privados excluir la atención de afirmación de género. Los planes privados no están sujetos a la prohibición de fondos públicos, pero pueden excluir la transición; revisa las exclusiones de tu póliza. Si niegan un reclamo, apela primero con la aseguradora (el Trans Health Project de A4TE tiene plantillas gratis) y luego presenta una queja ante el Departamento de Seguros.
  complaint_url: https://doi.sc.gov/8/Consumers
  sources: [map-sc, doi-consumers, a4te-thp]
