  notes: >-
    Climate ratings based on S.C. Code 15-49 (name change with mandatory background checks), the DPH birth certificate
    page (sex change only by court order), the undocumented SCDMV marker policy (court order or amended birth
    certificate per A4TE and the Harriet Hancock Center), and Act 203 of 2024 (H 4624). No shield law. See each guide's
    review notes for open items.
overview:
  en: >-
    South Carolina lets trans people change their name and their M or F sex marker, but only through the family court:
    a name change petition requires SLED fingerprinting and child-abuse and sex offender registry checks, and the
    birth certificate and driver's license need a court order for the sex marker. There is no X option. Adults can
    still get hormone therapy, but a 2024 law bans public funds (including Medicaid and the state employee plan) for
    transition care at any age and bans it entirely for minors. There is no shield law.
  es: >-
    Carolina del Sur permite a las personas trans cambiar su nombre y su marcador de sexo M o F, pero solo mediante el
    tribunal de familia: la petición de cambio de nombre exige huellas de SLED y verificaciones de registros de abuso
    infantil y de delincuentes sexuales, y el acta de nacimiento y la licencia necesitan una orden judicial para el
    marcador. No hay opción X. Los adultos todavía pueden obtener terapia hormonal, pero una ley de 2024 prohíbe fondos
    públicos (incluidos Medicaid y el plan de empleados estatales) para la transición a cualquier edad y la prohíbe por
    completo para menores. No hay ley escudo.
