  es: Condados de Charleston, Berkeley y Dorchester (área de tres condados del Lowcountry)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    Short starter list. Charleston County Family Court's own page was not checked; the $150 fee is the statewide
    family court fee. AFFA's programs page did not render in our text extraction, so its description is general. MUSC
    (Medical University of South Carolina) is not listed: per the ACLU, MUSC canceled transition-related appointments
    after the 2024 law, and we did not confirm any current adult services. Reviewer: confirm Charleston County Family
    Court address and whether any local legal clinic helps with name changes.
intro:
  en: >-
    The Charleston area has a Planned Parenthood health center offering gender-affirming care, an HIV and PrEP provider
    with LGBTQ+ inclusive care, and two long-standing LGBTQ organizations. Name change petitions are filed with the
    family court in the county where you live; the Columbia-based Harriet Hancock Center's legal program helps
    residents statewide.
  es: >-
    El área de Charleston tiene un centro de Planned Parenthood con atención de afirmación de género, un proveedor de
    VIH y PrEP con atención inclusiva LGBTQ+ y dos organizaciones LGBTQ establecidas. Las peticiones de cambio de nombre
    se presentan en el tribunal de familia de tu condado; el programa legal del Harriet Hancock Center en Columbia ayuda
    a residentes de todo el estado.
court:
  name: Family court of your county (Charleston, Berkeley, or Dorchester)
  url: https://www.sccourts.org/courts/trial-courts/family-court/court-fees/
