  notes:
    en: The $150 name change filing fee is the same statewide. Check your county clerk of court for the filing address.
    es: La tarifa de $150 es igual en todo el estado. Consulta al secretario del tribunal de tu condado la dirección.
  sources: [sccourts-fees]
