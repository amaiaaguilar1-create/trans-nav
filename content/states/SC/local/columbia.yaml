name: Columbia
area:
  en: Richland and Lexington counties (the Midlands)
  es: Condados de Richland y Lexington (los Midlands)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Resources read on each org's site or on the Harriet Hancock Center resource guide 2026-09-24. Richland County's
    website blocked automated access except for its Family Court page. Lexington County Family Court was not checked.
    Reviewer: confirm current HHC fingerprint clinic schedule and Transfusion meeting night, and whether CAN Community
    Health or any Midlands FQHC prescribes hormones (not stated on their pages). Prisma Health (the main Columbia
    health system) was not listed because we could not confirm adult gender-affirming services on its site.
intro:
  en: >-
    Columbia is home to the Harriet Hancock Center, which runs the state's main free legal program for name and gender
    marker changes, including a monthly free fingerprinting clinic. Petitions for Richland County residents are filed
    at the Richland County Family Court downtown. For hormones, Planned Parenthood's Columbia health center and
    telehealth are the main low-barrier options.
  es: >-
    Columbia alberga el Harriet Hancock Center, que ofrece el principal programa legal gratuito del estado para cambios
    de nombre y marcador de género, incluida una clínica mensual gratuita de huellas. Los residentes del condado de
    Richland presentan sus peticiones en el Tribunal de Familia del condado en el centro. Para hormonas, el centro de
    Planned Parenthood en Columbia y la telesalud son las principales opciones accesibles.
court:
  name: Richland County Family Court (Fifth Judicial Circuit)
  url: https://www.richlandcountysc.gov/Courts-Safety/Family-Court
  filing_fee: 150
  notes:
    en: 1701 Main St., 1st Floor West Wing, Columbia, SC 29201; mailing address P.O. Box 192, Columbia, SC 29202; 803-576-3320. The court does not give legal advice. Lexington County residents file with Lexington County Family Court instead.
    es: 1701 Main St., primer piso, ala oeste, Columbia, SC 29201; correo P.O. Box 192, Columbia, SC 29202; 803-576-3320. El tribunal no da asesoría legal. Los residentes del condado de Lexington presentan en el Tribunal de Familia de Lexington.
  sources: [richland-fc]
