      en: Statewide civil legal aid for low-income Nebraskans. Publishes a step-by-step name change guide and form links; apply online or through its AccessLine phone intake (no walk-ins).
      es: Asistencia legal civil gratuita en todo el estado para personas de bajos ingresos. Publica una guía paso a paso de cambio de nombre; solicita en línea o por su línea telefónica AccessLine.
    url: https://legalaidofnebraska.org/online-resources/name-change-resources.html
    phone: "402-348-1069"
    areas_served:
