statutes:
  - cite: Neb. Rev. Stat. § 25-21,270
    title:
      en: District court authority to change names
    url: https://nebraskalegislature.gov/laws/statutes.php?statute=25-21,270
  - cite: Neb. Rev. Stat. § 25-21,271
    title:
