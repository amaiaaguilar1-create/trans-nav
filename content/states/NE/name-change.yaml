      en: Civil liberties organization that tracks LGBTQ rights in Nebraska. Use its online form to report discrimination or request legal help; it takes cases selectively.
      es: Organización de libertades civiles que sigue los derechos LGBTQ en Nebraska. Usa su formulario en línea para reportar discriminación o pedir ayuda legal.
    url: https://www.aclunebraska.org/get-help/
    cost: free
