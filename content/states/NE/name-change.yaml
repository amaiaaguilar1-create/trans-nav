      es: Línea de apoyo entre pares dirigida por y para personas trans, 877-565-8860. Ha ofrecido microsubvenciones para costos de cambio de nombre y documentos cuando hay fondos.
    url: https://translifeline.org/
    phone: "877-565-8860"
    cost: free
