name: Omaha
area:
  en: Douglas and Sarpy counties and the Omaha-Council Bluffs metro
  es: Condados de Douglas y Sarpy y el área metropolitana de Omaha-Council Bluffs
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details from the Nebraska Judicial Branch's Douglas District Court page (fetched 2026-09-24). Douglas County's
    own website returned 403 to automated fetches. Heartland Pride's website did not respond, Trans Collaborations'
    site shows "under construction," and OutNebraska's site is behind a captcha, so none of them could be verified; only
    OutNebraska is listed (as community_reported). Douglas County Health Department's STI clinic site returned 403 and
    is not listed. Reviewer: add a local trans peer-support group and confirm whether Douglas County district court
    has a self-help desk.
intro:
  en: >-
    Omaha is Nebraska's largest metro and has the state's main academic gender clinic (Nebraska Medicine / UNMC),
    a Planned Parenthood health center, sliding-scale community health centers, and the headquarters of the state's
    HIV service organization. Name change petitions for Douglas County residents are filed with the Douglas County
    District Court at the Hall of Justice downtown.
  es: >-
    Omaha es el área metropolitana más grande de Nebraska y cuenta con la principal clínica de género académica del
    estado (Nebraska Medicine / UNMC), un centro de Planned Parenthood, centros de salud comunitarios con escala
    móvil y la sede de la organización estatal de VIH. Las peticiones de cambio de nombre de residentes del condado de
    Douglas se presentan en el Tribunal de Distrito del condado de Douglas, en el Hall of Justice del centro.
court:
  name: Douglas County District Court (Fourth Judicial District), Hall of Justice
  url: https://nebraskajudicial.gov/courts/douglas-district-court
  self_help_url: https://nebraskajudicial.gov/self-help/name-change/adult-name-change
  filing_fee: 144
  notes:
    en: 1701 Farnam Street, Omaha, NE 68183. Clerk of the District Court phone 402-444-7018. Sarpy County residents file at the Sarpy County District Court in Papillion. The $144 figure is the statewide civil filing fee; confirm with the clerk. Newspaper publication in Douglas County is extra unless the judge waives it.
    es: 1701 Farnam Street, Omaha, NE 68183. Teléfono de la secretaría 402-444-7018. Los residentes del condado de Sarpy presentan en Papillion. Los $144 son la tarifa civil estatal; confírmala con la secretaría.
  sources: [douglas-dc, court-fees]
