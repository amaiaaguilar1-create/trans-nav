review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate: id_documents "mixed" because license markers can change with a provider form (M/F only) but birth
    certificates require surgery plus a court-ordered name change; care "restrictive" because of the Let Them Grow Act
    (under-19 surgery ban, tight rules on hormones and blockers, state-funds ban) and no insurance protections or shield
    law, though adult care is unrestricted. Governor's EO 23-16 (2023) defines sex as sex at birth for agencies "to the
    fullest extent permitted by law"; MAP counts Nebraska as having a sex-definition policy. LB 89 (2025) is a
    sports-only law. No 2026 law affecting ID documents or care was found; the only 2026 change found is LB 596, which
    shortened name change publication to two weeks. OutNebraska's website is behind a captcha and could not be read.
overview:
  en: >-
    Nebraska allows adult name changes through district court (one year of county residence, a hearing, and two weeks
    of newspaper publication unless waived for safety). The sex on a driver's license or ID can be changed to M or F
    with a form signed by a medical provider, but a birth certificate change requires proof of surgery and a court-
    ordered name change. Adults (19+) can get gender-affirming care without state restrictions; for people under 19,
    surgery is banned and hormones are tightly limited by the Let Them Grow Act. There is no shield law.
  es: >-
    Nebraska permite cambios de nombre de adultos en el tribunal de distrito (un año de residencia en el condado,
    audiencia y dos semanas de publicación en periódico salvo exención por seguridad). El sexo en la licencia o
    identificación puede cambiarse a M o F con un formulario firmado por un proveedor médico, pero el cambio en el acta
    de nacimiento exige prueba de cirugía y una orden judicial de cambio de nombre. Los adultos (19+) pueden recibir
    atención de afirmación de género sin restricciones estatales; para menores de 19, la cirugía está prohibida y las
    hormonas están muy limitadas por la Ley Let Them Grow. No hay ley escudo.
