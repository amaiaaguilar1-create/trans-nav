fee_waiver:
  available: false
  sources: [dhhs-vr]
delivery:
  online: false
  by_mail: true
  in_person: false
  detail:
    en: Amendments are sent by mail. Call Vital Records to ask whether you can drop off an amendment in person at the Lincoln office.
    es: Las enmiendas se envían por correo. Llama a Vital Records para preguntar si puedes entregarla en persona en Lincoln.
  sources: [hhs-81, dhhs-vr]
timeline:
  en: DHHS does not publish a processing time for amendments. Call Vital Records for the current wait.
  es: El DHHS no publica un plazo para enmiendas. Llama a Vital Records para saber la espera actual.
after:
  en: Use the new certificate to update other records if needed. The DMV does not require an amended birth certificate to change your license marker; it uses its own provider form.
  es: Usa la nueva acta para actualizar otros registros si hace falta. El DMV no exige un acta enmendada para cambiar el marcador de la licencia; usa su propio formulario médico.
tips:
  - en: The free birth-certificate copy "for voting purposes" does not apply to amendments.
    es: La copia gratuita del acta "para votar" no aplica a las enmiendas.
  - en: If you were born in another state, that state's rules apply, even if you live in Nebraska. Some states allow changes without surgery.
    es: Si naciste en otro estado, se aplican las reglas de ese estado, aunque vivas en Nebraska. Algunos estados permiten cambios sin cirugía.
