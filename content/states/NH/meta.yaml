  notes: >-
    Climate ratings are based on statutes read on gc.nh.gov (RSA 263:5 and 260:21 for the X marker; RSA 5-C:87 for
    birth certificates; RSA 332-M, 332-N and 329:53 for minors' care) and cross-checked against the Movement
    Advancement Project maps on 2026-09-24. MAP lists no shield law for New Hampshire. Reviewer: confirm no shield
    law passed in the 2026 session.
overview:
  en: >-
    New Hampshire is mixed. Adults can change their name with a simple court petition (no newspaper publication in
    practice), and driver's licenses offer M, F, or X by self-attestation. Birth certificate sex changes still require
    a court order, and the process is left to judges. Since January 1, 2026, state law bans puberty blockers, hormones,
    and gender surgery for new patients under 18; care for adults is legal, and NH Medicaid and state-regulated
    insurance cover it. There is no shield law.
  es: >-
    Nuevo Hampshire es mixto. Los adultos pueden cambiar su nombre con una petición judicial sencilla (en la práctica
    sin publicación en periódico) y las licencias de conducir ofrecen M, F o X por declaración propia. El cambio de sexo
    en el acta de nacimiento todavía requiere una orden judicial y el proceso queda a criterio de los jueces. Desde el
    1 de enero de 2026, la ley estatal prohíbe bloqueadores de pubertad, hormonas y cirugía de género para pacientes
    nuevos menores de 18 años; la atención para adultos es legal y Medicaid de NH y los seguros regulados por el estado
    la cubren. No hay ley escudo.
