jurisdiction: NH
slug: manchester
name: Manchester
area:
  en: Manchester and greater Hillsborough County, with statewide and nearby Concord resources
  es: Manchester y el condado de Hillsborough, con recursos estatales y de Concord cercanos
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    courts.nh.gov blocked automated access (HTTP 403). Name change filing is electronic for all Probate Division
    locations, so Manchester residents file with the 9th Circuit Court, Probate Division (Hillsborough County) online.
    Reviewer: confirm the physical Probate Division location that serves Manchester residents (believed to be Nashua)
    and the current filing fee (A4TE reports $170). Manchester Health Department STD/HIV clinic details ($25 cash, hours,
    1528 Elm Street) were read on manchesternh.gov 2026-09-24. PPNNE Manchester address and services read on
    plannedparenthood.org. Amoskeag Health does not describe gender-affirming care on its site.
intro:
  en: >-
    Manchester is New Hampshire's largest city. File a name change online with the Circuit Court, Probate Division, for
    Hillsborough County. For hormone therapy, Planned Parenthood's Manchester health center and Equality Health Center
    in Concord (about 20 miles north) are the main informed-consent options; Amoskeag Health offers sliding-scale primary
    care, and the city health department runs a low-cost STI and HIV testing clinic.
  es: >-
    Manchester es la ciudad más grande de Nuevo Hampshire. Presenta el cambio de nombre en línea ante el Tribunal de
    Circuito, División de Sucesiones, del condado de Hillsborough. Para terapia hormonal, el centro de Planned
    Parenthood en Manchester y Equality Health Center en Concord (a unas 20 millas al norte) son las principales
    opciones; Amoskeag Health ofrece atención primaria en escala móvil y el departamento de salud de la ciudad tiene una
    clínica de pruebas de ITS y VIH de bajo costo.
court:
  name: 9th Circuit Court, Probate Division (Hillsborough County)
  url: https://www.courts.nh.gov/self-help/name-changes
  self_help_url: https://www.courts.nh.gov/self-help/name-changes
  notes:
    en: Name change petitions must be e-filed (TurboCourt for self-represented people). Choose the Hillsborough County Probate Division when you start the case. Courthouse kiosks can help if you have no computer.
    es: Las peticiones de cambio de nombre se presentan electrónicamente (TurboCourt para personas sin abogado). Elige la División de Sucesiones del condado de Hillsborough al iniciar el caso.
  sources: [courts-selfhelp]
