status_summary:
  en: >-
    Gender-affirming care is legal for adults in New Hampshire, and NH Medicaid and state-regulated private insurance
    cover it. Since January 1, 2026, state law bars providers from starting puberty blockers or hormones for anyone
    under 18 and bars gender surgery for minors; young people who began treatment before 2026 may continue. There is no
    shield law.
  es: >-
    La atención de afirmación de género es legal para adultos en Nuevo Hampshire, y Medicaid de NH y los seguros
    privados regulados por el estado la cubren. Desde el 1 de enero de 2026, la ley prohíbe a los proveedores iniciar
    bloqueadores de pubertad u hormonas para menores de 18 años y prohíbe la cirugía de género en menores; quienes
    empezaron el tratamiento antes de 2026 pueden continuar. No hay ley escudo.
adult_care:
  status: available
  detail:
    en: |
      No state restriction on care for adults 18 and older. Equality Health Center in Concord and Planned Parenthood of Northern New England (Derry, Exeter, Keene, Manchester) offer gender-affirming hormone therapy, and telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **NH Medicaid** (adults up to about 138% of the federal poverty level qualify through Granite Advantage). It covers hormones and related care.
      2. Go to a **community health center** (FQHC) such as Amoskeag Health in Manchester; they charge on a sliding scale. Find one at findahealthcenter.hrsa.gov.
      3. **Equality Health Center** and **Planned Parenthood** offer financial assistance or sliding fees for uninsured patients.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for a year or more (applications open once a year).
    es: |
      No hay restricciones estatales para adultos de 18 años o más. Equality Health Center en Concord y Planned Parenthood of Northern New England (Derry, Exeter, Keene, Manchester) ofrecen terapia hormonal de afirmación de género, y la telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medicaid de NH** (los adultos hasta aproximadamente el 138% del nivel federal de pobreza califican a través de Granite Advantage). Cubre hormonas y atención relacionada.
      2. Acude a un **centro de salud comunitario** como Amoskeag Health en Manchester; cobran en escala móvil.
      3. **Equality Health Center** y **Planned Parenthood** ofrecen ayuda financiera o tarifas reducidas para personas sin seguro.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud.
  sources: [ehc, ppnne-services, hrsa, map-medicaid]
minor_care:
  status: prohibited
  detail:
    en: |
      **Hormones and puberty blockers**: RSA 332-N:2 (HB 377), effective January 1, 2026, bars any person from giving a minor under 18 puberty blockers, cross-sex hormones, or other medical procedures to affirm a gender that differs from the minor's sex at birth. Exceptions: minors with a medically verifiable disorder of sex development, and **treatment that began before January 1, 2026**, which may continue. Violations lead to discipline by the Board of Medicine (no criminal penalty), and the minor may sue for damages until two years after turning 18; the attorney general may also sue.

      **Surgery**: RSA 332-M (2024, expanded by HB 712 effective January 1, 2026) bars genital surgery, chest surgery, facial surgery, and removal of reproductive organs for gender purposes on minors. RSA 329:53 separately bars "transgender chest surgery" under 18.

      Counseling, social support, and non-medical care are not banned. Dartmouth Health says established minor patients may continue hormones already prescribed, with parental approval. New Hampshire has no shield law; families seeking to start care may look to neighboring states such as Maine, Vermont, and Massachusetts.
    es: |
      **Hormonas y bloqueadores**: RSA 332-N:2 (HB 377), vigente desde el 1 de enero de 2026, prohíbe dar a menores de 18 años bloqueadores de pubertad, hormonas u otros procedimientos médicos para afirmar un género distinto al sexo al nacer. Excepciones: menores con un trastorno del desarrollo sexual verificable y **tratamientos iniciados antes del 1 de enero de 2026**, que pueden continuar. Las infracciones conllevan sanción de la Junta de Medicina (no penal) y el menor puede demandar.

      **Cirugía**: RSA 332-M (2024, ampliada por HB 712 desde el 1 de enero de 2026) prohíbe cirugía genital, de pecho, facial y extirpación de órganos reproductivos por motivos de género en menores. RSA 329:53 prohíbe la cirugía de pecho trans en menores de 18.

      La consejería y el apoyo social no están prohibidos. Dartmouth Health indica que los pacientes menores ya establecidos pueden continuar las hormonas recetadas con aprobación de sus padres. Nuevo Hampshire no tiene ley escudo; las familias que buscan iniciar atención pueden considerar estados vecinos como Maine, Vermont y Massachusetts.
  sources: [rsa-332-n-2, rsa-332-n-3, rsa-332-m-3, rsa-329-53, glad-hb377, dartmouth-hb377]
medicaid:
  program_name: NH Medicaid (including Granite Advantage)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      New Hampshire's Medicaid policy explicitly includes transgender-related care, according to the Movement Advancement Project. Adults with income up to about 138% of the federal poverty level qualify through the Granite Advantage expansion program. For minors, Medicaid cannot pay for care that state law now prohibits.

      **Apply** online at NH EASY (nheasy.nh.gov), by phone through DHHS, or at a DHHS district office. If you are denied coverage for care, New Hampshire Legal Assistance can help with appeals.
    es: |
      La política de Medicaid de Nuevo Hampshire incluye explícitamente la atención trans, según el Movement Advancement Project. Los adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza califican a través del programa de expansión Granite Advantage.

      **Solicita** en línea en NH EASY (nheasy.nh.gov), por teléfono con DHHS o en una oficina de distrito. Si te niegan cobertura, New Hampshire Legal Assistance puede ayudar con apelaciones.
  how_to_apply_url: https://nheasy.nh.gov/
  sources: [map-medicaid, nheasy, nhla]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      New Hampshire prohibits state-regulated health insurers from excluding medically necessary care for transgender people and bans insurance discrimination based on gender identity. If your plan denies care, appeal with the plan first, then contact the New Hampshire Insurance Department's Consumer Services. Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates.
    es: |
      Nuevo Hampshire prohíbe a las aseguradoras reguladas por el estado excluir atención médicamente necesaria para personas trans y prohíbe la discriminación por identidad de género en seguros. Si tu plan niega la atención, apela primero con el plan y luego contacta a Servicios al Consumidor del Departamento de Seguros de Nuevo Hampshire.
  complaint_url: https://www.insurance.nh.gov/how-can-we-help-formal-insurance-complaints
  sources: [map-insurance, nhid-complaints]
