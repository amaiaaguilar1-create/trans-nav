  notes: >-
    Medicaid coverage from the DMAS bulletin "Coverage of gender dysphoria services" (effective December 10, 2021) and
    the Gender Dysphoria Supplement to the Physician/Practitioner manual (12.8.21 version, still linked from the DMAS
    manual library on 2026-09-24); MAP's Medicaid citations (January 2026) agree Virginia explicitly covers this care.
    Reviewer: confirm DMAS has not revised the supplement since, and track the CMS final rule on federal Medicaid/CHIP
