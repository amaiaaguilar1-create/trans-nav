status_summary:
  en: >-
    Gender-affirming care is legal in Virginia for adults and for minors with parental consent. Virginia Medicaid
    (Cardinal Care) covers hormones and many surgeries, and state-regulated private plans may not exclude trans care.
    Virginia has no shield law, and access for minors has shrunk: the Richmond children's hospital program closed in
    2025, and a new federal rule will bar federal Medicaid funding for youth care.
  es: >-
    La atención de afirmación de género es legal en Virginia para adultos y para menores con consentimiento de los
    padres. Medicaid de Virginia (Cardinal Care) cubre hormonas y muchas cirugías, y los planes privados regulados por el
    estado no pueden excluir la atención trans. Virginia no tiene ley escudo y el acceso para menores se ha reducido: el
    programa del hospital infantil de Richmond cerró en 2025 y una nueva regla federal prohibirá fondos federales de
    Medicaid para atención juvenil.
adult_care:
  status: available
  detail:
    en: |
      No state restriction on care for adults. Several community clinics prescribe hormones using an **informed consent** intake (you review risks and benefits and sign consent; no therapist letter needed), and telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **Cardinal Care (Medicaid)** at Cover Virginia. Adults qualify with income up to about 138% of the federal poverty level. It covers hormones, labs, and many surgeries.
      2. **Health Brigade** in Richmond serves trans patients who are uninsured or on Medicaid, after a financial screening.
      3. A **community health center** (find one at findahealthcenter.hrsa.gov) must see you on a sliding scale regardless of ability to pay.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care; **He She Ze and We's Trans Wellness Fund** helps Virginians bridge the cost of gender-affirming care.
    es: |
      Sin restricciones estatales para adultos. Varias clínicas comunitarias recetan hormonas con **consentimiento informado** (sin carta de terapeuta), y la telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Cardinal Care (Medicaid)** en Cover Virginia. Los adultos califican con ingresos hasta aproximadamente el 138% del nivel federal de pobreza. Cubre hormonas, laboratorios y muchas cirugías.
      2. **Health Brigade** en Richmond atiende a pacientes trans sin seguro o con Medicaid, tras una evaluación financiera.
      3. Un **centro de salud comunitario** (findahealthcenter.hrsa.gov) debe atenderte en escala móvil.
      4. El **Fondo de Acceso a TRH de Point of Pride** y el **Trans Wellness Fund de He She Ze and We** ayudan con los costos.
  sources: [health-brigade, hrsa, pop-hrt, hszw, coverva]
minor_care:
  status: available
  detail:
    en: |
      Legal. Virginia has no law banning gender-affirming care for minors (Movement Advancement Project, data as of September 2026). Care requires parental or guardian consent.

      Access is limited in practice. **Children's Hospital of Richmond at VCU stopped providing gender-affirming care to patients under 19 on July 29, 2025**, citing federal directives. A **federal CMS final rule** announced in August 2026 bars federal Medicaid and CHIP funding for gender-affirming care for people under 18 (Medicaid) or 19 (CHIP); it is expected to take effect in mid-October 2026. It does not ban care, but Medicaid-covered youth may lose coverage. Virginia has **no shield law** protecting patients or providers from other states' investigations.
    es: |
      Legal. Virginia no tiene ley que prohíba la atención de afirmación de género para menores. Requiere consentimiento de los padres o tutores.

      El acceso es limitado en la práctica. **El Children's Hospital of Richmond at VCU dejó de ofrecer esta atención a menores de 19 años el 29 de julio de 2025**. Una **regla final federal de CMS** anunciada en agosto de 2026 prohíbe fondos federales de Medicaid y CHIP para esta atención a menores de 18 (Medicaid) o 19 (CHIP); se espera que entre en vigor a mediados de octubre de 2026. No prohíbe la atención, pero la juventud con Medicaid puede perder cobertura. Virginia **no tiene ley escudo**.
  sources: [map-profile, chor, ev-cms-rule, map-shield]
medicaid:
  program_name: Cardinal Care (Virginia Medicaid and FAMIS)
  covers_hrt: "yes"
  covers_surgery: partial
  detail:
    en: |
      Since December 2021, DMAS has affirmed coverage of gender dysphoria services for fee-for-service and managed care members. Under the Gender Dysphoria Supplement:
      - **Hormones** (including puberty blockers) are covered with a gender dysphoria diagnosis. For adults, the diagnosis can come from a gender-informed hormone prescriber; minors need a licensed mental health provider's assessment and parental consent.
      - **Chest surgery** (mastectomy, chest contouring, breast augmentation) is covered at 18+ with one mental health professional's support; augmentation requires 12 months of hormones unless contraindicated.
      - **Genital surgeries** (hysterectomy, phalloplasty, metoidioplasty, vaginoplasty, orchiectomy, and others) are covered at 18+ with two mental health letters, 12 months of hormones, and 12 months living in your gender (with exceptions).
      - **Facial procedures** (tracheal shave, genioplasty, forehead contouring, facial hair removal), behavioral health, and speech therapy are covered.
      - **Not covered**: voice surgery, hair transplants, liposuction, gluteal augmentation, pectoral implants, fertility preservation, and other listed cosmetic procedures.

      Surgery needs prior authorization (form DMAS-P264 for fee-for-service; managed care plans use their own forms). The August 2026 federal CMS rule is expected to end federal funding for this care for members under 18 (under 19 in FAMIS/CHIP) starting in mid-October 2026.

      **Apply** at Cover Virginia (coverva.dmas.virginia.gov), by phone, or at your local Department of Social Services.
    es: |
      Desde diciembre de 2021, DMAS cubre servicios de disforia de género. Según el Suplemento de Disforia de Género:
      - **Hormonas** (incluidos bloqueadores de pubertad) cubiertas con diagnóstico. Menores necesitan evaluación de salud mental y consentimiento de los padres.
      - **Cirugía de pecho** cubierta desde los 18 años con apoyo de un profesional de salud mental.
      - **Cirugías genitales** cubiertas desde los 18 años con dos cartas de salud mental, 12 meses de hormonas y 12 meses viviendo en tu género (con excepciones).
      - **Procedimientos faciales**, salud conductual y terapia del habla cubiertos.
      - **No cubiertos**: cirugía de voz, trasplante de cabello, liposucción, aumento de glúteos, preservación de fertilidad y otros procedimientos cosméticos.

      La cirugía requiere autorización previa. La regla federal de CMS de agosto de 2026 eliminaría fondos federales para menores de 18 (19 en FAMIS) a partir de mediados de octubre de 2026. **Solicita** en Cover Virginia.
  how_to_apply_url: https://coverva.dmas.virginia.gov/
  sources: [dmas-bulletin, dmas-gd-supplement, map-medicaid, ev-cms-rule, coverva]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Va. Code § 38.2-3449.1 (2020) requires health carriers selling individual or group plans in Virginia to cover people without discrimination based on gender identity and bars them from denying or limiting sex-specific services because your sex assigned at birth or recorded gender differs. It defines medically necessary transition-related care to include therapy, continuous hormone therapy, related lab work, and gender reassignment surgeries.

      If your plan denies care, appeal with the plan first, then file a complaint with the State Corporation Commission's **Bureau of Insurance**. Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates. Individual plans are sold through **Virginia's Insurance Marketplace** (marketplace.virginia.gov).
    es: |
      El Código de Virginia § 38.2-3449.1 (2020) exige que las aseguradoras que venden planes individuales o grupales en Virginia no discriminen por identidad de género y no nieguen servicios por sexo asignado al nacer. Define la atención de transición médicamente necesaria para incluir terapia, hormonas, laboratorios y cirugías.

      Si tu plan niega la atención, apela primero ante el plan y luego presenta una queja ante el **Bureau of Insurance** de la State Corporation Commission. Los planes autofinanciados de empleadores se rigen por leyes federales. Los planes individuales se venden en **Virginia's Insurance Marketplace**.
  complaint_url: https://www.scc.virginia.gov/consumers/insurance/file-an-insurance-complaint/
  sources: [va-38-2-3449-1, scc-complaint, map-insurance]
