jurisdiction: VA
slug: northern-virginia
name: Northern Virginia
area:
  en: Arlington County, Fairfax County, the City of Alexandria, and nearby Northern Virginia localities (Prince William County, Falls Church, Fairfax City)
  es: Condado de Arlington, condado de Fairfax, ciudad de Alexandria y localidades cercanas del norte de Virginia
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details are Fairfax's (brochure and fee schedule revised July 2026). Arlington's court website returned 403 to
    automated access and Alexandria's name-change page was not found, so their fees and procedures are not described;
    each is a separate circuit court and residents must file there. Most clinic entries come from VDH's September 2026
    Transgender Resource and Referral List (self-reported; VDH does not vet) and are marked community_reported unless
    the org's own page was read. Verify new-patient availability, sliding-scale policies, and informed-consent practice
    for Inova Fair Oaks and Meadow before marking reviewed. No Planned Parenthood health center in Northern Virginia
    was confirmed.
intro:
  en: >-
    Northern Virginia has several trans-affirming primary care and hormone prescribers, free HIV/STI testing, and peer
    support groups, and many residents also use Whitman-Walker Health just across the river in DC for hormones and free
    name-change legal help. You file a name change in the circuit court of the county or city where you live: Fairfax,
    Arlington, and Alexandria each have their own court.
  es: >-
    El norte de Virginia tiene varios proveedores afirmativos de atención primaria y hormonas, pruebas gratuitas de
    VIH/ITS y grupos de apoyo, y muchas personas también usan Whitman-Walker Health en DC para hormonas y ayuda legal
    gratuita con el cambio de nombre. El cambio de nombre se presenta en el tribunal de circuito del condado o ciudad
    donde vives: Fairfax, Arlington y Alexandria tienen cada uno su propio tribunal.
court:
  name: Fairfax Circuit Court (Arlington and Alexandria residents file in their own circuit courts)
  url: https://www.fairfaxcounty.gov/circuit/civil-case-information/name-change
  self_help_url: https://www.vacourts.gov/forms/circuit/civil.html
  filing_fee: 44
  notes:
    en: >-
      Fairfax Circuit Court, 4110 Chain Bridge Road, Fairfax (civil intake, Suite 319, weekdays 8 am to 4 pm;
      703-691-7320). File in person or by mail; Fairfax publishes a fillable petition-and-order packet and does not
      accept personal checks. $44 filing fee; $2.50 per extra certified copy. Arlington County and City of Alexandria
      residents: use statewide form CC-1411 and ask your court clerk for the fee and proposed-order format.
    es: >-
      Tribunal de Circuito de Fairfax, 4110 Chain Bridge Road, Fairfax (ventanilla civil, Suite 319, de lunes a
      viernes de 8 am a 4 pm; 703-691-7320). Presenta en persona o por correo. Tarifa de $44; $2.50 por copia certificada
      adicional. Residentes de Arlington y Alexandria: usen el formulario CC-1411 y consulten al secretario de su
      tribunal.
  sources: [ffx-nc-page, ffx-brochure, ffx-fees, vacourts-civil-forms]
