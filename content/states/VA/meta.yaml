  en: Virginia
  es: Virginia
kind: state
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate: id_documents "protective" (no publication for name changes; self-attested M/F/X on licenses; birth
    certificate by provider form without surgery, but no X). Care marked "mixed" rather than "protective" because
    Virginia has private-insurance and Medicaid protections but no shield law, the main pediatric program closed in
    2025, and a federal Medicaid funding rule for youth care is expected mid-October 2026; reviewer may prefer
    "protective" since no state law restricts care.
overview:
  en: >-
    Virginia makes it fairly easy to update ID documents: name changes need no newspaper publication, driver's licenses
    offer M, F, or X with no medical proof, and a new birth certificate (male or female) needs only a form from a
    health care provider. Gender-affirming care is legal for all ages, and Medicaid and state-regulated insurance cover
    it, but Virginia has no shield law and care for minors has become harder to find. Federal documents (passport,
    Social Security) currently cannot change their sex field.
  es: >-
    Virginia facilita bastante actualizar documentos: los cambios de nombre no requieren publicación, las licencias
    ofrecen M, F o X sin prueba médica y una nueva acta de nacimiento (masculino o femenino) solo necesita un formulario
    de un proveedor de salud. La atención de afirmación de género es legal a toda edad y Medicaid y los seguros
    regulados por el estado la cubren, pero Virginia no tiene ley escudo y la atención para menores es más difícil de
    encontrar. Los documentos federales (pasaporte, Seguro Social) actualmente no permiten cambiar el sexo.
