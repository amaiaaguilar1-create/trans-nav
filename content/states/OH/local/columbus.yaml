jurisdiction: OH
slug: columbus
name: Columbus
area:
  en: Franklin County and the Columbus metro area (Delaware, Fairfield, Licking, and nearby counties)
  es: Condado de Franklin y el área metropolitana de Columbus (Delaware, Fairfield, Licking y condados cercanos)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Franklin County Probate Court details read through WebFetch 2026-09-24 (direct requests return 403). Equitas Health
    addresses from its locations page. Columbus Public Health's Sexual Health and Wellness Center is listed on the city's
    clinics page; the city site blocks direct fetching, and the clinic's street address was not confirmed (240 Parsons
    Ave is Columbus Public Health's main address). Stonewall Columbus's address not confirmed, so it is omitted.
    Kaleidoscope Youth Center address from its site.
intro:
  en: >-
    Columbus has Ohio's largest cluster of trans services: Equitas Health's informed-consent clinics and pharmacy,
    Equality Ohio's legal clinic, and a probate court that grants both name changes and birth record sex-marker
    corrections. Name change applications are e-filed with the Franklin County Probate Court.
  es: >-
    Columbus tiene la mayor concentración de servicios trans de Ohio: las clínicas de Equitas Health con consentimiento
    informado y farmacia, la clínica legal de Equality Ohio y un tribunal testamentario que concede cambios de nombre y
    correcciones del marcador de sexo en actas de nacimiento. Las solicitudes se presentan electrónicamente ante el
    Tribunal Testamentario del Condado de Franklin.
court:
  name: Franklin County Probate Court
  url: https://probate.franklincountyohio.gov/Departments/Name-Change
  self_help_url: https://probate.franklincountyohio.gov/Forms/Name-Change-Forms
  filing_fee: 128
  notes:
    en: >-
      373 South High Street, 22nd Floor, Columbus, OH 43215; (614) 525-5362. File through the court's e-filing system
      (confidential name changes must be filed on paper). Residency of 60 days required. Hearings are about 45 days
      after filing, by Zoom. Publication, when ordered, starts at $72. The same court handles birth record corrections
      ($70), including sex-marker corrections with affidavit PC-3.A.
    es: >-
      373 South High Street, piso 22, Columbus, OH 43215; (614) 525-5362. Presenta por el sistema electrónico (los
      cambios confidenciales se presentan en papel). Se requieren 60 días de residencia. Las audiencias son unos 45
      días después, por Zoom. El mismo tribunal tramita correcciones del acta de nacimiento ($70).
  sources: [franklin-nc, franklin-birth]
resources:
