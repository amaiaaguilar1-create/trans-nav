    name: Equality Ohio Legal Clinic
    type: legal_aid
    pillars: [name_change, gender_marker]
    description:
      en: Columbus-based statewide LGBTQ+ legal clinic. Free name change representation at or below 300% of the federal poverty level. 855-LGBT-LAW or (614) 224-0400.
      es: Clínica legal LGBTQ+ con sede en Columbus. Representación gratuita en cambios de nombre hasta el 300% del nivel federal de pobreza.
    url: https://equalityohio.org/legal-clinic/
    phone: "614-224-0400"
    cost: free
    verification: org_website
    sources: [equality-ohio-clinic]
