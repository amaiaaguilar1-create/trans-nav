  notes: >-
    Cuyahoga County Probate Court fees and birth-correction requirements read 2026-09-24 (costs page, name change page,
    COB page, and e-filing guide updated 9/29/25). The LGBT Community Center of Greater Cleveland and Circle Health
    Services sites blocked automated fetching (403 / empty page), so the Center is listed as unverified with no address,
    and Circle Health Services is left out. MetroHealth Pride Network details from its own page. Legal Aid Society of
    Cleveland contact details from its contact page. Reviewer: add verified informed-consent clinics (Circle Health
    Services, Cleveland Clinic or University Hospitals gender programs) and confirm the Center's services.
intro:
  en: >-
    In Cleveland, name changes and birth record corrections go through the Cuyahoga County Probate Court, one of the
    counties that grants sex-marker corrections. MetroHealth's Pride Network provides hormone therapy and surgery in the
    public hospital system, and TransOhio is based in the area.
  es: >-
    En Cleveland, los cambios de nombre y las correcciones del acta de nacimiento se tramitan en el Tribunal
    Testamentario del Condado de Cuyahoga, uno de los condados que concede correcciones del marcador de sexo. La Pride
    Network de MetroHealth ofrece terapia hormonal y cirugía, y TransOhio tiene su sede en la zona.
court:
  name: Cuyahoga County Probate Court
  url: https://probate.cuyahogacounty.gov/namechange.aspx
  self_help_url: https://probate.cuyahogacounty.gov/ncforms.aspx
  filing_fee: 100
  notes:
    en: >-
      Adult name change $100; certified copies of the judgment entry $2 per page (cash or money order). A birth
      certificate is required at filing (for people born outside Ohio, at the hearing). E-filing is available. For a
      birth record sex-marker correction, the court asks for an application (CCPC_HEA 2783), a certified Ohio birth
      record, and a licensed professional's statement.
    es: >-
      Cambio de nombre de adulto $100; copias certificadas $2 por página. Se requiere acta de nacimiento al presentar.
      Se acepta presentación electrónica. Para corregir el marcador de sexo, el tribunal pide una solicitud, el acta
      certificada y una declaración de un profesional con licencia.
  sources: [cuyahoga-nc, cuyahoga-costs, cuyahoga-cob-guide]
