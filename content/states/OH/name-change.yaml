sources:
  - id: orc-2717-02
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.02
    title: Ohio Revised Code § 2717.02, Application for change of name allowed
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: A person desiring to change the person's name may file an application in the probate court of the county in which the person resides.
  - id: orc-2717-03
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.03
    title: Ohio Revised Code § 2717.03, Contents of application for change of name
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: The applicant has been a bona fide resident of the county for at least sixty days prior to the filing of the application.
  - id: orc-2717-07
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.07
    title: Ohio Revised Code § 2717.07, Evidence of identity
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
  - id: orc-2717-08
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.08
    title: Ohio Revised Code § 2717.08, Hearing
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: The probate court may hold a hearing on an application. ... if the court requires a hearing, it shall set the manner, scope, and content of the hearing notice the applicant must serve.
  - id: orc-2717-09
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.09
    title: Ohio Revised Code § 2717.09, Court order
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: upon proof that the facts set forth in the application show reasonable and proper cause for changing the name of the applicant ... the court may order the change of name.
  - id: orc-2717-11
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.11
    title: Ohio Revised Code § 2717.11, Sealing records
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: open records of the name change or conformity, or publication of the hearing notice ... would jeopardize the applicant's personal safety
  - id: orc-2717-14
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.14
    title: Ohio Revised Code § 2717.14, Application on behalf of minor
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: the consent of both living, legal parents of the minor shall be filed, or notice of the hearing shall be given to the parent or parents not consenting by certified mail, return receipt requested.
  - id: orc-2717-16
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.16
    title: Ohio Revised Code § 2717.16, Change of name prohibited
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
  - id: orc-2717-19
    url: https://codes.ohio.gov/ohio-revised-code/section-2717.19
    title: Ohio Revised Code § 2717.19, Criminal records check
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: On receipt of an application, the probate court may order a criminal records check. Any fee required for the criminal records check shall be paid by the applicant.
  - id: orc-2323-311
    url: https://codes.ohio.gov/ohio-revised-code/section-2323.311
    title: Ohio Revised Code § 2323.311, Indigent litigants
    publisher: Ohio Legislative Service Commission
    kind: statute
    accessed: "2026-09-24"
    quote: gross income does not exceed one hundred eighty-seven and five-tenths per cent of the federal poverty guidelines
  - id: form-21-0
    url: https://www.supremecourt.ohio.gov/docs/LegalResources/Rules/superintendence/probate_forms/nameChange/21_0.pdf
    title: Form 21.0, Application for Change of Name of Adult (amended January 1, 2023)
    publisher: Supreme Court of Ohio
    kind: form
    accessed: "2026-09-24"
    quote: Applicant is an adult and has been a bona fide resident of ______ County, Ohio, for at least 60 days immediately prior to the filing of this application.
  - id: form-21-6a
    url: https://www.supremecourt.ohio.gov/docs/LegalResources/Rules/superintendence/probate_forms/nameChange/21_6A.pdf
    title: Form 21.6A, Application to Waive Publication and Seal File and Judgment Entry
    publisher: Supreme Court of Ohio
    kind: form
    accessed: "2026-09-24"
    quote: The record of these proceedings shall be opened only by Order of the Court for good cause shown or at the request of the applicant for any reason.
  - id: form-21-14
    url: https://www.supremecourt.ohio.gov/docs/LegalResources/Rules/superintendence/probate_forms/nameChange/21_14.pdf
    title: Form 21.14, Release for Criminal Background Check
    publisher: Supreme Court of Ohio
    kind: form
    accessed: "2026-09-24"
  - id: sco-probate-forms
    url: https://www.supremecourt.ohio.gov/forms/all-forms/probate/5
    title: Probate forms (Change of Name, forms 21.0 to 21.14)
    publisher: Supreme Court of Ohio
    kind: official
    accessed: "2026-09-24"
