    name: Equitas Health, gender-affirming legal resources
    type: name_change_clinic
    pillars: [name_change, gender_marker]
    description:
      en: Lists current name and gender marker clinics (Equality Ohio, TransOhio, Legal Aid of Southeast and Central Ohio) and a do-it-yourself Ohio guide. Clinic waits can be several weeks.
      es: Enumera clínicas de nombre y marcador de género y una guía para hacerlo por tu cuenta. La espera puede ser de varias semanas.
    url: https://equitashealth.com/our-services/gender-affirming-care/legal-clinics/
