      en: Free, confidential virtual consultations with pro bono attorneys on the second Wednesday of each month. Register at least 48 hours ahead. Separate microgrant application for filing fees. Email legalclinics@transohio.org.
      es: Consultas virtuales gratuitas y confidenciales con abogados voluntarios el segundo miércoles de cada mes. Inscríbete al menos 48 horas antes. Microsubvenciones aparte para tarifas.
    url: https://www.transohio.org/legalclinic
    cost: free
    telehealth: true
    verification: org_website
    sources: [transohio-clinic]
