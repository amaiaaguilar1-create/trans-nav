    verification: org_website
    sources: [equality-ohio-clinic]
  - id: transohio
    name: TransOhio
    type: advocacy_org
    pillars: [name_change, gender_marker, mental_health]
    description:
      en: >-
        Trans-led statewide nonprofit. Runs the free virtual Ohio Name Change Legal Clinic (second Wednesday of each
        month), name change microgrants for court fees, an emergency fund for trans people who need to relocate or
        reach care, and support groups.
      es: >-
