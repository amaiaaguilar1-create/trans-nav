  notes: >-
    Climate set to restrictive for both documents and care. ID documents: since August 2026 the BMV no longer accepts
    Form 2369 and requires an amended birth certificate (news reports quoting the BMV; the BMV site has no page on the
    change), and Ohio birth certificate sex-marker corrections depend on the county probate court after the Ohio
    Supreme Court's 2024 split decision in In re Adelaide. Name changes remain available. Care: HB 68 (ORC Chapter 3129)
    bans hormones, puberty blockers, and surgery for minors and is in effect while the Ohio Supreme Court hears Moe v.
    Yost. Reviewer: check whether the Ohio Supreme Court has ruled in Moe v. Yost (the ACLU page describes the case as
    pending but gives no 2026 dates). Ohio state agency sites (medicaid.ohio.gov, insurance.ohio.gov, benefits.ohio.gov)
    returned errors to automated fetching on 2026-09-24.
overview:
  en: >-
    Ohio is a restrictive state for trans people, though a legal name change is still widely available through county
    probate courts. Since August 2026 the BMV changes the sex on a driver's license or ID only if you show an amended
    birth certificate. Birth certificate corrections need a probate court order, and only some counties grant them.
    A 2025 law (ORC 9.05) declares that the state recognizes only two unchangeable sexes. Ohio's HB 68 bans hormones and
    surgery for people under 18 while a court challenge continues. Adults can still get hormone therapy, but Medicaid
    excludes surgery.
  es: >-
    Ohio es un estado restrictivo para las personas trans, aunque el cambio legal de nombre sigue disponible en los
    tribunales testamentarios (probate) de los condados. Desde agosto de 2026 el BMV cambia el sexo en la licencia o
    identificación solo si presentas un acta de nacimiento enmendada. Las correcciones del acta requieren una orden
    judicial y solo algunos condados las conceden. Una ley de 2025 (ORC 9.05) declara que el estado reconoce solo dos
    sexos inmutables. La ley HB 68 prohíbe hormonas y cirugía para menores de 18 años mientras sigue una demanda. Los
    adultos aún pueden recibir terapia hormonal, pero Medicaid excluye la cirugía.
