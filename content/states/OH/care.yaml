litigation:
  - case: Moe v. Yost
    court: Supreme Court of Ohio (on appeal from the Tenth District Court of Appeals)
    summary:
      en: >-
        Families and physicians challenged HB 68's ban on care for minors under the Ohio Constitution. The Franklin
        County trial court upheld the ban in August 2024; the Tenth District reversed in March 2025; the Ohio Supreme
        Court stayed that ruling on April 29, 2025 and is hearing the state's appeal.
      es: >-
        Familias y médicos impugnaron la prohibición de HB 68 bajo la Constitución de Ohio. El tribunal de Franklin la
        confirmó en agosto de 2024; el Décimo Distrito la anuló en marzo de 2025; la Corte Suprema de Ohio suspendió
        ese fallo el 29 de abril de 2025 y está decidiendo la apelación.
    effect_today:
      en: The ban is in effect. Ohio physicians may not start hormones or puberty blockers for anyone under 18.
      es: La prohibición está vigente. Los médicos de Ohio no pueden iniciar hormonas ni bloqueadores para menores de 18 años.
    last_update: "2025-12-09"
    url: https://www.aclu.org/cases/moe-v-yost
    sources: [aclu-moe]
