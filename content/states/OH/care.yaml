status_summary:
  en: >-
    Adults in Ohio can get hormone therapy, including on an informed-consent basis at Equitas Health and Planned
    Parenthood. Ohio Medicaid excludes gender-affirming surgery, and state law gives no insurance protection. HB 68 bans
    hormones, puberty blockers, and surgery for anyone under 18; the ban is in effect while the Ohio Supreme Court
    hears an appeal.
  es: >-
    Los adultos en Ohio pueden recibir terapia hormonal, incluso por consentimiento informado en Equitas Health y
    Planned Parenthood. Medicaid de Ohio excluye la cirugía de afirmación de género y la ley estatal no protege la
    cobertura de seguros. La ley HB 68 prohíbe hormonas, bloqueadores de pubertad y cirugía para menores de 18 años;
    la prohibición está vigente mientras la Corte Suprema de Ohio decide una apelación.
adult_care:
  status: available
  detail:
    en: |
      No Ohio law bans gender-affirming care for adults. Equitas Health (Columbus, Cincinnati, Dayton, Akron, and telehealth) and Planned Parenthood of Greater Ohio prescribe hormones on an **informed consent** basis, which means you do not need a therapist's letter.

      **If you have no insurance and little money**:
      1. Apply for **Ohio Medicaid** (adults up to about 138% of the federal poverty level). Surgery is excluded; ask your plan or clinic whether hormones and labs are covered.
      2. Go to a **community health center** (Equitas Health or another FQHC). They charge on a sliding scale.
      3. **Telehealth**: Plume, FOLX, and Planned Parenthood serve Ohio.
      4. **Point of Pride** and **GenderBands** give grants for hormones and surgery.

      Ohio law (ORC 9.05, 2025) defines sex as fixed at birth. It does not ban adult care, but it has been used to change state agency rules, such as the BMV's August 2026 policy.
    es: |
      Ninguna ley de Ohio prohíbe la atención de afirmación de género para adultos. Equitas Health (Columbus, Cincinnati, Dayton, Akron y telesalud) y Planned Parenthood of Greater Ohio recetan hormonas por **consentimiento informado**, sin carta de terapeuta.

      **Si no tienes seguro ni mucho dinero**:
      1. Solicita **Medicaid de Ohio** (adultos hasta aproximadamente el 138% del nivel federal de pobreza). La cirugía está excluida; pregunta si cubren hormonas y análisis.
      2. Acude a un **centro de salud comunitario** con escala móvil.
      3. **Telesalud**: Plume, FOLX y Planned Parenthood atienden en Ohio.
      4. **Point of Pride** y **GenderBands** dan becas para hormonas y cirugía.

      La ley de Ohio (ORC 9.05, 2025) define el sexo como fijo al nacer. No prohíbe la atención para adultos, pero se ha usado para cambiar reglas de agencias estatales.
  sources: [equitas-gac, ppgoh-services, orc-9-05, hrsa]
minor_care:
  status: prohibited
  detail:
    en: |
      **HB 68** (ORC Chapter 3129, effective April 24, 2024, enacted over Governor DeWine's veto) bars physicians from providing gender reassignment surgery, cross-sex hormones, or puberty blockers to anyone under 18 for gender transition. Medicaid may not cover these services for minors.

      - **Exceptions**: minors who were already receiving hormones or blockers before April 24, 2024, if the physician finds that stopping would cause harm; and care for differences of sex development.
      - **Penalties**: violations are unprofessional conduct subject to license discipline, and the Attorney General can sue to enforce the ban.
      - **Mental health care** for gender dysphoria is still allowed.

      **Litigation**: an appeals court struck down the ban in March 2025, but the Ohio Supreme Court stayed that ruling on April 29, 2025, so **the ban is in effect** while the appeal (Moe v. Yost) is pending.
    es: |
      **HB 68** (Capítulo 3129 del ORC, vigente desde el 24 de abril de 2024, aprobada pese al veto del gobernador DeWine) prohíbe a los médicos dar cirugía, hormonas cruzadas o bloqueadores de pubertad a menores de 18 años para transición de género. Medicaid no puede cubrir estos servicios para menores.

      - **Excepciones**: menores que ya recibían hormonas o bloqueadores antes del 24 de abril de 2024, si el médico determina que suspenderlos causaría daño; y atención de diferencias del desarrollo sexual.
      - **Sanciones**: las violaciones son conducta no profesional sujeta a disciplina de la licencia, y el Fiscal General puede demandar.
      - La **atención de salud mental** sigue permitida.

      **Litigio**: un tribunal de apelaciones anuló la prohibición en marzo de 2025, pero la Corte Suprema de Ohio suspendió ese fallo el 29 de abril de 2025, así que **la prohibición está vigente** mientras se decide la apelación (Moe v. Yost).
  sources: [orc-3129-02, orc-3129-04, orc-3129-05, orc-3129-06, aclu-moe]
medicaid:
  program_name: Ohio Medicaid
  covers_hrt: unclear
  covers_surgery: "no"
  detail:
    en: >-
      Ohio's Medicaid hospital-services rule lists "gender transformation" as a non-covered service (OAC 5160-2-03), and
      HB 68 bars coverage of transition services for minors (ORC 3129.06). Whether your managed care plan covers
      hormones and labs for adults is not stated in a public policy; ask your plan and your clinic, and appeal a denial.
      Adults qualify with income up to about 138% of the federal poverty level. Apply online at Ohio Benefits or at
      your county Job and Family Services office.
    es: >-
      La norma de servicios hospitalarios de Medicaid de Ohio excluye la "transformación de género" (OAC 5160-2-03), y
      HB 68 prohíbe cubrir servicios de transición para menores (ORC 3129.06). No hay una política pública sobre la
      cobertura de hormonas para adultos; pregunta a tu plan y a tu clínica, y apela si te la niegan. Los adultos
      califican con ingresos hasta aproximadamente el 138% del nivel federal de pobreza. Solicita en Ohio Benefits o
      en la oficina de Job and Family Services de tu condado.
  how_to_apply_url: https://benefits.ohio.gov/
  sources: [oac-5160-2-03, orc-3129-06, map-profile, ohio-benefits]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: >-
      Ohio has no law barring insurers from excluding gender-affirming care, and the state employee health plan excludes
      it. Check your plan's exclusions list. If a claim is denied, you can appeal and request an external review, and
      you can file a complaint with the Ohio Department of Insurance. The Trans Health Project and Equality Ohio can help
      with appeals.
    es: >-
      Ohio no tiene ley que prohíba a las aseguradoras excluir la atención de afirmación de género, y el plan de
      empleados estatales la excluye. Revisa las exclusiones de tu plan. Si te niegan un reclamo, puedes apelar, pedir
      revisión externa y presentar una queja ante el Departamento de Seguros de Ohio.
  complaint_url: https://insurance.ohio.gov/
  sources: [map-profile, odi]
