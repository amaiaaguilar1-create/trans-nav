review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    REAP Act (HB 1125, 2023) read as sent to the Governor; bill-status index shows "02/28 Approved by Governor"; it
    takes effect on passage. Codification of the main sections (reported as Miss. Code § 41-141-1 et seq.) was NOT
    confirmed because Justia returned 403; § 43-13-117.7 (Medicaid) is stated in the bill text. No lawsuit against HB
    1125 was found (web search was unavailable). Medicaid: the entire Mississippi Medicaid Administrative Code (eff.
    8/1/2026, 1,474 pages) was searched for "gender," "transgender," "sex change," "sex reassign," "transsex," and
    "cross-sex" with no exclusion found, so adult coverage is marked unclear; pharmacy PDL and managed care plan
    policies were not checked. MAP rates Mississippi Medicaid and state employee benefits as excluding trans care; the
    source of MAP's rating was not identified. No 2024-2026 bill restricting adult care passed (SB 2029 of 2024, a
    Medicaid ban for adults, died in committee). Open Arms Healthcare Center's website lists primary care, PrEP, STI
    testing, and behavioral health but does not mention hormone therapy; the coordinator's brief describes it as an
    informed-consent HRT clinic, so it is marked community_reported. Planned Parenthood Southeast pages and the
    Mississippi Insurance Department complaint page returned 403. QueerMed lists Mississippi on queermed.com/locations.
    Spectrum Center (Hattiesburg), Grace House, and Mississippi Center for Justice pages did not load and are omitted.
status_summary:
  en: >-
    Adults can legally get hormone therapy and surgery in Mississippi, though few in-state clinics advertise it and
    telehealth (Plume, QueerMed) fills much of the gap. Puberty blockers, hormones, and surgery for gender transition are
    banned for anyone under 18 under the 2023 REAP Act, and public funds and Medicaid cannot pay for that care for
    minors. There is no shield law and no insurance protection.
  es: >-
    Los adultos pueden recibir legalmente terapia hormonal y cirugía en Misisipi, aunque pocas clínicas del estado lo
    anuncian y la telesalud (Plume, QueerMed) cubre gran parte de la necesidad. Los bloqueadores de pubertad, las
    hormonas y la cirugía para transición de género están prohibidos para menores de 18 años por la Ley REAP de 2023, y
    los fondos públicos y Medicaid no pueden pagar esa atención para menores. No hay ley escudo ni protección de seguros.
adult_care:
  status: available
  detail:
    en: |
      No Mississippi law restricts gender-affirming care for adults 18 and older. Options:
      - **Telehealth**: Plume and QueerMed serve Mississippi. Planned Parenthood Southeast may offer hormone therapy; call to confirm.
      - **Open Arms Healthcare Center** (Jackson and Hattiesburg) offers LGBTQ-affirming primary care on a sliding scale; ask about hormone therapy.
      - **Community health centers** (findahealthcenter.hrsa.gov) charge on a sliding scale; ask whether they prescribe hormones.
      - The **Campaign for Southern Equality's Trans in the South** directory lists affirming providers in Mississippi.

      If money is tight: generic estradiol, spironolactone, and testosterone are often inexpensive with discount cards, and Point of Pride's HRT Access Fund can help.
    es: |
      Ninguna ley de Misisipi restringe la atención de afirmación de género para adultos de 18 años o más. Opciones:
      - **Telesalud**: Plume y QueerMed atienden en Misisipi. Planned Parenthood Southeast puede ofrecer terapia hormonal; llama para confirmar.
      - **Open Arms Healthcare Center** (Jackson y Hattiesburg) ofrece atención primaria que afirma a personas LGBTQ con escala móvil; pregunta por terapia hormonal.
      - **Centros de salud comunitarios** (findahealthcenter.hrsa.gov) con escala móvil; pregunta si recetan hormonas.
      - El directorio **Trans in the South** de Campaign for Southern Equality incluye proveedores en Misisipi.

      Si tienes poco dinero: el estradiol, la espironolactona y la testosterona genéricos suelen ser baratos con tarjetas de descuento, y el Fondo de Acceso a TRH de Point of Pride puede ayudar.
  sources: [hb1125, queermed-locations, oahcc, oahcc-srh, hrsa, cse-tits, pop-hrt]
minor_care:
  status: prohibited
  detail:
    en: |
      The **Regulate Experimental Adolescent Procedures (REAP) Act** (HB 1125, signed February 28, 2023, effective on passage) bans anyone from knowingly providing puberty blockers, cross-sex hormones, or gender reassignment surgery to a person **under 18**, and from aiding or abetting it. Exceptions cover people with a medically verifiable disorder (difference) of sex development and treatment of complications. There is no exception for young people already on treatment.

      Penalties: doctors and other licensed providers **lose their license**; patients can sue for damages for up to 30 years after turning 18; the Attorney General must enforce the law. Public funds, state and local government facilities and employees, and Medicaid (Miss. Code § 43-13-117.7) may not provide or pay for this care for minors, and the costs are not deductible from state income tax. Mental health counseling is not banned. The ban is in effect; no court has blocked it.

      Families can get navigation help and $500 travel grants from the Campaign for Southern Equality's Trans Youth Emergency Project.
    es: |
      La **Ley REAP** (HB 1125, firmada el 28 de febrero de 2023, vigente desde su aprobación) prohíbe proporcionar bloqueadores de pubertad, hormonas cruzadas o cirugía de reasignación de género a menores de **18 años**, o ayudar a hacerlo. Las excepciones cubren diferencias del desarrollo sexual verificables médicamente y el tratamiento de complicaciones. No hay excepción para jóvenes que ya estaban en tratamiento.

      Sanciones: los médicos y otros proveedores **pierden su licencia**; los pacientes pueden demandar hasta 30 años después de cumplir 18; el Fiscal General debe hacer cumplir la ley. Los fondos públicos, las instalaciones y empleados del gobierno y Medicaid (§ 43-13-117.7) no pueden proporcionar ni pagar esta atención para menores. La consejería de salud mental no está prohibida. La prohibición está vigente.

      Las familias pueden recibir ayuda y becas de viaje de $500 del Trans Youth Emergency Project de Campaign for Southern Equality.
  sources: [hb1125, hb1125-status, cse-tyep]
medicaid:
  program_name: Mississippi Medicaid
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: By law, Medicaid cannot cover gender transition procedures for anyone under 18. For adults, the Medicaid Administrative Code has no written exclusion, but also no coverage policy, and MAP reports that Mississippi Medicaid restricts trans-related care. Mississippi has not expanded Medicaid, so most adults without children or a disability do not qualify. If you are denied, ask for the denial in writing and appeal; A4TE's Trans Health Project can help.
    es: Por ley, Medicaid no puede cubrir procedimientos de transición para menores de 18 años. Para adultos, el Código Administrativo de Medicaid no tiene una exclusión escrita, pero tampoco una política de cobertura, y MAP informa que Medicaid de Misisipi restringe esta atención. Misisipi no ha ampliado Medicaid, así que la mayoría de los adultos sin hijos ni discapacidad no califican. Si te niegan, pide la negativa por escrito y apela; el Trans Health Project de A4TE puede ayudar.
  how_to_apply_url: https://medicaid.ms.gov/medicaid-coverage/how-to-apply/
  sources: [hb1125, medicaid-admin-code, medicaid-apply, map-ms, a4te-thp]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: No Mississippi law bars insurers from excluding gender-affirming care, and MAP reports the state employee health plan excludes it. Read your plan's exclusions. If a claim is denied, appeal with the insurer, then complain to the Mississippi Insurance Department. Self-funded employer plans are regulated federally.
    es: Ninguna ley de Misisipi prohíbe a las aseguradoras excluir la atención de afirmación de género, y MAP informa que el plan de salud de empleados estatales la excluye. Revisa las exclusiones de tu plan. Si te niegan un reclamo, apela con la aseguradora y luego presenta una queja ante el Departamento de Seguros de Misisipi.
  complaint_url: https://www.mid.ms.gov/
  sources: [map-ms, mid]
