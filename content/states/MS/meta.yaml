overview:
  en: >-
    Mississippi is one of the most restrictive states for trans people. Adults (21 and older) can still change their
    name in chancery court, with no newspaper publication, but a judge must approve it at a hearing. Since July 1, 2026,
    driver's licenses must show the sex recorded at birth, and a 2024 law defines sex as "objective and fixed." Gender-affirming
    medical care is banned for anyone under 18. Adults can get hormone therapy, mostly through telehealth or a few
    clinics. Mississippi has no shield law.
  es: >-
    Misisipi es uno de los estados más restrictivos para las personas trans. Los adultos (21 años o más) todavía pueden
    cambiar su nombre en el tribunal de equidad (chancery court), sin publicación en periódico, pero un juez debe
    aprobarlo en una audiencia. Desde el 1 de julio de 2026, las licencias de conducir deben mostrar el sexo registrado
    al nacer, y una ley de 2024 define el sexo como "objetivo y fijo". La atención médica de afirmación de género está
    prohibida para menores de 18 años. Los adultos pueden recibir terapia hormonal, sobre todo por telesalud o en
    algunas clínicas. Misisipi no tiene ley escudo.
