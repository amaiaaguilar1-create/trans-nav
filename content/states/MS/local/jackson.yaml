name: Jackson
area:
  en: Hinds County and the Jackson metro (Madison and Rankin counties)
  es: Condado de Hinds y el área metropolitana de Jackson (condados de Madison y Rankin)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    Hinds County Chancery Clerk details (Eddie Jean Carr, 316 S. President St., 601-968-6508) come from the county
    website, which may be out of date; no fee is published there. Madison County's chancery fee schedule lists $148 for
    a name change. Hinds County has two judicial districts (Jackson and Raymond); confirm where to file. Open Arms
    hormone therapy not stated on its site (community_reported). Capital City Pride's domain (capitalcitypride.org)
    now belongs to a Des Moines, Iowa group, so it is omitted. Mississippi Equality, Grace House, and the TRANS
    Program sites did not load and are omitted. Planned Parenthood Southeast returned 403.
intro:
  en: >-
    Jackson is Mississippi's largest metro. Name changes are filed with the chancery clerk of the county where you live
    (Hinds, Madison, or Rankin). The ACLU of Mississippi, based in Jackson, runs the state's main trans legal help
    project, and Open Arms Healthcare Center offers affirming primary care, PrEP, and testing. Care for anyone under 18
    is banned statewide.
  es: >-
    Jackson es el área metropolitana más grande de Misisipi. Los cambios de nombre se presentan ante el secretario del
    tribunal de equidad del condado donde vives (Hinds, Madison o Rankin). La ACLU de Misisipi, con sede en Jackson,
    tiene el principal proyecto de ayuda legal para personas trans, y Open Arms Healthcare Center ofrece atención
    primaria, PrEP y pruebas. La atención para menores de 18 años está prohibida en todo el estado.
court:
  name: Hinds County Chancery Court (Chancery Clerk, First Judicial District, Jackson)
  url: https://www.hindscountyms.com/elected-offices/chancery-clerk
  notes:
    en: Chancery Clerk's office at 316 S. President St., Jackson, MS 39201, 601-968-6508, 8 a.m. to 5 p.m. weekdays. Call to confirm the fee (about $148 in the metro) and how to schedule a hearing. Madison and Rankin residents file in their own county.
    es: Oficina del secretario en 316 S. President St., Jackson, MS 39201, 601-968-6508, de 8 a.m. a 5 p.m. entre semana. Llama para confirmar la tarifa (unos $148 en el área) y cómo programar la audiencia. Los residentes de Madison y Rankin presentan en su propio condado.
  sources: [hinds-chancery, madison-fees]
