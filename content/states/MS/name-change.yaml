statutes:
  - cite: Miss. Code Ann. § 93-17-1 (as amended by SB 2126, 2026)
    title:
      en: Chancery court of the county of residence may change a person's name
      es: El tribunal de equidad del condado de residencia puede cambiar el nombre de una persona
    url: https://billstatus.ls.state.ms.us/documents/2026/pdf/SB/2100-2199/SB2126SG.pdf
  - cite: Miss. Code Ann. § 45-33-30 (SB 2126, 2026)
    title:
      en: Registered sex offenders may not change their name except by marriage or divorce; effective July 1, 2026
    url: https://billstatus.ls.state.ms.us/documents/2026/pdf/SB/2100-2199/SB2126SG.pdf
