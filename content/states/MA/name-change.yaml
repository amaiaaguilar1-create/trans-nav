statutes:
  - cite: G.L. c. 210, § 12
    title:
      en: Petition in the probate court of the county of residence; granted unless inconsistent with public interests
    url: https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter210/Section12
  - cite: G.L. c. 210, § 13 (as amended by St. 2025, c. 73, § 53, effective November 25, 2025)
    title:
      en: Probation report; public notice only for good cause; petitions and dockets impounded
    url: https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter210/Section13
  - cite: G.L. c. 261, §§ 27A-27G
    title:
      en: Indigency and waiver of court fees
    url: https://malegislature.gov/Laws/GeneralLaws/PartIII/TitleVI/Chapter261/Section27A
