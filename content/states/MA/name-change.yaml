    url: https://www.gladlaw.org/issues/id-documents-massachusetts/
    note:
      en: Includes annotated sample forms (April 2026). Its publication section predates the November 2025 change.
      es: Incluye ejemplos anotados de formularios (abril de 2026). Su sección de publicación es anterior al cambio de noviembre de 2025.
  - title: Advocates for Trans Equality, Massachusetts identity documents
    url: https://transequality.org/documents/massachusetts-identity-documents
    note:
      en: No last-updated date shown; it still says publication is required and a physician statement is needed for the birth certificate, both out of date.
