status_summary:
  en: >-
    Gender-affirming care is legal and protected in Massachusetts for adults and minors. MassHealth covers hormones
    and, with prior authorization, surgery; state-regulated private insurers may not exclude it; and the state's
    shield laws (2022, strengthened in 2025) protect patients and providers from other states' bans. Some clinics
    and hospitals have stopped hormone care for people under 19 because of federal pressure, so young people may need
    to look further for a provider.
  es: >-
    La atención de afirmación de género es legal y está protegida en Massachusetts para adultos y menores. MassHealth
    cubre hormonas y, con autorización previa, cirugía; las aseguradoras privadas reguladas por el estado no pueden
    excluirla; y las leyes escudo del estado (2022, reforzadas en 2025) protegen a pacientes y proveedores de las
    prohibiciones de otros estados. Algunas clínicas y hospitales dejaron de dar hormonas a menores de 19 por presión
    federal, así que los jóvenes pueden necesitar buscar más.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Community health centers such as **Fenway Health** prescribe hormones on an **informed consent** basis (no therapist letter), and telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **MassHealth** (Medicaid). It covers hormone therapy and, with prior authorization, surgery.
      2. If you do not qualify, ask a community health center or hospital about the **Health Safety Net**, which can pay for gender-affirming treatment at participating health centers and acute hospitals.
      3. Use a sliding-scale **community health center**; find one at findahealthcenter.hrsa.gov.
      4. **Point of Pride** runs an HRT access fund and other care funds.
      5. Generic estradiol, spironolactone, and testosterone are cheap with a pharmacy discount card; ask for the cash price.
    es: |
      Sin restricciones estatales. Centros de salud comunitarios como **Fenway Health** recetan hormonas mediante **consentimiento informado** (sin carta de terapeuta), y la telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **MassHealth**. Cubre terapia hormonal y, con autorización previa, cirugía.
      2. Si no calificas, pregunta en un centro de salud comunitario u hospital por la **Health Safety Net**, que puede pagar tratamientos de afirmación de género.
      3. Usa un **centro de salud comunitario** con escala móvil; búscalo en findahealthcenter.hrsa.gov.
      4. **Point of Pride** tiene un fondo de acceso a TRH y otros fondos.
      5. El estradiol, la espironolactona y la testosterona genéricos son baratos con una tarjeta de descuento; pregunta el precio en efectivo.
  sources: [fenway-trans, masshealth-covered, masshealth-eligibility, hrsa, pop]
minor_care:
  status: available
  detail:
    en: |
      **Legal.** No Massachusetts law restricts gender-affirming care for minors, and the Attorney General's May 2026 advisory states that federal law does not prohibit it and that a hospital ending such care "may amount to discrimination" under the state public accommodations law. The shield laws (St. 2022, c. 127 and St. 2025, c. 16) protect families and providers from out-of-state subpoenas, extradition, and professional discipline.

      **Access has narrowed.** Under federal pressure, Fenway Health stopped hormones and puberty blockers for patients under 19 in October 2025, and Baystate Health (western Massachusetts) stopped most medical care for minors in February 2026. Boston Children's Hospital, Boston Medical Center, and Mass General Brigham were reported (March 2026) to still offer gender-affirming medications to minors; call to confirm.

      **Federal Medicaid funding**: a federal CMS rule ends federal Medicaid and CHIP payment for this care for people under 18 (Medicaid) or 19 (CHIP) starting October 13, 2026. MassHealth has said it will keep paying with state-only funds (see the Medicaid section).
    es: |
      **Legal.** Ninguna ley de Massachusetts restringe la atención de afirmación de género para menores, y el aviso de la Fiscal General de mayo de 2026 afirma que la ley federal no la prohíbe y que un hospital que la suspenda podría incurrir en discriminación según la ley estatal de establecimientos públicos. Las leyes escudo (2022 y 2025) protegen a familias y proveedores de citaciones, extradiciones y sanciones de otros estados.

      **El acceso se ha reducido.** Por presión federal, Fenway Health dejó de dar hormonas y bloqueadores a menores de 19 en octubre de 2025, y Baystate Health dejó la mayor parte de la atención médica a menores en febrero de 2026. Boston Children's Hospital, Boston Medical Center y Mass General Brigham seguían ofreciéndola (marzo de 2026); llama para confirmar.

      **Fondos federales de Medicaid**: una regla de CMS elimina el pago federal de Medicaid y CHIP para esta atención a menores de 18 (Medicaid) o 19 (CHIP) desde el 13 de octubre de 2026. MassHealth dijo que seguirá pagando con fondos estatales.
  sources: [ag-advisory, shield-2022, shield-2025, masseq-fenway, wbur-baystate, wgbh-minors, wgbh-trust]
medicaid:
  program_name: MassHealth
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      MassHealth Standard, CommonHealth, CarePlus, and Family Assistance cover medically necessary **puberty blockers and hormone therapy**, behavioral health care, **gender-affirming surgery** (chest, genital, and some facial procedures), facial and neck **hair removal**, and **speech therapy** (35 visits a year without prior authorization). Managed care plans may set their own criteria but cannot be stricter than MassHealth's.

      Surgery and hair removal need **prior authorization** and a gender dysphoria diagnosis from a licensed behavioral health provider made at least six months before the request. Genital surgery also requires two assessments, age 18 or older, 12 months of hormone therapy (unless contraindicated), and 12 months living in your affirmed gender (exceptions case by case). Some procedures are excluded (for example face-lift, lip procedures, vocal cord surgery, most revisions).

      **Minors**: after a federal rule takes effect on October 13, 2026, MassHealth plans to keep covering hormones and puberty blockers for members under 18 using state-only money from the $8.5 million Affirming Health Care Trust.

      If you have problems with a MassHealth plan, the free **My Ombudsman** program can help (855-781-9898). Change your name with Social Security before reporting it to MassHealth (800-841-2900).
    es: |
      MassHealth Standard, CommonHealth, CarePlus y Family Assistance cubren **bloqueadores de pubertad y terapia hormonal** médicamente necesarios, salud mental, **cirugía de afirmación de género** (pecho, genitales y algunas faciales), **depilación** de cara y cuello y **terapia del habla** (35 visitas al año sin autorización previa).

      La cirugía y la depilación requieren **autorización previa** y un diagnóstico de disforia de género hecho por un profesional de salud mental al menos seis meses antes. La cirugía genital además requiere dos evaluaciones, 18 años o más, 12 meses de hormonas (salvo contraindicación) y 12 meses viviendo en tu género (con excepciones).

      **Menores**: cuando entre en vigor una regla federal el 13 de octubre de 2026, MassHealth planea seguir cubriendo hormonas y bloqueadores para menores de 18 con fondos estatales del Affirming Health Care Trust.

      Si tienes problemas con un plan de MassHealth, el programa gratuito **My Ombudsman** puede ayudar (855-781-9898).
  how_to_apply_url: https://www.mass.gov/how-to/apply-for-masshealth-the-health-safety-net-or-the-childrens-medical-security-plan
  sources: [masshealth-covered, masshealth-eligibility, masshealth-guidance, masshealth-apply, wgbh-trust]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Division of Insurance **Bulletin 2021-11** tells state-regulated insurers that discrimination on the basis of gender identity or gender dysphoria, including denying medically necessary gender-affirming care, is prohibited. If your plan denies care, appeal with the plan first, then file a complaint with the Division of Insurance's Consumer Services Unit (online or by printed form). Plans for state and many municipal employees (Group Insurance Commission) also cover this care. **Self-funded employer plans** are federally regulated and are not covered by the bulletin.
    es: |
      El **Boletín 2021-11** de la División de Seguros indica a las aseguradoras reguladas por el estado que la discriminación por identidad de género o disforia de género, incluida la negación de atención de afirmación de género médicamente necesaria, está prohibida. Si tu plan la niega, apela primero ante el plan y luego presenta una queja ante la Unidad de Servicios al Consumidor de la División de Seguros. Los **planes autofinanciados** de empleadores se rigen por la ley federal y no están cubiertos por el boletín.
  complaint_url: https://www.mass.gov/how-to/filing-an-insurance-complaint
  sources: [doi-bulletin, doi-complaint, mtpc-health]
