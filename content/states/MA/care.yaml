litigation:
  - case: Multistate challenge to the HHS "Kennedy Declaration" (22 states including Massachusetts)
    court: U.S. District Court for the District of Oregon
    summary:
      en: On December 18, 2025 HHS declared that gender-affirming care for minors fails professional standards and threatened to exclude providers from Medicare and Medicaid. On April 18, 2026 the court held the declaration unlawful, vacated it, and barred HHS from using it against providers in the plaintiff states. An appeal is possible.
      es: El 18 de diciembre de 2025, HHS declaró que la atención de afirmación de género para menores no cumple los estándares profesionales y amenazó con excluir a proveedores de Medicare y Medicaid. El 18 de abril de 2026 el tribunal declaró ilegal esa declaración, la anuló y prohibió a HHS usarla contra proveedores en los estados demandantes.
    effect_today:
      en: HHS may not exclude Massachusetts doctors or hospitals from Medicare or Medicaid for providing gender-affirming care consistent with professional standards. This case does not affect the separate CMS payment rule that takes effect October 13, 2026.
      es: HHS no puede excluir a médicos u hospitales de Massachusetts de Medicare o Medicaid por dar atención de afirmación de género conforme a los estándares profesionales. Este caso no afecta la regla de pago de CMS que entra en vigor el 13 de octubre de 2026.
    last_update: "2026-05-20"
    sources: [ag-advisory]
