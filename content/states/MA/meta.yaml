overview:
  en: >-
    Massachusetts is among the most protective states for trans people. Adults change their name with a sealed court
    petition that no longer requires newspaper publication, the RMV and birth certificates offer M, F, or X by
    self-attestation, MassHealth and state-regulated insurers cover gender-affirming care, and shield laws (2022,
    strengthened in 2025) protect patients and providers. Federal documents (passport, Social Security) are the
    exception: their sex fields are currently frozen nationwide.
  es: >-
    Massachusetts es uno de los estados que más protege a las personas trans. Los adultos cambian su nombre con una
    petición judicial sellada que ya no requiere publicación en periódico, el RMV y las actas de nacimiento ofrecen M,
    F o X por declaración propia, MassHealth y las aseguradoras reguladas cubren la atención de afirmación de género, y
    las leyes escudo (2022, reforzadas en 2025) protegen a pacientes y proveedores. Los documentos federales
    (pasaporte, Seguro Social) son la excepción: sus campos de sexo están congelados a nivel nacional.
