sources:
  - id: mcl-711-1
    url: https://www.legislature.mi.gov/Laws/MCL?objectName=mcl-711-1
    title: MCL 711.1, Order changing name of adult, minor, or spouse and minor children
    publisher: Michigan Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: The court shall bear any cost associated with the court's use of L.E.I.N. or ICHAT, not the petitioner. ... the court may, in its discretion, enter an order under this section with or without a hearing.
  - id: mcl-711-3
