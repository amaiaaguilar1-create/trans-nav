statutes:
  - cite: MCL 711.1
    title:
      en: Order changing name; one-year county residency; criminal record disclosure; hearing discretionary for adults; minors
    url: https://www.legislature.mi.gov/Laws/MCL?objectName=mcl-711-1
  - cite: MCL 711.3
    title:
      en: Nonpublication and confidential record for good cause; presumed for gender identity
    url: https://www.legislature.mi.gov/Laws/MCL?objectName=mcl-711-3
  - cite: 2024 PA 229 (HB 5300 of 2023)
    title:
      en: Removed fingerprinting and the fraud presumption, made hearings discretionary, and required nonpublication for good cause; effective April 2, 2025
    url: https://www.legislature.mi.gov/Bills/Bill?ObjectName=2023-HB-5300
