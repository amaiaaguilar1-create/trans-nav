area:
  en: Wayne, Oakland, and Macomb counties (Metro Detroit)
  es: Condados de Wayne, Oakland y Macomb (área metropolitana de Detroit)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  notes: >-
    Org details from each org's website 2026-09-24. The Third Circuit Court site (3rdcc.org) is a JavaScript app and
    did not render for automated fetching, so the Wayne County filing location and address are NOT confirmed; the $175
    fee is Michigan Legal Help's Wayne County figure. People living in Oakland or Macomb County file in their own county's
    circuit court (Sixth Circuit, Oakland; Sixteenth Circuit, Macomb); those courts were not checked. Planned Parenthood
    of Michigan Detroit-area health center locations were not individually verified.
  es_status: machine_draft
intro:
  en: >-
    Metro Detroit has Michigan's largest cluster of trans services: Corktown Health's LGBTQ+ clinic in Detroit, Ruth
    Ellis Center's free health and wellness centers for young people in Highland Park, and the Affirmations LGBTQ+
    center in Ferndale. Wayne County residents file name change petitions with the Third Judicial Circuit Court.
  es: >-
    El área metropolitana de Detroit concentra la mayor cantidad de servicios trans de Míchigan: la clínica LGBTQ+ de
    Corktown Health en Detroit, los centros de salud gratuitos del Ruth Ellis Center para jóvenes en Highland Park y el
    centro LGBTQ+ Affirmations en Ferndale. Los residentes del condado de Wayne presentan las peticiones de cambio de
    nombre ante el Tribunal del Tercer Circuito Judicial.
court:
  name: Third Judicial Circuit Court of Michigan (Wayne County), Family Division
  url: https://www.3rdcc.org/
  self_help_url: https://michiganlegalhelp.org/step/4768
  filing_fee: 175
  notes:
    en: You must have lived in Wayne County for at least one year. Contact the court to ask which filing methods it accepts (in person, email, mail, or MiFILE). Oakland County residents file in the Sixth Circuit Court and Macomb County residents in the Sixteenth Circuit Court.
    es: Debes haber vivido al menos un año en el condado de Wayne. Pregunta al tribunal qué métodos de presentación acepta. Los residentes de Oakland presentan en el Sexto Circuito y los de Macomb en el Decimosexto Circuito.
  sources: [mlh-adult-wayne]
resources:
  - id: corktown-health
    name: Corktown Health
    type: informed_consent_clinic
    pillars: [hrt, sexual_health, mental_health, insurance]
    description:
      en: LGBTQ+ health center with gender-affirming hormone therapy, primary and HIV care, STI testing, PrEP and PEP, at-home HIV testing, behavioral health, dental, and insurance navigation. Accepts Medicaid and most plans; telehealth available. Main campus in Corktown, second site at 24310 John R Rd, Hazel Park. 313-832-3300.
      es: Centro de salud LGBTQ+ con terapia hormonal, atención primaria y de VIH, pruebas de ITS, PrEP y PEP, salud conductual, dental y navegación de seguros. Acepta Medicaid; telesalud disponible. Sede principal en Corktown y otra en Hazel Park. 313-832-3300.
    url: https://corktownhealth.org/
    phone: "313-832-3300"
    address: 1726 Howard St, Detroit, MI 48216
    cost: insurance
    accepts_medicaid: true
    telehealth: true
    verification: org_website
    sources: [corktown, corktown-medical]
  - id: ruth-ellis-center
    name: Ruth Ellis Center and Health & Wellness Centers
    type: lgbtq_center
    pillars: [hrt, sexual_health, mental_health]
    description:
      en: Services for LGBTQ+ young people ages 13 to 30, including a drop-in center, housing, HIV prevention, and Health & Wellness Centers run with Henry Ford Health offering primary care, hormone therapy, STI and HIV care, psychiatry, and therapy at no out-of-pocket cost. 313-252-1950.
      es: Servicios para jóvenes LGBTQ+ de 13 a 30 años, incluido un centro de acogida, vivienda, prevención del VIH y Health & Wellness Centers con Henry Ford Health que ofrecen atención primaria, terapia hormonal, atención de ITS y VIH, psiquiatría y terapia sin costo de bolsillo. 313-252-1950.
