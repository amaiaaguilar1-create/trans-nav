  notes: >-
    Climate is based on primary sources read 2026-09-24 (MCL 711.1 and 711.3 as amended by 2024 PA 229; MCL 333.2831
    as amended by 2024 PA 230; SOS sex designation page; Medicaid Provider Manual Practitioner chapter section 3.13;
    Elliott-Larsen Civil Rights Act as amended by 2023 PA 6). Michigan has no shield law statute (MAP profile scores it
    0/1); reviewer should confirm no executive directive has since been issued. Several 2025 bills to ban care for minors
    (SB 289-290, HB 4190, HB 4466-4467) and to remove gender identity from Elliott-Larsen (HB 4751, HB 4777) were
    introduced but, per the legislature's bill list read 2026-09-24, none has passed a chamber.
overview:
  en: >-
    Michigan is one of the more protective states for trans people. Since April 2025 a name change for gender identity
    is automatically kept out of the newspaper and made confidential, with no fingerprinting. Driver's licenses and birth
    certificates offer M, F, or X on your own signed statement, with no doctor's letter or court order. Medicaid covers
    gender-affirming care, and the Elliott-Larsen Civil Rights Act bans discrimination based on gender identity or
    expression. Michigan does not have a shield law for gender-affirming care.
  es: >-
    Míchigan es uno de los estados que más protege a las personas trans. Desde abril de 2025, un cambio de nombre por
    identidad de género queda fuera del periódico y es confidencial automáticamente, sin huellas digitales. Las licencias
    de conducir y las actas de nacimiento ofrecen M, F o X con tu propia declaración firmada, sin carta médica ni orden
    judicial. Medicaid cubre la atención de afirmación de género, y la Ley de Derechos Civiles Elliott-Larsen prohíbe la
    discriminación por identidad o expresión de género. Míchigan no tiene una ley escudo para la atención de afirmación de
    género.
