guide_type: drivers_license
jurisdiction: MI
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: high
  es_status: machine_draft
  notes: >-
    Confirmed 2026-09-24 on the Secretary of State service page "License or ID sex designation correction" (M, F, or X;
    office visit only; $9 license, $10 ID) and the Sex Designation Form (Rev. 05/2026), which is a sworn self-attestation
    with no medical or court documentation. The policy is administrative (no statute found); the 2025-2026 session has no
    bill that passed a chamber to restrict it. Reviewer: confirm whether the no-fee ID program covers a sex designation
