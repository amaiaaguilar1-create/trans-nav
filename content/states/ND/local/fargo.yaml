name: Fargo
area:
  en: Cass County, North Dakota, and the Fargo-Moorhead metro (including Moorhead, Minnesota)
  es: Condado de Cass, Dakota del Norte, y el área metropolitana de Fargo-Moorhead (incluida Moorhead, Minnesota)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details from the ND Courts Cass County page (fetched 2026-09-24). The $160 fee is the statewide figure
    from the court's self-help instructions. The Pride Collective and Community Center (Fargo) could not be found
    online (pridecollective.com is a parked domain; other guessed domains did not resolve), so it is not listed;
    reviewer should confirm whether it still operates and add it with its current address. Sanford Health (Fargo)
    adult gender care could not be verified from its website. Family HealthCare's website does not mention
    gender-affirming care. Planned Parenthood Moorhead lists "Gender-Affirming Care" but its age minimum was not
    confirmed. Reviewer: add a local trans peer-support group and an NDSU or MSUM campus LGBTQ resource if they
    serve the public.
intro:
  en: >-
    Fargo is North Dakota's largest city. Name change petitions for Cass County residents are filed with the Cass
    County District Court in downtown Fargo. For care, many people cross the Red River to Moorhead, Minnesota, where
    Planned Parenthood offers gender-affirming care and Minnesota's shield law protects patients and providers.
    Minors cannot get puberty blockers or hormones in North Dakota; see the care guide.
  es: >-
    Fargo es la ciudad más grande de Dakota del Norte. Las peticiones de cambio de nombre de residentes del condado de
    Cass se presentan en el Tribunal de Distrito del condado de Cass, en el centro de Fargo. Para atención médica,
    muchas personas cruzan el río Rojo hacia Moorhead, Minnesota, donde Planned Parenthood ofrece atención de
    afirmación de género. Los menores no pueden recibir bloqueadores ni hormonas en Dakota del Norte.
court:
  name: Cass County District Court (East Central Judicial District)
  url: https://www.ndcourts.gov/court-locations/cass-county
  self_help_url: https://www.ndcourts.gov/legal-self-help/name-change-adult
  filing_fee: 160
  notes:
    en: >-
      211 9th St. S., Fargo, ND 58103. Clerk's Office (second floor) phone (701) 451-6900; hours 8 am to 5 pm, Monday
      to Friday. Public entrance on the east side. Ask the clerk whether Cass County judges require a background
      check for all adult name changes. Newspaper publication is extra unless the judge waives it.
    es: >-
      211 9th St. S., Fargo, ND 58103. Secretaría (segundo piso) teléfono (701) 451-6900; de 8 am a 5 pm, lunes a
      viernes. Pregunta si los jueces de Cass exigen verificación de antecedentes a todos los adultos.
  sources: [cass-court, nc-instructions]
