  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate is based on primary sources read 2026-09-24. N.D.C.C. 23-02.1-25.1 (HB 1297, 2023) bars birth
    certificate sex changes "due to a gender identity change"; the DOT still publishes Gender Designation Form SFN
    61146 (revised 4-2026) with M/F only; N.D.C.C. ch. 12.1-36.1 (HB 1254, 2023) criminalizes care for minors and was
    upheld by the North Dakota Supreme Court on 2026-09-17 (T.D. v. Wrigley, per Gender Justice). ND Medicaid's
    Gender Affirming Care policy (updated July 2026) covers hormones and listed surgeries for adults. MAP's profile
    agrees on all of these points and also lists a negative law on state-employee health benefits and a
    statewide definition of "sex" (now N.D.C.C. 1-01-49); the state-employee plan exclusion was not verified from
    a primary source. No shield law exists. The Pride Collective and Community Center (Fargo) website could not be
    found (pridecollective.com is a parked domain), so it is not listed.
overview:
  en: >-
    North Dakota is mixed for ID documents and restrictive for care. You can change your name in district court
    (newspaper publication can be waived if you change only your first or middle name) and change the sex on your
    driver's license to M or F with a form signed by a medical provider. But state law has barred changing the sex on
    a North Dakota birth certificate because of gender identity since 2023, and a 2023 law makes it a crime to
    provide puberty blockers, hormones, or surgery to anyone under 18. Adults can get care, and ND Medicaid covers
    hormones and many surgeries. There is no shield law.
  es: >-
    Dakota del Norte es mixto en documentos de identidad y restrictivo en atención médica. Puedes cambiar tu nombre
    en el tribunal de distrito (la publicación en el periódico puede omitirse si solo cambias el primer nombre o el
    segundo nombre) y cambiar el sexo en tu licencia de conducir a M o F con un formulario firmado por un proveedor
    médico. Pero desde 2023 la ley prohíbe cambiar el sexo en un acta de nacimiento de Dakota del Norte por identidad
    de género, y una ley de 2023 convierte en delito dar bloqueadores de pubertad, hormonas o cirugía a menores de 18.
    Los adultos pueden recibir atención, y ND Medicaid cubre hormonas y muchas cirugías. No hay ley escudo.
