status_summary:
  en: >-
    Adults (18 and older) can legally get hormone therapy and surgery in North Dakota, and ND Medicaid covers
    hormones and many surgeries. For anyone under 18, puberty blockers, hormones, and surgery for gender transition
    are a crime for providers; the North Dakota Supreme Court upheld the ban in September 2026. There is no shield
    law and no state protection against insurance exclusions.
  es: >-
    Las personas adultas (18 años o más) pueden recibir legalmente terapia hormonal y cirugía en Dakota del Norte, y
    ND Medicaid cubre hormonas y muchas cirugías. Para menores de 18, los bloqueadores, las hormonas y la cirugía de
    transición son delito para los proveedores; la Corte Suprema estatal confirmó la prohibición en septiembre de
    2026. No hay ley escudo ni protección estatal contra exclusiones de seguros.
adult_care:
  status: available
  detail:
    en: |
      North Dakota law does not restrict gender-affirming care for adults 18 and older.

      **If you have little money**, in rough order of what to try:
      1. Apply for **ND Medicaid**. It covers medically necessary gender-affirming care with a diagnosis of gender dysphoria, including hormone therapy, and many surgeries for people 18 and older with prior authorization. Its policy requires behavioral health counseling during your first 12 months on hormones.
      2. Go to a **community health center** (FQHC) such as Family HealthCare in Fargo. They charge on a sliding scale; ask whether a provider there prescribes hormones.
      3. **Planned Parenthood North Central States** lists gender-affirming care at its **Moorhead, Minnesota** health center, just across the river from Fargo. There are no Planned Parenthood health centers in North Dakota.
      4. **Telehealth**: Plume serves North Dakota. Point of Pride's HRT Access Fund pays for telehealth hormone care for some applicants each year.
    es: |
      La ley de Dakota del Norte no restringe la atención de afirmación de género para adultos de 18 años o más.

      **Si tienes poco dinero**, en orden aproximado:
      1. Solicita **ND Medicaid**. Cubre la atención médicamente necesaria con diagnóstico de disforia de género, incluida la terapia hormonal, y muchas cirugías para mayores de 18 con autorización previa. Exige consejería de salud conductual durante los primeros 12 meses de hormonas.
      2. Acude a un **centro de salud comunitario** como Family HealthCare en Fargo. Cobran en escala móvil; pregunta si recetan hormonas.
      3. **Planned Parenthood North Central States** ofrece atención de afirmación de género en su centro de **Moorhead, Minnesota**, al otro lado del río desde Fargo. No hay centros de Planned Parenthood en Dakota del Norte.
      4. **Telesalud**: Plume atiende en Dakota del Norte. El Fondo de Acceso a TRH de Point of Pride paga atención hormonal por telesalud a algunas personas.
  sources: [nd-medicaid-gac, pp-moorhead, pp-nd, fhc]
minor_care:
  status: prohibited
  detail:
    en: |
      Since **April 21, 2023**, N.D.C.C. chapter 12.1-36.1 (HB 1254) bars health care providers from giving anyone **under 18** (including emancipated minors) the following to change or affirm their gender:
      - puberty blockers, or testosterone or estrogen at supraphysiologic doses (a **class A misdemeanor** for the provider);
      - surgeries including mastectomy, hysterectomy, vaginoplasty, phalloplasty, and others (a **class B felony**).

      **Exceptions**: minors with a medically verifiable disorder of sex development, and treatment that **began before April 21, 2023**. Prosecutions can be brought up to three years after the offense or after it is reported.

      Families challenged the law in state court (T.D. v. Wrigley). The district court upheld it in October 2025, and the **North Dakota Supreme Court affirmed on September 17, 2026**, so the ban is fully in effect.

      Counseling and social transition are not banned. Families who seek medical care usually travel to Minnesota, which has a shield law, or other states. Minors can still change their name through a parent's petition (see the name change guide).
    es: |
      Desde el **21 de abril de 2023**, el capítulo 12.1-36.1 (HB 1254) prohíbe a los proveedores dar a **menores de 18** (incluidos los emancipados), para cambiar o afirmar su género:
      - bloqueadores de pubertad, o testosterona o estrógeno en dosis suprafisiológicas (**delito menor clase A** para el proveedor);
      - cirugías como mastectomía, histerectomía, vaginoplastia, faloplastia y otras (**delito grave clase B**).

      **Excepciones**: menores con un trastorno del desarrollo sexual verificable, y tratamientos que **comenzaron antes del 21 de abril de 2023**.

      Familias impugnaron la ley (T.D. v. Wrigley). El tribunal de distrito la confirmó en octubre de 2025 y la **Corte Suprema de Dakota del Norte la confirmó el 17 de septiembre de 2026**; la prohibición está plenamente vigente.

      La consejería y la transición social no están prohibidas. Las familias que buscan atención médica suelen viajar a Minnesota, que tiene ley escudo, u otros estados.
  sources: [ndcc-12-1-36-1, hb1254, gj-district, gj-supreme]
medicaid:
  program_name: ND Medicaid
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: >-
      ND Medicaid's Gender Affirming Care and Services policy (updated July 2026) covers medically necessary care
      for members with a diagnosis of gender dysphoria who give informed consent. Hormone therapy is covered, with
      behavioral health counseling required for the first 12 months. Surgery requires age 18+, 12 continuous months
      living in your gender and on hormones (unless contraindicated), a recent behavioral health evaluation, and
      prior authorization; covered procedures include mastectomy, hysterectomy, orchiectomy, vaginoplasty,
      phalloplasty, and others (breast augmentation after 24 months of hormones). Facial feminization, tracheal
      shave, most hair removal, and fertility preservation are **not** covered. Care for minors is limited by the
      state criminal ban regardless of this policy.
    es: >-
      La política de ND Medicaid (actualizada en julio de 2026) cubre la atención médicamente necesaria con
      diagnóstico de disforia de género y consentimiento informado. Cubre hormonas, con consejería obligatoria los
      primeros 12 meses. La cirugía requiere 18 años o más, 12 meses viviendo en tu género y con hormonas, una
      evaluación reciente y autorización previa. No cubre feminización facial, reducción de nuez, la mayoría de la
      depilación ni preservación de fertilidad.
  how_to_apply_url: https://www.hhs.nd.gov/healthcare/medicaid/apply
  sources: [nd-medicaid-gac, nd-medicaid-apply]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: >-
      North Dakota has no state law barring private health plans from excluding gender-affirming care. Check your
      plan's exclusions list. If a claim is denied, you can appeal with the plan and file a complaint with the North
      Dakota Insurance Department; the Trans Health Project can help with appeals.
    es: >-
      Dakota del Norte no tiene ley que prohíba a los seguros privados excluir la atención de afirmación de género.
      Revisa las exclusiones de tu plan. Si te niegan un reclamo, puedes apelar y presentar una queja ante el
      Departamento de Seguros; el Trans Health Project puede ayudar con apelaciones.
  complaint_url: https://www.insurance.nd.gov/consumers/complaints
  sources: [map-nd, nd-insurance-complaints]
