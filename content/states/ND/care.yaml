litigation:
  - case: T.D. v. Wrigley
    court: North Dakota Supreme Court (on appeal from Burleigh County District Court)
    summary:
      en: >-
        A pediatric endocrinologist and families challenged HB 1254 under the North Dakota Constitution. After
        trial, the district court upheld the law on October 8, 2025. The North Dakota Supreme Court affirmed on
        September 17, 2026.
      es: >-
        Un endocrinólogo pediátrico y familias impugnaron la HB 1254 bajo la Constitución de Dakota del Norte. El
        tribunal de distrito confirmó la ley el 8 de octubre de 2025 y la Corte Suprema estatal la confirmó el 17 de
        septiembre de 2026.
    effect_today:
      en: The ban on puberty blockers, hormones, and surgery for minors is fully in effect.
      es: La prohibición de bloqueadores, hormonas y cirugía para menores está plenamente vigente.
    last_update: "2026-09-17"
    url: https://www.genderjustice.us/work/td-v-wrigley/
    sources: [gj-supreme, gj-district]
