status_summary:
  en: >-
    Gender-affirming care is legal and protected for adults and minors in Vermont. State law requires Medicaid and
    state-regulated private health plans to cover medically necessary gender-affirming care, and shield laws (2023,
    expanded 2025) protect patients and providers from other states' investigations and lawsuits.
  es: >-
    La atención de afirmación de género es legal y está protegida para adultos y menores en Vermont. La ley estatal
    exige que Medicaid y los planes privados regulados por el estado cubran la atención médicamente necesaria, y las
    leyes escudo (2023, ampliadas en 2025) protegen a pacientes y proveedores de investigaciones y demandas de otros
    estados.
adult_care:
  status: available
  detail:
    en: |
      No state restrictions. Vermont law defines gender-affirming health care as a "legally protected health care activity" and a legal right. Providers cannot be disciplined by Vermont licensing boards for providing it, and malpractice insurers cannot raise premiums for it.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **Vermont Medicaid (Green Mountain Care)** through Vermont Health Connect. It must cover medically necessary gender-affirming care.
      2. Go to a **community health center** (FQHC) such as Community Health Centers of Burlington, which charges on a sliding scale. Find others at findahealthcenter.hrsa.gov.
      3. Use the **Vermont Diversity Health Project** directory to find affirming prescribers near you, filtered for hormone therapy.
      4. Telehealth: **Plume** serves Vermont. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for people who qualify.
      5. If a plan denies care, call the **Health Care Advocate** HelpLine (1-800-917-7787), free.
    es: |
      Sin restricciones estatales. La ley de Vermont define la atención de afirmación de género como una "actividad de atención médica legalmente protegida" y un derecho. Los proveedores no pueden ser sancionados por las juntas de licencias de Vermont por brindarla.

      **Si no tienes seguro ni mucho dinero**:
      1. Solicita **Medicaid de Vermont (Green Mountain Care)** a través de Vermont Health Connect.
      2. Acude a un **centro de salud comunitario** como Community Health Centers of Burlington, con escala móvil. Busca otros en findahealthcenter.hrsa.gov.
      3. Usa el directorio del **Vermont Diversity Health Project** para encontrar proveedores afirmativos que recetan hormonas.
      4. Telesalud: **Plume** atiende Vermont. El **Fondo HRT de Point of Pride** paga atención hormonal por telesalud a quienes califican.
      5. Si tu plan niega atención, llama gratis al **Health Care Advocate** (1-800-917-7787).
  sources: [act-14-2023, act-15-2023, act-15-text, vdhp, chcb, vtlawhelp-hca, hrsa]
minor_care:
  status: available
  detail:
    en: |
      Legal. Vermont has no ban on gender-affirming care for minors, and its shield laws cover care for people of any age. Care for minors generally requires parental consent. The **UVM Children's Hospital Transgender Youth Program** in Burlington offers counseling, puberty blockers, menstrual suppression, and gender-affirming hormones following AAP, Endocrine Society, and WPATH guidelines, and helps patients move to adult care at 18.

      Act 20 of 2025 extended the shield law to bar Vermont agencies from cooperating with **federal** investigations into legally protected care performed in Vermont (except under court order), and lets prescribers and pharmacists ask that their names be left off gender-affirming prescription labels.
    es: |
      Legal. Vermont no prohíbe la atención de afirmación de género para menores, y sus leyes escudo cubren la atención a cualquier edad. La atención a menores generalmente requiere consentimiento de los padres. El **Programa de Jóvenes Transgénero del Hospital Infantil de UVM** en Burlington ofrece consejería, bloqueadores de pubertad, supresión menstrual y hormonas.

      La Ley 20 de 2025 amplió la ley escudo para impedir que agencias de Vermont cooperen con investigaciones **federales** sobre atención legalmente protegida realizada en Vermont (salvo por orden judicial), y permite que quienes recetan y farmacéuticos pidan que sus nombres no aparezcan en las etiquetas.
  sources: [act-14-2023, act-20-2025, uvm-typ]
medicaid:
  program_name: Vermont Medicaid (Green Mountain Care)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Since Act 15 of 2023, 8 V.S.A. § 4088m requires Medicaid and other health insurance plans to cover gender-affirming health care services that are medically necessary and clinically appropriate. Surgery (genital and chest) is covered with prior authorization under Health Care Administrative Rule 4.238 and DVHA's clinical criteria. Apply through **Vermont Health Connect** online, by phone, or with an in-person assister.
    es: |
      Desde la Ley 15 de 2023, 8 V.S.A. § 4088m exige que Medicaid y otros planes de salud cubran la atención de afirmación de género médicamente necesaria. La cirugía (genital y de pecho) está cubierta con autorización previa según la Regla 4.238 y los criterios clínicos de DVHA. Solicita a través de **Vermont Health Connect**.
  how_to_apply_url: https://info.healthconnect.vermont.gov/
  sources: [act-15-text, dvha-surgery, vhc]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      8 V.S.A. § 4088m requires individual and group health plans regulated by Vermont, and state employee plans, to cover medically necessary gender-affirming care included in the state's essential health benefits benchmark. Self-funded employer plans are federally regulated and may not be covered. If your plan denies care, appeal with the plan, get free help from the Health Care Advocate (1-800-917-7787), and file a complaint with the Department of Financial Regulation.
    es: |
      8 V.S.A. § 4088m exige que los planes de salud individuales y grupales regulados por Vermont, y los planes de empleados estatales, cubran la atención de afirmación de género médicamente necesaria. Los planes autofinanciados por empleadores pueden no estar incluidos. Si niegan la atención, apela con el plan, pide ayuda gratis al Health Care Advocate y presenta una queja ante el Departamento de Regulación Financiera.
  complaint_url: https://dfr.vermont.gov/consumers/file-complaint/insurance/insurance-complaints
  sources: [act-15-text, dfr-complaint, vtlawhelp-hca]
