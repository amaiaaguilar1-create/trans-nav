      en: Statewide LGBTQ+ center. Free rapid HIV testing (results in 20 minutes; drop-in Tuesdays and Thursdays noon to 6 p.m.), and the Vermont Diversity Health Project directory of affirming providers.
      es: Centro LGBTQ+ estatal. Pruebas rápidas de VIH gratuitas (resultados en 20 minutos; sin cita martes y jueves de 12 a 6 p.m.) y el directorio de proveedores afirmativos del Vermont Diversity Health Project.
    url: https://www.pridecentervt.org/programs/health/
    phone: "802-860-7812"
    address: 11 Elmwood Ave, Burlington, VT 05401
