jurisdiction: VT
slug: burlington
name: Burlington
area:
  en: Chittenden County (Burlington, South Burlington, Winooski, Essex, Colchester)
  es: Condado de Chittenden (Burlington, South Burlington, Winooski, Essex, Colchester)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details from the Vermont Judiciary's Chittenden Probate Division page (2026-09-24). Resources from org
    websites where they loaded. Outright Vermont (outrightvt.org) and Planned Parenthood of Northern New England
    returned HTTP 403 to automated fetching: their entries are marked unverified and carry no address; confirm
    services, ages, and the Burlington health center address. CHCB's LGBTQ+ page does not mention hormone therapy;
    confirm. Pride Center HIV testing drop-in hours (Tue/Thu 12-6) are from its health page and may change.
intro:
  en: >-
    Burlington is Vermont's largest city and the center of its trans services: the statewide Pride Center, the UVM
    Children's Hospital Transgender Youth Program, a sliding-scale community health center, and Planned Parenthood.
    Name change petitions for Chittenden County residents are filed at the Chittenden Probate Division on Main Street.
  es: >-
    Burlington es la ciudad más grande de Vermont y el centro de sus servicios trans: el Pride Center estatal, el
    Programa de Jóvenes Transgénero del Hospital Infantil de UVM, un centro de salud comunitario con escala móvil y
    Planned Parenthood. Las peticiones de cambio de nombre de residentes del condado de Chittenden se presentan en la
    División de Sucesiones de Chittenden en Main Street.
court:
  name: Vermont Superior Court, Chittenden Unit, Probate Division
  url: https://www.vermontjudiciary.org/court-locations/chittenden-probate-division
  self_help_url: https://www.vermontjudiciary.org/probate/name-changes
  filing_fee: 150
  notes:
    en: >-
      175 Main Street, Burlington, VT 05401; 802-651-1518; ChittendenUnit@vtcourts.gov. Open Monday to Friday 8 a.m. to
      4:30 p.m., closed the second Tuesday of each month from noon to 4 p.m. You can file in person, by mail, or by email.
      The fee is the same statewide.
    es: >-
      175 Main Street, Burlington, VT 05401; 802-651-1518; ChittendenUnit@vtcourts.gov. Abierto de lunes a viernes de
      8 a.m. a 4:30 p.m. Puedes presentar en persona, por correo o por correo electrónico.
  sources: [chittenden-probate, vtcourts-name-changes]
