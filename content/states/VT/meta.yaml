overview:
  en: >-
    Vermont is one of the most protective states for trans people. You can change the sex marker on your driver's
    license (M, F, or X) with no documentation and on a Vermont birth certificate (M, F, or X) with a notarized
    self-attestation. Name changes go through the probate court with a $150 fee, no newspaper publication, and a
    short hearing. State law requires Medicaid and state-regulated private plans to cover gender-affirming care, and
    shield laws passed in 2023 and expanded in 2025 protect patients and providers from other states' bans. Federal
    documents (passport, Social Security) are the exception: their sex fields are currently frozen nationwide.
  es: >-
    Vermont es uno de los estados que más protege a las personas trans. Puedes cambiar el marcador de sexo en tu
    licencia de conducir (M, F o X) sin documentación y en un acta de nacimiento de Vermont (M, F o X) con una
    declaración propia notarizada. Los cambios de nombre se tramitan en el tribunal de sucesiones (probate) con una
    tarifa de $150, sin publicación en periódico y con una audiencia breve. La ley estatal exige que Medicaid y los
    planes privados regulados por el estado cubran la atención de afirmación de género, y las leyes escudo de 2023,
    ampliadas en 2025, protegen a pacientes y proveedores de las prohibiciones de otros estados. Los documentos
    federales (pasaporte, Seguro Social) son la excepción: sus campos de sexo están congelados a nivel nacional.
