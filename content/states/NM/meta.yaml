overview:
  en: >-
    New Mexico is a protective state. Name changes go through the district court with no newspaper publication since
    2023, and the driver's license and birth certificate both offer M, F, or X by signing a sworn, notarized statement
    (no doctor's letter). State law bars public bodies from restricting gender-affirming care, and a 2023 shield law
    protects patients and providers from other states' investigations. Federal documents (passport, Social Security)
    are the exception: their sex fields are currently frozen nationwide.
  es: >-
    Nuevo México es un estado protector. Los cambios de nombre se tramitan en el tribunal de distrito y desde 2023 no
    requieren publicación en periódico, y la licencia de conducir y el acta de nacimiento ofrecen M, F o X firmando una
    declaración jurada notariada (sin carta médica). La ley estatal prohíbe que los organismos públicos restrinjan la
    atención de afirmación de género, y una ley escudo de 2023 protege a pacientes y proveedores de investigaciones de
    otros estados. Los documentos federales (pasaporte, Seguro Social) son la excepción: sus campos de sexo están
    congelados a nivel nacional.
