  notes: >-
    Court details from the Second Judicial District adult name change packet (rev. June 2023); confirm the $132 fee
    and clerk hours (505-841-7438). Resource list from org homepages on 2026-09-24. PFLAG Albuquerque and ACLU of New
    Mexico sites loaded but their services pages were not read. UNM Health's LGBTQ+ Collaborative has no program URL
    found and Truman Health Services' old URL 404'd. Planned Parenthood pages returned 403. First Choice's gender
    care and PrEP services are unconfirmed. Verify hours, walk-in policies, and new-patient availability before
    marking reviewed.
intro:
  en: >-
    Albuquerque has most of New Mexico's trans-specific services, including the Transgender Resource Center of New
    Mexico, which helps with ID document changes and keeps a provider directory. Name change petitions for Bernalillo
    County residents are filed with the Second Judicial District Court downtown.
  es: >-
    Albuquerque concentra la mayoría de los servicios específicos para personas trans de Nuevo México, incluido el
    Centro de Recursos Transgénero de Nuevo México, que ayuda con cambios de documentos y mantiene un directorio de
    proveedores. Las peticiones de cambio de nombre de residentes del condado de Bernalillo se presentan en el Segundo
    Tribunal de Distrito Judicial, en el centro.
court:
  name: Second Judicial District Court (Bernalillo County Courthouse)
  url: https://seconddistrict.nmcourts.gov/
  self_help_url: https://seconddistrict.nmcourts.gov/self-representation/civil-law/name-change/
  filing_fee: 132
  notes:
    en: File in the Clerk's Office, Room 119, first floor, 400 Lomas Blvd NW, weekdays 8 am to 4 pm (call 505-841-7438 to confirm hours). The court does not take personal checks. Ask the clerk about free process if you cannot afford the fee. After the judge signs, record a certified copy with the Bernalillo County Clerk ($25).
    es: Presenta en la oficina del secretario, sala 119, primer piso, 400 Lomas Blvd NW, de lunes a viernes de 8 am a 4 pm (llama al 505-841-7438 para confirmar). No aceptan cheques personales. Pide free process si no puedes pagar. Después de la firma del juez, registra una copia certificada con el secretario del condado de Bernalillo ($25).
  sources: [sjdc-instructions, sjdc-name-change]
