status_summary:
  en: >-
    Gender-affirming care is legal and protected for adults and minors in New Mexico. State law bars public bodies
    from restricting it, a shield law protects patients, providers, and helpers from other states' investigations,
    and Medicaid (Turquoise Care) is expected to cover it. Clinics are concentrated in Albuquerque, and several
    telehealth services cover the whole state.
  es: >-
    La atención de afirmación de género es legal y está protegida para adultos y menores en Nuevo México. La ley
    estatal prohíbe que los organismos públicos la restrinjan, una ley escudo protege a pacientes, proveedores y
    quienes ayudan frente a investigaciones de otros estados, y se espera que Medicaid (Turquoise Care) la cubra. Las
    clínicas se concentran en Albuquerque y varios servicios de telesalud cubren todo el estado.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. The **Reproductive and Gender-Affirming Health Care Freedom Act** (HB 7, 2023) forbids any public body, including state agencies, cities, counties, school districts, and public universities, from denying, restricting, or interfering with a person's ability to access or provide gender-affirming care within the medical standard of care, or from discriminating against someone for using it.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **Medicaid (Turquoise Care)**; adults with low incomes qualify.
      2. Go to a **community health center** (FQHC); they charge on a sliding scale. Find one at findahealthcenter.hrsa.gov. Ask whether they prescribe hormones on an informed-consent basis.
      3. Use a **telehealth** service that serves New Mexico (Plume, FOLX, Planned Parenthood).
      4. Apply to **Point of Pride's HRT Access Fund** for free telehealth hormone care.
      5. Ask **TGRCNM** for its trans-friendly provider directory.
    es: |
      Sin restricciones estatales. La **Ley de Libertad en la Atención de Salud Reproductiva y de Afirmación de Género** (HB 7, 2023) prohíbe que cualquier organismo público (agencias estatales, ciudades, condados, distritos escolares, universidades públicas) niegue, restrinja o interfiera con el acceso a la atención de afirmación de género dentro del estándar médico, o discrimine a alguien por usarla.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medicaid (Turquoise Care)**.
      2. Acude a un **centro de salud comunitario** con escala móvil (findahealthcenter.hrsa.gov). Pregunta si recetan hormonas por consentimiento informado.
      3. Usa un servicio de **telesalud** que atienda Nuevo México (Plume, FOLX, Planned Parenthood).
      4. Solicita el **Fondo de Acceso a TRH de Point of Pride**.
      5. Pide a **TGRCNM** su directorio de proveedores.
  sources: [hb7-text, hrsa, pop, tgrcnm]
minor_care:
  status: available
  detail:
    en: |
      Legal. HB 7 (2023) bars public bodies from restricting gender-affirming care within the standard of care, for people of any age. The **Reproductive and Gender-Affirming Health Care Protection Act** (SB 13, 2023) is New Mexico's shield law: public bodies may not help other states' investigations into protected care, out-of-state subpoenas need a sworn attestation, the governor may not extradite someone for care provided in New Mexico unless they were physically in the other state, and licensing boards may not discipline providers for care that is lawful in New Mexico. Care for minors follows clinical guidelines and requires parental consent. Families from states with bans can travel to New Mexico for care.
    es: |
      Legal. HB 7 (2023) prohíbe que los organismos públicos restrinjan la atención de afirmación de género dentro del estándar médico, para personas de cualquier edad. La **Ley de Protección de la Atención de Salud Reproductiva y de Afirmación de Género** (SB 13, 2023) es la ley escudo: los organismos públicos no pueden ayudar a investigaciones de otros estados, las citaciones de otros estados requieren una declaración jurada, el gobernador no puede extraditar a alguien por atención prestada en Nuevo México salvo que haya estado físicamente en el otro estado, y las juntas de licencias no pueden sancionar a proveedores por atención legal en Nuevo México. La atención a menores sigue guías clínicas y requiere consentimiento de los padres.
  sources: [hb7-text, sb13-text]
medicaid:
  program_name: Turquoise Care (New Mexico Medicaid)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: New Mexico's Medicaid program, Turquoise Care, is run by the Health Care Authority. HB 7 prohibits public bodies from denying or restricting access to gender-affirming care within the standard of care. Surgery usually needs prior authorization; ask your managed care plan for its criteria. If a claim is denied, ask for a written denial and appeal.
    es: El programa de Medicaid de Nuevo México, Turquoise Care, lo administra la Autoridad de Atención Médica (HCA). HB 7 prohíbe que los organismos públicos nieguen o restrinjan la atención de afirmación de género. La cirugía suele requerir autorización previa; pregunta a tu plan sus criterios. Si niegan un reclamo, pide la negación por escrito y apela.
  how_to_apply_url: https://www.hca.nm.gov/turquoise-care/
  sources: [hca-turquoise, hb7-text]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: New Mexico's insurance regulator (Office of Superintendent of Insurance) is reported to prohibit blanket transgender exclusions in state-regulated plans. Self-funded employer plans are regulated federally, not by the state. If your plan denies gender-affirming care, file a complaint with OSI.
    es: Se informa que el regulador de seguros de Nuevo México (OSI) prohíbe exclusiones generales para personas trans en planes regulados por el estado. Los planes autofinanciados de empleadores se regulan a nivel federal. Si tu plan niega la atención, presenta una queja ante OSI.
  complaint_url: https://osi.state.nm.us/en/complaints/
  sources: [osi-complaints]
