overview:
  en: >-
    Arizona sits in the middle. Adults can change their name through a standard Superior Court petition with no
    newspaper publication, though a short hearing is required. The driver's license sex marker (M or F only) can be
    changed with a letter from a licensed physician. The birth certificate is harder: the state requires a physician's
    statement of a "sex change operation" or a court order. Hormone therapy is legal for adults and minors, but
    surgery is banned under 18 (A.R.S. § 32-3230) and AHCCCS (Medicaid) excludes gender-affirming surgery.
  es: >-
    Arizona está en un punto intermedio. Las personas adultas pueden cambiar su nombre con una petición estándar en el
    Tribunal Superior sin publicación en periódico, aunque se requiere una audiencia breve. El marcador de sexo de la
    licencia de conducir (solo M o F) se puede cambiar con una carta de un médico con licencia. El acta de nacimiento
    es más difícil: el estado exige una declaración médica de una "operación de cambio de sexo" o una orden judicial.
    La terapia hormonal es legal para adultos y menores, pero la cirugía está prohibida antes de los 18 años
    (A.R.S. § 32-3230) y AHCCCS (Medicaid) excluye la cirugía de afirmación de género.
