status_summary:
  en: >-
    Hormone therapy is legal in Arizona for adults and, with parental consent, for minors. Gender-affirming surgery is
    banned for people under 18 (A.R.S. § 32-3230), and AHCCCS (Medicaid) excludes gender reassignment surgery for
    everyone. No state law bars private insurance exclusions, and there is no shield law.
  es: >-
    La terapia hormonal es legal en Arizona para adultos y, con consentimiento de los padres, para menores. La cirugía
    de afirmación de género está prohibida para menores de 18 años (A.R.S. § 32-3230), y AHCCCS (Medicaid) excluye la
    cirugía de reasignación de género para todas las edades. Ninguna ley estatal prohíbe las exclusiones en seguros
    privados y no hay ley escudo.
adult_care:
  status: restricted
  detail:
    en: |
      Adults can legally get hormone therapy from any willing provider, including by telehealth. The restriction is financial: **AHCCCS excludes gender reassignment surgeries** (Ariz. Admin. Code R9-22-205), and state law does not require private plans to cover gender-affirming care.

      **If you have little money**, in rough order:
      1. Apply for **AHCCCS**. It covers primary care, labs, and prescriptions. Ask your plan whether hormones are on its formulary.
      2. Go to a **community health center** (FQHC), which charges on a sliding scale. Find one at findahealthcenter.hrsa.gov.
      3. **Planned Parenthood Arizona** and telehealth services (Plume, FOLX) prescribe hormones on an informed-consent basis.
      4. **Point of Pride** runs an annual HRT access fund.
    es: |
      Las personas adultas pueden recibir terapia hormonal legalmente de cualquier proveedor dispuesto, incluso por telesalud. La restricción es económica: **AHCCCS excluye las cirugías de reasignación de género** (R9-22-205), y la ley estatal no obliga a los planes privados a cubrir la atención de afirmación de género.

      **Si tienes poco dinero**, en orden aproximado:
      1. Solicita **AHCCCS**. Cubre atención primaria, laboratorios y recetas. Pregunta a tu plan si las hormonas están en su formulario.
      2. Acude a un **centro de salud comunitario**, que cobra en escala móvil. Búscalo en findahealthcenter.hrsa.gov.
      3. **Planned Parenthood Arizona** y servicios de telesalud (Plume, FOLX) recetan hormonas por consentimiento informado.
      4. **Point of Pride** tiene un fondo anual de acceso a hormonas.
  sources: [aac-r9-22-205, hrsa]
minor_care:
  status: restricted
  detail:
    en: |
      **A.R.S. § 32-3230** (SB 1138, 2022) bars physicians from performing "irreversible gender reassignment surgery" on anyone under 18. The law lists genital surgeries, hysterectomy and oophorectomy, breast augmentation, and mastectomy. It has exceptions for differences of sex development and medical emergencies. Arizona law does **not** ban puberty blockers or hormone therapy for minors; these remain legal with parental consent, subject to each provider's policies. Arizona has no shield statute.
    es: |
      El **A.R.S. § 32-3230** (SB 1138, 2022) prohíbe a los médicos realizar "cirugía irreversible de reasignación de género" a menores de 18 años, incluidas cirugías genitales, histerectomía, ooforectomía, aumento de senos y mastectomía, con excepciones para diferencias del desarrollo sexual y emergencias médicas. La ley de Arizona **no** prohíbe los bloqueadores de pubertad ni la terapia hormonal para menores; siguen siendo legales con consentimiento de los padres. Arizona no tiene ley escudo.
  sources: [ars-32-3230, sb1138]
medicaid:
  program_name: AHCCCS (Arizona Health Care Cost Containment System)
  covers_hrt: unclear
  covers_surgery: "no"
  detail:
    en: |
      AHCCCS rules list "gender reassignment surgeries" among excluded services (Ariz. Admin. Code R9-22-205(B)(4)(a)), for all ages. No written exclusion of hormone therapy was found in AHCCCS rules or the AHCCCS Medical Policy Manual. Coverage of hormones depends on your plan's formulary and prior-authorization rules. If a prescription is denied, ask your plan for the reason in writing and file a grievance.
    es: |
      Las reglas de AHCCCS excluyen las "cirugías de reasignación de género" (R9-22-205(B)(4)(a)) para todas las edades. No se encontró una exclusión escrita de la terapia hormonal en las reglas ni en el manual de políticas médicas. La cobertura de hormonas depende del formulario de tu plan y de sus reglas de autorización previa. Si te niegan una receta, pide el motivo por escrito y presenta una queja.
  how_to_apply_url: https://www.healthearizonaplus.gov/
  sources: [aac-r9-22-205, ahcccs-ampm]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: No Arizona statute bars state-regulated health plans from excluding gender-affirming care, so check your plan's exclusions list. Federal law (ACA Section 1557) may still help in some cases. If your plan denies care, appeal with the plan first, then file a complaint or request an external review with the Arizona Department of Insurance and Financial Institutions. The Trans Health Project and Transgender Law Center have appeal templates.
    es: Ninguna ley de Arizona impide que los planes regulados por el estado excluyan la atención de afirmación de género, así que revisa las exclusiones de tu plan. Si te niegan atención, apela primero ante el plan y luego presenta una queja o pide una revisión externa ante el Departamento de Seguros e Instituciones Financieras de Arizona.
  complaint_url: https://difi.az.gov/
  sources: [difi]
