    url: https://www.azleg.gov/ars/12/00601.htm
    title: A.R.S. § 12-601, Application; venue; judgment; sealing of record
    publisher: Arizona State Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: A person who desires to change the person's name and to adopt another name may file an application in the superior court in the county of the person's residence
  - id: maricopa-cvnca10p
    url: https://superiorcourt.maricopa.gov/media/2152/cvnca10pz.pdf
    title: "CVNCA10p: How to file for a change of name for an adult with no minor children"
    publisher: Superior Court of Arizona in Maricopa County, Law Library Resource Center
    kind: court
    accessed: "2026-09-24"
    quote: All hearings will occur virtually unless otherwise ordered by the Court.
  - id: maricopa-cvnca1
    url: https://superiorcourt.maricopa.gov/llrc/civil_cvnca1/
    title: Application for Change of Name of an Adult with No Minor Children (CVNCA1)
    publisher: Superior Court of Arizona in Maricopa County
    kind: form
    accessed: "2026-09-24"
  - id: maricopa-civil-forms
    url: https://superiorcourt.maricopa.gov/llrc/civil-court-forms/
    title: Civil Department Court Forms
    publisher: Superior Court of Arizona in Maricopa County
    kind: court
    accessed: "2026-09-24"
  - id: azcourts-fees
    url: https://www.azcourts.gov/courtfilingfees/Superior-Court-Filing-Fees
    title: Superior Court Filing Fees
    publisher: Arizona Judicial Branch
    kind: official
    accessed: "2026-09-24"
    quote: Petition for name change (Class A), $222 base fee, $252 total with surcharges (AO 2024-210, effective December 28, 2024).
  - id: azcourts-fee-waiver
    url: https://www.azcourts.gov/courtfilingfees/Fee-Waivers-and-Deferrals
    title: Fee Waivers and Deferrals
    publisher: Arizona Judicial Branch
    kind: official
    accessed: "2026-09-24"
    quote: If your income is between 150% and 225% of the current poverty level, or you have extraordinay expenses, the court may set a payment plan.
  - id: a4te-az
    url: https://transequality.org/documents/arizona-identity-documents
    title: Arizona identity documents
    publisher: Advocates for Trans Equality
    kind: org
    accessed: "2026-09-24"
  - id: tsaz-aid
    url: https://tsaz.org/aid/
    title: Affirming Identification Assistance
    publisher: Trans Spectrum of Arizona
    kind: org
    accessed: "2026-09-24"
    quote: This scholarship will not pay court or legal fees for acquiring your legal name change, only for the updated identification documents.
