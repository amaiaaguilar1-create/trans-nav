statutes:
  - cite: Ley Núm. 24 de 22 de abril de 1931, Art. 31 (24 LPRA § 1231)
    title:
      en: Registro Demográfico law; name changes by sworn petition with notice to the Ministerio Público
      es: Ley del Registro Demográfico; cambios de nombre por petición juramentada con notificación al Ministerio Público
    url: https://bvirtualogp.pr.gov/ogp/Bvirtual/leyesreferencia/PDF/Salud/24-1931/24-1931.pdf
related_links:
  - title: Advocates for Trans Equality, Puerto Rico identity documents
    url: https://transequality.org/documents/puerto-rico-identity-documents
    note:
      en: Undated page; its $75 filing fee is older than the court's current $78.
      es: Página sin fecha; su arancel de $75 es anterior al actual de $78 del tribunal.
  - title: Poder Judicial, Cambio de nombre ante el Tribunal
    url: https://poderjudicial.pr/educacion-a-la-comunidad/informacion-sobres-temas-legales/casos-civiles/cambio-de-nombre-ante-el-tribunal/
sources:
  - id: ley-24-1931
    url: https://bvirtualogp.pr.gov/ogp/Bvirtual/leyesreferencia/PDF/Salud/24-1931/24-1931.pdf
    title: Ley del Registro Demográfico de Puerto Rico (Ley 24-1931), consolidated text rev. April 16, 2024
    publisher: Oficina de Gerencia y Presupuesto
    kind: statute
    accessed: "2026-09-24"
    quote: >-
      El cambio, adición o modificación de nombre o apellido sólo podrá hacerse a instancia del interesado... Transcurridos
