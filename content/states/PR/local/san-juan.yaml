name: San Juan
area:
  en: San Juan metropolitan area (San Juan, Guaynabo, Bayamón, Carolina, Trujillo Alto)
  es: Área metropolitana de San Juan (San Juan, Guaynabo, Bayamón, Carolina, Trujillo Alto)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Starter list, drafted 2026-09-24. The TransSalud address and prices come from its own site. Centro Ararat's San Juan
    addresses come from its own clinics page, but the trans-specific "Clínica Translucent" name comes only from
    directories. Centro Comunitario LGBTT de Puerto Rico has only a Facebook page and an old Weebly site with an address
    (Calle Mayagüez 37, Hato Rey) that may be out of date, so it is listed as unverified. We could not find websites for
    CAFT (Comité Amigos y Familiares de Trans) or CoRE's trans clinic; they are omitted. Taller Salud (Loíza) is a
    feminist community health organization, not trans-specific; not listed. There is no Planned Parenthood in Puerto Rico.
    Court: the San Juan Superior Court is in the Centro Judicial de San Juan, Hato Rey (A4TE gives Ave. Muñoz Rivera esq.
    Coll y Toste, Parada 37); confirm.
intro:
  en: >-
    The San Juan metro area has most of Puerto Rico's trans-focused services: community clinics offering hormone therapy
    to adults 21 and older, PrEP and HIV testing, legal aid, and LGBTQ+ organizations. Name change petitions are filed at
    the Superior Court in the Centro Judicial de San Juan. Remember that Ley 63-2025 bans hormones and surgery for anyone
    under 21.
  es: >-
    El área metropolitana de San Juan concentra la mayoría de los servicios para personas trans en Puerto Rico: clínicas
    comunitarias que ofrecen terapia hormonal a personas de 21 años o más, PrEP y pruebas de VIH, ayuda legal y
    organizaciones LGBTQ+. Las peticiones de cambio de nombre se presentan en la Sala Superior del Centro Judicial de San
    Juan. Recuerda que la Ley 63-2025 prohíbe las hormonas y la cirugía a toda persona menor de 21 años.
court:
  name: Tribunal de Primera Instancia, Región Judicial de San Juan, Sala Superior (Centro Judicial de San Juan)
  url: https://poderjudicial.pr/educacion-a-la-comunidad/informacion-sobres-temas-legales/casos-civiles/cambio-de-nombre-ante-el-tribunal/
  self_help_url: https://poderjudicial.pr/formularios/
  filing_fee: 78
  notes:
    en: File OAT 1896 at the Secretaría (you can swear it there for free) and give a copy to the Fiscalía of the San Juan region the same day. Ask at the courthouse for the Centro Pro Se, which helps people without a lawyer.
    es: Presenta el OAT 1896 en la Secretaría (puedes juramentarlo allí gratis) y entrega copia a la Fiscalía de la región de San Juan el mismo día. Pregunta en el tribunal por el Centro Pro Se, que orienta a quienes no tienen abogado.
  sources: [pj-cambio-nombre, pj-aranceles]
resources:
  - id: transsalud
    name: Clínica TransSalud
    type: hrt_clinic
    pillars: [hrt, sexual_health, mental_health]
    description:
      en: LGBTQ+ primary care clinic with hormone therapy for adults, PrEP, free HIV testing, and telemedicine follow-up. Posted prices ($80 first virtual visit, $99 basic hormone labs) and a membership for uninsured patients.
      es: Clínica de cuidado primario LGBTQ+ con terapia hormonal para adultos, PrEP, pruebas de VIH gratis y seguimiento por telemedicina. Precios publicados ($80 primera visita virtual, $99 laboratorios básicos) y membresía para pacientes sin plan.
    url: https://transsalud.org/
    address: Carr. 21 U3-2, Las Lomas, San Juan, PR 00921
    cost: paid
    accepts_uninsured: true
    telehealth: true
    languages: [Español]
