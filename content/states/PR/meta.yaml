  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate: ID documents marked mixed because F/M changes are available by clinician letter on the license and birth
    certificate, but there is no X option (the First Circuit reversed the X ruling on 2026-09-03) and RCC 185 (in committee)
    would push agencies to use only "biological sex". Care marked restrictive because of Ley 63-2025 (ban under 21,
    public funds bar). No shield law. Spanish is the primary language; Spanish text was drafted first and should be
    reviewed by a native Puerto Rican Spanish speaker.
overview:
  en: >-
    Puerto Rico lets people born there change the gender on their birth certificate to F or M without a court order,
    and anyone with a Puerto Rico license can update its gender with a clinician's signature. There is no X option.
    Name changes go through the Tribunal de Primera Instancia (or a notary) with no newspaper publication. **Ley
    63-2025 bans hormones and gender-affirming surgery for everyone under 21** and bars public funds from paying for it.
    Care is legal for adults 21 and older.
  es: >-
    Puerto Rico permite a las personas nacidas allí cambiar el género en su certificado de nacimiento a F o M sin orden
    judicial, y cualquier persona con licencia de Puerto Rico puede actualizar su género con la firma de un profesional
    clínico. No hay opción X. Los cambios de nombre se tramitan en el Tribunal de Primera Instancia (o ante notario) sin
    publicación en periódicos. **La Ley 63-2025 prohíbe las hormonas y la cirugía de afirmación de género para toda
    persona menor de 21 años** y prohíbe usar fondos públicos para pagarlas. La atención es legal para personas de 21
    años o más.
