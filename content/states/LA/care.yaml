status_summary:
  en: >-
    Adults can legally get hormone therapy and other gender-affirming care in Louisiana, but Louisiana Medicaid is
    reported to exclude it, state law does not stop private plans from excluding it, and there is no Planned Parenthood
    health center in the state since October 2025. Since January 1, 2024, hormones, puberty blockers, and surgery are
    banned for anyone under 18; a state-court challenge is headed to trial and the ban remains in effect.
  es: >-
    Los adultos pueden recibir legalmente terapia hormonal y otra atención de afirmación de género en Luisiana, pero
    según informes Medicaid de Luisiana la excluye, la ley estatal no impide que los planes privados la excluyan y no
    hay un centro de Planned Parenthood en el estado desde octubre de 2025. Desde el 1 de enero de 2024, las hormonas,
    los bloqueadores de pubertad y la cirugía están prohibidos para menores de 18 años; una demanda en tribunal estatal
    va a juicio y la prohibición sigue vigente.
adult_care:
  status: restricted
  detail:
    en: |
      There is no state law against gender-affirming care for adults 18 and older, and telehealth prescribing is allowed. The restriction is **coverage**: Louisiana Medicaid reportedly excludes transgender-related care, and no state law requires private insurers to cover it. Louisiana has no shield law.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Go to a **community health center** (FQHC). They must see you regardless of ability to pay and charge on a sliding scale. In New Orleans, **CrescentCare** offers gender-affirming primary care. Find others at findahealthcenter.hrsa.gov and on Louisiana Trans Advocates' provider list.
      2. **Telehealth**: Plume serves Louisiana adults (self-pay, about $99 a month plus labs and medication).
      3. **Point of Pride's HRT Access Fund** pays for 18 months of telehealth hormone care (applications each May); **Genderbands** gives small grants.
      4. Generic spironolactone and estradiol are usually cheap with a pharmacy discount coupon; ask the pharmacy for the cash price.
    es: |
      No hay ley estatal contra la atención de afirmación de género para adultos de 18 años o más, y la telesalud está permitida. La restricción es la **cobertura**: según informes, Medicaid de Luisiana excluye la atención trans y ninguna ley estatal obliga a los seguros privados a cubrirla. Luisiana no tiene ley escudo.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Acude a un **centro de salud comunitario**. Deben atenderte sin importar tu capacidad de pago y cobran en escala móvil. En Nueva Orleans, **CrescentCare** ofrece atención primaria de afirmación de género. Busca otros en findahealthcenter.hrsa.gov y en la lista de proveedores de Louisiana Trans Advocates.
      2. **Telesalud**: Plume atiende a adultos en Luisiana (pago directo, unos $99 al mes más laboratorios y medicamentos).
      3. El **Fondo de Acceso a TRH de Point of Pride** paga 18 meses de atención hormonal por telesalud (solicitudes cada mayo); **Genderbands** otorga pequeñas becas.
      4. La espironolactona y el estradiol genéricos suelen ser baratos con un cupón de descuento de farmacia.
  sources: [map-medicaid, crescentcare-search, hrsa, pop-hrt, lta-providers, ppgc]
minor_care:
  status: prohibited
  detail:
    en: |
      The **Stop Harming Our Kids Act** (Act 466 of 2023, HB 648; La. R.S. 40:1098.1 to 1098.6), in effect since **January 1, 2024**, bars health care professionals from giving anyone under 18 puberty blockers, cross-sex hormones, or gender-affirming surgery. Minors cannot consent to these treatments. The grace period for tapering existing patients ended December 31, 2024. Exceptions cover intersex conditions and complications of prohibited treatment.

      **Penalties:** a licensing board that finds a violation must revoke the provider's license for at least two years; people harmed can sue for damages until 12 years after turning 18 (consent is no defense); and the attorney general can sue.

      Mental health care and therapy are **not** banned. Families can travel to states where care is legal; the Campaign for Southern Equality's Trans Youth Emergency Project offers navigation and $500 renewable travel grants.

      **Litigation:** *Soe v. Louisiana State Board of Medical Examiners* (19th Judicial District Court, East Baton Rouge) challenges the ban under the Louisiana Constitution. In January 2026 the court denied the state's motion for summary judgment and the case is moving toward trial. The ban has not been blocked.
    es: |
      La **Ley Stop Harming Our Kids** (Ley 466 de 2023, HB 648; La. R.S. 40:1098.1 a 1098.6), vigente desde el **1 de enero de 2024**, prohíbe que profesionales de la salud den a menores de 18 años bloqueadores de pubertad, hormonas o cirugía de afirmación de género. Los menores no pueden consentir estos tratamientos. El período para reducir gradualmente tratamientos existentes terminó el 31 de diciembre de 2024. Hay excepciones para condiciones intersexuales.

      **Sanciones:** la junta de licencias debe revocar la licencia del proveedor por al menos dos años; las personas afectadas pueden demandar hasta 12 años después de cumplir 18; y el procurador general puede demandar.

      La salud mental y la terapia **no** están prohibidas. Las familias pueden viajar a estados donde la atención es legal; el Trans Youth Emergency Project de Campaign for Southern Equality ofrece orientación y becas de viaje renovables de $500.

      **Litigio:** *Soe v. Louisiana State Board of Medical Examiners* impugna la prohibición bajo la Constitución de Luisiana. En enero de 2026 el tribunal negó el juicio sumario del estado y el caso avanza a juicio. La prohibición no ha sido bloqueada.
  sources: [rs-40-1098-2, rs-40-1098-3, rs-40-1098-5, soe-case, cse-la]
medicaid:
  program_name: Louisiana Medicaid (Healthy Louisiana)
  covers_hrt: unclear
  covers_surgery: "no"
  detail:
    en: |
      The Movement Advancement Project reports that Louisiana Medicaid policy explicitly excludes transgender-related health care for people of all ages. We could not confirm the exact policy text or whether hormone prescriptions are denied in practice; some community health centers accept Medicaid for primary care visits. For minors, the 2023 ban also applies. If a claim is denied, CrescentCare Legal Services' Transgender Rights Project handles coverage denials for trans clients.

      Louisiana expanded Medicaid, so adults with income up to about 138% of the federal poverty level can qualify. Apply through LDH's Medicaid site.
    es: |
      El Movement Advancement Project informa que la política de Medicaid de Luisiana excluye explícitamente la atención trans para todas las edades. No pudimos confirmar el texto exacto ni si las recetas de hormonas se niegan en la práctica. Para menores también aplica la prohibición de 2023. Si te niegan un reclamo, el Proyecto de Derechos Trans de CrescentCare Legal Services atiende negaciones de cobertura.

      Luisiana amplió Medicaid, así que los adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza pueden calificar. Solicita en el sitio de Medicaid de LDH.
  how_to_apply_url: https://ldh.la.gov/medicaid
  sources: [map-medicaid, ldh-medicaid, crescentcare-search]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Louisiana has no state law barring insurers from excluding gender-affirming care, so coverage depends on your plan. Read your plan's exclusions list, ask for a written denial, and appeal. The Trans Health Project has free appeal templates, and CrescentCare Legal Services helps with denials. The Louisiana Department of Insurance takes complaints about state-regulated plans; self-funded employer plans are federally regulated.
    es: |
      Luisiana no tiene una ley que impida a las aseguradoras excluir la atención de afirmación de género, así que la cobertura depende de tu plan. Revisa las exclusiones, pide la negación por escrito y apela. El Trans Health Project tiene plantillas gratuitas y CrescentCare Legal Services ayuda con negaciones. El Departamento de Seguros de Luisiana recibe quejas sobre planes regulados por el estado.
  sources: [map-profile, thp, crescentcare-search]
