litigation:
  - case: Soe v. Louisiana State Board of Medical Examiners
    court: 19th Judicial District Court, East Baton Rouge Parish
    summary:
      en: Five trans youth and their families, represented by Lambda Legal and Harvard's Center for Health Law and Policy Innovation, argue the minors' care ban violates the Louisiana Constitution (parental rights, right to medical treatment, sex discrimination).
      es: Cinco jóvenes trans y sus familias argumentan que la prohibición viola la Constitución de Luisiana.
    effect_today:
      en: The ban is in effect. In January 2026 the court denied the state's motion for summary judgment, so the case goes to trial.
      es: La prohibición está vigente. En enero de 2026 el tribunal negó el juicio sumario del estado y el caso irá a juicio.
    last_update: "2026-01-31"
    url: https://lambdalegal.org/case/soe-v-louisiana-state-board-of-medical-examiners/
    sources: [soe-case]
