review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Drafted 2026-09-24 from legis.la.gov (R.S. 13:4751-4755, 40:62, 40:1098.1-.6, 9:55-65, 1:8), OMV policies on
    PowerDMS, LDH vital records pages, and org websites. Act 814 of 2026 (HB 578, "Restoring Biological Truth Act",
    effective Aug. 1, 2026) adds a statewide biological definition of "sex" to R.S. 1:8; its effect on OMV and vital
    records practice is not yet documented anywhere we could find. Reviewer: confirm current OMV practice.
overview:
  en: >-
    Louisiana lets adults change their name by petition in district court with no newspaper publication. Changing the
    sex marker is much harder: the Office of Motor Vehicles' written policy asks for a physician's statement that you
    have had a "successful gender change/reassignment," and a new birth certificate requires a court judgment based on
    proof of surgery. A 2026 law (Act 814) defines "sex" throughout state law as sex observed at birth, and it is not
    yet clear how agencies will apply it. Gender-affirming medical care for minors has been banned since January 1,
    2024; adults can get care, but Louisiana Medicaid reportedly excludes it and there is no shield law.
  es: >-
    Luisiana permite a las personas adultas cambiar su nombre mediante una petición ante el tribunal de distrito, sin
    publicación en periódico. Cambiar el marcador de sexo es mucho más difícil: la política escrita de la Oficina de
    Vehículos Motorizados pide una declaración médica de que tuviste un "cambio/reasignación de género exitoso", y una
    nueva acta de nacimiento requiere una sentencia judicial basada en prueba de cirugía. Una ley de 2026 (Ley 814)
    define "sexo" en toda la ley estatal como el sexo observado al nacer, y aún no está claro cómo la aplicarán las
    agencias. La atención médica de afirmación de género para menores está prohibida desde el 1 de enero de 2024; los
    adultos pueden recibirla, pero según informes Medicaid de Luisiana la excluye y no hay ley escudo.
