  notes: >-
    Court fee from the Orleans Parish Civil Clerk's July 1, 2026 fee schedule. The Civil District Court's own site
    (orleanscdc.com) did not resolve for automated fetching, so the clerk's site is used. Resources from org websites
    2026-09-24. BreakOUT! (youthbreakout.org) returned 403, and Real Name Campaign NOLA, House of Tulip, and the
    Tulane clinics could not be loaded; they are not listed and should be checked by a human. Planned Parenthood's
    New Orleans health center closed September 30, 2025. Confirm CrescentCare's current hormone therapy intake.
intro:
  en: >-
    New Orleans has the state's largest cluster of trans-affirming services, centered on CrescentCare, a sliding-scale
    community health center with LGBTQ primary care, PrEP, and same-day STI testing, and on free legal help from
    CrescentCare Legal Services and local legal aid groups. Name change petitions for Orleans Parish residents are
    filed at Civil District Court on Loyola Avenue.
  es: >-
    Nueva Orleans tiene la mayor concentración de servicios afirmativos para personas trans del estado, centrada en
    CrescentCare, un centro de salud comunitario con escala móvil que ofrece atención primaria LGBTQ, PrEP y pruebas de
    ITS el mismo día, y en la ayuda legal gratuita de CrescentCare Legal Services y grupos locales. Las peticiones de
    cambio de nombre de residentes de Orleans se presentan en el Tribunal Civil de Distrito en Loyola Avenue.
court:
  name: Civil District Court for the Parish of Orleans (Clerk of Court, Civil Division)
  url: https://www.orleanscivilclerk.com/
  filing_fee: 250
  notes:
    en: File at the Civil Division, 421 Loyola Avenue, Room 402 (504-407-0000). The petition for name change fee is $250 ($225 plus $25 building fund) as of July 1, 2026; certified copies are $3 per page. The clerk's forms page has the In Forma Pauperis affidavit.
    es: Presenta en la División Civil, 421 Loyola Avenue, Sala 402 (504-407-0000). La tarifa de la petición de cambio de nombre es $250 desde el 1 de julio de 2026; las copias certificadas cuestan $3 por página. La página de formularios del secretario tiene la declaración In Forma Pauperis.
  sources: [orleans-fees, orleans-forms]
