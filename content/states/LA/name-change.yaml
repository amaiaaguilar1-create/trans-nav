      es: Asistencia legal civil gratuita en todo el estado para personas con ingresos elegibles con asuntos legales relacionados con su condición transgénero o de VIH. Oficinas en Nueva Orleans y Baton Rouge, con cita; 504-821-2601.
    url: https://www.crescentcare.org/service/cc-legal-services/
    phone: "504-821-2601"
    cost: free
    verification: org_website
    sources: [crescentcare-legal, crescentcare-search]
