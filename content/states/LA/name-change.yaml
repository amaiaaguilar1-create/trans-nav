      en: LSC-funded legal aid for low-income people in southeast Louisiana parishes, including Medicaid and benefits problems. Apply online. As an LSC-funded program, it can sign the pauper declaration that helps you get the court fee waived.
      es: Asistencia legal financiada por la LSC para personas de bajos ingresos en el sureste de Luisiana, incluidos problemas de Medicaid y beneficios. Solicita en línea.
