    name: Louisiana Trans Advocates, ID Documents Center
    type: advocacy_org
    pillars: [name_change, gender_marker]
    description:
      en: Free step-by-step name change instructions with model petition and judgment, plus a physician statement form for the OMV gender marker change.
      es: Instrucciones gratuitas paso a paso para el cambio de nombre con modelo de petición y sentencia, además de un formulario de declaración médica para la OMV.
    url: https://www.latransadvocates.org/id-documents-center
    phone: "504-450-7496"
    cost: free
    verification: org_website
