  notes: >-
    R.S. 40:62 text read on legis.la.gov 2026-09-24 (Title 40 not yet marked updated for the 2026 session). Act 814 of
    2026 (HB 578) is not listed as amending R.S. 40:62 in its résumé digest, but it adds a statewide biological
    definition of "sex" in R.S. 1:8 effective Aug. 1, 2026; how courts and Vital Records will treat new R.S. 40:62
    petitions is unknown. Reviewer: confirm with LDH Vital Records (504-593-5100) whether R.S. 40:62 judgments are
