  notes: >-
    Climate: id_documents mixed (DL and birth certificate changes still available with a physician form, but name
    changes need publication and SB 456 (2025) defines sex as sex at birth, creating risk); care restrictive (minor ban
    with no exceptions since Aug. 2025; Medicaid surgery exclusion upheld March 2026). No shield law. Fairness WV
    reports no anti-LGBTQ+ bill passed in the 2026 session.
overview:
  en: >-
    West Virginia still lets you change the sex on your driver's license and birth certificate (M or F) with a form
    signed by a physician, but a 2025 law (SB 456) defines sex as sex observed at birth, so confirm with each agency
    before applying. Name changes require a court hearing and a newspaper notice. Adults can get hormone therapy,
    while all transition-related medical care for minors is banned, and a 2026 federal ruling lets Medicaid refuse to
    cover surgery. There is no shield law.
  es: >-
    Virginia Occidental aún permite cambiar el sexo en la licencia y el acta de nacimiento (M o F) con un formulario
    firmado por un médico, pero una ley de 2025 (SB 456) define el sexo como el observado al nacer, así que confirma
    con cada agencia antes de solicitar. Los cambios de nombre requieren audiencia y aviso en el periódico. Los
    adultos pueden recibir terapia hormonal; toda la atención médica de transición para menores está prohibida, y un
    fallo federal de 2026 permite a Medicaid no cubrir la cirugía. No hay ley escudo.
