litigation:
  - case: Anderson v. Crouch (consolidated with Kadel v. Folwell)
    court: U.S. Court of Appeals for the Fourth Circuit
    summary:
      en: >-
        Class action by transgender West Virginia Medicaid members challenging the exclusion of gender-affirming
        surgery. Won in district court (2022) and at the en banc Fourth Circuit (2024); the Supreme Court vacated that
        ruling in June 2025 after Skrmetti. On March 10, 2026 the Fourth Circuit reversed, and rehearing was denied May
        29, 2026.
      es: >-
        Demanda colectiva contra la exclusión de cirugía en Medicaid. Tras la anulación de la Corte Suprema en 2025, el
        Cuarto Circuito falló a favor del estado el 10 de marzo de 2026.
    effect_today:
      en: West Virginia Medicaid is no longer under a court order to cover surgery. Hormone coverage is not affected.
      es: Medicaid ya no está obligado por un tribunal a cubrir la cirugía. La cobertura de hormonas no cambia.
    last_update: "2026-05-29"
    url: https://lambdalegal.org/case/fain-v-crouch/
    sources: [lambda-anderson]
