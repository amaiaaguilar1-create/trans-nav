  confidence: medium
  es_status: machine_draft
  notes: >-
    Minor ban read directly in W. Va. Code 30-3-20 and 30-14-17 (HB 2007, 2023, effective Jan. 1, 2024; SB 299, 2025,
    effective Aug. 1, 2025, removed the earlier exception and extended the ban to PAs (30-3E-20) and APRNs (30-7-15f),
    and added a telehealth-rule prohibition for under-18s in 30-1-26). No active challenge to the minor ban found.
    Medicaid: Lambda Legal's Anderson v. Crouch page (read 2026-09-24) says the Fourth Circuit on remand reversed on
    March 10, 2026 and allowed the surgery exclusion to stand; rehearing en banc denied May 29, 2026. BMS Policy 519.24
    Gender Affirmation Surgery (effective 8/1/2023, adopted under the district court order) is STILL POSTED on
    bms.wv.gov; we could not confirm whether BMS has rescinded it or resumed denials, so covers_surgery is unclear.
    HRT coverage marked yes: the challenged exclusion covered surgery only, Policy 519.24 presumes Medicaid-covered
    hormone therapy, and MAP scores WV Medicaid policy 1/1; not confirmed on the pharmacy PDL. Private insurance: no
    WV law bars exclusions (MAP 0/1). Women's Health Center of WV GAHT and PrEP pages read directly; minimum age not
    stated (18 by law). WVU Medicine pages returned 403; Marshall Health had no findable trans-care page; Planned
    Parenthood pages returned 403, so PP South Atlantic's WV availability is unverified. The kchd.org domain now
    redirects to an unrelated hospital, so the Kanawha-Charleston Health Department is omitted. QueerMed lists West
    Virginia as served on queermed.com/locations. FOLX and QueerDoc do not list WV.
status_summary:
  en: >-
    Adults can get hormone therapy in West Virginia, including by informed consent in Charleston and by telehealth.
    Hormones, puberty blockers, and surgery for gender transition are banned for anyone under 18, with no exception for
    gender dysphoria. West Virginia Medicaid covers hormones, but a 2026 federal appeals ruling lets the state refuse
    to pay for surgery.
  es: >-
    Los adultos pueden recibir terapia hormonal en Virginia Occidental, incluso por consentimiento informado en
    Charleston y por telesalud. Las hormonas, los bloqueadores de pubertad y la cirugía para la transición están
    prohibidos para menores de 18, sin excepción por disforia de género. Medicaid cubre las hormonas, pero un fallo
    federal de 2026 permite al estado negarse a pagar la cirugía.
adult_care:
  status: available
  detail:
    en: >-
      No West Virginia law limits gender-affirming care for adults 18 and older. Informed-consent hormone therapy (no
      therapist letter) is offered at the Women's Health Center of West Virginia in Charleston, and telehealth
      providers such as Plume and QueerMed serve the state. Out-of-state telehealth prescribers registered in West
      Virginia may not prescribe gender-transition hormones to anyone under 18, but adults are not affected.
    es: >-
      Ninguna ley de Virginia Occidental limita la atención para adultos de 18 años o más. El Women's Health Center of
      West Virginia en Charleston ofrece hormonas por consentimiento informado, y proveedores de telesalud como Plume y
      QueerMed atienden el estado.
  sources: [wvc-30-3-20, wvc-30-1-26, whc-gaht, queermed]
minor_care:
  status: prohibited
  detail:
    en: |
      Physicians (MDs and DOs), physician assistants, and advanced practice registered nurses may not provide puberty blockers, cross-sex hormones, or gender-transition surgery to anyone under 18. The ban took effect January 1, 2024 (HB 2007, 2023). The 2023 law allowed medication for severe gender dysphoria with parental consent and two doctors' approval; **SB 299 (2025) removed that exception effective August 1, 2025.**

      - **Exceptions:** only for intersex conditions (disorders of sex development), treating complications of earlier transition care, and physical conditions that put the minor in imminent danger of death.
      - **Penalties:** the licensing board must immediately revoke the provider's license; the Attorney General can sue; the patient can sue until age 38 (20 years after turning 18).
      - **Not enjoined.** We found no active lawsuit against the ban.
      - The law covers medical care only. Talk therapy, social transition, and name or document changes are not banned.
    es: |
      Médicos, asistentes médicos y enfermeras de práctica avanzada no pueden dar bloqueadores de pubertad, hormonas ni cirugía de transición a menores de 18. La prohibición rige desde el 1 de enero de 2024 (HB 2007, 2023). **La SB 299 (2025) eliminó la excepción por disforia grave a partir del 1 de agosto de 2025.**

      - **Excepciones:** solo condiciones intersexuales, tratamiento de complicaciones y peligro inminente de muerte.
      - **Sanciones:** revocación inmediata de la licencia, demandas del Fiscal General y del paciente.
      - **No está suspendida** por ningún tribunal.
      - La terapia, la transición social y los cambios de documentos no están prohibidos.
  sources: [wvc-30-3-20, wvc-30-14-17, sb299, hb2007]
medicaid:
  program_name: West Virginia Medicaid
  covers_hrt: "yes"
  covers_surgery: unclear
  detail:
    en: |
      West Virginia Medicaid's exclusion applied to surgery, not hormones. After a 2022 federal court order in **Anderson v. Crouch**, Medicaid adopted Policy 519.24, which covers listed gender-affirmation surgeries for members 21 and older with prior authorization, letters from two unaffiliated mental health professionals, 8 psychotherapy visits in 12 months, and 12 months of hormone therapy.

      In June 2025 the U.S. Supreme Court vacated the Fourth Circuit's ruling for the plaintiffs, and on **March 10, 2026** the Fourth Circuit reversed, allowing the state to exclude surgery; rehearing was denied May 29, 2026. Policy 519.24 is still posted, but coverage for new surgery requests may be denied. Ask your plan in writing and contact Lambda Legal if you are denied.
    es: |
      La exclusión de Medicaid se aplicaba a la cirugía, no a las hormonas. Tras una orden federal de 2022 (Anderson v. Crouch), Medicaid adoptó la Política 519.24, que cubre ciertas cirugías para mayores de 21 con autorización previa y requisitos estrictos.

      En junio de 2025 la Corte Suprema anuló el fallo favorable, y el **10 de marzo de 2026** el Cuarto Circuito permitió al estado excluir la cirugía. La política sigue publicada, pero las nuevas solicitudes podrían negarse.
  how_to_apply_url: https://www.wvpath.wv.gov/
  sources: [bms-519-24, lambda-anderson, map-wv]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: >-
      West Virginia has no law barring insurers from excluding transition-related care. Check your plan documents. If
      a state-regulated plan denies a claim, you can appeal and file a complaint with the Offices of the Insurance
      Commissioner; employer self-funded plans are regulated federally.
    es: >-
      Virginia Occidental no tiene ley que prohíba a las aseguradoras excluir la atención de transición. Puedes apelar
      y presentar una queja ante la Oficina del Comisionado de Seguros.
  complaint_url: https://www.wvinsurance.gov/consumerservices
  sources: [map-wv, wvoic]
