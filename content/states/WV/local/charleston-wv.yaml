slug: charleston-wv
name: Charleston
area:
  en: Kanawha County and the Charleston metro area
  es: Condado de Kanawha y el área metropolitana de Charleston
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Charleston chosen over Morgantown and Huntington: it has the only confirmed informed-consent hormone clinic (Women's
    Health Center of WV), plus Fairness WV, Legal Aid of WV's main office, and ACLU-WV. WVU Medicine (Morgantown)
    returned 403 and Marshall Health (Huntington) had no findable trans-care page, so their services are unverified.
    Kanawha Circuit Clerk address and phone read on kanawha.us; filing fee is the statutory $200 (59-1-11). The Kanawha
    newspaper named in the 2023 Fairness WV guide is the Gazette-Mail. The CAMC Ryan White program is mentioned by WHC
    WV but not verified on CAMC's site. Covenant House services beyond its address not confirmed. The kchd.org domain
    now redirects to an unrelated hospital; Kanawha-Charleston Health Department omitted.
intro:
  en: >-
    Charleston is West Virginia's capital and the hub for statewide LGBTQ+ advocacy and legal aid. Name change
    petitions are filed with the Kanawha County Circuit Clerk. The Women's Health Center of West Virginia offers
    informed-consent hormone therapy for adults, and free clinics offer PrEP and STI testing.
  es: >-
    Charleston es la capital de Virginia Occidental y el centro de la defensa LGBTQ+ y la ayuda legal estatal. Las
    peticiones de cambio de nombre se presentan ante el Secretario del Tribunal de Circuito del Condado de Kanawha. El
    Women's Health Center of West Virginia ofrece terapia hormonal por consentimiento informado para adultos.
court:
  name: Kanawha County Circuit Clerk (Circuit Court of Kanawha County)
  url: https://kanawha.us/circuit-clerk/
  filing_fee: 200
  notes:
    en: >-
      111 Court Street, Charleston, WV 25301; (304) 357-0440; Monday to Friday 8 am to 5 pm. The clerk offers
      procedural help to people filing without a lawyer. After the hearing, record your order with the Kanawha County
      Clerk (a separate office).
    es: >-
      111 Court Street, Charleston, WV 25301; (304) 357-0440; lunes a viernes de 8 a 5. Después de la audiencia,
      registra la orden con el Secretario del Condado de Kanawha.
  sources: [kanawha-circuit, wvc-59-1-11]
