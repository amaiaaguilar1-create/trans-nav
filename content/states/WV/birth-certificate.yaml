litigation:
  - case: Hersom v. West Virginia Department of Health and Human Resources, No. 2:21-cv-450
    court: U.S. District Court for the Southern District of West Virginia
    summary:
      en: >-
        ACLU challenge to the requirement of a court order (impossible to get after a 2020 WV Supreme Court ruling) and
        to strike-through amendments. Settled October 2022; the state adopted the physician form and stopped showing
        old information on amended certificates.
      es: >-
        Demanda de la ACLU contra el requisito de orden judicial y las enmiendas tachadas. Se resolvió en octubre de
        2022; el estado adoptó el formulario médico.
    effect_today:
      en: The case is closed. The settlement is why you can use a physician form today.
      es: El caso está cerrado. Gracias al acuerdo puedes usar un formulario médico.
    last_update: "2022-10-26"
    url: https://www.acluwv.org/cases/hersom-et-al-v-west-virginia-division-health-and-human-resources-et-al/
    sources: [aclu-hersom, aclu-hersom-pr]
