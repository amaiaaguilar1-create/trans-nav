jurisdiction: IN
slug: indianapolis
name: Indianapolis
area:
  en: Marion County and the Indianapolis metro area
  es: Condado de Marion y el área metropolitana de Indianápolis
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court address and phone from the Indiana courts' Directory of Courts and Clerks PDF (2026-09-24). indy.gov pages are
    a JavaScript app and did not render, so Marion County's local name change procedures (which division hears name
    changes, local forms, number of copies) were not confirmed; reviewer should check with the Marion County Clerk.
    Organization details from each org's own site the same day, except Planned Parenthood (affiliate site returned 403;
    WFYI used). Damien Center's site does not say whether it prescribes gender-affirming hormones; listed for PrEP,
    testing, and primary care only.
intro:
  en: >-
    Indianapolis has the state's main trans services: an informed-consent gender health program at Eskenazi Health, free
    HIV and STI testing and PrEP at the Damien Center, care coordination and support groups at GenderNexus, a large
    LGBTQ+ youth center, and statewide legal aid headquartered downtown. Name change petitions for Marion County
    residents are filed with the Marion County Clerk at the Community Justice Campus.
  es: >-
    Indianápolis tiene los principales servicios trans del estado: un programa de salud de género por consentimiento
    informado en Eskenazi Health, pruebas gratuitas de VIH e ITS y PrEP en el Damien Center, coordinación de atención y
    grupos de apoyo en GenderNexus, un gran centro para jóvenes LGBTQ+ y asistencia legal estatal con sede en el centro.
    Las peticiones de cambio de nombre de residentes del condado de Marion se presentan ante el Secretario del Condado
    de Marion en el Community Justice Campus.
court:
  name: Marion County Clerk and Marion Superior Court (Civil Division), Community Justice Campus
  url: https://www.in.gov/courts/files/court-directory.pdf
  self_help_url: https://indianalegalhelp.org/legal-topic/name-change/
  filing_fee: 157
  notes:
    en: >-
      File at the Marion County Clerk's Office, 675 Justice Way, Indianapolis, IN 46203 (317-327-4740), or e-file. The
      Civil Division's number is 317-327-4747. Ask the clerk which court your name change will be assigned to and whether
      Marion County has any local forms. Bring the confidentiality forms with your petition if you want the case sealed
      and publication waived.
    es: >-
      Presenta en la Oficina del Secretario del Condado de Marion, 675 Justice Way, Indianapolis, IN 46203
      (317-327-4740), o electrónicamente. Pregunta al secretario a qué tribunal se asignará tu cambio de nombre y si hay
      formularios locales. Lleva los formularios de confidencialidad con tu petición si quieres sellar el caso.
  sources: [court-directory, ilh-fee-faq]
