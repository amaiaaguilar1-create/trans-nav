sources:
  - id: ic-34-28-2-1-5
    url: https://codes.findlaw.com/in/title-34-civil-law-and-procedure/in-code-sect-34-28-2-1-5/
    title: Ind. Code 34-28-2-1.5 (persons who may not petition)
    publisher: FindLaw (copy of the Indiana Code)
    kind: statute
    accessed: "2026-09-24"
    quote: "A person may not petition for a change of name if the person: (1) is confined to a department of correction facility; or (2) ... is a lifetime sex or violent offender."
  - id: ic-34-28-2-2
    url: https://codes.findlaw.com/in/title-34-civil-law-and-procedure/in-code-sect-34-28-2-2/
    title: Ind. Code 34-28-2-2 (petition for a minor)
    publisher: FindLaw (copy of the Indiana Code)
    kind: statute
    accessed: "2026-09-24"
    quote: the written consent of a parent, or the written consent of the guardian if both parents are dead, must be filed with the petition
  - id: ic-34-28-2-2-5
    url: https://codes.findlaw.com/in/title-34-civil-law-and-procedure/in-code-sect-34-28-2-2-5/
