  notes: >-
    Climate ratings follow the guides: BMV sex-marker changes ended 2026-02-12 (140 IAC 7-1.1-3); IDOH stopped birth
    certificate sex changes after EO 25-36 (March 2025); SEA 480 bans care for minors; no shield law (MAP). Name changes
    remain available with publication and a hearing, which can be sealed and waived.
overview:
  en: >-
    Indiana is restrictive. You can still change your name in court (with a newspaper notice that the judge can waive
    if the case is sealed), but since 2025 the state no longer changes the sex on Indiana birth certificates, and since
    February 12, 2026 the BMV no longer changes it on licenses and ID cards. Hormone therapy is legal and available for
    adults, but care for anyone under 18 is banned, and there is no shield law or insurance protection.
  es: >-
    Indiana es restrictivo. Todavía puedes cambiar tu nombre ante un tribunal (con un aviso en el periódico que el juez
    puede eximir si sella el caso), pero desde 2025 el estado ya no cambia el sexo en las actas de nacimiento de Indiana
    y desde el 12 de febrero de 2026 el BMV ya no lo cambia en licencias ni tarjetas de identificación. La terapia
    hormonal es legal y está disponible para adultos, pero la atención para menores de 18 años está prohibida, y no hay
    ley escudo ni protección en los seguros.
