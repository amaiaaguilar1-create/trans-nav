status_summary:
  en: >-
    Hormone therapy is legal for adults in Indiana, and informed-consent care is available in Indianapolis and through
    Planned Parenthood clinics statewide. Care for anyone under 18 is banned by SEA 480, which has been in effect since
    2024 after federal courts declined to block it. Indiana has no shield law, no insurance nondiscrimination rule, and
    no clear Medicaid policy.
  es: >-
    La terapia hormonal es legal para adultos en Indiana, y hay atención por consentimiento informado en Indianápolis y
    en las clínicas de Planned Parenthood del estado. La atención para menores de 18 años está prohibida por SEA 480,
    vigente desde 2024 después de que los tribunales federales se negaron a bloquearla. Indiana no tiene ley escudo, ni
    norma de no discriminación en seguros, ni una política clara de Medicaid.
adult_care:
  status: available
  detail:
    en: |
      No Indiana law restricts gender-affirming care for adults 18 and older, with one exception: state law bars the Department of Correction from providing gender-affirming surgery to people in prison (challenged in *Allison* and *Wallace v. Commissioner*, in discovery). Telehealth prescribing is legal.

      Eskenazi Health's Gender Health Program in Indianapolis and Planned Parenthood's Indiana clinics use **informed consent**: no therapist letter is needed to start hormones.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **Medicaid / Healthy Indiana Plan (HIP)** at the FSSA Benefits Portal. Coverage of transition care is not clearly written; hormones and labs are often billed as ordinary prescriptions and visits, but ask before you start.
      2. Go to a **federally qualified health center** such as Eskenazi Health, which must see you regardless of ability to pay and uses a sliding fee scale. Find others at findahealthcenter.hrsa.gov.
      3. **Planned Parenthood** clinics across Indiana offer hormone therapy for adults, often with same-day or next-day visits.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care (applications each May).
      5. Generic estradiol and spironolactone are usually inexpensive with a pharmacy discount coupon; ask for the cash price.
    es: |
      Ninguna ley de Indiana restringe la atención de afirmación de género para adultos de 18 años o más, con una excepción: la ley prohíbe al Departamento de Corrección proporcionar cirugía de afirmación de género a personas en prisión (impugnada en *Allison* y *Wallace*). La telesalud es legal.

      El Programa de Salud de Género de Eskenazi Health en Indianápolis y las clínicas de Planned Parenthood en Indiana usan **consentimiento informado**: no se necesita carta de terapeuta para empezar hormonas.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medicaid / Healthy Indiana Plan (HIP)** en el portal de beneficios de FSSA. La cobertura de la transición no está escrita claramente; pregunta antes de empezar.
      2. Acude a un **centro de salud federalmente calificado** como Eskenazi Health, que debe atenderte sin importar tu capacidad de pago y usa escala móvil.
      3. Las clínicas de **Planned Parenthood** en Indiana ofrecen terapia hormonal para adultos, a menudo el mismo día o al día siguiente.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud (solicitudes cada mayo).
      5. El estradiol y la espironolactona genéricos suelen ser baratos con un cupón de descuento de farmacia.
  sources: [eskenazi-gender, wfyi-pp, aclu-in-litigation, hrsa, pop-hrt, in-medicaid]
minor_care:
  status: prohibited
  detail:
    en: |
      **Senate Enrolled Act 480 (2023)**, codified at IC 25-1-22, bars physicians and other practitioners from knowingly providing "gender transition procedures" (puberty blockers, hormones, and surgery) to anyone under 18, or aiding another practitioner in doing so. It was signed April 5, 2023 and was set to take effect July 1, 2023; a federal injunction blocked most of it until **February 27, 2024**, when the Seventh Circuit allowed it to take effect. The Seventh Circuit later ruled against the plaintiffs (*K.C. v. Individual Members of the Medical Licensing Board*), and the case is being wound down.

      Exceptions in the statute: disorders of sex development, treatment of complications from earlier procedures, and emergencies. Mental health care, social transition, and counseling are not banned. Indiana has **no shield law**. If your family is considering care in another state, get legal advice first.
    es: |
      La **Ley 480 del Senado (2023)**, codificada en IC 25-1-22, prohíbe a médicos y otros profesionales proporcionar a sabiendas "procedimientos de transición de género" (bloqueadores de pubertad, hormonas y cirugía) a menores de 18 años, o ayudar a otro profesional a hacerlo. Se firmó el 5 de abril de 2023; una orden federal bloqueó la mayor parte hasta el **27 de febrero de 2024**, cuando el Séptimo Circuito permitió que entrara en vigor. El Séptimo Circuito falló después contra los demandantes (*K.C.*), y el caso se está cerrando.

      Excepciones: trastornos del desarrollo sexual, tratamiento de complicaciones de procedimientos anteriores y emergencias. La salud mental, la transición social y la consejería no están prohibidas. Indiana **no tiene ley escudo**.
  sources: [ic-25-1-22-13, wfyi-sea480-signed, wfyi-sea480-effect, aclu-in-litigation]
medicaid:
  program_name: Indiana Medicaid (Healthy Indiana Plan, Hoosier Healthwise, Hoosier Care Connect)
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: |
      Indiana has **no written Medicaid policy** either including or excluding gender-affirming care; transition care does not appear in the state's list of noncovered services (405 IAC 5-29-1). In practice, coverage of hormones, labs, and surgery depends on your managed care plan and prior authorization. If a claim is denied, ask for the denial in writing and appeal; the Trans Health Project has templates.

      **Healthy Indiana Plan (HIP)** covers adults 19 to 64 with low income; Hoosier Healthwise covers children and pregnant people. Apply online at the FSSA Benefits Portal or call 1-800-457-4584.
    es: |
      Indiana **no tiene una política escrita de Medicaid** que incluya o excluya la atención de afirmación de género; no aparece en la lista estatal de servicios no cubiertos (405 IAC 5-29-1). En la práctica, la cobertura de hormonas, laboratorios y cirugía depende de tu plan y de la autorización previa. Si te niegan un reclamo, pide la negación por escrito y apela.

      El **Healthy Indiana Plan (HIP)** cubre a adultos de 19 a 64 años con bajos ingresos. Solicita en línea en el portal de beneficios de FSSA o llama al 1-800-457-4584.
  how_to_apply_url: https://fssabenefits.in.gov/CitizenPortal/application.do
  sources: [in-medicaid, iac-405-5-29-1, map-profile, thp]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Indiana law does not prohibit insurers from excluding gender-affirming care. Read your plan's exclusions list. If a claim is denied, file an internal appeal, then an external review; you can also file a complaint with the Indiana Department of Insurance (800-622-4461). Employer self-funded plans are federally regulated; the Trans Health Project has appeal templates for those.
    es: |
      La ley de Indiana no prohíbe a las aseguradoras excluir la atención de afirmación de género. Lee la lista de exclusiones de tu plan. Si te niegan un reclamo, presenta una apelación interna y luego una revisión externa; también puedes presentar una queja ante el Departamento de Seguros de Indiana (800-622-4461).
  complaint_url: https://www.in.gov/idoi/consumer-services/
  sources: [idoi, map-profile, thp]
