litigation:
  - case: K.C. v. Individual Members of the Medical Licensing Board of Indiana
    court: US District Court, S.D. Indiana; Seventh Circuit
    summary:
      en: ACLU challenge to SEA 480 on behalf of transgender youth, parents, and a doctor. The Seventh Circuit lifted the injunction in February 2024 and later ruled 2-1 against the plaintiffs.
      es: Impugnación de la ACLU contra SEA 480. El Séptimo Circuito levantó la orden judicial en febrero de 2024 y luego falló 2-1 contra los demandantes.
    effect_today:
      en: The ban is fully in effect. The case is being dismissed.
      es: La prohibición está plenamente vigente. El caso se está cerrando.
    last_update: "2026-04-18"
    sources: [aclu-in-litigation, wfyi-sea480-effect]
  - case: Allison v. Commissioner, Indiana Department of Correction; Wallace v. Commissioner
    court: US District Court, S.D. Indiana
    summary:
      en: Challenges to the state law banning gender-affirming surgery for people in Indiana prisons.
      es: Impugnaciones a la ley estatal que prohíbe la cirugía de afirmación de género para personas en prisiones de Indiana.
    effect_today:
      en: In discovery; the ban applies while the cases continue.
      es: En etapa de descubrimiento; la prohibición aplica mientras continúan.
    last_update: "2026-04-18"
    sources: [aclu-in-litigation]
