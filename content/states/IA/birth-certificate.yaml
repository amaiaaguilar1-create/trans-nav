    title: Iowa Code 2026, § 144.39, Change of name
    publisher: Iowa Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: The state registrar shall amend the certificate of birth to reflect the new name.
  - id: hhs-abstract
    url: https://hhs.iowa.gov/media/3228/download?inline
    title: Form 470-5446, Abstract to Change Registrant's Legal Name on Birth Certificate (07/26)
    publisher: Iowa Department of Health and Human Services
    kind: form
    accessed: "2026-09-24"
    quote: Processing the amendment request should be completed within approximately 4-6 weeks after receipt, unless additional supporting documents are required.
  - id: hhs-vital-records
    url: https://hhs.iowa.gov/family-community/vital-records
    title: Vital Records
    publisher: Iowa Department of Health and Human Services
    kind: official
    accessed: "2026-09-24"
    quote: Administrative processing fees at the state level are $15 as of July 1, 2019.
  - id: hhs-request
    url: https://hhs.iowa.gov/family-community/vital-records/how-request-certified-record
    title: How to Request a Certified Record
    publisher: Iowa Department of Health and Human Services
    kind: official
    accessed: "2026-09-24"
    quote: Each copy of a certified record costs $20.00.
  - id: oneiowa-sf418
    url: https://oneiowa.org/civilrightsremovalguide/
    title: Iowa Civil Rights Removal Act Implementation Guide
    publisher: One Iowa
    kind: org
    accessed: "2026-09-24"
