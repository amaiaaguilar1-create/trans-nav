    publisher: Iowa Department of Transportation
    kind: official
    accessed: "2026-09-24"
    quote: Changing your name on an Iowa driver's license or ID must be done in person at any DMV location by scheduling an appointment. There is a $10 charge. Applicants must provide proof of any name change. Photocopies and faxes of documents will not be accepted.
  - id: dot-fees
    url: https://iowadot.gov/drivers-licenses-ids/get-or-renew-drivers-licenses-ids-permits/fees
    title: Driver's License Fees
    publisher: Iowa Department of Transportation
    kind: official
    accessed: "2026-09-24"
    quote: There is a $10 fee for a replacement license or non-operator ID card (e.g., change of address, name change, lost or stolen).
  - id: dot-appointment
    url: https://iowadot.gov/drivers-licenses-ids/schedule-appointment
    title: Schedule an Appointment
    publisher: Iowa Department of Transportation
    kind: official
    accessed: "2026-09-24"
