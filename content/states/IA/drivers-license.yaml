    url: https://oneiowa.org/civilrightsremovalguide/
    title: Iowa Civil Rights Removal Act Implementation Guide
    publisher: One Iowa
    kind: org
    accessed: "2026-09-24"
    quote: If your state does not allow you to change your birth certificate, there is no longer a parallel process for out-of-state applicants, and you will not be able to alter your Iowa driver's license either.
