  - cite: Iowa Admin. Code r. 761-601.4(7)
    title:
      en: Verification of sex; the sex on the card will be identical to the sex on the identity document submitted (effective November 19, 2025)
    url: https://www.legis.iowa.gov/docs/iac/chapter/761.601.pdf
  - cite: Iowa Code § 4.1A (SF 418, 2025)
    title:
      en: Statutory definition of sex as observed or clinically verified at birth; effective July 1, 2025
    url: https://www.legis.iowa.gov/docs/code/4.1A.pdf
  - cite: Iowa Code § 321.189
    title:
      en: Contents of the driver's license, including sex
    url: https://www.legis.iowa.gov/docs/code/321.189.pdf
