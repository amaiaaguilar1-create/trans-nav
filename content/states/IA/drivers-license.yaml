    publisher: Iowa Administrative Bulletin
    kind: regulation
    accessed: "2026-09-24"
    quote: A person will no longer be able to change the sex designation on the person's driver's license or nonoperator's identification card to reflect a sex designation different than what is listed on the person's identity document.
  - id: dot-change-info
    url: https://iowadot.gov/drivers-licenses-ids/other-services/change-information
