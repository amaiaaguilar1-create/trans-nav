    publisher: Iowa Legislature
    kind: regulation
    accessed: "2026-09-24"
    quote: 601.4(7) Verification of sex. The sex listed on the driver's license or nonoperator's identification card that is issued will be identical to the sex listed on the identity document submitted.
  - id: arc-9622c
