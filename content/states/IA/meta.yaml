overview:
  en: >-
    Iowa is restrictive for trans people. Name changes are simple (no publication, usually no hearing, $215), but since
    SF 418 took effect on July 1, 2025, Iowa law defines sex as sex at birth: Iowa birth certificates can no longer be
    changed, and driver's licenses must match your identity document. Adults can still get hormone therapy, but Iowa
    Medicaid may not pay for it, gender identity is no longer covered by the state civil rights law, and care for
    minors has been banned since 2023. There is no shield law.
  es: >-
    Iowa es restrictivo para las personas trans. Cambiar el nombre es sencillo (sin publicación, normalmente sin
    audiencia, $215), pero desde que SF 418 entró en vigor el 1 de julio de 2025, la ley define el sexo como el sexo al
    nacer: las actas de nacimiento de Iowa ya no se pueden cambiar y las licencias deben coincidir con tu documento de
    identidad. Los adultos todavía pueden recibir terapia hormonal, pero Medicaid de Iowa no puede pagarla, la ley
    estatal de derechos civiles ya no cubre la identidad de género y la atención para menores está prohibida desde
    2023. No hay ley escudo.
