status_summary:
  en: >-
    Hormone therapy is legal for adults in Iowa, and informed-consent care is available in Des Moines and Iowa City.
    But since July 1, 2025, Iowa Medicaid may not pay for hormones or surgery for gender dysphoria, and state law no
    longer protects against gender identity discrimination. Care for anyone under 18 has been banned since 2023.
  es: >-
    La terapia hormonal es legal para adultos en Iowa, y hay atención por consentimiento informado en Des Moines e
    Iowa City. Pero desde el 1 de julio de 2025, Medicaid de Iowa no puede pagar hormonas ni cirugía para la disforia
    de género, y la ley estatal ya no protege contra la discriminación por identidad de género. La atención para
    menores de 18 años está prohibida desde 2023.
adult_care:
  status: restricted
  detail:
    en: |
      Adults can legally get hormone therapy and surgery. Planned Parenthood North Central States (18+) uses an **informed consent** model: no therapist letter or referral. University of Iowa Health Care's LGBTQ Clinic (18+) and UCS Healthcare in West Des Moines also prescribe hormones, and UnityPoint's LGBTQ+ clinic in Des Moines prescribes from **age 19**; ask each whether it requires a letter. Telehealth prescribing is legal.

      The restriction is **money**: Iowa Code § 249A.14 bars Iowa Medicaid from paying for hormones or surgery related to gender dysphoria, and state law does not require private plans to cover this care.

      **If you have no insurance, or only Medicaid, and little money**, in rough order of what to try:
      1. **Keep or get Medicaid anyway.** It still covers primary care, lab work, mental health care, and other services not tied to transition. You pay for hormones separately.
      2. **Pay cash for generic hormones.** Generic spironolactone and estradiol tablets are often under $35 a month with a GoodRx-type coupon or at Cost Plus Drugs; ask the pharmacy for the cash price. Testosterone costs vary more.
      3. **Telehealth self-pay**: Plume serves Iowa on a monthly subscription; Planned Parenthood offers telehealth visits.
      4. **Point of Pride's HRT Access Fund** pays for 18 months of telehealth hormone care (applications each spring), and the **Iowa Trans Mutual Aid Fund** gives monthly grants for gender-affirming care.
      5. **Community health centers** (such as Primary Health Care in Des Moines) charge on a sliding scale for primary care and labs.
    es: |
      Los adultos pueden recibir legalmente terapia hormonal y cirugía. Planned Parenthood North Central States (18+) usa **consentimiento informado**: sin carta de terapeuta ni referencia. La Clínica LGBTQ de University of Iowa Health Care (18+) y UCS Healthcare en West Des Moines también recetan hormonas, y la clínica LGBTQ+ de UnityPoint en Des Moines receta desde los **19 años**; pregunta a cada una si pide carta. La telesalud es legal.

      La restricción es el **dinero**: el § 249A.14 del Código de Iowa prohíbe que Medicaid pague hormonas o cirugía relacionadas con la disforia de género, y la ley estatal no obliga a los planes privados a cubrir esta atención.

      **Si no tienes seguro, o solo Medicaid, y poco dinero**:
      1. **Mantén o solicita Medicaid de todos modos.** Sigue cubriendo atención primaria, análisis, salud mental y otros servicios no ligados a la transición.
      2. **Paga en efectivo hormonas genéricas.** La espironolactona y el estradiol genéricos suelen costar menos de $35 al mes con cupón o en Cost Plus Drugs.
      3. **Telesalud con pago propio**: Plume atiende Iowa con suscripción mensual; Planned Parenthood ofrece visitas por telesalud.
      4. El **Fondo de Acceso a TRH de Point of Pride** y el **Iowa Trans Mutual Aid Fund** ayudan con los costos.
      5. Los **centros de salud comunitarios** cobran en escala móvil por atención primaria y análisis.
  sources: [ia-code-249a-14, ppncs-hrt, uihc-lgbtq, unitypoint-lgbtq, ucs-lgbtq, pop-hrt, itmaf]
minor_care:
  status: prohibited
  detail:
    en: |
      Iowa Code § 147.164 (SF 538, signed March 22, 2023; in force since about September 18, 2023) bars health care professionals from giving anyone under 18 puberty blockers, cross-sex hormones, or gender-related surgery "for the purpose of attempting to alter the appearance of, or affirm the minor's perception of, the minor's gender or sex." Exceptions cover only differences of sex development and treating complications. Providers who violate it face licensing discipline, lawsuits (a minor can sue until 20 years after turning 18), and enforcement by the attorney general. As far as could be determined, the law is **not enjoined**.

      Mental health care, social support, and counseling are not banned. Iowa has **no shield law**. Families who travel to a state such as Illinois or Minnesota, which have shield laws, can get care there; Iowa's law regulates Iowa-licensed professionals.
    es: |
      El § 147.164 del Código de Iowa (SF 538, firmado el 22 de marzo de 2023; vigente desde aproximadamente el 18 de septiembre de 2023) prohíbe a los profesionales de la salud dar a menores de 18 años bloqueadores de pubertad, hormonas o cirugía "con el propósito de intentar alterar la apariencia o afirmar la percepción del menor sobre su género o sexo". Las excepciones solo cubren diferencias del desarrollo sexual y complicaciones. Los proveedores que la violan enfrentan sanciones de licencia, demandas (el menor puede demandar hasta 20 años después de cumplir 18) y acciones del fiscal general. Hasta donde se pudo determinar, la ley **no está suspendida**.

      La atención de salud mental y el apoyo no están prohibidos. Iowa **no tiene ley escudo**. Las familias que viajan a estados como Illinois o Minnesota, que tienen leyes escudo, pueden recibir atención allí.
  sources: [ia-code-147-164, map-health]
medicaid:
  program_name: Iowa Medicaid (IA Health Link; Iowa Health and Wellness Plan for adults 19 to 64)
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: |
      **Since July 1, 2025, Iowa Code § 249A.14 says state Medicaid funds "shall not be used for reimbursement for sex reassignment surgery or associated procedures, including hormone therapy or other medical interventions intended to alter primary or secondary sex characteristics related to an individual's gender dysphoria diagnosis."** It was added by the 2025 health and human services budget (HF 1049). Other covered services, including mental health care, primary care, and labs, are still covered. Medicaid's administrative rule (441-78.1(4)) also still lists sex reassignment surgery as excluded.

      Background: Iowa courts struck down earlier Medicaid exclusions twice, in *Good v. Iowa DHS* (Iowa Supreme Court, 2019, under the Iowa Civil Rights Act) and in *Covington and Vasquez* (Polk County District Court, 2021, under the Iowa Constitution; left intact by the Iowa Supreme Court in 2023). SF 418 then removed gender identity from the Civil Rights Act, and § 249A.14 is a new statute that has not been ruled on as far as could be found.

      **Who qualifies**: adults 19 to 64 with income at or below 133% of the federal poverty level, plus children, pregnant people, and people with disabilities under other programs. Apply through the HHS benefits portal or a paper application at your local HHS office.
    es: |
      **Desde el 1 de julio de 2025, el § 249A.14 del Código de Iowa establece que los fondos estatales de Medicaid "no se usarán para reembolsar cirugía de reasignación de sexo o procedimientos asociados, incluida la terapia hormonal".** Se agregó en el presupuesto de salud de 2025 (HF 1049). Otros servicios cubiertos, como salud mental, atención primaria y análisis, siguen cubiertos.

      Antecedentes: los tribunales de Iowa anularon exclusiones anteriores en 2019 y 2021. SF 418 eliminó la identidad de género de la Ley de Derechos Civiles, y el § 249A.14 es una ley nueva sobre la que no se encontró ningún fallo.

      **Quién califica**: adultos de 19 a 64 años con ingresos hasta el 133% del nivel federal de pobreza, además de niños, embarazadas y personas con discapacidad. Solicita en el portal de beneficios de HHS o con una solicitud en papel en tu oficina local de HHS.
  how_to_apply_url: https://hhs.iowa.gov/medicaid/apply-medicaid
  sources: [ia-code-249a-14, hf1049, iac-441-78, aclu-covington, aclu-timeline, hhs-medicaid-eligibility, hhs-medicaid-apply]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      No Iowa law bars private health plans from excluding gender-affirming care, and since July 1, 2025 the Iowa Civil Rights Act no longer covers gender identity (SF 418). Iowa Code § 216.7(3) also says public accommodation law does not require state or local governments to pay for gender-related surgery. Check your plan documents for exclusions. If a claim is denied, appeal through the plan, then ask for an external review; for state-regulated plans, you can file a complaint with the Iowa Insurance Division. Self-funded employer plans are federally regulated; federal sex discrimination law (Section 1557 and Title VII) may still apply, and the Trans Health Project has appeal templates.
    es: |
      Ninguna ley de Iowa prohíbe que los planes privados excluyan la atención de afirmación de género, y desde el 1 de julio de 2025 la Ley de Derechos Civiles de Iowa ya no cubre la identidad de género (SF 418). Revisa tu plan. Si te niegan una reclamación, apela ante el plan y luego pide una revisión externa; para planes regulados por el estado, puedes presentar una queja ante la División de Seguros de Iowa.
  complaint_url: https://iid.iowa.gov/consumers/filing-complaints
  sources: [sf418, ia-code-216-7, iid-complaints]
