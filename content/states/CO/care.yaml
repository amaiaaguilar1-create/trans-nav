  es_status: machine_draft
  notes: >-
    hcpf.colorado.gov and doi.colorado.gov blocked automated access on 2026-09-24; the Health First Colorado
    Gender-Affirming Care Billing Manual and the Division of Insurance pages were read via Internet Archive snapshots
    (2026 and December 2025). Youth developments come from Colorado Sun reporting through September 22, 2026 and the
    Federal Register notice of August 13, 2026. Reviewer: (1) confirm HCPF's October 13, 2026 suspension of Medicaid and
    CHP+ coverage for members under 18 (CHP+ under 19), the six-month hormone taper, and whether the 2027 legislature
    funds state-only coverage; (2) confirm whether Denver Health has resumed any youth hormone care (suspended January
    2, 2026); (3) Proposition 135 (surgery for minors) is on the November 3, 2026 ballot, update after the election;
    (4) Planned Parenthood of the Rocky Mountains' minimum age for hormone therapy was not stated on its page (April
    2026 snapshot); plannedparenthood.org blocked live access; (5) a 2025 federal rule stopped treating gender-affirming
    care as an ACA essential health benefit starting in plan year 2026; the Division of Insurance's coverage guide still
    lists 2026 individual and small-group coverage, confirm how Colorado is handling this. Minor care is marked
    "restricted" because the two largest pediatric programs are not prescribing and Medicaid coverage ends October 13,
    even though state law does not ban the care; a reviewer may prefer "available" or "litigation".
status_summary:
  en: >-
    Gender-affirming care is legal for adults and minors under Colorado law, and a 2023 shield law protects patients and
    providers. Adults can get informed-consent hormones at Denver Health, Planned Parenthood, and community clinics, and
    Health First Colorado (Medicaid) and state-regulated private plans cover care. For people under 18, access has
    narrowed sharply: Children's Hospital Colorado and Denver Health stopped youth prescriptions in 2026, and federal
    rules end Medicaid and CHP+ coverage for minors on October 13, 2026.
  es: >-
    La atención de afirmación de género es legal para adultos y menores según la ley de Colorado, y una ley escudo de
    2023 protege a pacientes y proveedores. Los adultos pueden obtener hormonas por consentimiento informado en Denver
    Health, Planned Parenthood y clínicas comunitarias, y Health First Colorado (Medicaid) y los planes privados
    regulados por el estado cubren la atención. Para menores de 18, el acceso se ha reducido mucho: Children's Hospital
    Colorado y Denver Health dejaron de recetar a jóvenes en 2026, y reglas federales terminan la cobertura de Medicaid y
    CHP+ para menores el 13 de octubre de 2026.
adult_care:
  status: available
  detail:
    en: |
      No state restriction on adult care. Denver Health, Planned Parenthood of the Rocky Mountains, and several community clinics prescribe hormones on an **informed consent** basis: you talk through risks and benefits with the prescriber and sign a consent form, with no therapist letter required. Telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **Health First Colorado** (Medicaid). Adults with household income under about 133% of the federal poverty level qualify, and it covers hormones, labs, and surgery.
      2. Go to a **community health center** (federally qualified health center). They charge on a sliding scale; find one at findahealthcenter.hrsa.gov and ask about gender-affirming hormone therapy.
      3. **Planned Parenthood of the Rocky Mountains** offers hormone therapy at nine Colorado health centers (1-800-230-7526).
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for people who cannot afford it.
      5. If you need a letter for surgery, The Center on Colfax runs a free monthly Gender Affirming Care Letter Lab and 12 free therapy sessions for LGBTQ+ adults.
    es: |
      No hay restricciones estatales para adultos. Denver Health, Planned Parenthood of the Rocky Mountains y varias clínicas comunitarias recetan hormonas por **consentimiento informado**: hablas de riesgos y beneficios y firmas un consentimiento, sin carta de terapeuta. La telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Health First Colorado** (Medicaid). Los adultos con ingresos menores a aproximadamente el 133% del nivel federal de pobreza califican, y cubre hormonas, laboratorios y cirugía.
      2. Acude a un **centro de salud comunitario**. Cobran en escala móvil; búscalo en findahealthcenter.hrsa.gov.
      3. **Planned Parenthood of the Rocky Mountains** ofrece terapia hormonal en nueve centros de Colorado (1-800-230-7526).
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud.
      5. Si necesitas una carta para cirugía, The Center on Colfax tiene un laboratorio mensual gratuito de cartas y 12 sesiones de terapia gratis para adultos LGBTQ+.
  sources: [denver-health-lgbtq, pprm-gac, doi-lgbtq, hrsa, pop-hrt, center-colfax-mh]
minor_care:
  status: restricted
  detail:
    en: |
      **State law does not ban gender-affirming care for minors**, and Colorado's shield law (SB23-188) blocks out-of-state subpoenas, extradition, and professional discipline for care lawfully provided here. Parental consent is required. In practice, access has narrowed:

      - **Hospitals:** Children's Hospital Colorado and Denver Health suspended new and renewed hormone and puberty-blocker prescriptions for patients under 18 on January 2, 2026, citing federal investigations. After the Colorado Supreme Court found likely discrimination (May 18, 2026), a Denver judge ordered Children's to stop refusing the care; Children's restored the service on paper, but its physicians (employed by the University of Colorado) have declined to write prescriptions, and on September 22, 2026 the judge ruled the hospital was not in contempt. The class action continues.
      - **Medicaid and CHP+:** a federal rule finalized in August 2026 bars federal funds for this care for people under 18 (under 19 in CHP+). Colorado will suspend coverage on **October 13, 2026**, with six months of continued coverage to taper off hormones. Behavioral health is not affected.
      - **Ballot:** **Proposition 135**, on the November 3, 2026 ballot, would ban gender-affirming surgery for anyone under 18 and bar public funds or insurance from paying for it. It does not address hormones or puberty blockers.

      Some independent and community clinics may still see adolescents; call first and ask.
    es: |
      **La ley estatal no prohíbe la atención de afirmación de género para menores**, y la ley escudo de Colorado (SB23-188) bloquea citaciones de otros estados, extradiciones y sanciones profesionales por atención legal en Colorado. Se requiere consentimiento de los padres. En la práctica, el acceso se ha reducido:

      - **Hospitales:** Children's Hospital Colorado y Denver Health suspendieron el 2 de enero de 2026 las recetas nuevas y renovaciones de hormonas y bloqueadores de pubertad para menores de 18, citando investigaciones federales. Tras un fallo de la Corte Suprema de Colorado (18 de mayo de 2026), un juez ordenó a Children's dejar de negarse; el hospital restableció el servicio en papel, pero sus médicos se han negado a recetar, y el 22 de septiembre de 2026 el juez resolvió que el hospital no estaba en desacato. La demanda colectiva continúa.
      - **Medicaid y CHP+:** una regla federal de agosto de 2026 prohíbe fondos federales para esta atención a menores de 18 (menores de 19 en CHP+). Colorado suspenderá la cobertura el **13 de octubre de 2026**, con seis meses de cobertura para disminuir las hormonas. La salud conductual no se ve afectada.
      - **Boleta:** la **Proposición 135**, en la boleta del 3 de noviembre de 2026, prohibiría la cirugía de afirmación de género para menores de 18. No trata hormonas ni bloqueadores.

      Algunas clínicas independientes y comunitarias pueden seguir atendiendo a adolescentes; llama primero.
  sources: [sb23-188, sun-chc-suspend, sun-chc-supreme, sun-chc-contempt, sun-medicaid-youth, fr-medicaid-rule, prop-135]
medicaid:
  program_name: Health First Colorado
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Health First Colorado covers gender-affirming care for members with a diagnosis of gender dysphoria when medically necessary, under program rule 10 CCR 2505-10 § 8.735: hormone therapy (prior authorization required), puberty blockers, and surgeries such as mastectomy, breast augmentation (mammoplasty), hysterectomy, and covered facial and neck procedures (the rule has the full list, and other medically necessary surgeries are reviewed case by case), plus electrolysis of surgical sites and pre- and post-operative care. Most surgeries require six continuous months of hormone therapy (12 months for breast augmentation) unless hormones are not clinically indicated or not wanted; chest surgery (mastectomy) has no hormone requirement. The surgeon must keep a statement from a qualified health professional that the criteria are met.

      **Under 18 (CHP+ under 19):** coverage of hormones, puberty blockers, and related procedures is suspended starting October 13, 2026 because of a federal funding rule; people already on hormones keep coverage for a six-month taper.

      **Who qualifies:** adults with household income under about 133% of the federal poverty level, even if not pregnant, married, or a parent. Apply online through PEAK, by phone, or at your county human services office.
    es: |
      Health First Colorado cubre la atención de afirmación de género para miembros con diagnóstico de disforia de género cuando es médicamente necesaria (regla 10 CCR 2505-10 § 8.735): terapia hormonal (con autorización previa), bloqueadores de pubertad y cirugías como mastectomía, aumento de senos, histerectomía y procedimientos faciales y de cuello cubiertos (otras cirugías médicamente necesarias se revisan caso por caso), además de electrólisis del sitio quirúrgico. La mayoría de las cirugías requieren seis meses continuos de hormonas (12 para aumento de senos), salvo que no estén indicadas o no se deseen; la mastectomía no tiene ese requisito.

      **Menores de 18 (CHP+ menores de 19):** la cobertura de hormonas, bloqueadores y procedimientos relacionados se suspende desde el 13 de octubre de 2026 por una regla federal; quienes ya toman hormonas mantienen cobertura seis meses para disminuirlas.

      **Quién califica:** adultos con ingresos menores a aproximadamente el 133% del nivel federal de pobreza. Solicita en línea en PEAK, por teléfono o en la oficina de servicios humanos de tu condado.
  how_to_apply_url: https://www.healthfirstcolorado.com/apply-now/
  sources: [hcpf-gac-manual, hcpf-rule, sun-medicaid-youth, fr-medicaid-rule, doi-lgbtq]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Colorado Insurance Regulation 4-2-62 bars state-regulated plans (look for "CO-DOI" on your card) from denying, excluding, or limiting medically necessary care based on gender identity, and the Division of Insurance says Colorado prohibits transgender exclusions in plans sold here. Since 2023 Colorado has included gender-affirming care in its essential health benefits benchmark for individual and small-group plans, and the Division publishes a yearly guide to what each company covers. The shield law (SB23-188) also bars insurers from penalizing providers for lawful gender-affirming care.

      If a plan denies care, appeal to the plan within 180 days; if it is upheld as "not medically necessary," you can ask the Division for a free, binding independent external review. Help: Division of Insurance Consumer Services, 303-894-7490 or 800-930-3745. Self-funded employer plans are federally regulated and may not follow these rules; the Trans Health Project has appeal templates.
    es: |
      El Reglamento de Seguros 4-2-62 de Colorado prohíbe que los planes regulados por el estado (busca "CO-DOI" en tu tarjeta) nieguen, excluyan o limiten atención médicamente necesaria por identidad de género, y la División de Seguros dice que Colorado prohíbe exclusiones trans en los planes vendidos aquí. Desde 2023 Colorado incluye la atención de afirmación de género en sus beneficios de salud esenciales para planes individuales y de grupos pequeños, y la División publica cada año una guía de cobertura por compañía.

      Si un plan niega la atención, apela ante el plan dentro de 180 días; si la negación se mantiene por "no ser médicamente necesaria", puedes pedir a la División una revisión externa independiente gratuita y vinculante. Ayuda: Servicios al Consumidor de la División de Seguros, 303-894-7490 o 800-930-3745.
  complaint_url: https://doi.colorado.gov/for-consumers/file-a-complaint
  sources: [doi-lgbtq, doi-gac-guide, sb23-188]
