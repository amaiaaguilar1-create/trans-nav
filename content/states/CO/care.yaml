litigation:
  - case: Transgender patients v. Children's Hospital Colorado (class action)
    court: Denver District Court; Colorado Supreme Court
    summary:
      en: Families of transgender youth sued Children's Hospital Colorado under the state anti-discrimination law after it suspended hormone and puberty-blocker prescriptions for patients under 18 in January 2026. On May 18, 2026 the Colorado Supreme Court (5-2) found sufficient evidence of discrimination; in June a Denver judge enjoined the hospital from refusing the care. On September 22, 2026 the judge ruled the hospital was not in contempt because it had changed its policy, and its physicians, who are not hospital employees, had individually declined to prescribe.
      es: Familias de jóvenes trans demandaron a Children's Hospital Colorado por discriminación después de que suspendiera en enero de 2026 las recetas de hormonas y bloqueadores para menores de 18. El 18 de mayo de 2026 la Corte Suprema de Colorado (5-2) halló pruebas suficientes de discriminación; en junio un juez ordenó al hospital no negar la atención. El 22 de septiembre de 2026 el juez resolvió que el hospital no estaba en desacato.
    effect_today:
      en: Children's Hospital Colorado lists youth gender-affirming medical care as a service again, but as of late September 2026 its doctors are not writing new or renewed prescriptions. Mental and behavioral health services continue. The case is ongoing.
      es: Children's Hospital Colorado vuelve a listar la atención médica de afirmación de género para jóvenes, pero a finales de septiembre de 2026 sus médicos no están recetando. Los servicios de salud mental continúan. El caso sigue en curso.
    last_update: "2026-09-22"
    url: https://coloradosun.com/2026/09/22/childrens-hospital-colorado-contempt-ruling/
    sources: [sun-chc-contempt, sun-chc-supreme, sun-chc-suspend]
