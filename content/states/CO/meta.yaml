  notes: >-
    Climate set from Colorado statutes (HB19-1039, HB24-1071, HB25-1312, SB26-018, SB23-188) and cross-checked
    against the MAP equality maps. Care is marked protective based on state law, but youth access narrowed in 2026
    (hospital suspensions, federal Medicaid rule effective October 13, 2026) and Proposition 135 (surgery for minors)
    is on the November 3, 2026 ballot; revisit after the election.
overview:
  en: >-
    Colorado's laws are among the most protective for trans people. Name changes for gender identity need no newspaper
    publication (though you must get a fingerprint background check), and driver's licenses and birth certificates offer
    M, F, or X by self-attestation. Health First Colorado and state-regulated private plans cover gender-affirming care,
    and a 2023 shield law protects patients and providers. Youth care is the exception: major hospitals stopped
    prescribing to minors in 2026 under federal pressure, Medicaid coverage for minors ends October 13, 2026, and a
    ballot measure on surgery for minors is before voters in November 2026.
  es: >-
    Las leyes de Colorado están entre las que más protegen a las personas trans. Los cambios de nombre por identidad de
    género no requieren publicación en el periódico (aunque sí una verificación de antecedentes con huellas), y las
    licencias y actas de nacimiento ofrecen M, F o X por declaración propia. Health First Colorado y los seguros privados
    regulados por el estado cubren la atención de afirmación de género, y una ley escudo de 2023 protege a pacientes y
    proveedores. La excepción es la atención a jóvenes: los principales hospitales dejaron de recetar a menores en 2026
    por presión federal, la cobertura de Medicaid para menores termina el 13 de octubre de 2026, y una medida sobre
    cirugía para menores está en la boleta de noviembre de 2026.
