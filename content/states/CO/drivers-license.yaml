sources:
  - id: dmv-change-sex
    url: https://dmv.colorado.gov/change-your-sex
    title: Change Your Sex Identifier (read via Internet Archive snapshot of January 9, 2026)
    publisher: Colorado Division of Motor Vehicles
    kind: official
    accessed: "2026-09-24"
    quote: "People can designate M (male), F (female) or X. ... You must appear at an office in person to change your sex identifier. ... There is no additional fee for people to change the sex identifier."
  - id: dr2083
    url: https://dmv.colorado.gov/sites/dmv/files/documents/DR2083_2023.pdf
    title: Form DR 2083, Change of Sex Designation (rev. 03/14/23; read via Internet Archive snapshot of February 22, 2026)
    publisher: Colorado Department of Revenue
    kind: form
    accessed: "2026-09-24"
    quote: I, the above named person, confirm under penalty of law that the sex designation on my driver license/identification card does not align with my gender identity.
  - id: dmv-fees
    url: https://dmv.colorado.gov/state-dmv-fees
    title: State DMV Fees (read via Internet Archive snapshot of May 11, 2026)
    publisher: Colorado Division of Motor Vehicles
    kind: official
    accessed: "2026-09-24"
    quote: "Driver License, renewal $32.00; Identification Card (under 60 Years Old) $13.00; Identification Card (over 60 years old) FREE; Duplicate Permit or License $12.30; Subsequent Duplicate Permit or License $16.40"
  - id: crs-42-2-107
    url: https://colorado.public.law/statutes/crs_42-2-107
    title: C.R.S. § 42-2-107, Application for license (2024 edition text)
    publisher: Colorado.Public.Law (from the Office of Legislative Legal Services CRS 2024)
    kind: statute
    accessed: "2026-09-24"
    quote: The department shall issue a new driver's license to a person who has a gender different from the sex denoted on that person's driver's license when the department receives a new birth certificate ... or ... a statement ... confirming the sex designation ... does not align with the person's gender identity.
  - id: hb25-1312
    url: https://leg.colorado.gov/bills/hb25-1312
    title: HB25-1312, Kelly Loving Act (signed May 16, 2025)
    publisher: Colorado General Assembly
    kind: statute
    accessed: "2026-09-24"
    quote: The department may only amend a sex designation for an individual's driver's license three times upon the individual's request. ... sections 11, 12, and 13 of this act take effect October 1, 2026.
