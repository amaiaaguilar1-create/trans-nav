    Archive snapshots: "Change Your Sex Identifier" (January 9, 2026), form DR 2083 (revision 03/14/23, snapshot of
    February 22, 2026), and "State DMV Fees" (May 11, 2026). Reviewer: (1) The DMV announced fee adjustments effective
    June 30 and July 1, 2026 (press release title seen in the archive index; page itself was blocked), so the fee
