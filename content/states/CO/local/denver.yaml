      es: Línea de apoyo entre pares dirigida por y para personas trans, 877-565-8860; también ofrece microsubvenciones.
    url: https://translifeline.org/
    phone: "877-565-8860"
    cost: free
    verification: org_website
    sources: [translifeline]
