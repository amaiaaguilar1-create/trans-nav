  notes: >-
    Climate ratings based on 735 ILCS 5/21 as amended by P.A. 103-1063 (no publication, impoundment for transgender
    petitioners), self-attestation for driver's licenses and birth certificates with an X option, and the 2023 shield
    law (P.A. 102-1117). Cross-checked against MAP on 2026-09-24.
overview:
  en: >-
    Illinois is one of the most protective states for trans people. Since March 2025 adult name changes need no
    newspaper publication and can be sealed on request, driver's licenses, state IDs, and Illinois birth certificates
    offer M, F, or X by self-attestation, Medicaid and state-regulated insurance cover gender-affirming care, and a
    shield law protects patients and providers from other states' bans. Federal documents (passport, Social Security)
    are the exception: their sex fields currently follow sex assigned at birth.
  es: >-
    Illinois es uno de los estados que más protege a las personas trans. Desde marzo de 2025 los cambios de nombre de
    adultos no requieren publicación en periódico y pueden sellarse a pedido, las licencias, identificaciones y actas de
    nacimiento de Illinois ofrecen M, F o X por declaración propia, Medicaid y los seguros regulados por el estado
    cubren la atención de afirmación de género, y una ley escudo protege a pacientes y proveedores. Los documentos
    federales (pasaporte, Seguro Social) son la excepción: su campo de sexo sigue el sexo asignado al nacer.
