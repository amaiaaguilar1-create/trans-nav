status_summary:
  en: >-
    Gender-affirming care is legal for adults and minors in Illinois, and a 2023 shield law protects patients and
    providers from other states' bans. Illinois Medicaid covers hormone therapy and surgery, and state-regulated private
    insurance may not exclude transition-related care. A new federal Medicaid rule targeting care for patients under 18
    is set to start October 13, 2026 and is being challenged in court.
  es: >-
    La atención de afirmación de género es legal para adultos y menores en Illinois, y una ley escudo de 2023 protege a
    pacientes y proveedores de las prohibiciones de otros estados. Medicaid de Illinois cubre terapia hormonal y
    cirugía, y los seguros privados regulados por el estado no pueden excluir la atención de transición. Una nueva regla
    federal de Medicaid dirigida a menores de 18 años comenzaría el 13 de octubre de 2026 y está impugnada en tribunales.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Several Chicago community health centers, including Howard Brown Health, provide hormone therapy and gender-affirming surgery navigation, and telehealth prescribing is legal statewide.

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **Illinois Medicaid** through ABE (free for adults with income up to about 138% of the federal poverty level). It covers hormones and surgery.
      2. Go to a **community health center** (federally qualified health center). They must see you regardless of ability to pay and charge on a sliding scale. Find one at findahealthcenter.hrsa.gov.
      3. **Planned Parenthood of Illinois** health centers offer gender-affirming hormone care on a sliding scale (call to confirm your nearest center and age minimum).
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for people who cannot afford it.
      5. For the medications themselves, generic spironolactone and estradiol are inexpensive with a GoodRx-type coupon; ask the pharmacy for the cash price.
    es: |
      Sin restricciones estatales. Varios centros de salud comunitarios de Chicago, incluido Howard Brown Health, ofrecen terapia hormonal y orientación para cirugía de afirmación de género, y la telesalud es legal en todo el estado.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medicaid de Illinois** en ABE (gratis para adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza). Cubre hormonas y cirugía.
      2. Acude a un **centro de salud comunitario**. Deben atenderte sin importar tu capacidad de pago y cobran en escala móvil. Búscalo en findahealthcenter.hrsa.gov.
      3. Los centros de **Planned Parenthood of Illinois** ofrecen atención hormonal en escala móvil (llama para confirmar el centro y la edad mínima).
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud para quienes no pueden pagarla.
  sources: [howard-brown-tgd, hrsa, pop-hrt, pride-connect-health]
minor_care:
  status: available
  detail:
    en: |
      Legal. Illinois has no ban on gender-affirming care for minors, and the **Lawful Health Care Activity Act** (2023) defines treatment of gender dysphoria and affirmation of gender identity as "lawful health care" and protects patients, families, and providers from other states' attempts to punish it. Care for minors requires parental consent and follows clinical guidelines.

      Two cautions as of September 2026:
      - **Some hospitals have stopped providing this care to patients under 19** out of fear of lawsuits or loss of federal funding, even though it remains legal in Illinois. Community health centers such as Howard Brown (all-in-one care for ages 12 to 24) continue to see youth; call to confirm.
      - A **federal CMS rule** issued in August 2026 bars federal Medicaid and CHIP funds from paying for puberty blockers, hormones, or surgery for enrollees under 18 (CHIP under 19), effective **October 13, 2026**, with up to six months of continued hormone coverage for people already on treatment. Illinois says Medicaid covers youth care, and the Illinois Attorney General co-leads a lawsuit against the rule. Call the IL Pride Connect Legal Hotline (855-805-9200) if coverage is affected.
    es: |
      Legal. Illinois no prohíbe la atención de afirmación de género para menores, y la **Ley de Actividad de Atención Médica Lícita** (2023) define el tratamiento de la disforia de género y la afirmación de la identidad de género como "atención médica lícita" y protege a pacientes, familias y proveedores de los intentos de otros estados de castigarla. Requiere consentimiento de los padres.

      Dos advertencias a septiembre de 2026:
      - **Algunos hospitales dejaron de ofrecer esta atención a menores de 19 años** por temor a demandas o pérdida de fondos federales, aunque sigue siendo legal. Centros comunitarios como Howard Brown (atención para edades de 12 a 24) siguen atendiendo a jóvenes; llama para confirmar.
      - Una **regla federal de CMS** de agosto de 2026 prohíbe usar fondos federales de Medicaid y CHIP para bloqueadores, hormonas o cirugía para menores de 18 (CHIP menores de 19), a partir del **13 de octubre de 2026**, con hasta seis meses de cobertura hormonal para quienes ya están en tratamiento. El Fiscal General de Illinois codirige una demanda contra la regla. Llama a la Línea Legal de IL Pride Connect (855-805-9200) si tu cobertura se ve afectada.
  sources: [pa-102-1117, pride-connect-health, howard-brown-home]
medicaid:
  program_name: Illinois Medicaid (HealthChoice Illinois managed care; All Kids for children)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Illinois Medicaid covers gender-affirming care, including hormone therapy and surgery, for adults and youth. Most enrollees are in a HealthChoice Illinois managed care plan, which may require prior authorization for surgery. If a plan denies care, you can appeal; the IL Pride Connect Legal Hotline (855-805-9200) and Illinois Legal Aid Online explain how.

      **Who qualifies**: adults with income up to about 138% of the federal poverty level, with higher limits for children (All Kids) and pregnant people. **Apply** online through ABE (Application for Benefits Eligibility), by phone, or at a Department of Human Services Family Community Resource Center.

      **Federal change for youth**: a CMS rule effective October 13, 2026 bars federal Medicaid/CHIP funding for gender-affirming care for enrollees under 18 (CHIP under 19). States may still pay with state funds; Illinois's response is not yet final and the rule is being challenged in court.
    es: |
      Medicaid de Illinois cubre la atención de afirmación de género, incluidas la terapia hormonal y la cirugía, para adultos y jóvenes. La mayoría está en un plan de HealthChoice Illinois, que puede requerir autorización previa para cirugía. Si el plan niega la atención, puedes apelar.

      **Quién califica**: adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza, con límites más altos para niños (All Kids) y embarazadas. **Solicita** en línea en ABE, por teléfono o en una oficina del Departamento de Servicios Humanos.

      **Cambio federal para jóvenes**: una regla de CMS vigente desde el 13 de octubre de 2026 prohíbe fondos federales de Medicaid/CHIP para esta atención a menores de 18 (CHIP menores de 19). Los estados pueden pagar con fondos propios; la regla está impugnada.
  how_to_apply_url: https://abe.illinois.gov/
  sources: [pride-connect-health, abe]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      The Illinois Human Rights Act prohibits discrimination based on gender-related identity, and the Illinois Department of Insurance (Company Bulletin 2014-10) told state-regulated insurers they may not exclude coverage for gender-transition-related care or deny medically necessary services because of gender identity. Insurers may not refuse to enroll you, cancel you, charge more, or deny a service because the gender on your plan does not match the service. Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates for those.

      If a state-regulated plan denies care, file an appeal with the plan and then a complaint with the **Illinois Department of Insurance** (online), and call the IL Pride Connect Legal Hotline for help.
    es: |
      La Ley de Derechos Humanos de Illinois prohíbe la discriminación por identidad relacionada con el género, y el Departamento de Seguros de Illinois (Boletín 2014-10) indicó a las aseguradoras reguladas por el estado que no pueden excluir la atención relacionada con la transición ni negar servicios médicamente necesarios por identidad de género. Los planes autofinanciados por empleadores están regulados a nivel federal y pueden no estar cubiertos.

      Si un plan niega la atención, apela ante el plan y luego presenta una queja ante el **Departamento de Seguros de Illinois**.
  complaint_url: https://idoi.illinois.gov/consumers/file-a-complaint.html
  sources: [idoi-cb-2014-10, idoi-complaint, pride-connect-health, map-health]
