litigation:
  - case: Multistate challenge to the CMS rule on Medicaid/CHIP funding for youth gender-affirming care (co-led by Illinois)
    summary:
      en: >-
        Illinois Attorney General Kwame Raoul co-leads a coalition of states suing to stop an August 2026 CMS final rule
        that bars federal Medicaid and CHIP funds for gender-affirming care for enrollees under 18 (CHIP under 19).
      es: >-
        El Fiscal General de Illinois codirige una coalición de estados que demanda para detener una regla final de CMS
        de agosto de 2026 que prohíbe fondos federales de Medicaid y CHIP para esta atención a menores de 18 (CHIP 19).
    effect_today:
      en: >-
        The rule is scheduled to take effect October 13, 2026. Until then nothing changes. Adults are not affected.
        People already on hormones may keep federally funded coverage for up to six months after that date.
      es: >-
        La regla entraría en vigor el 13 de octubre de 2026. Hasta entonces nada cambia. Los adultos no se ven
        afectados.
    last_update: "2026-09-24"
    url: https://www.illinoisattorneygeneral.gov/news/story/attorney-general-raoul-leads-coalition-challenging-trump-administrations-latest-attack-on-healthcare-for-transgender-youth
    sources: [pride-connect-health]
