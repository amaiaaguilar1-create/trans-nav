  program_name: Arkansas Medicaid (including ARHOME)
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: State law bars Arkansas Medicaid from covering gender transition procedures for anyone under 18. We could not confirm the program's policy for adults; ask your plan or doctor before starting, and appeal any denial.
    es: La ley estatal prohíbe que Medicaid de Arkansas cubra procedimientos de transición para menores de 18 años. No pudimos confirmar la política para adultos; pregunta a tu plan o médico antes de empezar y apela cualquier negativa.
  how_to_apply_url: https://access.arkansas.gov/
  sources: [act626, access-ar]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: Arkansas has no law requiring coverage of gender-affirming care. Ark. Code § 23-79-164 bans coverage for minors and says plans are not required to cover it for anyone. Plans governed by federal law (many employer plans) may have different rules. You can file a complaint with the Arkansas Insurance Department.
    es: Arkansas no tiene ley que exija cubrir la atención de afirmación de género. El § 23-79-164 prohíbe la cobertura para menores y dice que los planes no están obligados a cubrirla para nadie. Los planes regidos por la ley federal (muchos planes de empleadores) pueden tener otras reglas. Puedes presentar una queja ante el Departamento de Seguros de Arkansas.
  complaint_url: https://insurance.arkansas.gov/consumer-assistance/consumer-services/file-a-complaint/
  sources: [act626, aid-complaint]
