status_summary:
  en: >-
    Adults 18 and older can legally get hormone therapy in Arkansas, including by informed consent at Planned
    Parenthood and by telehealth. Hormones, puberty blockers, surgery, and referrals for gender transition are banned
    for everyone under 18 (Act 626); a federal appeals court upheld the ban in August 2025. Insurers are not required
    to cover transition care at any age, and Arkansas has no shield law.
  es: >-
    Los adultos de 18 años o más pueden obtener legalmente terapia hormonal en Arkansas, incluso por consentimiento
    informado en Planned Parenthood y por telesalud. Las hormonas, bloqueadores de pubertad, cirugías y referidos para
    la transición están prohibidos para menores de 18 años (Ley 626); un tribunal federal de apelaciones confirmó la
    prohibición en agosto de 2025. Las aseguradoras no están obligadas a cubrir la atención de transición a ninguna
    edad, y Arkansas no tiene ley escudo.
adult_care:
  status: available
  detail:
    en: |
      No Arkansas law bans gender-affirming care for adults 18 and older. But Ark. Code § 23-79-164(c) says health plans are **not required** to cover gender transition procedures, so check your plan before you start.

      **If you have little money or no insurance**, in rough order:
      1. **Planned Parenthood Great Plains** offers hormone therapy to patients **18 and older** at all its health centers, including Little Rock and Rogers, with **no therapy letter**. It takes most insurance and has financial counselors. Call 1-800-230-PLAN.
      2. **Telehealth**: Plume and QueerMed serve Arkansas. Point of Pride's HRT Access Fund can help pay.
      3. **Community health centers** charge on a sliding scale; find one at findahealthcenter.hrsa.gov and ask whether they prescribe hormones.
    es: |
      Ninguna ley de Arkansas prohíbe la atención de afirmación de género para adultos de 18 años o más. Pero el Código de Arkansas § 23-79-164(c) dice que los planes de salud **no están obligados** a cubrir procedimientos de transición, así que revisa tu plan antes de empezar.

      **Si tienes poco dinero o no tienes seguro**, en orden aproximado:
      1. **Planned Parenthood Great Plains** ofrece terapia hormonal a pacientes de **18 años o más** en todos sus centros, incluidos Little Rock y Rogers, **sin carta de terapeuta**. Acepta la mayoría de los seguros y tiene asesores financieros. Llama al 1-800-230-PLAN.
      2. **Telesalud**: Plume y QueerMed atienden Arkansas. El Fondo de Acceso a TRH de Point of Pride puede ayudar a pagar.
      3. Los **centros de salud comunitarios** cobran en escala móvil; búscalos en findahealthcenter.hrsa.gov y pregunta si recetan hormonas.
  sources: [act626, ppgp-gac, queermed, pop-hrt, hrsa]
minor_care:
  status: prohibited
  detail:
    en: |
      **Act 626 of 2021** (the SAFE Act, Ark. Code §§ 20-9-1501 to -1504), passed over the governor's veto, bars physicians and other health care professionals from providing **puberty blockers, cross-sex hormones, or gender transition surgery** to anyone under 18, and from **referring** a minor for them. Exceptions cover differences of sex development and treating complications. Violations are unprofessional conduct subject to license discipline, and patients can sue. Public funds, state and local facilities, and Arkansas Medicaid may not pay for or provide this care to minors, and no health plan may cover it for minors.

      A federal district court struck the law down in 2023, but on **August 12, 2025** the full Eighth Circuit (en banc) reversed in *Brandt v. Griffin* and the law is in effect.

      The Protecting Minors from Medical Malpractice Act (**Act 274 of 2023**, expanded by **Act 979 of 2025**) lets a person who received transition procedures, puberty blockers, or cross-sex hormones as a minor sue the provider up to **15 years after turning 18**, and Act 979 extends this to mental health professionals who provide a "gender-affirming intervention."
    es: |
      La **Ley 626 de 2021** (Ley SAFE, Código de Arkansas §§ 20-9-1501 a -1504), aprobada sobre el veto del gobernador, prohíbe a médicos y otros profesionales dar **bloqueadores de pubertad, hormonas cruzadas o cirugía de transición** a menores de 18 años, y **referir** a un menor para recibirlos. Hay excepciones para diferencias del desarrollo sexual y para tratar complicaciones. Las violaciones son conducta no profesional sujeta a disciplina de licencia, y los pacientes pueden demandar. Los fondos públicos, las instalaciones estatales y locales y Medicaid de Arkansas no pueden pagar ni dar esta atención a menores, y ningún plan de salud puede cubrirla para menores.

      Un tribunal federal de distrito anuló la ley en 2023, pero el **12 de agosto de 2025** el Octavo Circuito en pleno revocó esa decisión en *Brandt v. Griffin* y la ley está vigente.

      La Ley de protección de menores contra la negligencia médica (**Ley 274 de 2023**, ampliada por la **Ley 979 de 2025**) permite a quien recibió estos tratamientos siendo menor demandar al proveedor hasta **15 años después de cumplir 18**, e incluye a profesionales de salud mental que hagan una "intervención de afirmación de género".
  sources: [act626, brandt-8th, act274, act979]
