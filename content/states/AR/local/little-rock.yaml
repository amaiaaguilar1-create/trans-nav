jurisdiction: AR
slug: little-rock
name: Little Rock
area:
  en: Pulaski County and the central Arkansas metro (North Little Rock, Conway, Benton)
  es: Condado de Pulaski y el área metropolitana del centro de Arkansas (North Little Rock, Conway, Benton)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Pulaski fee schedules are dated May 20, 2019 (latest posted); confirm $165. The Pulaski Circuit/County Clerk site
    advertises a "free civil legal help desk event" but we did not read its details. Planned Parenthood Little Rock
    address and phone from its health center page. We found no verified Little Rock LGBTQ community center or
    FQHC with a published trans health program; Lucie's Place's domain no longer works. Reviewer: consider adding
    local FQHCs and LGBTQ-affirming mental health providers after checking their pages.
intro:
  en: >-
    Little Rock is home to the state courts, the Department of Health's Vital Records office, and a Planned Parenthood
    health center that prescribes hormones to adults by informed consent. Name-change petitions for Pulaski County
    residents are filed with the Pulaski County Circuit Clerk.
  es: >-
    Little Rock tiene los tribunales estatales, la oficina de Registros Vitales del Departamento de Salud y un centro
    de Planned Parenthood que receta hormonas a adultos por consentimiento informado. Las peticiones de cambio de
    nombre de residentes del condado de Pulaski se presentan ante el Secretario del Tribunal de Circuito de Pulaski.
court:
  name: Pulaski County Circuit Court (Circuit Clerk, 401 West Markham St., Little Rock)
  url: https://pulaskiclerkar.gov/
  filing_fee: 165
  notes:
    en: Filing fee from the clerk's court filings fee schedule; certified copies are $5 per seal. Clerk's office phone 501-340-8500.
    es: Tarifa según la tabla de tarifas del secretario; las copias certificadas cuestan $5 por sello. Teléfono 501-340-8500.
  sources: [pulaski-clerk, pulaski-fees]
