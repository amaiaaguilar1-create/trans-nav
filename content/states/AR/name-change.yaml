review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Statute text read from Act 331 of 2023 (HB 1473) on arkleg.state.ar.us, which rewrote Ark. Code 9-2-101; no later
    amendment to 9-2-101 was found in the 2025 code-sections-amended list. The consolidated code (Lexis, Justia) could
    not be fetched. Filing fee $165 and certified copy $5 per seal are from the Pulaski County Circuit/County Clerk fee
    schedules dated May 20, 2019 (the most recent posted); reviewer should confirm they are current. We could NOT find
    a verified URL for a statewide adult "Petition for Change of Name" template: A4TE's Arkansas page links to Arkansas
    Law Help (a.arlawhelp.org) forms, but the adult-petition link on A4TE points to a cover sheet, and the Arkansas Law
    Help LGBTQIA guide URL returned 404 on 2026-09-24. The Order for Name Change and the minor petition, consent, and
    proof-of-service templates on a.arlawhelp.org were downloaded and read. Hearing practice (held or not) varies by
