  notes: >-
    Climate based on primary sources: Act 711 of 2025 (license marker only with amended birth certificate, no X), ADH
    birth certificate page (court order citing surgery), Act 626 of 2021 upheld in Brandt v. Griffin (8th Cir. en banc,
    Aug. 12, 2025), Act 955 of 2025 (SB 486, sex-designated multi-occupancy restrooms, changing rooms, and sleeping
    quarters in shelters, correctional facilities, and public buildings). MAP's Arkansas profile agrees (negative on
    IDs and care, no shield law). Lucie's Place's domain now redirects to an unrelated site, and the Arkansas
    Transgender Equality Coalition and Center for Artistic Revolution sites did not resolve; they are not listed.
overview:
  en: >-
    Arkansas is restrictive for trans people. Name changes are straightforward (no newspaper publication, fee about
    $165), but the sex on a birth certificate changes only with a court order citing surgery, and a 2025 law (Act 711)
    lets the driver's license show only M or F matching an amended birth certificate. Adults can get hormone therapy,
    including by informed consent, but care for minors is banned (Act 626, upheld in 2025), insurers need not cover
    transition care, and there is no shield law.
  es: >-
    Arkansas es restrictivo para las personas trans. El cambio de nombre es sencillo (sin publicación en periódico,
    tarifa de unos $165), pero el sexo en el acta de nacimiento solo cambia con una orden judicial que mencione
    cirugía, y una ley de 2025 (Ley 711) permite que la licencia muestre solo M o F según un acta enmendada. Los
    adultos pueden obtener terapia hormonal, incluso por consentimiento informado, pero la atención para menores está
    prohibida (Ley 626, confirmada en 2025), las aseguradoras no están obligadas a cubrirla y no hay ley escudo.
