overview:
  en: >-
    Rhode Island is protective for trans people. Courts must grant adult name changes unless they are for fraud, may not
    require newspaper publication, and must seal the record when an open record would put your safety at risk, and
    being transgender counts toward that risk. Driver's licenses and birth certificates offer M, F, or X by
    self-attestation, Medicaid and state-regulated insurance cover gender-affirming care, and a 2024 shield law protects
    patients and providers from other states' lawsuits. Federal documents (passport, Social Security) are the
    exception: their sex fields are currently frozen nationwide.
  es: >-
    Rhode Island protege a las personas trans. Los tribunales deben conceder el cambio de nombre de un adulto salvo que
    sea por fraude, no pueden exigir publicación en periódico y deben sellar el expediente cuando un expediente abierto
    ponga en riesgo tu seguridad, y ser transgénero cuenta para ese riesgo. Las licencias de conducir y las actas de
    nacimiento ofrecen M, F o X por declaración propia, Medicaid y los seguros regulados por el estado cubren la
    atención de afirmación de género, y una ley escudo de 2024 protege a pacientes y proveedores de demandas de otros
    estados. Los documentos federales (pasaporte, Seguro Social) son la excepción: sus campos de sexo están congelados
    a nivel nacional.
