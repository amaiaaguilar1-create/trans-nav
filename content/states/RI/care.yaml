jurisdiction: RI
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Shield law read directly (R.I. Gen. Laws chapter 23-101 and chapter 5-37.8, P.L. 2024 ch. 260/261, effective June
    25, 2024). The drafting request called it a 2023 law; the legislature's history notes say 2024. Medicaid and
    private-insurance coverage could not be read at the source: eohhs.ri.gov, ohic.ri.gov, and dbr.ri.gov all block
    automated access. Coverage is stated per MAP (Medicaid policy "explicitly includes coverage"; private insurers
    "banned from excluding coverage"). From memory and unverified: the private-insurance protection is OHIC Health
    Insurance Bulletin 2015-3, and RI Medicaid coverage dates from about 2015. Reviewer: confirm both, the Medicaid
    policy citation, and any prior-authorization rules. No law restricting care for minors was found, and MAP shows no
    youth ban. Thundermist Health Center no longer has a trans health page on its site (checked the page sitemap); it
    is listed as community_reported from Namesake's directory. The Brown University Health (formerly Lifespan) Gender
    and Sexuality Program page was not found at the old or new URLs, so it is omitted; reviewer should locate it.
    Planned Parenthood of Southern New England states its gender-affirming services are for adults.
status_summary:
  en: >-
    Gender-affirming care is legal for adults and minors in Rhode Island. RI Medicaid and state-regulated private
    insurance cover it, and the 2024 Healthcare Provider Shield law protects patients and providers from other states'
    lawsuits and subpoenas. Open Door Health in Providence and Planned Parenthood offer hormone therapy with sliding-scale
    fees.
  es: >-
    La atención de afirmación de género es legal para adultos y menores en Rhode Island. Medicaid de RI y los seguros
    privados regulados por el estado la cubren, y la ley de Escudo para Proveedores de Salud de 2024 protege a
    pacientes y proveedores de demandas y citaciones de otros estados. Open Door Health en Providence y Planned
    Parenthood ofrecen terapia hormonal con tarifas en escala móvil.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. If you have no insurance and little money, in rough order:
      1. Apply for **RI Medicaid** through HealthyRhode or HealthSource RI; it covers gender-affirming care.
      2. Go to **Open Door Health** (Providence), Rhode Island's LGBTQ+ community health clinic, or a **community health center** with a sliding fee.
      3. **Planned Parenthood of Southern New England** offers hormone therapy and labs for adults, with a sliding fee scale and help enrolling in Medicaid.
      4. **Telehealth** (Plume, FOLX, Planned Parenthood) is available statewide.
      5. **Point of Pride** runs an HRT access fund.
    es: |
      Sin restricciones estatales. Si no tienes seguro ni mucho dinero, en orden aproximado:
      1. Solicita **Medicaid de RI** a través de HealthyRhode o HealthSource RI; cubre la atención de afirmación de género.
      2. Acude a **Open Door Health** (Providence), la clínica comunitaria LGBTQ+ de Rhode Island, o a un **centro de salud comunitario** con tarifa móvil.
      3. **Planned Parenthood of Southern New England** ofrece terapia hormonal y análisis para adultos, con escala móvil y ayuda para inscribirte en Medicaid.
      4. **Telesalud** (Plume, FOLX, Planned Parenthood) está disponible en todo el estado.
      5. **Point of Pride** tiene un fondo de acceso a TRH.
  sources: [odh-gac, ppsne-gac, map-ri, pop-hrt]
minor_care:
  status: available
  detail:
    en: |
      Legal; Rhode Island has no ban on gender-affirming care for minors. The Healthcare Provider Shield (chapter 23-101, 2024) lets people sued elsewhere over legally protected gender-affirming or reproductive care sue back in Rhode Island, limits state cooperation with out-of-state subpoenas and judgments, and chapter 5-37.8 protects providers' licenses, malpractice insurance, and jobs. Care for minors normally requires a parent's or guardian's consent. Planned Parenthood of Southern New England's program is for adults; ask a pediatric provider for a referral.
    es: |
      Legal; Rhode Island no prohíbe la atención de afirmación de género para menores. El Escudo para Proveedores de Salud (capítulo 23-101, 2024) permite a quienes sean demandados en otro estado por atención de afirmación de género o reproductiva legalmente protegida demandar a su vez en Rhode Island, limita la cooperación estatal con citaciones y sentencias de otros estados, y el capítulo 5-37.8 protege las licencias, el seguro de responsabilidad y los empleos de los proveedores. La atención para menores normalmente requiere el consentimiento de un padre, madre o tutor. El programa de Planned Parenthood of Southern New England es para adultos; pide una referencia a un proveedor pediátrico.
  sources: [rigl-23-101, rigl-23-101-2, rigl-5-37-8, map-ri, ppsne-gac]
medicaid:
  program_name: Rhode Island Medicaid (including RIte Care)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Rhode Island's Medicaid policy explicitly includes coverage of transgender-related care, according to the Movement Advancement Project. Expect prior authorization for surgery. Apply online at HealthyRhode or through HealthSource RI; RIPIN's call center (401-270-0101) helps with enrollment and denials.
    es: |
      La política de Medicaid de Rhode Island incluye explícitamente la cobertura de atención relacionada con la transición, según el Movement Advancement Project. Espera autorización previa para cirugías. Solicita en línea en HealthyRhode o a través de HealthSource RI; el centro de llamadas de RIPIN (401-270-0101) ayuda con la inscripción y las denegaciones.
  how_to_apply_url: https://healthyrhode.ri.gov/
  sources: [map-medicaid, healthyrhode, ripin]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      Rhode Island bans state-regulated health insurers from excluding coverage for transgender people (per MAP). Self-funded employer plans are regulated federally and may differ. If a claim is denied, appeal, and get free help from RIPIN's health insurance advocates or A4TE's Trans Health Project. Complaints about insurers go to the Office of the Health Insurance Commissioner (OHIC).
    es: |
      Rhode Island prohíbe a las aseguradoras de salud reguladas por el estado excluir la cobertura para personas transgénero (según MAP). Los planes autofinanciados de empleadores están regulados a nivel federal y pueden ser distintos. Si te niegan un reclamo, apela y busca ayuda gratuita con los defensores de seguros de RIPIN o el Trans Health Project de A4TE. Las quejas sobre aseguradoras van a la Oficina del Comisionado de Seguros de Salud (OHIC).
  complaint_url: https://ohic.ri.gov/
  sources: [map-ri, ripin, a4te-thp]
