jurisdiction: RI
slug: providence
name: Providence
area:
  en: City of Providence and the surrounding Providence County metro. Name changes are filed in the probate court of the city or town where you live, so residents of Cranston, Pawtucket, and other towns file in their own town's probate court.
  es: Ciudad de Providence y el área metropolitana del condado de Providence. Los cambios de nombre se presentan en el tribunal de sucesiones de la ciudad o pueblo donde vives, así que los residentes de Cranston, Pawtucket y otros pueblos presentan en el tribunal de su propio pueblo.
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Providence Probate Court details (fee $39 including one certified copy, hearings Tuesdays and Thursdays at 10 am,
    BCI report no older than 60 days, mail filing to Room 501) come from the court's own instructions PDF dated August
    2025, read 2026-09-24. Clinic and org details come from each org's site the same day. Project Weber/RENEW's role in
    name-change clinics comes from Namesake's blog, not Weber/RENEW's own site. Planned Parenthood's Providence health
    center address was not confirmed and is omitted. Brown University Health's Gender and Sexuality Program page could
    not be found and is omitted; reviewer should add it if still operating.
intro:
  en: >-
    Providence is Rhode Island's hub for trans services. Name changes go through the Providence Probate Court at City
    Hall for city residents. Open Door Health is the state's LGBTQ+ community health clinic, Youth Pride serves young
    people, and TGI Network runs peer support groups. Free legal help is available from GLAD Law's Transgender ID
    Project, and Namesake fills out the court forms for you.
  es: >-
    Providence es el centro de los servicios trans en Rhode Island. Los residentes de la ciudad tramitan su cambio de
    nombre en el Tribunal de Sucesiones de Providence, en el Ayuntamiento. Open Door Health es la clínica comunitaria
    LGBTQ+ del estado, Youth Pride atiende a jóvenes y TGI Network organiza grupos de apoyo entre pares. Hay ayuda
    legal gratuita del Transgender ID Project de GLAD Law, y Namesake llena los formularios judiciales por ti.
court:
  name: Providence Probate Court
  url: https://www.providenceri.gov/probate-court/
  filing_fee: 39
  notes:
    en: |
      Providence City Hall, 25 Dorrance St, 5th floor (Room 501), Providence, RI 02903. Phone 401-680-5000; email ProvidenceProbateCourt@providenceri.gov. File in person or by mail (Attn. name change) with: a copy of your birth certificate, a Rhode Island ID showing a Providence address (or a utility bill or lease going back 6 months), an original BCI report no older than 60 days, and the PC-8.1 petition notarized with a wet-ink signature (no electronic notary). The $39 fee (check or money order) includes one certified copy; extra copies are $5. Name-change hearings are Tuesdays and Thursdays at 10 am.
    es: |
      Ayuntamiento de Providence, 25 Dorrance St, 5.º piso (Sala 501), Providence, RI 02903. Teléfono 401-680-5000; correo ProvidenceProbateCourt@providenceri.gov. Presenta en persona o por correo (Attn. name change) con: copia de tu acta de nacimiento, una ID de Rhode Island con dirección en Providence (o una factura de servicios o contrato de alquiler de hace 6 meses), un informe BCI original de no más de 60 días y la petición PC-8.1 notarizada con firma en tinta (no se acepta notario electrónico). La tarifa de $39 (cheque o giro postal) incluye una copia certificada; las copias adicionales cuestan $5. Las audiencias de cambio de nombre son los martes y jueves a las 10 am.
  sources: [pvd-probate, pvd-instructions]
resources:
  - id: namesake
    org: namesake
    name: Namesake
    type: other
    pillars: [name_change, gender_marker]
    description:
      en: Free tool that fills out the Rhode Island name change petition and guides you through the Providence Probate Court, DMV, and birth certificate steps.
      es: Herramienta gratuita que llena la petición de cambio de nombre de Rhode Island y te guía por los pasos del Tribunal de Sucesiones de Providence, el DMV y el acta de nacimiento.
    url: https://namesake.fyi/guides/ri
