  - cite: KRS 401.020
    title:
      en: Name change for a child; notice and hearing if a parent does not sign
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=55610
  - cite: KRS 401.040
    title:
      en: Certification of order to county clerk unless sealed; recording fee
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=57721
