sources:
  - id: krs-401-010
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=41791
    title: KRS 401.010, Adult may have name changed by District Court
    publisher: Kentucky Legislative Research Commission
    kind: statute
    accessed: "2026-09-24"
    quote: Any person at least eighteen (18) years of age may have his or her name changed by the District Court of the county in which he or she resides.
  - id: krs-401-020
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=55610
    title: KRS 401.020, Parents or guardian may have child's name changed
    publisher: Kentucky Legislative Research Commission
    kind: statute
    accessed: "2026-09-24"
    quote: The court shall conduct a hearing on the petition no later than sixty (60) days from the date of service and make findings of fact and conclusions of law based on the best interests of the child.
  - id: krs-401-040
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=57721
    title: KRS 401.040, Certification of order for name change, fee, index kept by county clerk
    publisher: Kentucky Legislative Research Commission
    kind: statute
    accessed: "2026-09-24"
    quote: a copy of the order shall be certified by the clerk of that court to the county clerk, for record, unless the court has ordered the record sealed or otherwise restricted from public inspection.
  - id: krs-64-012
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=57720
    title: KRS 64.012, Fees of county clerks
    publisher: Kentucky Legislative Research Commission
    kind: statute
    accessed: "2026-09-24"
    quote: "Court ordered name change pursuant to KRS Chapter 401 ... if the entire thereof does not exceed five (5) pages ... $33.00"
  - id: krs-24a-170
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=20695
    title: KRS 24A.170, Fees and costs for civil cases
    publisher: Kentucky Legislative Research Commission
    kind: statute
    accessed: "2026-09-24"
    quote: The Supreme Court shall by rule set the filing fees and miscellaneous costs for civil cases filed in the District Court.
  - id: aoc-295
    url: https://www.kycourts.gov/Legal-Forms/Legal%20Forms/295.pdf
    title: AOC-295, Petition for Name Change (Rev. 8-23)
    publisher: Kentucky Court of Justice
