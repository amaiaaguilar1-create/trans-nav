  - id: kyjustice
    name: Kentucky Justice Online (statewide legal aid portal)
    type: legal_aid
    pillars: [name_change]
    description:
      en: Run by Kentucky's legal aid programs. Plain-language name change information and a "Help Near You" tool that routes you to your region's free legal aid office.
      es: Portal de los programas de asistencia legal de Kentucky, con información sobre cambio de nombre y un buscador de ayuda legal gratuita en tu región.
    url: https://www.kyjustice.org/help-near-you
    cost: free
    verification: org_website
    sources: [kyjustice-name-change]
  - id: fayette-legal-help
    name: Fayette County Legal Help Center
    type: legal_aid
    pillars: [name_change]
    description:
      en: Volunteers help you locate and fill in court forms, including the name change petition. Thursdays 11 am to 2 pm.
      es: Voluntarios ayudan a encontrar y llenar formularios judiciales, incluida la petición de cambio de nombre. Jueves de 11 am a 2 pm.
    url: https://www.kycourts.gov/Courts/County-Information/Fayette/Pages/Legal-Help-Center.aspx
    address: Robert F. Stephens Circuit Courthouse, Law Library Room CB02A, 120 N. Limestone, Lexington, KY 40507
    cost: free
    verification: official_source
    sources: [fayette-lhc]
  - id: khjn
    name: Kentucky Health Justice Network, Trans Health Program
    type: advocacy_org
    pillars: [name_change, hrt, insurance]
    description:
      en: Statewide group offering grants for gender-affirming care, insurance navigation, support persons, and patient guides including how to change your legal name in Kentucky. Request help through the forms on its site.
      es: Grupo estatal que ofrece becas para atención de afirmación de género, orientación sobre seguros, acompañamiento y guías, incluida una sobre el cambio de nombre en Kentucky.
    url: https://www.kentuckyhealthjusticenetwork.org/transhealth.html
    cost: free
    verification: org_website
    sources: [khjn-trans]
  - id: transkentucky
    name: TransKentucky
    type: lgbtq_center
    pillars: [name_change, gender_marker, mental_health]
    description:
      en: Lexington-based trans support and social group with a Kentucky identity documents guide. Monthly meetings; 859-448-LGBT.
      es: Grupo de apoyo trans con sede en Lexington y una guía sobre documentos de identidad en Kentucky.
    url: https://www.transkentucky.com/other-resources/identity-documents/
    phone: "859-448-5428"
    cost: free
    verification: org_website
    sources: [transky-id]
  - id: aclu-ky
    name: ACLU of Kentucky
    type: legal_aid
    pillars: [name_change, gender_marker]
    description:
      en: Takes civil rights cases, including discrimination against trans people. Submit a legal assistance request online; it does not handle routine name changes.
      es: Acepta casos de derechos civiles, incluida la discriminación contra personas trans. No tramita cambios de nombre rutinarios.
    url: https://www.aclu-ky.org/legalassistance/
    cost: free
    verification: org_website
    sources: [aclu-ky]
  - id: pop-ky
    org: point-of-pride
    name: Point of Pride
    type: fund
    pillars: [name_change, hrt]
    description:
      en: National trans-led nonprofit with programs that help pay for gender-affirming care and related costs.
      es: Organización nacional que ayuda a pagar atención de afirmación de género y costos relacionados.
    url: https://www.pointofpride.org/
    cost: free
    verification: org_website
    sources: [pop]
