    court: U.S. District Court, Eastern District of Kentucky (No. 25-CV-00238)
    summary:
      en: Class action by people in Kentucky Department of Corrections custody challenging SB 2's ban on gender-affirming hormone therapy in prisons.
      es: Demanda colectiva de personas bajo custodia del Departamento de Correccionales contra la prohibición de terapia hormonal en prisiones de SB 2.
    effect_today:
      en: The court denied a preliminary injunction on September 12, 2025, and ACLU of Kentucky lists the case as dismissed. The prison ban is in effect.
      es: El tribunal negó una medida cautelar el 12 de septiembre de 2025 y ACLU de Kentucky indica que el caso fue desestimado. La prohibición está vigente.
