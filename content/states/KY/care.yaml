status_summary:
  en: >-
    Adults can legally get gender-affirming care in Kentucky, but since June 2025 Kentucky Medicaid may not pay for
    hormones or surgery for gender dysphoria, and state prisons may not provide them. Care for anyone under 18 (puberty
    blockers, hormones, surgery) has been banned since June 2023. There is no shield law.
  es: >-
    Los adultos pueden recibir legalmente atención de afirmación de género en Kentucky, pero desde junio de 2025
    Medicaid de Kentucky no puede pagar hormonas ni cirugía para la disforia de género, y las prisiones estatales no
    pueden proporcionarlas. La atención para menores de 18 (bloqueadores, hormonas, cirugía) está prohibida desde junio
    de 2023. No hay ley escudo.
adult_care:
  status: restricted
  detail:
    en: |
      There is no ban on care for adults 18 and older, and private clinics, Planned Parenthood, and telehealth providers prescribe hormones in Kentucky, many on an informed-consent basis (no therapist letter). But two 2025 laws limit who can get it paid for or provided:

      - **Medicaid**: KRS 205.5365 (HB 495) bars Kentucky Medicaid and its managed care plans from spending Medicaid funds on cross-sex hormones prescribed primarily or solely for gender dysphoria, and on gender reassignment surgery, unless federal law requires it.
      - **Prisons**: SB 2 (2025) prohibits hormone treatment or elective gender reassignment surgery for people in state prison. A class-action challenge (Marcum v. Crews) lost its bid for a preliminary injunction in September 2025.

      **If you are on Medicaid or uninsured**, realistic options are: paying cash at a sliding-scale clinic or Planned Parenthood; telehealth services (Plume and FOLX are subscription-based; generic estradiol and spironolactone are inexpensive with discount cards); and grants from the Kentucky Health Justice Network or Point of Pride. Medicaid still covers primary care, labs, and mental health care in general.
    es: |
      No hay prohibición para adultos de 18 años o más, y clínicas privadas, Planned Parenthood y servicios de telesalud recetan hormonas en Kentucky, muchos por consentimiento informado. Pero dos leyes de 2025 limitan quién puede recibirla pagada o proporcionada:

      - **Medicaid**: KRS 205.5365 (HB 495) prohíbe a Medicaid de Kentucky y sus planes gastar fondos en hormonas cruzadas recetadas principal o únicamente para la disforia de género, y en cirugía de reasignación, salvo que la ley federal lo exija.
      - **Prisiones**: SB 2 (2025) prohíbe el tratamiento hormonal o la cirugía electiva de reasignación para personas en prisiones estatales.

      **Si tienes Medicaid o no tienes seguro**, las opciones realistas son pagar en efectivo en clínicas con escala móvil o Planned Parenthood, servicios de telesalud (Plume y FOLX), y becas de Kentucky Health Justice Network o Point of Pride.
  sources: [krs-205-5365, hb495, sb2-2025, marcum, pp-affiliate, khjn-trans]
minor_care:
  status: prohibited
  detail:
    en: |
      KRS 311.372 (from SB 150, effective June 29, 2023) bars health care providers from giving anyone under 18, for the purpose of affirming a gender different from their sex at birth: puberty blockers; testosterone, estrogen, or progesterone above normal levels; sterilizing surgeries; genital surgeries; or removal of healthy body parts.

      - **Exceptions**: minors with a medically verifiable disorder of sex development, and treatment of complications caused by prohibited care.
      - **Tapering**: a provider who had already started a minor on blockers or hormones may wind them down gradually if stopping abruptly would cause harm, and must document this.
      - **Penalties**: the provider's licensing board must revoke their license. A patient can sue until age 30, or within 3 years of discovering the injury, whichever is later.

      Mental health care and social support are not banned. Families often travel to states where care is legal (Illinois is the nearest). Kentucky has no shield law protecting patients or providers.
    es: |
      KRS 311.372 (de SB 150, vigente desde el 29 de junio de 2023) prohíbe a los proveedores dar a menores de 18, para afirmar un género distinto a su sexo al nacer: bloqueadores de pubertad; testosterona, estrógeno o progesterona por encima de niveles normales; cirugías esterilizantes o genitales; o extirpación de partes sanas.

      - **Excepciones**: menores con un trastorno verificable del desarrollo sexual y tratamiento de complicaciones.
      - **Reducción gradual**: un proveedor que ya había iniciado el tratamiento puede reducirlo gradualmente si detenerlo de golpe causaría daño.
      - **Sanciones**: revocación obligatoria de la licencia del proveedor; el paciente puede demandar hasta los 30 años.

      La atención de salud mental y el apoyo social no están prohibidos. Kentucky no tiene ley escudo.
  sources: [krs-311-372, sb150]
medicaid:
  program_name: Kentucky Medicaid
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: |
      Since June 27, 2025, KRS 205.5365 prohibits the Department for Medicaid Services and its managed care organizations from spending Medicaid funds on (1) cross-sex hormones "when prescribed or administered primarily or solely for the treatment of gender dysphoria" and (2) gender reassignment surgery. Governor Beshear vetoed HB 495; the legislature overrode the veto. The same law also voided Executive Order 2024-632 (the governor's order restricting conversion therapy).

      Medicaid still covers other care: primary care, lab work, mental health, PrEP, and hormones prescribed for other conditions. Adults with income up to about 138% of the federal poverty level qualify. Apply at kynect.ky.gov or through the Department for Medicaid Services.
    es: |
      Desde el 27 de junio de 2025, KRS 205.5365 prohíbe al Departamento de Servicios de Medicaid y sus organizaciones de atención administrada gastar fondos de Medicaid en (1) hormonas cruzadas "recetadas o administradas principal o únicamente para el tratamiento de la disforia de género" y (2) cirugía de reasignación de género. El gobernador Beshear vetó HB 495; la legislatura anuló el veto.

      Medicaid sigue cubriendo otra atención: atención primaria, laboratorios, salud mental, PrEP y hormonas recetadas por otras razones. Solicita en kynect.ky.gov.
  how_to_apply_url: https://kynect.ky.gov/
  sources: [krs-205-5365, hb495, hb501, dms-apply]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Kentucky has no state law requiring private health plans to cover gender-affirming care or barring exclusions. Coverage depends on your plan: many large employer plans cover it, while some individual and small-group plans exclude it. If a claim is denied, appeal with the plan first; for fully insured plans you can file a complaint with the Kentucky Department of Insurance (800-595-6053). Self-funded employer plans are federally regulated. KHJN's Trans Health Program helps with insurance navigation.
    es: |
      Kentucky no tiene una ley que obligue a los planes privados a cubrir la atención de afirmación de género ni que prohíba exclusiones. Depende de tu plan. Si te niegan un reclamo, apela primero con el plan; para planes asegurados puedes presentar una queja ante el Departamento de Seguros de Kentucky (800-595-6053).
  complaint_url: https://insurance.ky.gov/ppc/forms/complaints_home.aspx
  sources: [doi-complaints, khjn-trans]
