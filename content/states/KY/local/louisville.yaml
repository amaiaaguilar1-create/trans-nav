  es: Área metropolitana de Louisville/condado de Jefferson
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    Org details from each org's own site 2026-09-24. Not confirmed: the Jefferson County name change filing fee
    (TransKentucky's older page says $43 plus an $8 county clerk fee; the statutory recording fee is now $33), and the
    claim that Jefferson County does not require adults to appear (community-reported). The Planned Parenthood Louisville
    health center page and louisvilleky.gov (Department of Public Health and Wellness STD clinic) returned 403, so they
    are listed without addresses or left out. UofL Health's 550 Clinic page returned 404 and is not listed; Norton
    Healthcare was not checked. Louisville Youth Group's site did not show ages or address. Legal Aid Society (laslou.org)
    did not respond; Kentucky Justice Online's "Help Near You" is listed instead.
intro:
  en: >-
    Louisville has Kentucky's largest cluster of LGBTQ organizations: the Fairness Campaign, youth programs, housing for
    LGBTQ young adults, HIV services, and a Planned Parenthood health center that offers hormone therapy for adults. Name
    change petitions are filed with the Jefferson Circuit Court Clerk for Jefferson District Court.
  es: >-
    Louisville concentra la mayor cantidad de organizaciones LGBTQ de Kentucky: la Fairness Campaign, programas para
    jóvenes, vivienda para adultos jóvenes LGBTQ, servicios de VIH y un centro de Planned Parenthood que ofrece terapia
    hormonal para adultos. Las peticiones de cambio de nombre se presentan ante la Secretaría del Tribunal de Circuito de
    Jefferson para el Tribunal de Distrito de Jefferson.
court:
  name: Jefferson District Court (petitions filed with the Jefferson Circuit Court Clerk)
  self_help_url: https://www.kycourts.gov/Legal-Help/Pages/default.aspx
  notes:
    en: Use statewide form AOC-295, signed before a notary. Name changes are District Court probate cases. Call the clerk to confirm the current fee and whether a hearing will be set; community reports say adults in Jefferson County usually do not have to appear.
    es: Usa el formulario estatal AOC-295, firmado ante notario. Llama a la secretaría para confirmar la tarifa y si habrá audiencia.
  sources: [krs-401-010, aoc-295, transky-id]
