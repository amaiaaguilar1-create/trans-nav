sources:
  - id: krs-213-121
    url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=8741
    title: KRS 213.121, Amendment of certificate or report
    publisher: Kentucky Legislative Research Commission
    kind: statute
    accessed: "2026-09-24"
    quote: Upon receipt of a sworn statement by a licensed physician indicating that the gender of an individual born in the Commonwealth has been changed by surgical procedure and a certified copy of an order of a court of competent jurisdiction changing that individual's name, the certificate of birth of the individual shall be amended as prescribed by regulation to reflect the change.
  - id: kar-5-070
    url: https://apps.legislature.ky.gov/law/kar/titles/901/005/070/
    title: 901 KAR 5:070, Certificate of birth amended
    publisher: Kentucky Legislative Research Commission
    kind: regulation
    accessed: "2026-09-24"
    quote: Once an amendment of an item is recorded on the birth certificate, that item shall not be amended again except upon receipt of a court order from a court of competent jurisdiction.
  - id: kar-5-050
