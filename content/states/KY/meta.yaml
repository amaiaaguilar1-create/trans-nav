  notes: >-
    Climate ratings based on primary sources read 2026-09-24: KRS 213.121(5) (birth certificate requires surgery plus
    court-ordered name change), KYTC's document list (license marker requires amended birth certificate, court order, or
    surgeon's letter), KRS 311.372 (minors' care ban, 2023), KRS 205.5365 (Medicaid ban, 2025). No shield law found.
    Only Louisville was drafted; Lexington was skipped for time.
overview:
  en: >-
    Kentucky makes legal name changes fairly easy (a one-page petition in District Court, no publication), but changing
    the sex marker on a driver's license or birth certificate generally requires proof of surgery. Adults can get
    gender-affirming care, but since 2025 Kentucky Medicaid will not pay for hormones or surgery for gender dysphoria
    and state prisons may not provide them; all such care for people under 18 has been banned since 2023. There is no
    shield law.
  es: >-
    Kentucky facilita bastante el cambio legal de nombre (una petición de una página en el Tribunal de Distrito, sin
    publicación), pero cambiar el marcador de sexo en la licencia o el acta de nacimiento en general requiere prueba de
    cirugía. Los adultos pueden recibir atención de afirmación de género, pero desde 2025 Medicaid de Kentucky no paga
    hormonas ni cirugía para la disforia de género y las prisiones estatales no pueden proporcionarlas; toda esa
    atención para menores de 18 está prohibida desde 2023. No hay ley escudo.
