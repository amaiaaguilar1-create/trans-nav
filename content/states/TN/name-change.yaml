  notes: >-
    Statute text (Tenn. Code Ann. 29-8-101 to -105) read on FindLaw via WebFetch; Justia and the official Lexis site
    blocked automated access. The Tennessee Courts self-help site (tncourts.gov) serves a JavaScript browser challenge
    and could NOT be loaded, so we could not confirm whether the Administrative Office of the Courts publishes statewide
    name change forms or the current Supreme Court Rule 29 indigency form link; reviewer should check
    tncourts.gov/programs/self-help-center. Davidson County petition, hearing notice, filing fee ($159.50) and
