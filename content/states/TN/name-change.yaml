sources:
  - id: tca-29-8-101
    url: https://codes.findlaw.com/tn/title-29-remedies-and-special-proceedings/tn-code-sect-29-8-101/
    title: Tenn. Code Ann. § 29-8-101
    publisher: FindLaw (Tennessee Code)
    kind: statute
    accessed: "2026-09-24"
    quote: The circuit, probate and county courts have concurrent jurisdiction to change names and to correct errors in birth certificates on the application of a resident of the county in which the application is made.
  - id: tca-29-8-102
    url: https://codes.findlaw.com/tn/title-29-remedies-and-special-proceedings/tn-code-sect-29-8-102/
    title: Tenn. Code Ann. § 29-8-102
    publisher: FindLaw (Tennessee Code)
    kind: statute
    accessed: "2026-09-24"
    quote: The application to change the name ... shall be by petition, in writing, signed by the applicant and verified by affidavit, stating that the applicant is a resident of the county, and giving the applicant's reasons for desiring the change or correction.
  - id: tca-29-8-103
    url: https://codes.findlaw.com/tn/title-29-remedies-and-special-proceedings/tn-code-sect-29-8-103/
    title: Tenn. Code Ann. § 29-8-103
    publisher: FindLaw (Tennessee Code)
    kind: statute
    accessed: "2026-09-24"
    quote: The clerk's fee for services in proceedings under this chapter shall be the same as for like services in other cases, to be paid by the party petitioning.
  - id: tca-29-8-104
    url: https://codes.findlaw.com/tn/title-29-remedies-and-special-proceedings/tn-code-sect-29-8-104/
    title: Tenn. Code Ann. § 29-8-104
    publisher: FindLaw (Tennessee Code)
    kind: statute
    accessed: "2026-09-24"
    quote: The court may order the name to be changed or the birth certificate to be corrected by entry of record reciting the petition and its reasons therefor.
