    url: https://codes.findlaw.com/tn/title-29-remedies-and-special-proceedings/tn-code-sect-29-8-101/
  - cite: Tenn. Code Ann. § 29-8-102
    title:
      en: Sworn written petition stating residence and reasons
    url: https://codes.findlaw.com/tn/title-29-remedies-and-special-proceedings/tn-code-sect-29-8-102/
  - cite: Tenn. Code Ann. § 29-8-104
    title:
      en: Court may order the change by entry of record
