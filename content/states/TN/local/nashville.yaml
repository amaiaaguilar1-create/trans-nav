      es: Ayuda en persona con formularios, tarifas y búsqueda de casos para personas sin abogado, junto al secretario del Tribunal de Sucesiones. Abierto de 8:00 am a 4:30 pm.
    url: https://circuitclerk.nashville.gov/resource-center/
    phone: "615-862-5207"
    address: 1 Public Square, Suite 303, Nashville, TN 37201
    cost: free
    verification: official_source
    sources: [davidson-resource-center]
  - id: pp-nashville
    org: planned-parenthood
    name: Planned Parenthood, Nashville Health Center
    type: informed_consent_clinic
    pillars: [hrt, sexual_health]
    description:
      en: Gender-affirming hormone care by informed consent (no therapist letter) for patients 18 and older, in person or by telehealth, plus STI testing and birth control. Book online or call 866-711-1717.
      es: Atención hormonal de afirmación de género por consentimiento informado (sin carta de terapeuta) para pacientes de 18 años o más, en persona o por telesalud, además de pruebas de ITS y anticonceptivos. Reserva en línea o llama al 866-711-1717.
    url: https://www.plannedparenthood.org/planned-parenthood-tennessee-and-north-mississippi/patients/gah-care
    phone: "866-711-1717"
    cost: varies
    telehealth: true
    verification: org_website
    sources: [pptnm-gah, pp-tn-centers]
  - id: cares360
    name: CARES 360 (Nashville CARES)
    type: sexual_health
    pillars: [sexual_health, mental_health]
    description:
      en: PrEP, PEP, doxyPEP, rapid HIV testing, STI testing, HIV care, primary care, therapy, and psychiatry with LGBTQ+ informed care. No insurance required for STI testing and PrEP.
      es: PrEP, PEP, doxyPEP, pruebas rápidas de VIH, pruebas de ITS, atención de VIH, atención primaria, terapia y psiquiatría con atención informada LGBTQ+. No se requiere seguro para pruebas de ITS y PrEP.
    url: https://cares360.org/
    phone: "615-499-7406"
    address: 633 Thompson Lane, Nashville, TN 37204
    cost: varies
    accepts_uninsured: true
    verification: org_website
    sources: [cares360, nashville-cares]
  - id: metro-prep
    name: Metro Public Health Department Sexual Health Center and PrEP Clinic
    type: sexual_health
    pillars: [sexual_health]
    description:
      en: STD/HIV testing and a PrEP clinic at the Lentz Public Health Center. PrEP visits cost $10 (covers labs and STI screening); staff help enroll you in medication assistance. Accepts TennCare. Call 615-340-5647 for PrEP appointments.
      es: Pruebas de ETS/VIH y una clínica de PrEP en el Lentz Public Health Center. Las visitas de PrEP cuestan $10 (incluye laboratorios y pruebas de ITS); el personal ayuda a inscribirte en asistencia para medicamentos. Acepta TennCare. Llama al 615-340-5647.
    url: https://www.nashville.gov/departments/health/clinical-health-services/sexual-health-center/prep-clinic
    phone: "615-340-5647"
    address: 2500 Charlotte Avenue, Suite 110, Nashville, TN 37209
    cost: low_cost
    accepts_medicaid: true
    accepts_uninsured: true
    verification: official_source
    sources: [metro-shc, metro-prep]
