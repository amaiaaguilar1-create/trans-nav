    name: Oasis Center, Just Us (LGBTQ+ teens) and 24/7 crisis line
    type: lgbtq_center
    pillars: [mental_health]
    description:
      en: Just Us is a free, supportive space for LGBTQ+ teens in Middle Tennessee. Oasis also runs a 24/7 crisis line (615-327-4455) and emergency shelter for youth 13 to 17.
      es: Just Us es un espacio gratuito y de apoyo para adolescentes LGBTQ+ en el centro de Tennessee. Oasis también tiene una línea de crisis 24/7 (615-327-4455) y refugio de emergencia para jóvenes de 13 a 17 años.
    url: https://oasiscenter.org/for-youth
    phone: "615-327-4455"
    address: 1704 Charlotte Avenue, Suite 200, Nashville, TN 37203
    cost: free
    verification: org_website
    sources: [oasis]
