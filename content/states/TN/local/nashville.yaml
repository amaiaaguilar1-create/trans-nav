      es: Ayuda legal civil gratuita para personas de bajos ingresos, incluidas clínicas gratuitas de cambio de nombre en el centro de Tennessee (con registro).
    url: https://las.org/
    phone: "1-800-238-1443"
    address: 1321 Murfreesboro Pike, Suite 400, Nashville, TN 37217
    cost: free
    verification: org_website
    sources: [las-contact, las-clinic]
