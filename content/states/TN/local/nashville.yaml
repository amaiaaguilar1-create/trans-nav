slug: nashville
name: Nashville
area:
  en: Nashville-Davidson County (Metro Nashville)
  es: Nashville-condado de Davidson (Metro Nashville)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details (Seventh Circuit / Probate Court handles adult name changes, $159.50 fee, Tuesday 9 am in-person
    hearings, Courtroom 608) read on circuitclerk.nashville.gov and its petition PDF 2026-09-24. Davidson County
    Chancery Court's site did not respond, so we could not confirm whether it also accepts name changes (the statute
    names circuit, probate, and county courts). Resources are from each organization's own site. Not listed because
    unconfirmed: Vanderbilt adult transgender clinic (old pages return 404), Street Works and Neighborhood Health
    (sites did not respond). Oasis Center counseling says it is no longer accepting clients. Verify hours and
    new-patient availability before marking reviewed.
intro:
  en: >-
    Nashville has the largest cluster of trans-friendly services in Tennessee. Adult name changes are filed with the
    Davidson County Probate Court, which has a fill-in petition and in-person hearings on Tuesdays. Planned Parenthood's
    Nashville health center and telehealth offer informed-consent hormones for adults, and several clinics offer free
    or low-cost PrEP and STI testing. State law bans hormone therapy for anyone under 18 and TennCare no longer covers
    it, so plan for self-pay or private insurance.
  es: >-
    Nashville tiene la mayor concentración de servicios amigables para personas trans en Tennessee. Los cambios de
    nombre de adultos se presentan en el Tribunal de Sucesiones del condado de Davidson, que tiene una petición para
    llenar y audiencias en persona los martes. El centro de Planned Parenthood en Nashville y la telesalud ofrecen
    hormonas por consentimiento informado para adultos, y varias clínicas ofrecen PrEP y pruebas de ITS gratis o de
    bajo costo. La ley estatal prohíbe la terapia hormonal para menores de 18 años y TennCare ya no la cubre.
court:
  name: Seventh Circuit (Probate) Court for Davidson County
  url: https://circuitclerk.nashville.gov/probate/
  self_help_url: https://circuitclerk.nashville.gov/resource-center/
  filing_fee: 159.5
  notes:
    en: File with the Probate Court Clerk, Historic Metro Courthouse, 1 Public Square, Suite 302. Sign the petition before a notary or the clerk. The clerk sets a hearing on a Tuesday at 9:00 am before a special master in Courtroom 608, and you must attend in person. No personal checks or money orders. The Resource Center (Suite 303, 615-862-5207) helps people filing without a lawyer. A Uniform Civil Affidavit of Indigency asks to file without paying.
    es: Presenta ante el secretario del Tribunal de Sucesiones, Historic Metro Courthouse, 1 Public Square, Suite 302. Firma la petición ante un notario o el secretario. El secretario fija una audiencia un martes a las 9:00 am ante un magistrado especial en la Sala 608, y debes asistir en persona. No se aceptan cheques personales ni giros postales. El Centro de Recursos (Suite 303, 615-862-5207) ayuda a quienes presentan sin abogado.
  sources: [davidson-petition, davidson-fees, davidson-resource-center]
resources:
