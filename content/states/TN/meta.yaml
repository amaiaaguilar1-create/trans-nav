overview:
  en: >-
    Tennessee is one of the most restrictive states for trans people. You can still change your **name** through a
    court petition with no newspaper publication, but the state does not allow changing the sex on a Tennessee birth
    certificate or driver's license, and a 2023 law defines "sex" everywhere in state law as sex at birth. Hormone
    therapy and other gender-affirming care are banned for people under 18 (a ban the US Supreme Court upheld in 2025),
    and since July 1, 2026 TennCare may not pay for this care at any age. Adults can still get hormones from private
    clinics, Planned Parenthood, and telehealth.
  es: >-
    Tennessee es uno de los estados más restrictivos para las personas trans. Todavía puedes cambiar tu **nombre** con
    una petición judicial sin publicación en periódico, pero el estado no permite cambiar el sexo en el acta de
    nacimiento ni en la licencia de conducir, y una ley de 2023 define "sexo" en toda la ley estatal como el sexo al
    nacer. La terapia hormonal y otra atención de afirmación de género están prohibidas para menores de 18 años (una
    prohibición que la Corte Suprema de EE. UU. confirmó en 2025), y desde el 1 de julio de 2026 TennCare no puede pagar
    esta atención a ninguna edad. Los adultos todavía pueden obtener hormonas en clínicas privadas, Planned Parenthood y
    por telesalud.
