litigation:
  - case: United States v. Skrmetti, No. 23-477
    court: Supreme Court of the United States
    summary:
      en: Challenge to SB 1's ban on puberty blockers and hormones for minors. On June 18, 2025, the Court held that the ban does not violate the Equal Protection Clause.
      es: Impugnación de la prohibición de SB 1 de bloqueadores de pubertad y hormonas para menores. El 18 de junio de 2025 la Corte decidió que la prohibición no viola la Cláusula de Igual Protección.
    effect_today:
      en: The minors' ban is fully in force in Tennessee. No court order limits it.
      es: La prohibición para menores está plenamente vigente en Tennessee. Ninguna orden judicial la limita.
    last_update: "2025-06-18"
    url: https://www.supremecourt.gov/opinions/24pdf/23-477_2cp3.pdf
    sources: [skrmetti]
