status_summary:
  en: >-
    Adults in Tennessee can still legally get hormone therapy, including by informed consent at Planned Parenthood and
    through telehealth. Since July 1, 2026, TennCare (Medicaid) may not pay for hormones, puberty blockers, or surgery
    for gender transition at any age, and gender clinics must report their prescriptions to the state. Hormones, puberty
    blockers, and surgery for gender transition are banned for everyone under 18; the US Supreme Court upheld that ban
    in June 2025. Tennessee has no shield law.
  es: >-
    Los adultos en Tennessee todavía pueden obtener legalmente terapia hormonal, incluso por consentimiento informado en
    Planned Parenthood y por telesalud. Desde el 1 de julio de 2026, TennCare (Medicaid) no puede pagar hormonas,
    bloqueadores de pubertad ni cirugía para la transición de género a ninguna edad, y las clínicas de género deben
    reportar sus recetas al estado. Las hormonas, los bloqueadores de pubertad y la cirugía para la transición están
    prohibidos para menores de 18 años; la Corte Suprema de EE. UU. confirmó esa prohibición en junio de 2025.
    Tennessee no tiene ley escudo.
adult_care:
  status: restricted
  detail:
    en: |
      Hormone therapy is **legal for adults 18 and older**, but state law now limits how it is paid for and tracked:
      - **TennCare will not pay** for estrogen, testosterone, puberty blockers, or surgery for gender transition, from July 1, 2026, including care delivered by telehealth to someone in Tennessee (Public Chapter 765). Care already underway can be covered only until March 31, 2027, and only if your treating physician certifies in writing that stopping would harm you.
      - **Gender clinics must report** each transition-related prescription or surgery to the Department of Health (date, age, sex, drug and dose, state of residence, prescriber, and mental health diagnoses), without names; the state publishes only aggregate numbers (Public Chapter 932, 2026).
      - A 2026 law (Public Chapter 794) lets adults sue a provider for up to 18 years if they were coerced into transition care.

      **If you have no insurance and little money**, in rough order of what to try:
      1. **Planned Parenthood of Tennessee and North Mississippi** prescribes hormones by **informed consent** (no therapist letter) to patients 18 and older, in person at its Tennessee health centers (Nashville, Memphis, Knoxville) and by telehealth. It offers prompt-pay discounts. Call 866-711-1717.
      2. **Telehealth**: Plume and FOLX serve Tennessee. Point of Pride's HRT Access Fund pays for 18 months of telehealth care through partners like these.
      3. **Community health centers** charge on a sliding scale; find one at findahealthcenter.hrsa.gov and ask whether they prescribe hormones.
      4. For the medications themselves, generic estradiol tablets and spironolactone are inexpensive with a pharmacy discount coupon; testosterone prices vary more, so compare cash prices.
    es: |
      La terapia hormonal es **legal para adultos de 18 años o más**, pero la ley estatal ahora limita cómo se paga y se registra:
      - **TennCare no pagará** estrógeno, testosterona, bloqueadores de pubertad ni cirugía para la transición de género desde el 1 de julio de 2026, incluso por telesalud a alguien en Tennessee (Capítulo Público 765). La atención ya iniciada puede cubrirse solo hasta el 31 de marzo de 2027, y solo si tu médico certifica por escrito que suspenderla te dañaría.
      - **Las clínicas de género deben reportar** cada receta o cirugía de transición al Departamento de Salud, sin nombres; el estado publica solo cifras agregadas (Capítulo Público 932, 2026).
      - Una ley de 2026 (Capítulo Público 794) permite a los adultos demandar a un proveedor hasta por 18 años si fueron coaccionados a recibir atención de transición.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. **Planned Parenthood of Tennessee and North Mississippi** receta hormonas por **consentimiento informado** (sin carta de terapeuta) a pacientes de 18 años o más, en persona en sus centros de Tennessee (Nashville, Memphis, Knoxville) y por telesalud. Ofrece descuentos por pago inmediato. Llama al 866-711-1717.
      2. **Telesalud**: Plume y FOLX atienden Tennessee. El Fondo de Acceso a TRH de Point of Pride paga 18 meses de atención por telesalud con socios como estos.
      3. Los **centros de salud comunitarios** cobran en escala móvil; búscalos en findahealthcenter.hrsa.gov y pregunta si recetan hormonas.
      4. Los medicamentos genéricos como estradiol y espironolactona son económicos con un cupón de descuento de farmacia; compara precios de testosterona.
  sources: [pc765, pc932, pc794, pptnm-gah, pop-hrt, hrsa]
minor_care:
  status: prohibited
  detail:
    en: |
      **Banned since July 1, 2023** (SB 1, Public Chapter 1; Tenn. Code Ann. § 68-33-101 et seq.). Health care providers may not give anyone under 18 puberty blockers, hormones, or surgery for the purpose of living as a gender different from their sex at birth or treating distress about it. Treatment that began before the law had to end by March 31, 2024. Exceptions cover only congenital conditions, precocious puberty, disease (not including gender dysphoria), or injury.

      **Penalties**: the Attorney General can seek a $25,000 civil penalty per violation within 20 years; patients or parents can sue providers up to 30 years after the patient turns 18; licensing boards must act against violators.

      **The ban is in full effect.** The US Supreme Court upheld it in **United States v. Skrmetti** on June 18, 2025. Tennessee has no shield law. Mental health care and social support remain legal, but a 2026 law (Public Chapter 748, effective October 1, 2026) bars providers from asking a minor about gender identity unless a parent is present and consents in writing and the question relates to a condition being evaluated. Planned Parenthood of Tennessee and North Mississippi sees minors for other sexual health care but not hormone therapy. Families considering care in another state should talk to a lawyer first.
    es: |
      **Prohibida desde el 1 de julio de 2023** (SB 1, Capítulo Público 1; Código de Tennessee § 68-33-101 y siguientes). Los proveedores de salud no pueden dar a menores de 18 años bloqueadores de pubertad, hormonas ni cirugía con el propósito de vivir como un género distinto a su sexo al nacer o tratar la angustia relacionada. Los tratamientos iniciados antes de la ley tuvieron que terminar el 31 de marzo de 2024. Las excepciones solo cubren condiciones congénitas, pubertad precoz, enfermedad (sin incluir la disforia de género) o lesión.

      **Sanciones**: el Fiscal General puede pedir una multa civil de $25,000 por infracción; pacientes o padres pueden demandar hasta 30 años después de que el paciente cumpla 18; las juntas de licencias deben actuar contra los infractores.

      **La prohibición está plenamente vigente.** La Corte Suprema de EE. UU. la confirmó en **United States v. Skrmetti** el 18 de junio de 2025. Tennessee no tiene ley escudo. La atención de salud mental sigue siendo legal, pero una ley de 2026 (Capítulo Público 748, vigente el 1 de octubre de 2026) prohíbe a los proveedores preguntar a un menor sobre identidad de género salvo que un padre esté presente y consienta por escrito. Las familias que consideren atención en otro estado deben hablar primero con un abogado.
  sources: [sb1, tca-68-33-103, skrmetti, pc748, pptnm-gah]
medicaid:
  program_name: TennCare
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: |
      Public Chapter 765 (2026) bars TennCare from covering or reimbursing surgery, puberty blockers, androgens, or estrogens for gender transition or to treat gender dysphoria, for people of any age, starting July 1, 2026. The only exceptions are treatment for a congenital defect, precocious puberty, disease, or injury, and a transition period: care that started before the law may be covered until **March 31, 2027** if your treating physician puts a written certification in your record that stopping would be harmful. TennCare still covers other health care, including mental health.

      **Who qualifies for TennCare**: Tennessee has not expanded Medicaid. Coverage is mainly for children under 21, pregnant people, parents or caretakers of a minor child who lives with them, people receiving SSI, and some older or disabled people. Most adults without children do not qualify. Apply at tenncareconnect.tn.gov; the Tennessee Justice Center helps people for free with TennCare problems.
    es: |
      El Capítulo Público 765 (2026) prohíbe que TennCare cubra cirugía, bloqueadores de pubertad, andrógenos o estrógenos para la transición de género o para tratar la disforia de género, a cualquier edad, desde el 1 de julio de 2026. Las únicas excepciones son tratamientos por defecto congénito, pubertad precoz, enfermedad o lesión, y un período de transición: la atención iniciada antes de la ley puede cubrirse hasta el **31 de marzo de 2027** si tu médico certifica por escrito que suspenderla sería dañino. TennCare sigue cubriendo otra atención médica, incluida la salud mental.

      **Quién califica**: Tennessee no ha expandido Medicaid. La cobertura es principalmente para menores de 21 años, personas embarazadas, padres o cuidadores de un menor que vive con ellos, personas con SSI y algunas personas mayores o con discapacidad. La mayoría de los adultos sin hijos no califican. Solicita en tenncareconnect.tn.gov; el Tennessee Justice Center ayuda gratis con problemas de TennCare.
  how_to_apply_url: https://tenncareconnect.tn.gov/
  sources: [pc765, tenncare-medicaid, tjc]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Tennessee has no law stopping private insurers from excluding gender-affirming care, and many plans do exclude it. Since 2026 (Public Chapter 932), any policy issued, renewed, or amended in Tennessee that covers gender transition procedures must also cover detransition procedures, and insurers must report detransition claims to the state. If your plan denies care, appeal with the plan first; A4TE's Trans Health Project has free appeal help and templates. You can also file a complaint with the Tennessee Department of Commerce and Insurance, although no state law requires coverage.
    es: |
      Tennessee no tiene una ley que impida a los seguros privados excluir la atención de afirmación de género, y muchos planes la excluyen. Desde 2026 (Capítulo Público 932), toda póliza que cubra procedimientos de transición también debe cubrir procedimientos de destransición. Si tu plan niega atención, apela primero con el plan; el Trans Health Project de A4TE ofrece ayuda gratuita con apelaciones. También puedes presentar una queja ante el Departamento de Comercio y Seguros de Tennessee, aunque ninguna ley estatal exige la cobertura.
  complaint_url: https://www.tn.gov/commerce/insurance/consumer-resources/file-a-complaint.html
  sources: [map-tn, pc932, tdci-complaint, a4te-thp]
