steps:
  - id: court-order
    title:
      en: Get a court order changing your name
      es: Obtén una orden judicial de cambio de nombre
    body:
      en: See the name change guide. You need a **certified** copy of the order from the court clerk.
      es: Consulta la guía de cambio de nombre. Necesitas una copia **certificada** de la orden del secretario del tribunal.
    applies_to: [name_change]
    sources: [vr-court-order]
  - id: mail
    title:
      en: Mail the order and fees to Vital Records
      es: Envía la orden y las tarifas a Estadísticas Vitales
    body:
      en: |
        Send:
        1. An original, certified copy of the court order that changed your name.
        2. A check or money order payable to Tennessee Vital Records: **$15** for the amendment (no fee if it is within 6 months of birth) plus **$15** for each certified copy of the corrected certificate you want.
        3. Optionally, form PH-1186 and a photocopy of your photo ID.

        Mail to: Tennessee Vital Records, 1st Floor, Andrew Johnson Tower, 710 James Robertson Parkway, Nashville, TN 37243.
      es: |
        Envía:
        1. Una copia original certificada de la orden judicial que cambió tu nombre.
        2. Un cheque o giro postal a nombre de Tennessee Vital Records: **$15** por la enmienda más **$15** por cada copia certificada del acta corregida.
        3. Opcionalmente, el formulario PH-1186 y una fotocopia de tu identificación.

        Dirección: Tennessee Vital Records, 1st Floor, Andrew Johnson Tower, 710 James Robertson Parkway, Nashville, TN 37243.
    forms: [PH-1186]
    fees: [amendment, copy]
    applies_to: [name_change, by_mail]
    sources: [vr-name-change, vr-fees, vr-id]
  - id: wait
    title:
      en: Wait about two weeks
      es: Espera unas dos semanas
    body:
      en: Vital Records lists 2 weeks for court-ordered name changes (as of June 23, 2026), if your record is on file. Times change with volume.
      es: Estadísticas Vitales indica 2 semanas para cambios de nombre por orden judicial (al 23 de junio de 2026), si tu registro está en archivo.
    estimated_time:
      en: about 2 weeks
      es: unas 2 semanas
    sources: [vr-timing]
  - id: copies-later
    title:
      en: Order more copies later from any county health department
      es: Pide más copias después en cualquier departamento de salud del condado
    body:
      en: Once your record is updated, any Tennessee county health department, the Nashville office (walk-in, same day), or the online vendor can issue certified copies for $15 each.
      es: Una vez actualizado tu registro, cualquier departamento de salud de condado de Tennessee, la oficina de Nashville (sin cita, el mismo día) o el proveedor en línea pueden emitir copias certificadas por $15 cada una.
    forms: [PH-1654]
    fees: [copy]
    optional: true
    sources: [vr-get-certificate, vr-fees]
