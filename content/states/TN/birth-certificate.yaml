    name:
      en: Application to Amend a Tennessee Birth Record
      es: Solicitud para enmendar un registro de nacimiento de Tennessee
    url: https://www.tn.gov/content/dam/tn/health/pdf/PH-1186-Application-to-Amend-A-Tennessee-Birth-Record.pdf
    required: optional
    condition:
      en: Vital Records' general amendment form. Its name-change instructions ask only for the certified court order and fees, but including this form can help identify your record.
      es: Formulario general de enmiendas de Estadísticas Vitales. Sus instrucciones para cambio de nombre solo piden la orden certificada y las tarifas, pero incluir este formulario puede ayudar a identificar tu registro.
    sources: [vr-applications, vr-name-change]
  - id: PH-1654
    name:
      en: Application for a Certified Copy of a Certificate of Birth
      es: Solicitud de copia certificada de acta de nacimiento
    url: https://www.tn.gov/content/dam/tn/health/pdf/PH-1654-Application-For-Certificate-of-Birth.pdf
    url_es: https://www.tn.gov/content/dam/tn/health/documents/vital-records/PH-1654-Application-For-Certificate-of-Birth-Spanish.pdf
