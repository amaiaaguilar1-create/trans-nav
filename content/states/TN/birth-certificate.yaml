delivery:
  online: false
  by_mail: true
  in_person: true
  detail:
    en: Name amendments are mailed to, or dropped off at, the state Vital Records office in Nashville (Monday to Friday, 8:00 am to 4:00 pm). Copies can also be ordered in person, by mail, or online.
    es: Las enmiendas de nombre se envían por correo o se entregan en la oficina estatal de Estadísticas Vitales en Nashville (lunes a viernes, 8:00 am a 4:00 pm).
  sources: [vr-name-change, vr-get-certificate]
timeline:
  en: About 2 weeks after Vital Records receives a complete name-change request.
  es: Unas 2 semanas después de que Estadísticas Vitales reciba una solicitud completa de cambio de nombre.
after:
  en: |
    Your Tennessee birth certificate will show your new name and the sex recorded at birth. For federal documents, a US passport currently cannot show a changed sex marker either (as of September 2026). If you were born in Tennessee but live in a state that issues its own records (for example, a driver's license with a self-attested marker), that state's rules apply to its own documents, but your Tennessee birth certificate stays the same.
  es: |
    Tu acta de nacimiento de Tennessee mostrará tu nuevo nombre y el sexo registrado al nacer. El pasaporte de EE. UU. tampoco puede mostrar actualmente un marcador cambiado (a septiembre de 2026). Si naciste en Tennessee pero vives en otro estado, las reglas de ese estado aplican a sus propios documentos, pero tu acta de Tennessee no cambia.
tips:
  - en: Do not send a gender-recognition order from another state expecting Vital Records to change the sex; Vital Records will not change the sex under § 68-3-203(d).
    es: No envíes una orden de reconocimiento de género de otro estado esperando que cambien el sexo; Estadísticas Vitales no cambiará el sexo según el § 68-3-203(d).
  - en: If you live in Tennessee but were born elsewhere, check your birth state's rules; many states allow changes by mail.
    es: Si vives en Tennessee pero naciste en otro lugar, revisa las reglas de tu estado de nacimiento; muchos permiten cambios por correo.
statutes:
  - cite: Tenn. Code Ann. § 68-3-203(c), (d)
    title:
      en: Registrar must amend the name on a court order; sex may not be changed on the original certificate
      es: El registrador debe enmendar el nombre con orden judicial; el sexo no puede cambiarse en el acta original
    url: https://codes.findlaw.com/tn/title-68-health-safety-and-environmental-protection/tn-code-sect-68-3-203/
  - cite: Tenn. Code Ann. § 1-3-105(c)
    title:
      en: Defines "sex" as immutable biological sex at birth (2023)
      es: Define "sexo" como el sexo biológico inmutable al nacer (2023)
    url: https://codes.findlaw.com/tn/title-1-code-and-statutes/tn-code-sect-1-3-105/
litigation:
  - case: Gore v. Lee, No. 23-5669
    court: US Court of Appeals for the Sixth Circuit
    summary:
      en: Four trans women born in Tennessee argued that refusing to change the sex on their birth certificates violated equal protection and a due-process right to informational privacy. The court ruled 2 to 1 for the state on July 12, 2024 (107 F.4th 548).
      es: Cuatro mujeres trans nacidas en Tennessee argumentaron que negarse a cambiar el sexo en sus actas violaba la igualdad ante la ley y el derecho a la privacidad de la información. El tribunal falló 2 a 1 a favor del estado el 12 de julio de 2024.
    effect_today:
      en: The ban stays in force. There is no court order requiring Tennessee to change sex markers.
      es: La prohibición sigue vigente. No hay orden judicial que obligue a Tennessee a cambiar marcadores de sexo.
    last_update: "2024-07-12"
    url: https://www.opn.ca6.uscourts.gov/opinions.pdf/24a0151p-06.pdf
    sources: [gore-v-lee]
