review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: high
  es_status: machine_draft
  notes: >-
    Prohibition confirmed from three primary sources on 2026-09-24: Tenn. Code Ann. 68-3-203(d) (FindLaw text), Tennessee
    Vital Records' own FAQ ("Tennessee law does not allow for the amendment of a birth certificate due to gender
    reassignment surgery"), and Gore v. Lee (6th Cir. July 12, 2024), which upheld the policy. Vital Records' help
    center (vitalrecords.tn.gov) blocks browsers without JavaScript; articles were read through its public Zendesk
    API. Fees ($15 amendment if more than 6 months after birth, $15 per certified copy) and processing time (2 weeks
    for court-ordered name changes, as of June 23, 2026) read there. NOT CONFIRMED: whether a name amendment produces
    a new certificate or an amended one with a visible notation, and whether PH-1186 must accompany a court-ordered
    name change (the name-change FAQ lists only the certified order and fees). We found no record of Tennessee ever
    having allowed sex changes, so there are no previously amended certificates to void. No petition for certiorari in
    Gore v. Lee was checked. The Gore dissent (footnote 5) mentions Tennessee policies "requiring strikethroughs showing amendments to birth certificates", which suggests a name amendment may be visible on the certificate; reviewer should confirm with Vital Records.
status: prohibited
requirement_type: prohibited
name_change_status: available
status_summary:
  en: >-
    Tennessee law does not allow changing the sex on a Tennessee birth certificate, and a federal appeals court upheld
    this in 2024. You can update your name on it by mailing a certified copy of your court order and $30 ($15
    amendment fee plus $15 for a new copy).
  es: >-
    La ley de Tennessee no permite cambiar el sexo en un acta de nacimiento de Tennessee, y un tribunal federal de
    apelaciones lo confirmó en 2024. Puedes actualizar tu nombre enviando por correo una copia certificada de tu orden
    judicial y $30 ($15 por la enmienda más $15 por una copia nueva).
summary:
  en: |
    Tennessee Code § 68-3-203(d) says: "The sex of an individual shall not be changed on the original certificate of birth as a result of sex change surgery." Tennessee Vital Records applies this to all gender-related requests: it corrects the sex only when the entry was a recording mistake at birth, proven with an affidavit and documentary evidence. In **Gore v. Lee** (2024), four trans women born in Tennessee challenged the policy; the Sixth Circuit held that it does not violate the Constitution. A court order recognizing your gender will not change the result, and 2023's definition of "sex" in state law (§ 1-3-105(c)) points the same way.

    You **can** change the **name**. Under § 68-3-203(c), the state registrar must amend the certificate to show a new name when given a certified copy of a court order changing it.

    This guide applies only to people born in Tennessee. If you were born in another state, that state's rules control your birth certificate, even if you live in Tennessee.
  es: |
    El Código de Tennessee § 68-3-203(d) dice que el sexo de una persona no se cambiará en el acta de nacimiento original como resultado de una cirugía de cambio de sexo. Estadísticas Vitales de Tennessee aplica esto a todas las solicitudes relacionadas con el género: corrige el sexo solo cuando hubo un error al registrarlo al nacer, probado con una declaración jurada y pruebas documentales. En **Gore v. Lee** (2024), cuatro mujeres trans nacidas en Tennessee impugnaron la política; el Sexto Circuito decidió que no viola la Constitución. Una orden judicial que reconozca tu género no cambia el resultado.

    Sí **puedes** cambiar el **nombre**. Según el § 68-3-203(c), el registrador estatal debe enmendar el acta para mostrar el nuevo nombre al recibir una copia certificada de la orden judicial.

    Esta guía aplica solo a personas nacidas en Tennessee. Si naciste en otro estado, las reglas de ese estado controlan tu acta, aunque vivas en Tennessee.
eligibility:
  residency:
    en: You must have been born in Tennessee. Where you live now does not matter.
    es: Debes haber nacido en Tennessee. No importa dónde vivas ahora.
  other:
    en: The person named on the certificate (or a parent, guardian, or legal representative) may request the name amendment.
    es: La persona nombrada en el acta (o su padre, madre, tutor o representante legal) puede pedir la enmienda de nombre.
  sources: [tca-68-3-203, tca-1-3-105, vr-sex, vr-name-change, vr-other-state]
