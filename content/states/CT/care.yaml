status_summary:
  en: >-
    Gender-affirming care is legal and protected for adults and minors in Connecticut, and a 2022 shield law protects
    patients and providers from other states' bans. HUSKY Health (Medicaid) covers hormones and surgery for adults,
    and state insurance rules bar exclusions. Care for people under 18 is harder to find since the two largest
    pediatric programs stopped prescribing in 2025, and a federal rule bars HUSKY from paying for youth care starting
    October 13, 2026.
  es: >-
    La atención de afirmación de género es legal y está protegida para adultos y menores en Connecticut, y una ley
    escudo de 2022 protege a pacientes y proveedores de las prohibiciones de otros estados. HUSKY Health (Medicaid)
    cubre hormonas y cirugía para adultos, y las normas estatales de seguros prohíben exclusiones. La atención para
    menores de 18 es más difícil de encontrar desde que los dos principales programas pediátricos dejaron de recetar
    en 2025, y una regla federal prohíbe que HUSKY pague la atención de jóvenes a partir del 13 de octubre de 2026.
adult_care:
  status: available
  detail:
    en: |
      No state restrictions. Planned Parenthood of Southern New England and Anchor Health prescribe hormones on an **informed consent** basis, with no therapist letter required, in person or by telehealth. Connecticut also bars health care providers from discriminating based on gender identity or expression (Public Act 25-154, 2025).

      **If you have no insurance and little money**, in rough order of what to try:
      1. Apply for **HUSKY Health** (free for low-income adults; see below). It covers hormones, labs, and surgery.
      2. **Planned Parenthood of Southern New England** has a sliding fee scale and an insurance enrollment navigator; hormone care starts in person or by telehealth (18 and older).
      3. A **community health center** charges on a sliding scale; find one at findahealthcenter.hrsa.gov.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care (applications each May).
    es: |
      Sin restricciones estatales. Planned Parenthood of Southern New England y Anchor Health recetan hormonas mediante **consentimiento informado**, sin carta de terapeuta, en persona o por telesalud. Connecticut también prohíbe que los proveedores de salud discriminen por identidad o expresión de género (Ley 25-154, 2025).

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **HUSKY Health** (gratis para adultos de bajos ingresos). Cubre hormonas, laboratorios y cirugía.
      2. **Planned Parenthood of Southern New England** tiene escala móvil y una navegadora de inscripción; la atención hormonal empieza en persona o por telesalud (18 años o más).
      3. Un **centro de salud comunitario** cobra en escala móvil; búscalo en findahealthcenter.hrsa.gov.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud (solicitudes cada mayo).
  sources: [ppsne-gac, anchor-gam, pa-25-154, hrsa, pop-hrt]
minor_care:
  status: available
  detail:
    en: |
      **Legal in Connecticut, but access is limited.** No state law restricts care for minors, and the shield law protects families and providers from out-of-state investigations and judgments. However:
      - **Yale New Haven Health** stopped medication treatment (puberty blockers and hormones) for patients under 19 in July 2025; its Gender Program still offers evaluation and mental health care.
      - **Connecticut Children's** closed its gender program in July 2025 and in August 2026 signed an agreement with the U.S. Department of Justice committing not to provide gender-affirming medications to minors.
      - **Planned Parenthood of Southern New England** prescribes only to patients 18 and older, but its care navigator helps under-18 patients find pediatric providers.
      - Starting **October 13, 2026**, a federal CMS rule bars HUSKY A (Medicaid, under 18) and HUSKY B (CHIP, under 19) from paying for puberty blockers, hormones, or surgery for young people. Youth already on hormones can keep HUSKY coverage for those medications for up to 6 months. Private insurance is not affected by this rule.

      Some independent and community providers still treat minors with parental consent; ask Anchor Health, your pediatrician, or GLAD Law Answers for current referrals.
    es: |
      **Legal en Connecticut, pero con acceso limitado.** Ninguna ley estatal restringe la atención a menores, y la ley escudo protege a familias y proveedores de investigaciones y sentencias de otros estados. Sin embargo:
      - **Yale New Haven Health** dejó de dar tratamiento con medicamentos (bloqueadores y hormonas) a menores de 19 años en julio de 2025; su Programa de Género sigue ofreciendo evaluación y salud mental.
      - **Connecticut Children's** cerró su programa en julio de 2025 y en agosto de 2026 firmó un acuerdo con el Departamento de Justicia federal comprometiéndose a no dar medicamentos de afirmación de género a menores.
      - **Planned Parenthood of Southern New England** receta solo a mayores de 18, pero su navegadora ayuda a menores a encontrar proveedores pediátricos.
      - Desde el **13 de octubre de 2026**, una regla federal de CMS prohíbe que HUSKY A (menores de 18) y HUSKY B (menores de 19) paguen bloqueadores, hormonas o cirugía para jóvenes. Quienes ya toman hormonas pueden mantener la cobertura de esos medicamentos hasta 6 meses. El seguro privado no se ve afectado.

      Algunos proveedores independientes y comunitarios todavía atienden a menores con consentimiento de los padres; pide referencias actuales a Anchor Health, a tu pediatra o a GLAD Law Answers.
  sources: [cgs-52-571n, cgs-54-155b, ctmirror-yale, ctmirror-ccmc-2026, yale-gender, ppsne-gac, fr-cms-rule]
medicaid:
  program_name: HUSKY Health
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      HUSKY Health covers gender-affirming care for adults. Its Gender Affirmation Surgery policy (updated August 2025) covers chest, genital, pelvic, facial, thyroid cartilage, and voice surgery and hair removal when criteria are met, with **one referral letter** from a treating provider (a mental health professional, primary care provider, or endocrinologist), prior authorization, and hormone therapy unless not wanted or not advised. Hormones and labs are covered through the regular medical and pharmacy benefits. State law (P.A. 23-204 § 309) requires DSS to consult with gender-affirming care experts when updating HUSKY coverage.

      **Youth (under 18 on HUSKY A, under 19 on HUSKY B)**: from October 13, 2026, a federal rule bars HUSKY from paying for gender-affirming medications and surgery; current hormone users get up to six months of continued coverage.

      **Apply** through Access Health CT (accesshealthct.com) or DSS. If you earn too much for HUSKY, the Covered Connecticut Program may offer free coverage.
    es: |
      HUSKY Health cubre la atención de afirmación de género para adultos. Su política de cirugía (actualizada en agosto de 2025) cubre cirugía de pecho, genital, pélvica, facial, de cartílago tiroideo y de voz, y depilación cuando se cumplen los criterios, con **una carta de referencia** de un proveedor tratante, autorización previa y terapia hormonal salvo que no se desee o no se recomiende. Las hormonas y análisis se cubren con los beneficios médicos y de farmacia habituales.

      **Jóvenes (menores de 18 en HUSKY A, menores de 19 en HUSKY B)**: desde el 13 de octubre de 2026, una regla federal prohíbe que HUSKY pague medicamentos y cirugía de afirmación de género; quienes ya toman hormonas tienen hasta seis meses de cobertura continua.

      **Solicita** en Access Health CT (accesshealthct.com) o en DSS. Si ganas demasiado para HUSKY, el Covered Connecticut Program podría ofrecer cobertura gratuita.
  how_to_apply_url: https://www.accesshealthct.com/
  sources: [husky-surgery-policy, pa-23-204, fr-cms-rule, husky-portal]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      The Connecticut Insurance Department's bulletin on gender identity nondiscrimination (IC-37, renumbered IC-34) says state-regulated health plans may not treat medically necessary care for gender dysphoria differently from other care, and that refusing to pay for it is an unfair claim settlement practice. If your plan denies care, appeal with the plan first, then file a complaint with the Insurance Department. The **Office of the Healthcare Advocate** helps with appeals for free. Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates.
    es: |
      El boletín del Departamento de Seguros de Connecticut sobre no discriminación por identidad de género (IC-37, renumerado IC-34) indica que los planes regulados por el estado no pueden tratar la atención médicamente necesaria para la disforia de género de forma distinta a otra atención, y que negarse a pagarla es una práctica desleal. Si tu plan niega la atención, apela primero ante el plan y luego presenta una queja ante el Departamento de Seguros. La **Oficina del Defensor de la Salud** (Office of the Healthcare Advocate) ayuda gratis con apelaciones.
  complaint_url: https://portal.ct.gov/cid/file-a-complaint
  sources: [cid-ic37, cid-complaint, oha]
