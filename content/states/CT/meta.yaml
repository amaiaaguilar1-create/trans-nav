  notes: >-
    Climate drawn from Connecticut statutes read on cga.ct.gov (shield law §§ 52-571m, 52-571n, 54-155b; birth
    certificate § 19a-42(i)), the DMV B-385 form, and the Probate Court name change page, all on 2026-09-24. Care is
    marked protective because state law protects care for all ages, but reviewers should know that the two largest
    pediatric programs (Yale New Haven Health and Connecticut Children's) stopped youth medication treatment in July
    2025, and a federal rule effective October 13, 2026 bars HUSKY A/B payment for youth gender-affirming care.
    Connecticut TransAdvocacy Coalition (cttransadvocacy.org) did not resolve and was not listed.
overview:
  en: >-
    Connecticut is one of the more protective states for trans people. You can change your name in your local Probate
    Court with **no filing fee** (since July 2023) and no newspaper publication, pick M, F, or X on your driver's license
    by signing a one-page form, and amend a Connecticut birth certificate (including to non-binary) with a notarized
    statement from a doctor, PA, APRN, or psychologist, with no surgery required. State insurance rules and HUSKY Health
    cover gender-affirming care for adults, and Connecticut passed one of the first shield laws in 2022. Care for young
    people is legal but harder to find: the two biggest pediatric hospital programs stopped prescribing in 2025, and a
    federal rule stops HUSKY from paying for youth care starting October 13, 2026.
  es: >-
    Connecticut es uno de los estados que más protegen a las personas trans. Puedes cambiar tu nombre en el Tribunal
    de Sucesiones (Probate Court) de tu localidad **sin tarifa de presentación** (desde julio de 2023) y sin publicación
    en periódico, elegir M, F o X en tu licencia de conducir firmando un formulario de una página, y enmendar un acta de
    nacimiento de Connecticut (incluso a no binario) con una declaración notarizada de un médico, asistente médico,
    enfermera de práctica avanzada o psicólogo, sin cirugía. Las normas estatales de seguros y HUSKY Health cubren la
    atención de afirmación de género para adultos, y Connecticut aprobó una de las primeras leyes escudo en 2022. La
    atención para jóvenes es legal pero más difícil de encontrar: los dos principales programas hospitalarios
    pediátricos dejaron de recetar en 2025, y una regla federal impide que HUSKY pague la atención de jóvenes a partir
    del 13 de octubre de 2026.
