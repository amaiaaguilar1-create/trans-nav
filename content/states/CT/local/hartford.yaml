name: Hartford and New Haven
area:
  en: Greater Hartford (Hartford County) and Greater New Haven (New Haven County)
  es: Gran Hartford (condado de Hartford) y Gran New Haven (condado de New Haven)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details from ctprobate.gov court pages 2026-09-24. Resources from org websites the same day. Not listed
    because they could not be verified: Hartford Gay & Lesbian Health Collective (hglhc.org returns "site not found"),
    Connecticut TransAdvocacy Coalition (domain does not resolve), Charter Oak Health Center (site did not load),
    Hartford and New Haven health department STI clinics (pages returned 403). Greater Hartford Legal Aid's site
    blocks automated access; its existence and mission were confirmed via a fetch tool but not its intake details.
    New Haven Pride Center closed in February 2026 and reopened in April 2026 with limited staff; confirm current
    programs. Planned Parenthood street addresses were not extracted; phone numbers are from the health center pages.
intro:
  en: >-
    Connecticut's two largest metros are about 40 miles apart and share many services. Name changes are filed in the
    Probate Court for the town where you live, with no filing fee: Hartford residents go to the Hartford Probate Court
    and New Haven residents to the New Haven Probate Court. Informed-consent hormone care is available from Planned
    Parenthood health centers in both cities and from Anchor Health in Hamden, just north of New Haven.
  es: >-
    Las dos áreas metropolitanas más grandes de Connecticut están a unas 40 millas y comparten muchos servicios. Los
    cambios de nombre se presentan en el Tribunal de Sucesiones del pueblo donde vives, sin tarifa: los residentes de
    Hartford van al Hartford Probate Court y los de New Haven al New Haven Probate Court. Hay atención hormonal por
    consentimiento informado en los centros de Planned Parenthood de ambas ciudades y en Anchor Health en Hamden, al
    norte de New Haven.
court:
  name: Hartford Probate Court (District PD-01)
  url: https://www.ctprobate.gov/courts/hartford-probate-court
  self_help_url: https://www.ctprobate.gov/other-matters/name-changes
  filing_fee: 0
  notes:
    en: |
      **Hartford Probate Court**: 250 Constitution Plaza, 3rd Floor, Hartford, CT 06103; (860) 757-9150; Mon to Fri 8:30 to 4:30. Serves the city of Hartford only.

      **New Haven Probate Court** (PD-38): 200 Orange Street, 1st Floor, New Haven, CT 06510; (203) 946-4880; Mon to Fri 9:00 to 5:00. Serves the city of New Haven only.

      Suburbs (West Hartford, East Hartford, Hamden, and others) have their own probate districts; use the court locator at ctprobate.gov.
    es: |
      **Hartford Probate Court**: 250 Constitution Plaza, 3er piso, Hartford, CT 06103; (860) 757-9150; lunes a viernes 8:30 a 4:30. Atiende solo a la ciudad de Hartford.

      **New Haven Probate Court** (PD-38): 200 Orange Street, 1er piso, New Haven, CT 06510; (203) 946-4880; lunes a viernes 9:00 a 5:00. Atiende solo a la ciudad de New Haven.

      Los suburbios (West Hartford, East Hartford, Hamden y otros) tienen sus propios distritos; usa el localizador en ctprobate.gov.
  sources: [hartford-probate, new-haven-probate, probate-name-changes]
