overview:
  en: >-
    Texas is one of the most restrictive states for trans people's documents and care. Adults can still change their
    **name** in district court (fingerprints and a criminal background check are required), but since August 2024 the
    Department of Public Safety and Vital Statistics refuse to change the **sex marker** on driver's licenses, ID cards,
    and birth certificates, and a 2025 law (HB 229) defines sex in state law as male or female at birth. Hormone therapy
    and other care remain legal for adults, but gender-affirming medications and surgery are banned for anyone under 18
    (SB 14, upheld by the Texas Supreme Court in 2024), Medicaid excludes transition care, and there is no shield law.
  es: >-
    Texas es uno de los estados más restrictivos para los documentos y la atención de las personas trans. Los adultos
    todavía pueden cambiar su **nombre** en un tribunal de distrito (se requieren huellas digitales y una revisión de
    antecedentes penales), pero desde agosto de 2024 el Departamento de Seguridad Pública y Estadísticas Vitales se
    niegan a cambiar el **marcador de sexo** en licencias de conducir, tarjetas de identificación y actas de nacimiento,
    y una ley de 2025 (HB 229) define el sexo en la ley estatal como masculino o femenino al nacer. La terapia hormonal
    y otra atención siguen siendo legales para adultos, pero los medicamentos y cirugías de afirmación de género están
    prohibidos para menores de 18 años (SB 14, confirmada por la Corte Suprema de Texas en 2024), Medicaid excluye la
    atención de transición y no hay ley escudo.
