  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Filing fee ($350, name change adult or minor) from the Harris County District Clerk fee schedule effective
    January 1, 2026 (updated July 15, 2026). Resource details from org websites read 2026-09-24. Not confirmed: which
    Houston Planned Parenthood of Greater Texas centers currently offer hormone therapy in person after the October
    2025 Gulf Coast transition; the Montrose Center's gender services page describes peer groups and partner referrals
    rather than clinical care; Avenue 360's site lists HIV testing, PrEP education and referral, and sliding-scale
    primary care but does not mention hormone therapy. Houston Health Department's HIV/STD page is JavaScript-rendered
    and could not be read, so it is not listed. Verify hours and new-patient availability before marking reviewed.
intro:
  en: >-
    Houston has the largest cluster of trans-affirming services in Texas, centered in Montrose. Name change petitions
    are filed with the Harris County District Clerk ($350 filing fee, waivable) and decided by a district judge; you
    also need a fingerprint card and a DPS background check (see the name change guide). Adults can get hormone therapy
    at Legacy Community Health and Planned Parenthood of Greater Texas. Care for anyone under 18 is banned statewide.
  es: >-
    Houston tiene el mayor grupo de servicios afirmativos para personas trans en Texas, concentrados en Montrose. Las
    peticiones de cambio de nombre se presentan ante el Secretario de Distrito del condado Harris (tarifa de $350, se
    puede exentar) y las decide un juez de distrito; también necesitas una tarjeta de huellas y una revisión de
    antecedentes de DPS (ver la guía de cambio de nombre). Los adultos pueden recibir terapia hormonal en Legacy
    Community Health y Planned Parenthood of Greater Texas. La atención para menores de 18 años está prohibida en todo
    el estado.
court:
  name: Harris County District Clerk (civil and family district courts)
  url: https://www.hcdistrictclerk.com/
  self_help_url: https://www.harriscountylawlibrary.org/adult-name-change
  filing_fee: 350
  notes:
    en: The District Clerk classifies name changes as family cases. File in person at the District Clerk's office or electronically through eFileTexas.gov. Certified copies of the order are $1 per page plus $5 for the certificate and seal. The Harris County Law Library (1019 Congress St; 713-755-5183) has a free adult name change packet and staff who help find forms.
    es: El Secretario de Distrito clasifica los cambios de nombre como casos de familia. Presenta en persona en la oficina del Secretario de Distrito o electrónicamente por eFileTexas.gov. Las copias certificadas de la orden cuestan $1 por página más $5 por el certificado y sello. La Biblioteca Legal del condado Harris (1019 Congress St; 713-755-5183) tiene un paquete gratuito de cambio de nombre para adultos y personal que ayuda a encontrar formularios.
  sources: [harris-fees, harris-law-library]
