  - id: legacy
    name: Legacy Community Health, Transgender Specialty Care
    type: hrt_clinic
    pillars: [hrt, sexual_health, mental_health]
    description:
      en: Federally qualified health center with transgender medical services (hormone treatment, well-person exams, STD testing, vaccines) and transgender behavioral health, including evaluations before hormones or surgery. Clinics across Houston including Montrose. Medical 832-548-5000; behavioral health 832-548-5014.
      es: Centro de salud comunitario con servicios médicos para personas trans (tratamiento hormonal, exámenes preventivos, pruebas de ETS, vacunas) y salud conductual, incluidas evaluaciones antes de hormonas o cirugía. Clínicas en todo Houston, incluido Montrose. Médico 832-548-5000; salud conductual 832-548-5014.
    url: https://www.legacycommunityhealth.org/transgender-specialty-care/
    phone: "832-548-5000"
    cost: sliding_scale
    accepts_medicaid: true
    accepts_uninsured: true
    languages: [English, Español]
    verification: org_website
    sources: [legacy-trans]
  - id: ppgt
    org: planned-parenthood
    name: Planned Parenthood of Greater Texas (Houston area)
    type: informed_consent_clinic
    pillars: [hrt, sexual_health]
    description:
      en: Took over the former Planned Parenthood Gulf Coast health centers on October 1, 2025. Informed-consent hormone therapy for patients 18 and up, in person or by telehealth, plus STI and HIV testing. Call 1-800-230-7526.
      es: Asumió los antiguos centros de Planned Parenthood Gulf Coast el 1 de octubre de 2025. Terapia hormonal por consentimiento informado para pacientes de 18 años o más, en persona o por telesalud, además de pruebas de ITS y VIH. Llama al 1-800-230-7526.
    url: https://www.plannedparenthood.org/planned-parenthood-greater-texas/patient-resources/gender-affirming-healthcare
    phone: "1-800-230-7526"
    cost: varies
    telehealth: true
    verification: org_website
    sources: [ppgt-gac, ppgc-closure]
  - id: avenue-360
    name: Avenue 360 Health & Wellness
    type: sexual_health
    pillars: [sexual_health]
    description:
      en: Community health center in the Heights with HIV testing and care, PrEP education and referral, hepatitis C testing, and primary care. All services on a sliding fee scale; no one turned away for inability to pay. 713-426-0027.
      es: Centro de salud comunitario en the Heights con pruebas y atención de VIH, educación y referencia para PrEP, pruebas de hepatitis C y atención primaria. Todos los servicios con tarifa en escala móvil; no se rechaza a nadie por no poder pagar. 713-426-0027.
    url: https://avenue360.org/services/
    phone: "713-426-0027"
    address: 2150 West 18th Street, Houston, TX 77008
    cost: sliding_scale
    accepts_uninsured: true
    verification: org_website
    sources: [avenue360]
  - id: montrose-center
    name: The Montrose Center, Gender Affirming Services
    type: lgbtq_center
    pillars: [mental_health]
    description:
      en: Houston's LGBTQ+ community center. TransWellness peer groups and resource referrals, counseling, case management, HIV testing, youth programs (Hatch), and an anti-violence program with a 24-hour helpline for survivors of sexual assault.
      es: Centro comunitario LGBTQ+ de Houston. Grupos de apoyo TransWellness y referencias, consejería, manejo de casos, pruebas de VIH, programas juveniles (Hatch) y un programa contra la violencia con línea de ayuda de 24 horas para sobrevivientes de agresión sexual.
    url: https://montrosecenter.org/services/gender-services/
    address: 401 Branard Street, Houston, TX 77006
