  notes: >-
    Short list. Filing fee ($350, name change of adult or child) from the Dallas County District Clerk fee schedule
    effective January 1, 2024; confirm no 2025-2026 update. Clerk address from the Dallas County District Clerk civil
    section page. Prism Health North Texas's website did not respond on 2026-09-24 and is not listed; a reviewer may
    want to add it. The Dallas LGBT Bar Association's clinics are described from A4TE's Texas page; its own site did
    not list upcoming clinic dates.
intro:
  en: >-
    In Dallas County, name change petitions are filed with the District Clerk at the George L. Allen Sr. Courts
    Building downtown ($350 filing fee, waivable), with the same fingerprint and DPS background check required
    statewide. Resource Center Health on Inwood Road offers hormone therapy for adults, and Planned Parenthood of
    Greater Texas offers informed-consent hormone therapy in person and by telehealth. Care for anyone under 18 is banned statewide.
  es: >-
    En el condado Dallas, las peticiones de cambio de nombre se presentan ante el Secretario de Distrito en el edificio
    de tribunales George L. Allen Sr. en el centro (tarifa de $350, se puede exentar), con las mismas huellas y
    revisión de antecedentes de DPS que se exigen en todo el estado. Resource Center Health en Inwood Road ofrece
    terapia hormonal para adultos, y Planned Parenthood of Greater Texas ofrece terapia hormonal por consentimiento informado en persona y por telesalud. La atención para
    menores de 18 años está prohibida en todo el estado.
