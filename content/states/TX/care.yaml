litigation:
  - case: State of Texas v. Loe, No. 23-0697
    court: Supreme Court of Texas
    summary:
      en: Families and physicians challenged SB 14 under the Texas Constitution. A Travis County district court (No. D-1-GN-23-003616) temporarily enjoined the law in 2023; the State took a direct appeal to the Supreme Court, and SB 14 took effect on schedule. On June 28, 2024 the Supreme Court of Texas reversed and vacated the injunction, holding the ban constitutional.
      es: Familias y médicos impugnaron SB 14 bajo la Constitución de Texas. Un tribunal del condado Travis (No. D-1-GN-23-003616) suspendió temporalmente la ley en 2023; el Estado apeló directamente a la Corte Suprema y SB 14 entró en vigor según lo previsto. El 28 de junio de 2024 la Corte Suprema de Texas revocó y anuló la orden, declarando constitucional la prohibición.
    effect_today:
      en: SB 14 is fully enforceable. Providers in Texas cannot prescribe blockers or hormones to minors for gender transition.
      es: SB 14 es plenamente aplicable. Los proveedores en Texas no pueden recetar bloqueadores ni hormonas a menores para la transición de género.
    last_update: "2024-10-02"
    url: https://search.txcourts.gov/Case.aspx?cn=23-0697&coa=cossup
    sources: [loe-docket]
