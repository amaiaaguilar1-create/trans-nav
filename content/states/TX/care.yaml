status_summary:
  en: >-
    Hormone therapy and other gender-affirming care are legal for adults in Texas and are offered on an informed-consent
    basis by Planned Parenthood of Greater Texas and several community clinics. For anyone under 18, puberty blockers,
    hormones, and surgeries for gender transition are banned (SB 14, in effect since September 2023 and upheld by the
    Texas Supreme Court in 2024). Texas Medicaid excludes transition care, state law does not stop private plans from
    excluding it, and there is no shield law.
  es: >-
    La terapia hormonal y otra atención de afirmación de género son legales para adultos en Texas y las ofrecen por
    consentimiento informado Planned Parenthood of Greater Texas y varias clínicas comunitarias. Para menores de 18
    años están prohibidos los bloqueadores de pubertad, las hormonas y las cirugías para la transición (SB 14, vigente
    desde septiembre de 2023 y confirmada por la Corte Suprema de Texas en 2024). Medicaid de Texas excluye la atención
    de transición, la ley estatal no impide que los planes privados la excluyan y no hay ley escudo.
adult_care:
  status: available
  detail:
    en: |
      No Texas law bans gender-affirming care for adults 18 and older. Planned Parenthood of Greater Texas (which took over the former Planned Parenthood Gulf Coast health centers in Houston in October 2025) prescribes estrogen and testosterone on an **informed consent** basis, in person or by telehealth, and most patients get a prescription at the first visit. Resource Center Health in Dallas and Legacy Community Health in Houston also provide hormone therapy. Telehealth providers licensed in Texas (Plume, FOLX, QueerMed, Planned Parenthood) can prescribe to adults anywhere in the state.

      Things that affect adults:
      - **Medical records**: SB 1188 (2025) requires electronic health records in Texas to include a separate field for the biological sex observed at birth. It does not restrict care, but your chart will show it.
      - **Insurance**: Texas Medicaid excludes transition care, and no state law prevents private plans from excluding it (see below).
      - **Documents**: your ID and birth certificate cannot be changed to match your gender (see the ID guides), so bring your chosen name and pronouns to intake forms.

      **If you have no insurance and little money**:
      1. Try a **community health center** (FQHC) such as Legacy Community Health (Houston) on a sliding fee scale. Find others at findahealthcenter.hrsa.gov.
      2. **Planned Parenthood of Greater Texas** offers hormone therapy with several payment options; call 1-800-230-7526.
      3. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for a limited number of applicants each year.
      4. Generic estradiol and spironolactone are inexpensive with pharmacy discount coupons; ask the pharmacy for its cash price.
    es: |
      Ninguna ley de Texas prohíbe la atención de afirmación de género para adultos de 18 años o más. Planned Parenthood of Greater Texas (que asumió los antiguos centros de Planned Parenthood Gulf Coast en Houston en octubre de 2025) receta estrógeno y testosterona por **consentimiento informado**, en persona o por telesalud, y la mayoría de los pacientes reciben receta en la primera visita. Resource Center Health en Dallas y Legacy Community Health en Houston también ofrecen terapia hormonal. Proveedores de telesalud con licencia en Texas (Plume, FOLX, QueerMed, Planned Parenthood) pueden recetar a adultos en todo el estado.

      Lo que afecta a adultos:
      - **Expedientes médicos**: SB 1188 (2025) exige que los expedientes electrónicos en Texas incluyan un campo separado para el sexo biológico observado al nacer. No restringe la atención, pero tu expediente lo mostrará.
      - **Seguro**: Medicaid de Texas excluye la atención de transición y ninguna ley estatal impide que los planes privados la excluyan.
      - **Documentos**: tu identificación y acta de nacimiento no se pueden cambiar para coincidir con tu género, así que indica tu nombre y pronombres en los formularios de admisión.

      **Si no tienes seguro ni mucho dinero**:
      1. Prueba un **centro de salud comunitario** (FQHC) como Legacy Community Health (Houston), con tarifas en escala móvil. Busca otros en findahealthcenter.hrsa.gov.
      2. **Planned Parenthood of Greater Texas** ofrece terapia hormonal con varias opciones de pago; llama al 1-800-230-7526.
      3. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud a un número limitado de solicitantes cada año.
      4. El estradiol y la espironolactona genéricos son económicos con cupones de descuento; pide a la farmacia su precio en efectivo.
  sources: [ppgt-gac, ppgc-closure, sb1188, resource-center, legacy-trans, map-tx, hrsa]
minor_care:
  status: prohibited
  detail:
    en: |
      **SB 14** (2023), Health & Safety Code §§ 161.701 to 161.706, took effect **September 1, 2023**. For anyone under 18, physicians and other licensed providers may not, for the purpose of gender transition, perform sterilizing surgeries or mastectomy, remove healthy tissue, or prescribe **puberty blockers or hormones** (testosterone or estrogen above natural levels).

      - **Exceptions**: puberty blockers for precocious puberty, and care for children with a medically verifiable disorder of sex development. Minors who started blockers or hormones before June 1, 2023, after at least 12 counseling sessions over six months, could continue only long enough to be **weaned off** safely.
      - **Penalties**: the Texas Medical Board **must revoke** the license of a physician who violates the law; the Attorney General can sue to stop violations. Medicaid, CHIP, and public money may not pay for prohibited care.
      - **Court challenge**: the Texas Supreme Court upheld SB 14 in *State v. Loe* on June 28, 2024, vacating a lower-court injunction. The law is fully in effect.

      Families who seek care for a minor usually travel to a state where it is legal. Texas has no shield law protecting patients or providers. Mental health care and social transition (name, clothing, pronouns) are not banned by SB 14, and a parent can still petition to change a child's name (see the name change guide).
    es: |
      **SB 14** (2023), Código de Salud y Seguridad §§ 161.701 a 161.706, entró en vigor el **1 de septiembre de 2023**. Para menores de 18 años, los médicos y otros proveedores con licencia no pueden, con fines de transición de género, realizar cirugías esterilizantes o mastectomías, extirpar tejido sano, ni recetar **bloqueadores de pubertad u hormonas** (testosterona o estrógeno por encima de los niveles naturales).

      - **Excepciones**: bloqueadores para pubertad precoz y atención a menores con un trastorno del desarrollo sexual verificable médicamente. Los menores que comenzaron bloqueadores u hormonas antes del 1 de junio de 2023, tras al menos 12 sesiones de consejería durante seis meses, solo podían continuar el tiempo necesario para **dejarlos** de forma segura.
      - **Sanciones**: la Junta Médica de Texas **debe revocar** la licencia del médico que viole la ley; el Fiscal General puede demandar para detener violaciones. Medicaid, CHIP y el dinero público no pueden pagar atención prohibida.
      - **Impugnación judicial**: la Corte Suprema de Texas confirmó SB 14 en *State v. Loe* el 28 de junio de 2024, anulando una orden judicial inferior. La ley está plenamente vigente.

      Las familias que buscan atención para un menor suelen viajar a un estado donde es legal. Texas no tiene ley escudo que proteja a pacientes o proveedores. SB 14 no prohíbe la atención de salud mental ni la transición social (nombre, ropa, pronombres), y un padre todavía puede pedir el cambio de nombre de un menor.
  sources: [sb14, sb14-history, loe-docket]
medicaid:
  program_name: Texas Medicaid (STAR, STAR+PLUS)
  covers_hrt: unclear
  covers_surgery: "no"
  detail:
    en: |
      Texas Medicaid policy excludes gender transition services, and the Movement Advancement Project classifies Texas as having an explicit Medicaid exclusion. Whether a given Medicaid health plan will pay for adult hormone prescriptions is not clearly stated in the sources we could load; ask your plan in writing before you rely on it. By statute, Medicaid and CHIP may not cover transition care for anyone under 18 (SB 14). SB 1257 (2025) requires Medicaid to cover side effects and reversal of past transition treatment.

      Texas did not expand Medicaid, so most adults without children or a disability do not qualify no matter how low their income. Apply at YourTexasBenefits.com or by calling 2-1-1.
    es: |
      La política de Medicaid de Texas excluye los servicios de transición de género, y el Movement Advancement Project clasifica a Texas como un estado con exclusión explícita en Medicaid. Las fuentes que pudimos consultar no dicen claramente si un plan de Medicaid pagará recetas de hormonas para adultos; pregunta a tu plan por escrito antes de depender de ello. Por ley, Medicaid y CHIP no pueden cubrir atención de transición para menores de 18 (SB 14). SB 1257 (2025) exige que Medicaid cubra efectos secundarios y la reversión de tratamientos anteriores.

      Texas no expandió Medicaid, así que la mayoría de los adultos sin hijos o sin discapacidad no califican aunque sus ingresos sean muy bajos. Solicita en YourTexasBenefits.com o llamando al 2-1-1.
  how_to_apply_url: https://www.yourtexasbenefits.com/
  sources: [map-tx, sb14, sb1257, yourtexasbenefits]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Texas has no law prohibiting health plans from excluding transition care, and many state-regulated plans do exclude it. Employer plans that are self-funded are regulated federally and may cover it; read your plan's Evidence of Coverage. Under **SB 1257** (effective September 1, 2025), any state-regulated plan that covers, or ever covered, transition treatment must also cover its side effects, annual monitoring, and reversal. If a plan denies a claim, file an internal appeal first, then a complaint with the Texas Department of Insurance. A4TE's Trans Health Project has free appeal guides.
    es: |
      Texas no tiene una ley que prohíba a los planes de salud excluir la atención de transición, y muchos planes regulados por el estado la excluyen. Los planes de empleadores autofinanciados están regulados a nivel federal y pueden cubrirla; revisa la Evidencia de Cobertura de tu plan. Según **SB 1257** (vigente desde el 1 de septiembre de 2025), un plan regulado por el estado que cubra, o haya cubierto, tratamientos de transición también debe cubrir sus efectos secundarios, el monitoreo anual y la reversión. Si un plan niega un reclamo, presenta primero una apelación interna y luego una queja ante el Departamento de Seguros de Texas. El Trans Health Project de A4TE tiene guías de apelación gratuitas.
  complaint_url: https://www.tdi.texas.gov/consumer/complfrm.html
  sources: [map-tx, sb1257, tdi-complaint, thp]
