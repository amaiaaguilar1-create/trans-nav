overview:
  en: >-
    New York is among the most protective states for trans people. You can change your name and legal sex designation
    in one court petition with no newspaper publication, and choose M, F, or X on your driver's license and birth
    certificate by self-attestation. Medicaid and state-regulated insurance cover gender-affirming care, and a 2023
    shield law protects patients and providers from other states' bans. New York City and the rest of the state issue
    birth certificates separately, and NYC residents can file name changes in Civil Court for $65.
  es: >-
    Nueva York es uno de los estados que más protege a las personas trans. Puedes cambiar tu nombre y tu designación
    legal de sexo en una sola petición judicial sin publicación en periódico, y elegir M, F o X en tu licencia y acta de
    nacimiento por autodeclaración. Medicaid y los seguros regulados por el estado cubren la atención de afirmación de
    género, y una ley escudo de 2023 protege a pacientes y proveedores de las prohibiciones de otros estados. La ciudad
    de Nueva York y el resto del estado emiten actas por separado, y en NYC el cambio de nombre en el Tribunal Civil
    cuesta $65.
