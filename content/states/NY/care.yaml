status_summary:
  en: >-
    Gender-affirming care is legal and protected in New York for adults and minors. NY Medicaid covers hormone therapy
    and surgery, state-regulated private insurance may not exclude it, and a 2023 shield law protects patients and
    providers from other states' investigations. Community health centers, NYC Health + Hospitals, and LGBTQ health
    centers offer care whether or not you have insurance.
  es: >-
    La atención de afirmación de género es legal y está protegida en Nueva York para adultos y menores. Medicaid de
    Nueva York cubre terapia hormonal y cirugía, los seguros privados regulados por el estado no pueden excluirla, y
    una ley escudo de 2023 protege a pacientes y proveedores de investigaciones de otros estados. Los centros de salud
    comunitarios, NYC Health + Hospitals y los centros de salud LGBTQ ofrecen atención tengas o no seguro.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Hormone therapy is available from community health centers, LGBTQ health centers, NYC Health + Hospitals Pride Health Centers, and telehealth providers.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **Medicaid** or the **Essential Plan** through NY State of Health. Medicaid covers hormones and surgery (see below).
      2. In NYC, **NYC Care** guarantees low- and no-cost care at NYC Health + Hospitals for people who do not qualify for or cannot afford insurance, regardless of immigration status. Call 1-646-692-2273.
      3. Go to a **community health center** (find one at findahealthcenter.hrsa.gov). They charge on a sliding scale.
      4. **Point of Pride** and **GenderBands** help pay for hormone access and gender-affirming items when funding allows.
    es: |
      Sin restricciones estatales. La terapia hormonal está disponible en centros de salud comunitarios, centros de salud LGBTQ, los Centros de Salud Pride de NYC Health + Hospitals y proveedores de telesalud.

      **Si no tienes seguro ni mucho dinero**:
      1. Solicita **Medicaid** o el **Essential Plan** en NY State of Health. Medicaid cubre hormonas y cirugía.
      2. En NYC, **NYC Care** garantiza atención de bajo o ningún costo en NYC Health + Hospitals para quienes no califican o no pueden pagar un seguro, sin importar el estatus migratorio. Llama al 1-646-692-2273.
      3. Ve a un **centro de salud comunitario** (findahealthcenter.hrsa.gov). Cobran en escala móvil.
      4. **Point of Pride** y **GenderBands** ayudan a pagar hormonas y artículos de afirmación cuando hay fondos.
  sources: [ag-tgnci, nychh-pride, nyc-care, hrsa, pop, genderbands]
minor_care:
  status: available
  detail:
    en: |
      Legal. New York's 2023 shield law (S2475-B, Chapter 143) bars enforcement of other states' laws that would remove a child from a parent for allowing gender-affirming care, blocks cooperation with out-of-state investigations and subpoenas, and prevents extradition for care lawfully provided in New York. Care for minors follows clinical guidelines; NY Medicaid covers puberty blockers, and hormones from age 16 (younger with prior approval).
    es: |
      Legal. La ley escudo de Nueva York de 2023 (S2475-B, capítulo 143) impide aplicar leyes de otros estados que separarían a un menor de sus padres por permitir atención de afirmación de género, bloquea la cooperación con investigaciones y citaciones de otros estados e impide extradiciones por atención legal en Nueva York. Medicaid cubre bloqueadores de pubertad y hormonas desde los 16 años (antes con aprobación previa).
  sources: [shield-law, nycrr-505-2, ag-tgnci]
medicaid:
  program_name: New York Medicaid
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      18 NYCRR 505.2(l) requires Medicaid to cover medically necessary hormone therapy and gender-affirming surgery for gender dysphoria, in both fee-for-service and managed care plans.
      - **Hormones**: puberty suppressants for people who meet clinical criteria; hormones from age 16, younger with demonstrated medical necessity and prior approval.
      - **Surgery**: age 18 and older, with letters from two New York-licensed qualified professionals; under 18 only with prior approval. Procedures judged purely cosmetic are excluded.

      **Apply** through NY State of Health online, by phone, or with a local navigator.
    es: |
      El reglamento 18 NYCRR 505.2(l) exige que Medicaid cubra terapia hormonal y cirugía médicamente necesarias para la disforia de género, en pago por servicio y en planes administrados.
      - **Hormonas**: supresores de pubertad según criterios clínicos; hormonas desde los 16 años, antes con aprobación previa.
      - **Cirugía**: desde los 18, con cartas de dos profesionales con licencia en Nueva York; menores solo con aprobación previa. Se excluyen procedimientos puramente cosméticos.

      **Solicita** en NY State of Health en línea, por teléfono o con un navegador local.
  how_to_apply_url: https://nystateofhealth.ny.gov/
  sources: [nycrr-505-2, ag-tgnci]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      State-regulated (fully insured) plans may not deny medically necessary treatment solely because it is for gender dysphoria (DFS Circular Letter No. 7, 2014), and may not deny, limit, or exclude coverage because of gender identity or sex assigned at birth. Self-funded employer plans are regulated federally and may not be covered. If your plan denies care, appeal with the plan, then file a complaint or external appeal with the Department of Financial Services (1-800-541-2831).
    es: |
      Los planes regulados por el estado no pueden negar tratamiento médicamente necesario solo porque es para disforia de género (Carta Circular 7 de DFS, 2014), ni negar o limitar cobertura por identidad de género. Los planes autofinanciados de empleadores tienen regulación federal. Si te niegan atención, apela con el plan y luego presenta una queja ante el Departamento de Servicios Financieros (1-800-541-2831).
  complaint_url: https://www.dfs.ny.gov/complaint
  sources: [dfs-cl2014-07, ag-tgnci, dfs-complaint]
