statutes:
  - cite: N.Y. Civ. Rights Law § 60
    title:
      en: Where to petition; NYC residents may use Civil Court in any borough
    url: https://www.nysenate.gov/legislation/laws/CVR/60
  - cite: N.Y. Civ. Rights Law § 64-a
    title:
      en: Sealing of name change papers; transgender status counts toward the safety finding
    url: https://www.nysenate.gov/legislation/laws/CVR/64-A
  - cite: N.Y. Civ. Rights Law § 67
    title:
      en: Sex designation change on affidavit alone; no medical evidence; no RJI fee
    url: https://www.nysenate.gov/legislation/laws/CVR/67
  - cite: N.Y. Civ. Rights Law § 67-b
    title:
      en: Sealing of sex designation change papers
    url: https://www.nysenate.gov/legislation/laws/CVR/67-B
  - cite: Gender Recognition Act, L. 2021 ch. 158 (A5465-D)
    title:
      en: Ended publication, added sealing protections and sex designation petitions, and M/F/X self-attestation on state documents
    url: https://www.nysenate.gov/legislation/bills/2021/A5465
