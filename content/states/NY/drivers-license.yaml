guide_type: drivers_license
jurisdiction: NY
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Online gender change and MV-44 route confirmed on the DMV "Change information on DMV photo documents" page via
    WebFetch 2026-09-24 (direct curl returns 403). That page gives $12.50 (license/permit) and $5.00 (non-driver ID)
    for a by-mail name change; it does not state a fee for the gender change itself. The University at Buffalo guide
    (March 2025) gives the same $12.50/$5 figures for updating a license or ID with a new name and/or gender marker.
    Reviewer: confirm (1) the fee charged for the online sex-identifier transaction; (2) whether X is available on
    REAL ID and Enhanced documents (not stated on the pages read); (3) whether the online tool now handles M/F
