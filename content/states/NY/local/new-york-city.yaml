name: New York City
area:
  en: The five boroughs (Manhattan, Brooklyn, Queens, the Bronx, Staten Island)
  es: Los cinco condados (Manhattan, Brooklyn, Queens, el Bronx, Staten Island)
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Resources from org and city websites 2026-09-24. NYC Civil Court pages blocked automated fetching; $65 fee and
    any-borough filing confirmed by Civ. Rights Law § 60, a search extract of the court page, and SRLP (June 2023).
    Reviewer: confirm Civil Court clerk room (SRLP says 111 Centre St, Room 118), Callen-Lorde's informed-consent and
    sliding-scale policy, and Destination Tomorrow's current health services. A4TE's Name Change Project (which served
    all five boroughs) stopped taking applications on March 11, 2026 and is intentionally not listed.
intro:
  en: >-
    New York City has some of the country's deepest trans services: a $65 Civil Court name and sex designation change
    you can file in any borough, free legal help, public hospital Pride Health Centers, LGBTQ community health centers,
    and free or low-cost sexual health clinics. People born in the five boroughs update their birth certificates with
    NYC Health, not New York State.
  es: >-
    La ciudad de Nueva York tiene algunos de los servicios trans más completos del país: cambio de nombre y designación
    de sexo por $65 en el Tribunal Civil de cualquier condado, ayuda legal gratuita, Centros de Salud Pride en hospitales
    públicos, centros de salud comunitarios LGBTQ y clínicas de salud sexual gratuitas o de bajo costo. Quienes nacieron
    en los cinco condados actualizan su acta con NYC Health, no con el estado.
court:
  name: Civil Court of the City of New York
  url: https://www.nycourts.gov/new-york-city-civil-court/nyc-civil-court-name-andor-sex-designation-change
  self_help_url: https://www.nycourts.gov/courthelp/diy/nameChange.shtml
  filing_fee: 65
  notes:
    en: File in any borough's Civil Court (or Supreme Court for $210). SRLP recommends Manhattan, 111 Centre Street, Room 118. Tell the clerk before filing if you want the records sealed.
    es: Presenta en el Tribunal Civil de cualquier condado (o en el Tribunal Supremo por $210). SRLP recomienda Manhattan, 111 Centre Street, sala 118. Dile al secretario antes de presentar si quieres sellar el expediente.
  sources: [courts-nyc-civil, cvr-60, srlp]
