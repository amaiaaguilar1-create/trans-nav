sources:
  - id: ocga-31-10-23
    url: https://codes.findlaw.com/ga/title-31-health/ga-code-sect-31-10-23/
    title: O.C.G.A. § 31-10-23, Amendment of certificates or reports
    publisher: FindLaw (Georgia Code, current as of March 2024)
    kind: statute
    accessed: "2026-09-24"
    quote: >-
      Upon receipt of a certified copy of a court order indicating the sex of an individual born in this state has
      been changed by surgical procedure and that such individual's name has been changed, the certificate of birth of
      such individual shall be amended as prescribed by regulation.
  - id: dph-3977
    url: https://dph.georgia.gov/document/document/affidavit-amendment-form-3977-revisedpdf/download
    title: Affidavit for Amendment, Form 3977 (rev. 09/2018)
    publisher: Georgia Department of Public Health, State Office of Vital Records
    kind: form
    accessed: "2026-09-24"
    quote: >-
      To amend the name on the birth certificate requires a court order indicating the changes from (original name)
      and change to (new name). In addition, please provide a statement on letterhead from the physician indicating
      the intersex/transgender diagnosis. ... The fee for amendments to Vital Records is $10.00.
  - id: dph-fees
    url: https://dph.georgia.gov/ways-request-vital-record/fees
    title: Vital records fees
    publisher: Georgia Department of Public Health
    kind: official
    accessed: "2026-09-24"
    quote: "Birth Certificates - $25.00 + $5.00 for additional copies. Amendments - $10.00 + cost of the certificate."
  - id: dph-birth
    url: https://dph.georgia.gov/ways-request-vital-record/birth
    title: Birth records
    publisher: Georgia Department of Public Health
    kind: official
    accessed: "2026-09-24"
    quote: A general amendment is defined as a change that is made to a certificate after 1 year of age.
