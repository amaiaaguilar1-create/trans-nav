  notes: >-
    Climate ratings follow the guides: name changes require four weeks of newspaper publication; license and birth
    certificate sex changes require surgery; SB 140 bans hormones and surgery for minors; no shield law; no insurance
    nondiscrimination law. MAP's Georgia profile (read 2026-09-24) agrees (identity documents score -2.5/4; health
    care 0.75/10). See care.yaml notes on the unresolved Medicaid question.
overview:
  en: >-
    Georgia is restrictive for trans people's documents and for minors' care. Name changes go through Superior Court
    with four weeks of mandatory newspaper publication, and the driver's license and birth certificate sex markers can
    be changed only after surgery (M or F only). Adults can get hormone therapy and surgery, but hormones and
    surgery are banned for minors (SB 140, 2023), there is no shield law, and state law does not require insurers to
    cover gender-affirming care.
  es: >-
    Georgia es restrictiva para los documentos de las personas trans y para la atención de menores. Los cambios de
    nombre pasan por el Tribunal Superior con cuatro semanas de publicación obligatoria en periódico, y el marcador de
    sexo de la licencia y del acta de nacimiento solo se cambia después de una cirugía (solo M o F). Los adultos pueden
    recibir terapia hormonal y cirugía, pero las hormonas y la cirugía están prohibidas para menores (SB 140, 2023), no
    hay ley escudo y la ley estatal no obliga a las aseguradoras a cubrir esta atención.
