statutes:
  - cite: SB 140 (2023); O.C.G.A. §§ 31-7-3.5, 43-34-15
    title:
      en: Prohibits hormone therapy and gender-affirming surgery for minors with gender dysphoria; effective July 1, 2023
      es: Prohíbe la terapia hormonal y la cirugía de afirmación de género para menores con disforia de género; vigente desde el 1 de julio de 2023
    url: https://www.legis.ga.gov/legislation/64231
  - cite: SB 185 (2025)
    title:
      en: Bars state funds for gender-affirming care for people in state and county correctional custody (struck down in federal court; on appeal)
      es: Prohíbe fondos estatales para atención de afirmación de género de personas bajo custodia correccional (anulada por un tribunal federal; en apelación)
    url: https://www.legis.ga.gov/legislation/70386
litigation:
  - case: Challenge to SB 185 (incarcerated plaintiffs v. Georgia Department of Corrections officials)
    court: U.S. District Court (Judge Victoria M. Calvert); appeal to the 11th Circuit
    summary:
      en: Five transgender people in state custody challenged SB 185's ban on state-funded hormone therapy in prisons. The court blocked the law in September 2025 and permanently struck it down in December 2025 under the Eighth Amendment. The state appealed.
      es: Cinco personas trans bajo custodia estatal impugnaron la prohibición de SB 185. El tribunal bloqueó la ley en septiembre de 2025 y la anuló en diciembre de 2025 por la Octava Enmienda. El estado apeló.
    effect_today:
      en: People in Georgia prisons can receive hormone therapy when their doctors find it medically necessary, while the appeal is pending.
      es: Las personas en prisiones de Georgia pueden recibir terapia hormonal cuando sus médicos la consideren necesaria, mientras se resuelve la apelación.
    last_update: "2025-12-08"
    sources: [gr-prison-appeal]
  - case: Lange v. Houston County
    court: U.S. Court of Appeals for the 11th Circuit (en banc)
    summary:
      en: A transgender sheriff's deputy challenged her county health plan's exclusion of gender-affirming surgery. In September 2025 the full 11th Circuit reversed her earlier jury win, holding the exclusion was not sex discrimination under Title VII, and sent the case back.
      es: Una ayudante del sheriff trans impugnó la exclusión de cirugía en el plan de salud de su condado. En septiembre de 2025 el 11.º Circuito en pleno revocó su victoria anterior y devolvió el caso.
    effect_today:
      en: Employers in Georgia can currently rely on this ruling to keep exclusions in their health plans.
      es: Los empleadores en Georgia pueden por ahora apoyarse en este fallo para mantener exclusiones en sus planes.
    last_update: "2025-09-10"
    sources: [gr-lange]
