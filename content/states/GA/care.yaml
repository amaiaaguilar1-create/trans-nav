status_summary:
  en: >-
    Adults in Georgia can get hormone therapy and surgery; there is no state law restricting adult care outside
    prisons. For people under 18, Georgia bans hormone therapy and gender-affirming surgery (SB 140, since July 1,
    2023), though puberty blockers remain legal. Georgia has no shield law and no insurance nondiscrimination law.
    Informed-consent clinics and telehealth services operate in Atlanta.
  es: >-
    En Georgia, las personas adultas pueden recibir terapia hormonal y cirugía; no hay ley estatal que restrinja la
    atención de adultos fuera de las prisiones. Para menores de 18 años, Georgia prohíbe la terapia hormonal y la
    cirugía de afirmación de género (SB 140, desde el 1 de julio de 2023), aunque los bloqueadores de pubertad siguen
    siendo legales. Georgia no tiene ley escudo ni ley de no discriminación en seguros. Hay clínicas de
    consentimiento informado y servicios de telesalud en Atlanta.
adult_care:
  status: available
  detail:
    en: |
      No state law limits gender-affirming care for adults in the community. Several Atlanta providers prescribe hormones on an **informed consent** basis (no therapist letter), including the Feminist Center for Reproductive Liberation (18+) and QueerMed (telehealth and in person), and national telehealth services such as Plume and FOLX serve Georgia.

      **Exceptions and fights to watch:**
      - **State prisons**: SB 185 (2025) banned state funds for hormone therapy and surgery for people in state custody. A federal judge blocked it in September 2025 and struck it down in December 2025; the state has appealed to the 11th Circuit. For now, doctors in the Department of Corrections may prescribe hormones based on individual medical need.
      - **State Health Benefit Plan**: under a 2023 settlement the plan covers gender-affirming care. SB 39 and an amended HB 54 would have ended that coverage and barred state-owned hospitals from providing care; both passed the Senate but did not become law before the 2025-2026 session ended.

      **If you have no insurance and little money**: go to a community health center (sliding scale; find one at findahealthcenter.hrsa.gov), compare telehealth self-pay prices (QueerMed lists $99 a month including labs, not medications), and apply to Point of Pride's HRT Access Fund.
    es: |
      Ninguna ley estatal limita la atención de afirmación de género para adultos en la comunidad. Varios proveedores de Atlanta recetan hormonas por **consentimiento informado** (sin carta de terapeuta), como el Feminist Center for Reproductive Liberation (18+) y QueerMed (telesalud y en persona), y servicios nacionales de telesalud como Plume y FOLX atienden en Georgia.

      **Excepciones:**
      - **Prisiones estatales**: SB 185 (2025) prohibió usar fondos estatales para terapia hormonal y cirugía de personas bajo custodia estatal. Un juez federal la bloqueó en septiembre de 2025 y la anuló en diciembre de 2025; el estado apeló. Por ahora, los médicos del Departamento de Correcciones pueden recetar hormonas según la necesidad médica individual.
      - **Plan de Beneficios de Salud del Estado**: por un acuerdo de 2023 el plan cubre esta atención. SB 39 y una versión enmendada de HB 54 habrían eliminado esa cobertura; ambas pasaron el Senado pero no se convirtieron en ley.

      **Si no tienes seguro ni mucho dinero**: acude a un centro de salud comunitario (escala móvil; búscalo en findahealthcenter.hrsa.gov), compara precios de telesalud (QueerMed indica $99 al mes con laboratorios, sin medicamentos) y solicita el Fondo de Acceso a TRH de Point of Pride.
  sources: [fcrl, queermed-locations, queermed-costs, gr-prison-appeal, gr-hb54, gr-sb39-2025, ga-sb39, ga-hb54, hrsa]
minor_care:
  status: prohibited
  detail:
    en: |
      **SB 140 (2023)**, effective July 1, 2023, prohibits for anyone under 18 being treated for gender dysphoria: (1) sex reassignment surgeries and other surgeries that alter primary or secondary sex characteristics, and (2) hormone replacement therapy (O.C.G.A. § 43-34-15; hospitals and licensed facilities under § 31-7-3.5).

      - **Still legal**: puberty blockers, mental health care, and social transition. A 2026 Senate amendment (HB 54) to ban puberty blockers did not become law.
      - **Exceptions**: minors already on hormone therapy before July 1, 2023 may continue; care for intersex conditions (differences of sex development, partial androgen insensitivity); treatment for conditions other than gender dysphoria.
      - **Penalties**: physicians face discipline by the Georgia Composite Medical Board; facilities can lose their permit.
      - **Medicaid**: a federal CMS rule bars state Medicaid and CHIP from covering puberty blockers, hormones, and surgery for minors starting October 13, 2026 (current patients may be covered for up to six months).

      Families traveling to another state for care should ask a lawyer about Georgia's rules; Georgia has no shield law.
    es: |
      **SB 140 (2023)**, vigente desde el 1 de julio de 2023, prohíbe para menores de 18 años tratados por disforia de género: (1) cirugías de reasignación de sexo y otras que alteren características sexuales primarias o secundarias, y (2) terapia de reemplazo hormonal.

      - **Siguen siendo legales**: bloqueadores de pubertad, salud mental y transición social. Una enmienda del Senado en 2026 (HB 54) para prohibir los bloqueadores no se convirtió en ley.
      - **Excepciones**: menores que ya recibían terapia hormonal antes del 1 de julio de 2023 pueden continuar; atención de condiciones intersexuales; tratamientos por otras condiciones.
      - **Sanciones**: los médicos enfrentan disciplina de la Junta Médica; los establecimientos pueden perder su permiso.
      - **Medicaid**: una regla federal de CMS prohíbe que Medicaid y CHIP cubran bloqueadores, hormonas y cirugía para menores desde el 13 de octubre de 2026.
  sources: [ga-sb140, ga-hb54, gr-hb54, gr-cms-minors]
medicaid:
  program_name: Georgia Medicaid (including Georgia Pathways to Coverage)
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: |
      Adults who do not qualify for traditional Medicaid may qualify through **Georgia Pathways to Coverage**, which requires you to meet and report "qualifying activities". Pathways eligibility rules change on January 1, 2027; check pathways.georgia.gov.

      We could not confirm Georgia Medicaid's written policy on gender-affirming care. The Movement Advancement Project lists Georgia Medicaid as explicitly covering transgender-related care for adults; no state law excludes it. For minors, federal rules end coverage in October 2026. If you are enrolled, ask your care management organization (CMO) for prior authorization and request any denial in writing so you can appeal.
    es: |
      Los adultos que no califican para Medicaid tradicional pueden calificar mediante **Georgia Pathways to Coverage**, que exige cumplir y reportar "actividades calificadas". Las reglas cambian el 1 de enero de 2027; consulta pathways.georgia.gov.

      No pudimos confirmar la política escrita de Medicaid de Georgia sobre esta atención. El Movement Advancement Project indica que Medicaid de Georgia cubre explícitamente la atención trans para adultos; ninguna ley estatal la excluye. Para menores, las reglas federales terminan la cobertura en octubre de 2026. Si estás inscrito, pide autorización previa a tu organización de atención (CMO) y cualquier negativa por escrito para apelar.
  how_to_apply_url: https://gateway.ga.gov/
  sources: [map-medicaid, gr-cms-minors, ga-medicaid-apply, ga-pathways]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      Georgia has no state law barring insurers from excluding gender-affirming care, so coverage depends on your plan. Marketplace (ACA) plans and employer plans may cover it or exclude it. If your plan denies care, appeal in writing; A4TE's Trans Health Project has appeal templates. You can file a complaint about a state-regulated insurer with the Georgia Office of Commissioner of Insurance.

      Employer plans in Georgia are also shaped by the 11th Circuit's 2025 en banc ruling in Lange v. Houston County, which held that a county plan's exclusion of "sex change" surgery did not violate Title VII; the case went back to the trial court.
    es: |
      Georgia no tiene una ley que impida a las aseguradoras excluir la atención de afirmación de género, así que la cobertura depende de tu plan. Si tu plan la niega, apela por escrito; el Trans Health Project de A4TE tiene modelos de apelación. Puedes presentar una queja sobre una aseguradora regulada por el estado ante la Oficina del Comisionado de Seguros de Georgia.

      En 2025, el 11.º Circuito resolvió en pleno en Lange v. Houston County que la exclusión de cirugía de "cambio de sexo" en un plan del condado no violaba el Título VII; el caso volvió al tribunal de primera instancia.
  complaint_url: https://oci.georgia.gov/file-consumer-insurance-complaint
  sources: [map-profile, oci-complaint, a4te-thp, gr-lange]
