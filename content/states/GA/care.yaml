  notes: >-
    SB 140 (2023) text read from the enrolled bill on legis.ga.gov; bill status for SB 30, SB 39, HB 54, and SB 185
    read from the Georgia General Assembly's legislation API on 2026-09-24. HB 54 (amended in the Senate on
    2/10/2026 to ban puberty blockers for minors and bar state health plan coverage) shows no action after the
    Senate's 2/10/2026 vote and SB 39's last action is a House committee report on 4/2/2026, so neither became law;
    the 2025-2026 biennium has ended. Reviewer: confirm with Georgia Equality that nothing passed in the final days.
    MEDICAID: the task brief assumed a Georgia Medicaid exclusion, but MAP's Medicaid map (read 2026-09-24) lists
    Georgia as "explicitly covers transgender-related health care". No DCH manual was fetched to confirm either way,
    so covers_hrt and covers_surgery are set to "unclear". This is the most important item to verify in the
    Department of Community Health's provider manuals. SB 140 litigation (Koe v. Noggle, a 2023 injunction later
    lifted) was not re-checked; confirm no injunction is in effect. Prison case name was not confirmed (Georgia
    Recorder describes a suit by five incarcerated people, filed by the Center for Constitutional Rights). The CMS
    rule barring federal Medicaid funds for minors' care (effective Oct. 13, 2026) is from a Stateline story.
