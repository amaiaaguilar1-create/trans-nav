sources:
  - id: ocga-19-12-1
    url: https://codes.findlaw.com/ga/title-19-domestic-relations/ga-code-sect-19-12-1/
    title: O.C.G.A. § 19-12-1, Petition for name change
    publisher: FindLaw (Georgia Code, current as of March 2024)
    kind: statute
    accessed: "2026-09-24"
    quote: >-
      When a name change is requested by a petitioner who alleges to be a victim of family violence or human
      trafficking, such petitioner may petition the court to file his or her petition to change his or her name under
      seal. ... Such hearing shall occur upon the expiration of: (1) Thirty days from the filing of the petition if the
      individual whose name to be changed is an adult.
  - id: ocga-9-15-2
    url: https://codes.findlaw.com/ga/title-9-civil-practice/ga-code-sect-9-15-2/
    title: O.C.G.A. § 9-15-2, Affidavit of indigence
    publisher: FindLaw
    kind: statute
    accessed: "2026-09-24"
    quote: If the party shall subscribe an affidavit to the effect that because of his indigence he is unable to pay the costs, the party shall be relieved from paying the costs.
  - id: fulton-instructions
    url: https://www.fultonsuperiorcourtga.gov/sites/default/files/family/forms/name-change-adult/Instructions%20for%20Adult%20Name%20Change.pdf
