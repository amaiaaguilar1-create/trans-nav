    kind: court
    accessed: "2026-09-24"
    quote: >-
      YOU MUST HAVE LIVED IN FULTON COUNTY FOR A LEAST SIX MONTHS PRIOR TO FILING THIS PETITION ... This notice must be
      published once a week for four weeks in the Fulton County Daily Report.
