  notes: >-
    Climate ratings are editorial summaries of the guide files. id_documents is "mixed": name changes and court-ordered
    birth certificate sex changes are possible, but the sex change standard is demanding and the DLD has no written
    marker policy. care is "restrictive" because of the minors ban (SB 16, 2023; HB 174, 2026), no insurance
    protections, and no shield law. MAP's Utah profile (read 2026-09-24) rates Utah "Low" on gender identity policy.
overview:
  en: >-
    Utah allows name changes through district court and lets adults change the sex on a Utah birth certificate with
    a court order, but only after proving transition, six months of living as their gender, and clinical distress.
    The Driver License Division has no published policy for changing the sex marker. Adults can get hormone therapy,
    and Medicaid covers it, but care for minors is banned and most remaining minor care ends January 28, 2027. Utah
    has no shield law.
  es: >-
    Utah permite cambios de nombre en el tribunal de distrito y deja que los adultos cambien el sexo en un acta de
    nacimiento de Utah con orden judicial, pero solo tras probar la transición, seis meses viviendo según su género y
    malestar clínico. La División de Licencias no tiene una política publicada para cambiar el marcador de sexo. Los
    adultos pueden recibir terapia hormonal y Medicaid la cubre, pero la atención para menores está prohibida y la
    mayor parte de la que queda termina el 28 de enero de 2027. Utah no tiene ley escudo.
