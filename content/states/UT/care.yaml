  notes: >-
    Minor-care law read from the current Utah Code on le.utah.gov (58-1-603 effective May 6, 2026; 58-1-603.1 effective
    March 18, 2026 as amended by HB 174, 2026 General Session, Laws of Utah 2026 ch. 109) and the enrolled HB 174 text
    and bill status (signed March 18, 2026). The code sets March 18, 2026 as the reference date, but Utah Medicaid's
    hormone therapy PA form (updated 8-1-26) uses 05/06/2026 instead; reviewer should confirm which date applies (the
    bill took effect on signing only if it passed both houses by two-thirds; final votes were House 53-15-7 and Senate
    20-6-3, which appear to meet that bar, and the codified text uses March 18). Surgery ban for minors from
    58-67-502(1)(g). Medicaid HRT coverage confirmed from the Medicaid pharmacy PA form "Hormone Therapy for Gender
    Dysphoria"; surgery coverage NOT confirmed (Medicaid provider manuals could not be listed by automated fetch).
    Planned Parenthood Association of Utah pages returned 403, so PPAU's hormone program and minimum age are
    unverified. No active lawsuit against HB 174 or SB 16 was found, but we could not search news sites; reviewer
    should check. HB 193 (2026, PEHP exclusion) did not pass. Genderbands says it is winding down and transferring
    programs. MAP lists Utah Medicaid as covering transgender-related care and Utah as having no insurance
    nondiscrimination protection and no shield law, consistent with what we found.
status_summary:
  en: >-
    Gender-affirming care is legal for adults in Utah, and Utah Medicaid covers hormone therapy with prior
    authorization. For people under 18, new hormone treatment and puberty blockers have been banned since 2023, and a
    2026 law (HB 174) ends most remaining care for minors on January 28, 2027. Surgery for minors is banned. Utah has
    no shield law and no law against insurance exclusions.
  es: >-
    La atención de afirmación de género es legal para adultos en Utah, y Medicaid de Utah cubre la terapia hormonal
    con autorización previa. Para menores de 18 años, los nuevos tratamientos hormonales y bloqueadores de pubertad
    están prohibidos desde 2023, y una ley de 2026 (HB 174) pone fin a la mayor parte de la atención restante para
    menores el 28 de enero de 2027. La cirugía para menores está prohibida. Utah no tiene ley escudo ni ley contra
    exclusiones de seguros.
adult_care:
  status: available
  detail:
    en: |
      No state law restricts care for adults 18 and older. Several Salt Lake City clinics prescribe hormones on an **informed consent** basis (no therapist letter), and telehealth prescribing is legal.

      **If you have little money**, in rough order:
      1. Apply for **Utah Medicaid**. Adults qualify with income up to about 138% of the federal poverty level, and Medicaid covers hormone therapy with prior authorization.
      2. Go to a **community health center** (sliding-scale fees). Find one at findahealthcenter.hrsa.gov.
      3. **UAF Legacy Health** in Salt Lake City offers hormone therapy and accepts Medicaid and most insurance.
      4. **Point of Pride** runs an HRT access fund that pays for telehealth hormone care.
      5. Generic estradiol and spironolactone are inexpensive with discount cards; ask the pharmacy for the cash price.
    es: |
      Ninguna ley estatal restringe la atención para adultos de 18 años o más. Varias clínicas de Salt Lake City recetan hormonas por **consentimiento informado** (sin carta de terapeuta), y la telesalud es legal.

      **Si tienes poco dinero**, en orden aproximado:
      1. Solicita **Medicaid de Utah**. Los adultos califican con ingresos hasta aproximadamente el 138% del nivel federal de pobreza, y Medicaid cubre la terapia hormonal con autorización previa.
      2. Acude a un **centro de salud comunitario** (tarifas en escala móvil). Búscalo en findahealthcenter.hrsa.gov.
      3. **UAF Legacy Health** en Salt Lake City ofrece terapia hormonal y acepta Medicaid y la mayoría de los seguros.
      4. **Point of Pride** tiene un fondo que paga atención hormonal por telesalud.
      5. El estradiol y la espironolactona genéricos son baratos con tarjetas de descuento; pregunta el precio en efectivo.
  sources: [medicaid-pa-gd, uaf, identity-hormones, hrsa]
minor_care:
  status: prohibited
  detail:
    en: |
      **Hormones and puberty blockers.** Since January 28, 2023 (SB 16), providers may not start hormone treatment or puberty blockers for gender dysphoria in anyone under 18 unless the minor was diagnosed before January 28, 2023 (Utah Code 58-1-603.1). **HB 174 (2026)**, signed March 18, 2026, goes further: **beginning January 28, 2027**, providers may not give hormone treatment to a minor who was younger than 16 on March 18, 2026, or who had not already started cross-sex hormones by that date. Providers may taper treatment off before January 28, 2027 without the special state certification. Anyone still eligible must see a provider with Utah's "transgender treatment certification," after at least six months of treatment for gender dysphoria, with written consent from the minor and a parent.

      **Surgery.** Genital and other sex-characteristic surgeries on anyone under 18 are banned (58-67-502).

      **Penalties.** Violations are "unprofessional conduct," which means discipline of the provider's license. Families are not penalized.

      Exceptions cover intersex conditions (disorders of sexual development), precocious puberty, and certain other medical conditions. Utah has no shield law; families traveling to Colorado, Nevada, or other states for care should ask the out-of-state clinic about that state's protections.
    es: |
      **Hormonas y bloqueadores.** Desde el 28 de enero de 2023 (SB 16), los proveedores no pueden iniciar tratamiento hormonal ni bloqueadores de pubertad por disforia de género en menores de 18 años, salvo que el diagnóstico sea anterior al 28 de enero de 2023. **HB 174 (2026)**, firmada el 18 de marzo de 2026, va más allá: **a partir del 28 de enero de 2027**, los proveedores no pueden dar tratamiento hormonal a un menor que tenía menos de 16 años el 18 de marzo de 2026, o que no había empezado hormonas cruzadas para esa fecha. Los proveedores pueden reducir el tratamiento gradualmente antes del 28 de enero de 2027.

      **Cirugía.** Las cirugías de características sexuales en menores de 18 años están prohibidas (58-67-502).

      **Sanciones.** Las violaciones son "conducta no profesional", lo que implica disciplina de la licencia del proveedor. Las familias no son sancionadas.

      Hay excepciones para condiciones intersexuales, pubertad precoz y otras condiciones médicas. Utah no tiene ley escudo.
  sources: [ucode-58-1-603-1, ucode-58-1-603, hb174, ucode-58-67-502, uofu-trans]
medicaid:
  program_name: Utah Medicaid
  covers_hrt: "yes"
  covers_surgery: unclear
  detail:
    en: |
      Utah Medicaid covers hormone therapy for gender dysphoria through its pharmacy **prior authorization** form (updated August 2026). For adults the prescriber documents a gender dysphoria diagnosis of at least six months, informed consent, a discussion of risks, and a lab monitoring plan. For minors the form applies the SB 16 and HB 174 limits described above.

      We could not confirm whether Medicaid covers gender-affirming surgery; ask your plan or the University of Utah Transgender Health Program's coordinators, who help with prior authorizations and appeals.

      **Who qualifies**: adults with income up to about 138% of the federal poverty level (Utah expanded Medicaid), plus children, pregnant people, and people with disabilities under other programs. Apply online, by mail, by fax, or at a Department of Workforce Services office; call 1-866-435-7414 (Salt Lake County 801-526-0950).
    es: |
      Medicaid de Utah cubre la terapia hormonal para la disforia de género mediante su formulario de **autorización previa** de farmacia (actualizado en agosto de 2026). Para adultos, quien receta documenta un diagnóstico de al menos seis meses, consentimiento informado, riesgos y un plan de laboratorios. Para menores aplica los límites de SB 16 y HB 174.

      No pudimos confirmar si Medicaid cubre la cirugía; pregunta a tu plan o a los coordinadores del Programa de Salud Transgénero de la Universidad de Utah.

      **Quién califica**: adultos con ingresos hasta aproximadamente el 138% del nivel federal de pobreza, además de niños, embarazadas y personas con discapacidad. Solicita en línea, por correo, por fax o en una oficina del Departamento de Servicios Laborales; llama al 1-866-435-7414.
  how_to_apply_url: https://medicaid.utah.gov/apply-medicaid/
  sources: [medicaid-pa-gd, medicaid-apply, uofu-support]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: |
      No Utah law prohibits health plans from excluding gender-affirming care, so coverage depends on your plan. Read your plan's exclusions list, and if care is denied, appeal with the plan first. If that fails, you can file a complaint with the Utah Insurance Department (801-957-9200; toll-free in Utah 1-800-439-3805). Self-funded employer plans are federally regulated. The University of Utah Transgender Health Program's coordinators help patients with prior authorizations and appeals.
    es: |
      Ninguna ley de Utah prohíbe a los planes de salud excluir la atención de afirmación de género, así que la cobertura depende de tu plan. Revisa las exclusiones y, si te niegan la atención, apela primero con el plan. Si no funciona, puedes presentar una queja ante el Departamento de Seguros de Utah (801-957-9200; gratis en Utah 1-800-439-3805). Los planes autofinanciados de empleadores se rigen por leyes federales.
  complaint_url: https://insurance.utah.gov/complaints/
  sources: [uid-complaints, uofu-support]
