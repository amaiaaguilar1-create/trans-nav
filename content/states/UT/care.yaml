pending_bills:
  - bill: HB 174 (2026)
    summary:
      en: Ends the grandfather clause for minors already receiving hormone treatment, effective January 28, 2027, except for those who were at least 16 and already on cross-sex hormones on March 18, 2026. Repeals the required state review of the medical evidence.
      es: Pone fin a la excepción para menores que ya reciben tratamiento hormonal a partir del 28 de enero de 2027, salvo quienes tenían al menos 16 años y ya usaban hormonas cruzadas el 18 de marzo de 2026. Deroga la revisión estatal de la evidencia médica.
    status: signed
    last_action: "2026-03-18"
    url: https://le.utah.gov/~2026/bills/static/HB0174.html
    sources: [hb174]
