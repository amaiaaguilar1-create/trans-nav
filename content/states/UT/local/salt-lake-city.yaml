  en: Salt Lake County and the Wasatch Front
  es: Condado de Salt Lake y el Wasatch Front
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Resources checked on each organization's own site on 2026-09-24 except where marked. Addresses for Maliheh Free
    Clinic and the Community Health Centers Neighborhood clinic come from the Utah Pride Center's resource list (their
    own sites did not respond to automated requests). Planned Parenthood pages returned 403. The Third District Court
    handles Salt Lake County; the courthouse address was not confirmed on the court directory page and is omitted.
    Reviewer: confirm the Rainbow Law Clinic's current schedule and intake method, and Encircle's hours.
intro:
  en: >-
    Salt Lake City has most of Utah's trans-specific services: the University of Utah's adult Transgender Health
    Program, community clinics that prescribe hormones on informed consent, a free law school clinic for name and
    gender marker questions, and LGBTQ+ centers for adults and youth. Name change petitions for Salt Lake County
    residents are filed in the Third District Court.
  es: >-
    Salt Lake City concentra la mayoría de los servicios trans de Utah: el Programa de Salud Transgénero para adultos
    de la Universidad de Utah, clínicas comunitarias que recetan hormonas por consentimiento informado, una clínica
    legal gratuita de la facultad de derecho para cambios de nombre y marcador, y centros LGBTQ+ para adultos y
    jóvenes. Las peticiones de cambio de nombre de residentes del condado de Salt Lake se presentan en el Tercer
    Tribunal de Distrito.
court:
  name: Third District Court (Salt Lake County)
  url: https://www.utcourts.gov/en/self-help/case-categories/family/name-change/sex-change.html
  self_help_url: https://www.utcourts.gov/en/self-help/services/contact.html
  filing_fee: 375
  notes:
    en: File with the district court in the county where you have lived for at least a year. Salt Lake County residents file in the Third District Court, or online through the court's MyPaperwork tool. The statewide Self-Help Center helps with forms for free.
    es: Presenta en el tribunal de distrito del condado donde has vivido al menos un año. Los residentes del condado de Salt Lake presentan en el Tercer Tribunal de Distrito, o en línea con MyPaperwork. El Centro de Autoayuda estatal ayuda gratis con los formularios.
  sources: [courts-adult-page, ucode-78a-2-301, courts-shc]
resources:
  - id: rainbow-law
    name: Rainbow Law Clinic (S.J. Quinney College of Law Pro Bono Initiative)
    type: name_change_clinic
    pillars: [name_change, gender_marker]
    description:
      en: Free clinic where law students and volunteer attorneys answer questions on LGBTQIA+ legal issues, including name and gender marker changes.
      es: Clínica gratuita donde estudiantes de derecho y abogados voluntarios responden preguntas sobre temas legales LGBTQIA+, incluidos cambios de nombre y marcador.
    url: https://www.law.utah.edu/pro-bono-initiative/clients/
    phone: "801-581-8895"
    cost: free
    verification: org_website
    sources: [ulaw-pbi]
  - id: uls
    name: Utah Legal Services
    type: legal_aid
    pillars: [name_change]
    description:
      en: Civil legal aid for low-income Utahns (generally up to 200% of the poverty level). Handles priority case types only; call 801-328-8891 (9 am to 2 pm weekdays) or apply online.
      es: Asistencia legal civil para personas de bajos ingresos (generalmente hasta el 200% del nivel de pobreza). Solo casos prioritarios; llama al 801-328-8891 (9 am a 2 pm entre semana) o solicita en línea.
    url: https://www.utahlegalservices.org/
    phone: "801-328-8891"
    address: 960 South Main St, Salt Lake City, UT
    cost: free
    verification: org_website
    sources: [uls]
  - id: uofu-trans-health
    name: University of Utah Transgender Health Program
    type: hrt_clinic
    pillars: [hrt, mental_health, insurance, gender_marker]
    description:
      en: Adult hormone therapy, primary care, surgery, voice therapy, hair reduction, and counseling. No referral needed. Providers write letters for gender marker changes, and coordinators help with insurance prior authorizations and appeals.
      es: Terapia hormonal para adultos, atención primaria, cirugía, terapia de voz, depilación y consejería. No requiere referencia. Los proveedores escriben cartas para cambios de marcador y los coordinadores ayudan con autorizaciones y apelaciones.
    url: https://healthcare.utah.edu/transgender-health
    phone: "801-213-2195"
    address: 50 North Medical Drive, Salt Lake City, UT 84132
    cost: insurance
    accepts_medicaid: true
    verification: org_website
    sources: [uofu-trans, uofu-support]
