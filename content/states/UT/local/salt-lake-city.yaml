    pillars: [hrt, sexual_health, mental_health]
    description:
      en: Primary care, hormone therapy, PrEP and HIV care, STI testing, and therapy. Low-cost after-hours HIV/STI testing with no insurance required. Accepts Medicaid and most insurance.
      es: Atención primaria, terapia hormonal, PrEP y atención del VIH, pruebas de ITS y terapia. Pruebas nocturnas de VIH/ITS de bajo costo sin seguro. Acepta Medicaid y la mayoría de los seguros.
