  notes: >-
    SB 244 new section 2 (birth certificates) read from the enrolled PDF 2026-09-24. KDHE's website (kdhe.ks.gov)
    returned 403 to automated access, so KDHE's current procedure, amendment and copy fees, forms, and processing
    times are NOT confirmed and no fees are listed. We also could not confirm whether KDHE has mailed notices or
    reissued previously amended certificates under SB 244, or how K.S.A. 65-2422c name amendments are handled today.
    Background from memory that the reviewer should confirm with primary sources: Kansas allowed sex marker changes
    from 2019 under the Foster v. Stanek consent judgment, and KDHE stopped after SB 180 took effect July 1, 2023.
    Note that section 2 covers certificates "issued prior to July 1, 2026", while the act took effect on Kansas
    Register publication in February 2026.
status: prohibited
requirement_type: prohibited
name_change_status: available
status_summary:
  en: >-
    Kansas does not change the sex on a Kansas birth certificate. A 2026 law (SB 244) declared certificates that had
    already been amended invalid and told the state registrar to correct those records back to sex assigned at birth.
    You can still ask to update the name.
  es: >-
    Kansas no cambia el sexo en un acta de nacimiento de Kansas. Una ley de 2026 (SB 244) declaró inválidas las
    actas ya enmendadas y ordenó al registro estatal corregir esos registros al sexo asignado al nacer. Todavía
    puedes pedir que se actualice el nombre.
summary:
  en: |
    SB 180 (2023) defined "sex" in Kansas law as biological sex at birth (K.S.A. 77-207). House Substitute for SB 244 (2026) went further: under its section 2, any birth certificate issued before July 1, 2026 that shows a sex contrary to that definition "shall be invalid", and the state registrar must correct the record. That includes certificates amended legally between 2019 and 2023.

    A court order recognizing your gender will not change a Kansas birth certificate. You can still request a **name** amendment with a certified court order; contact KDHE's Office of Vital Statistics for the current form and fee.

    This guide applies only to people born in Kansas. If you were born in another state, that state's rules control your birth certificate, even if you live in Kansas.
  es: |
    SB 180 (2023) definió "sexo" en la ley de Kansas como el sexo biológico al nacer (K.S.A. 77-207). House Substitute for SB 244 (2026) fue más allá: según su sección 2, toda acta de nacimiento emitida antes del 1 de julio de 2026 que muestre un sexo contrario a esa definición es inválida, y el registro estatal debe corregirla. Eso incluye actas enmendadas legalmente entre 2019 y 2023.

    Una orden judicial que reconozca tu género no cambia un acta de Kansas. Todavía puedes pedir una enmienda de **nombre** con una orden judicial certificada; contacta a la Oficina de Estadísticas Vitales de KDHE para el formulario y la tarifa actuales.

    Esta guía aplica solo a personas nacidas en Kansas. Si naciste en otro estado, se aplican las reglas de ese estado.
eligibility:
  residency:
    en: You must have been born in Kansas. Where you live now does not matter.
    es: Debes haber nacido en Kansas. No importa dónde vivas ahora.
  sources: [sb244]
steps:
  - id: name-amendment
    title:
      en: Ask KDHE Vital Statistics to amend your name
      es: Pide a Estadísticas Vitales de KDHE que enmiende tu nombre
    body:
      en: Get a certified copy of your court order changing your name, then contact the KDHE Office of Vital Statistics for the current amendment application and fee. The sex field will remain as assigned at birth.
      es: Obtén una copia certificada de tu orden de cambio de nombre y contacta a la Oficina de Estadísticas Vitales de KDHE para la solicitud y tarifa actuales. El campo de sexo seguirá como se asignó al nacer.
    applies_to: [name_change]
    sources: [kdhe-vs, ksa-65-2422c]
  - id: previously-amended
    title:
      en: If your certificate was amended before, get legal advice
      es: Si tu acta fue enmendada antes, busca asesoría legal
    body:
      en: SB 244 makes previously amended Kansas certificates invalid. Before relying on one, talk to the ACLU of Kansas or legal aid, and follow Doe v. State of Kansas.
      es: SB 244 invalida las actas de Kansas enmendadas antes. Antes de usarla, habla con la ACLU de Kansas o asistencia legal y sigue el caso Doe v. State of Kansas.
    applies_to: [gender_marker]
    sources: [sb244, aclu-doe]
after:
  en: Use your court order, not your birth certificate, to update Social Security, your license, and your passport name. If you were born elsewhere, check your birth state's guide.
  es: Usa tu orden judicial, no tu acta de nacimiento, para actualizar el nombre en el Seguro Social, tu licencia y tu pasaporte. Si naciste en otro estado, revisa la guía de ese estado.
