litigation:
  - case: Doe v. State of Kansas
    court: District Court of Douglas County, Kansas
    summary:
      en: Challenges SB 244 under the Kansas Constitution, including restrictions on birth certificate sex markers. A temporary restraining order was denied March 10, 2026; a temporary injunction hearing was set for September 29, 2026.
      es: Impugna SB 244 bajo la Constitución de Kansas, incluidas las restricciones a los marcadores de sexo en actas de nacimiento. Se negó una orden de restricción temporal el 10 de marzo de 2026; una audiencia sobre un mandato temporal se fijó para el 29 de septiembre de 2026.
    effect_today:
      en: No court order blocks SB 244 as of September 24, 2026.
      es: Ninguna orden judicial bloquea SB 244 al 24 de septiembre de 2026.
    last_update: "2026-09-24"
    url: https://www.aclukansas.org/cases/doe-v-state-of-kansas/
    sources: [aclu-doe]
