    note:
      en: $8 credential fee plus $8 photo fee.
      es: $8 de credencial más $8 de foto.
    sources: [dov-fees]
  - id: name-change-id
    label:
      en: Name change on an ID card
      es: Cambio de nombre en tarjeta de identificación
    amount: 12
    note:
