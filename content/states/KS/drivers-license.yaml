status: prohibited
requirement_type: prohibited
name_change_status: available
status_summary:
  en: >-
    Kansas does not allow changing the sex marker on a driver's license or ID. A 2026 law (SB 244) also made
    licenses that had already been changed invalid; holders were told to surrender them by March 25, 2026. You can
    still update your name.
  es: >-
    Kansas no permite cambiar el marcador de sexo en una licencia de conducir o identificación. Una ley de 2026
    (SB 244) además invalidó las licencias que ya se habían cambiado; se ordenó entregarlas antes del 25 de marzo de
    2026. Todavía puedes actualizar tu nombre.
summary:
  en: |
    House Substitute for SB 244, passed over Governor Kelly's veto in February 2026, defines "gender" in the driver's license law as sex at birth (K.S.A. 77-207). Under the amended K.S.A. 8-243(g), any license issued before July 1, 2026 that shows a different gender "shall be invalid". The Division of Vehicles must correct its records, send written notice, and issue a new license showing sex assigned at birth when the old one is surrendered.

    **If you had changed your marker**: the Division of Vehicles says affected people received a letter. You bring your current card to a driver's license office and surrender it. No other documents are needed; you get a temporary license right away and the new card by mail in 10 to 14 days. The Division says people who had not done this by close of business March 25, 2026 are "subject to all applicable penalties" if stopped by police. You can check whether your license is valid with the free online status check, which shows the same status police see.

    **Name changes** are still processed normally with a certified court order.
  es: |
    House Substitute for SB 244, aprobada sobre el veto de la gobernadora Kelly en febrero de 2026, define "género" en la ley de licencias como el sexo al nacer (K.S.A. 77-207). Según K.S.A. 8-243(g), toda licencia emitida antes del 1 de julio de 2026 que muestre otro género es inválida. La División de Vehículos debe corregir sus registros, enviar un aviso por escrito y emitir una nueva licencia con el sexo asignado al nacer al entregar la anterior.

    **Si habías cambiado tu marcador**: la División dice que las personas afectadas recibieron una carta. Llevas tu tarjeta a una oficina de licencias y la entregas. No se necesitan otros documentos; recibes una licencia temporal en el momento y la nueva por correo en 10 a 14 días. La División dice que quien no lo hizo antes del cierre del 25 de marzo de 2026 está sujeto a las sanciones aplicables si la policía lo detiene. Puedes revisar si tu licencia es válida en la consulta gratuita en línea, que muestra lo mismo que ve la policía.

    Los **cambios de nombre** se siguen tramitando normalmente con una orden judicial certificada.
eligibility:
  other:
    en: Applies to all Kansas driver's licenses and ID cards.
    es: Aplica a todas las licencias e identificaciones de Kansas.
  sources: [dov-gender, sb244]
steps:
  - id: check-status
    title:
      en: Check whether your license is still valid
      es: Revisa si tu licencia sigue siendo válida
    body:
      en: If you ever changed the sex marker on a Kansas license or ID, use the Division of Vehicles' free driver's license status check. Its status is what police see.
      es: Si alguna vez cambiaste el marcador de sexo en una licencia o identificación de Kansas, usa la consulta gratuita de estado de licencia de la División de Vehículos. Ese estado es el que ve la policía.
    applies_to: [gender_marker]
    sources: [dov-gender]
  - id: surrender
    title:
      en: If your card was invalidated, surrender it for a new one
      es: Si tu tarjeta fue invalidada, entrégala por una nueva
    body:
      en: Bring your current card to a driver's license office. No other documents are needed unless you are changing something else, like your address. You get a temporary license right away. If you believe your license was invalidated in error, you can appeal under K.S.A. 8-259, but an appeal does not keep your current card valid.
      es: Lleva tu tarjeta actual a una oficina de licencias. No necesitas otros documentos a menos que cambies otra cosa, como tu dirección. Recibes una licencia temporal en el momento. Si crees que fue un error, puedes apelar según K.S.A. 8-259, pero la apelación no mantiene válida tu tarjeta.
    applies_to: [gender_marker, in_person]
    sources: [dov-gender]
  - id: name-change
    title:
      en: Update your name with a certified court order
      es: Actualiza tu nombre con una orden judicial certificada
    body:
      en: Update Social Security first, then bring the certified name change order and your current card to a driver's license office.
      es: Actualiza primero el Seguro Social y luego lleva la orden certificada de cambio de nombre y tu tarjeta actual a una oficina de licencias.
    fees: [name-change-dl, name-change-id]
    applies_to: [name_change, in_person]
    sources: [dov-fees]
