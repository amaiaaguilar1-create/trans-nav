    sources: [dov-fees]
delivery:
  online: false
  by_mail: false
  in_person: true
  detail:
    en: Surrendering a card and name changes are done at a driver's license office.
    es: La entrega de la tarjeta y los cambios de nombre se hacen en una oficina de licencias.
  sources: [dov-gender]
timeline:
  en: Temporary license the same day; the permanent card arrives by mail in 10 to 14 days.
  es: Licencia temporal el mismo día; la tarjeta llega por correo en 10 a 14 días.
after:
  en: Your Kansas license will show the sex assigned at birth. If you have a passport or another state's document with a different marker, carry what you need for travel and work, and talk to legal aid if an employer or landlord questions the mismatch.
  es: Tu licencia de Kansas mostrará el sexo asignado al nacer. Si tienes un pasaporte u otro documento con otro marcador, lleva lo que necesites para viajar y trabajar, y consulta con asistencia legal si un empleador o arrendador cuestiona la diferencia.
tips:
  - en: Driving on a license the state has invalidated can lead to penalties. Check your status online before you drive.
    es: Conducir con una licencia invalidada puede traer sanciones. Revisa tu estado en línea antes de conducir.
