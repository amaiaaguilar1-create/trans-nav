litigation:
  - case: Doe v. State of Kansas
    court: District Court of Douglas County, Kansas
    summary:
      en: Transgender Kansans represented by the ACLU, ACLU of Kansas, and Ballard Spahr challenge SB 244 under the Kansas Constitution, including the invalidation of driver's licenses. A temporary restraining order was denied March 10, 2026. An evidentiary hearing on a temporary injunction was set to begin September 29, 2026.
      es: Personas trans representadas por la ACLU, ACLU de Kansas y Ballard Spahr impugnan SB 244 bajo la Constitución de Kansas, incluida la invalidación de licencias. Se negó una orden de restricción temporal el 10 de marzo de 2026. Una audiencia sobre un mandato temporal estaba fijada para comenzar el 29 de septiembre de 2026.
    effect_today:
      en: No court order blocks SB 244 as of September 24, 2026. The law is in effect.
      es: Ninguna orden judicial bloquea SB 244 al 24 de septiembre de 2026. La ley está vigente.
    last_update: "2026-09-24"
