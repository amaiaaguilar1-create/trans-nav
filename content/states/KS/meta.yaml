overview:
  en: >-
    Kansas is one of the most restrictive states for trans people's identity documents. A 2026 law (H Sub for SB 244,
    passed over the governor's veto) declared driver's licenses and birth certificates showing a sex other than sex
    assigned at birth **invalid**, including ones changed years ago, and Kansas no longer changes the sex marker on
    either document. Name changes through district court are still available. Adults can get hormone therapy legally;
    the 2025 ban on medical transition for minors (SB 63) is partly blocked by a state court while a lawsuit continues.
  es: >-
    Kansas es uno de los estados más restrictivos para los documentos de identidad de las personas trans. Una ley de
    2026 (H Sub for SB 244, aprobada sobre el veto de la gobernadora) declaró **inválidas** las licencias de conducir y
    actas de nacimiento que muestran un sexo distinto al asignado al nacer, incluso las cambiadas hace años, y Kansas
    ya no cambia el marcador de sexo en ninguno de los dos documentos. El cambio de nombre en el tribunal de distrito
    sigue disponible. Los adultos pueden recibir terapia hormonal legalmente; la prohibición de 2025 para menores
    (SB 63) está parcialmente bloqueada por un tribunal estatal mientras continúa una demanda.
