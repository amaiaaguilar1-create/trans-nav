      es: Terapia hormonal, cirugía para adultos, terapia de voz, atención primaria y psicología, con coordinadoras de enfermería; adolescentes desde los 16. Llama al 913-588-6200.
    url: https://www.kansashealthsystem.com/care/specialties/gender-affirming-medicine
