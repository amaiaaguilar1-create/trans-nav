jurisdiction: KS
slug: kansas-city-ks
name: Kansas City, Kansas
area:
  en: Kansas side of the Kansas City metro (Wyandotte and Johnson counties); some listed services are across the state line in Kansas City, Missouri.
  es: Lado de Kansas del área metropolitana de Kansas City (condados de Wyandotte y Johnson); algunos servicios están en Kansas City, Missouri.
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    Wyandotte County (29th Judicial District) and Johnson County (10th Judicial District) court pages were not
    reached (wycokck.org returned 403; the jocogov.org district court URL we tried was a 404), so no court URL or
    local fee is listed. Planned Parenthood and Equality Kansas pages blocked automated fetching; those entries are
    unverified. KU Health System, Vivent Health, Johnson County STI testing, and Kansas Legal Services were read
    on their own sites. Wichita (Sedgwick County, 18th Judicial District, dc18.org) was considered but has fewer
    trans-specific services we could verify.
intro:
  en: >-
    The Kansas City metro has the state's largest concentration of trans health services, anchored by The University
    of Kansas Health System's gender-affirming medicine program. Name change petitions are filed in the district court
    of the county where you live: Wyandotte County (29th Judicial District) or Johnson County (10th Judicial District).
  es: >-
    El área metropolitana de Kansas City tiene la mayor concentración de servicios de salud trans del estado, con el
    programa de medicina de afirmación de género de The University of Kansas Health System. Las peticiones de cambio de
    nombre se presentan en el tribunal de distrito del condado donde vives: Wyandotte (Distrito Judicial 29) o Johnson
    (Distrito Judicial 10).
court:
  name: District Court of Wyandotte County (29th Judicial District) or Johnson County (10th Judicial District)
  notes:
    en: File in your county of residence. The statewide docket fee is $173 plus a court surcharge (about $195 total); confirm with the clerk.
    es: Presenta en tu condado de residencia. La tarifa estatal es $173 más un recargo (unos $195); confirma con el secretario.
  sources: [ksa-60-2001]
