status_summary:
  en: >-
    Adults in Kansas can legally get gender-affirming care, including hormones and surgery, but there are no state
    insurance protections. SB 63 (2025) bans medical transition for minors and bars KanCare and state funds from
    paying for it; a state court partly blocked the ban in May 2026 while the lawsuit continues.
  es: >-
    Los adultos en Kansas pueden recibir legalmente atención de afirmación de género, incluidas hormonas y cirugía,
    pero no hay protecciones estatales en los seguros. SB 63 (2025) prohíbe la transición médica para menores e impide
    que KanCare y fondos estatales la paguen; un tribunal estatal bloqueó parcialmente la prohibición en mayo de 2026
    mientras sigue la demanda.
adult_care:
  status: available
  detail:
    en: |
      No Kansas law restricts gender-affirming care for adults 18 and older. The University of Kansas Health System in Kansas City runs a multidisciplinary gender-affirming medicine program (hormones, surgery, voice therapy, primary care) and offers telehealth to Kansas patients. Telehealth providers such as Plume and FOLX serve Kansas.

      **If you have no insurance and little money:**
      1. Kansas has not expanded Medicaid, so most adults without children or a disability do not qualify for KanCare. Check anyway, and check **HealthCare.gov**, where low-income adults often qualify for subsidized plans.
      2. Look for a **community health center** at findahealthcenter.hrsa.gov; they charge on a sliding scale.
      3. **Point of Pride's HRT Access Fund** pays for telehealth hormone care for a year or more (applications open once a year).
    es: |
      Ninguna ley de Kansas restringe la atención de afirmación de género para adultos. The University of Kansas Health System en Kansas City tiene un programa multidisciplinario (hormonas, cirugía, terapia de voz, atención primaria) y ofrece telesalud a pacientes de Kansas. Proveedores de telesalud como Plume y FOLX atienden en Kansas.

      **Si no tienes seguro ni mucho dinero:**
      1. Kansas no amplió Medicaid, así que la mayoría de los adultos sin hijos ni discapacidad no califica para KanCare. Revisa de todos modos, y revisa **HealthCare.gov**, donde muchas personas de bajos ingresos califican para planes subsidiados.
      2. Busca un **centro de salud comunitario** en findahealthcenter.hrsa.gov; cobran en escala móvil.
      3. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud (solicitudes una vez al año).
  sources: [kuhs-gam, hrsa, healthcare-gov, pop]
minor_care:
  status: litigation
  detail:
    en: |
      SB 63, the Help Not Harm Act (K.S.A. 65-28,137 to 65-28,142), became law on February 20, 2025, after the Legislature overrode Governor Kelly's veto. It bars providers from giving puberty blockers, hormones, or surgery to people under 18 for gender dysphoria, bars recipients of state funds and state facilities from providing or subsidizing that care, and bars KanCare from covering it.

      On May 15, 2026, the Douglas County District Court granted a temporary injunction in **Loe v. Kansas**, finding the law likely violates the Kansas Constitution. The order may protect only the families who sued; confirm with a provider or the ACLU of Kansas before relying on it. KU Health System lists adolescent care for ages 16 and up.
    es: |
      SB 63, la Ley Help Not Harm (K.S.A. 65-28,137 a 65-28,142), entró en vigor el 20 de febrero de 2025, después de que la Legislatura anulara el veto de la gobernadora Kelly. Prohíbe dar bloqueadores de pubertad, hormonas o cirugía a menores de 18 años por disforia de género, impide que receptores de fondos estatales e instalaciones estatales la presten o subsidien, y prohíbe que KanCare la cubra.

      El 15 de mayo de 2026, el Tribunal de Distrito del Condado de Douglas otorgó un mandato temporal en **Loe v. Kansas**, al considerar que la ley probablemente viola la Constitución de Kansas. La orden podría proteger solo a las familias demandantes; confirma con un proveedor o la ACLU de Kansas antes de contar con ella.
  sources: [ksa-65-28-138, aclu-loe, aclu-loe-pr, kuhs-gam]
medicaid:
  program_name: KanCare
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: KanCare may not cover gender-affirming medication or surgery for anyone under 18 (K.S.A. 65-28,138). We found no written adult exclusion but could not confirm adult coverage; ask your KanCare health plan for its policy in writing. Kansas has not expanded Medicaid, so most adults without children or a disability are not eligible.
    es: KanCare no puede cubrir medicamentos ni cirugía de afirmación de género para menores de 18 años (K.S.A. 65-28,138). No encontramos una exclusión escrita para adultos, pero no pudimos confirmar la cobertura; pide a tu plan de KanCare su política por escrito. Kansas no amplió Medicaid, así que la mayoría de los adultos sin hijos ni discapacidad no califica.
  how_to_apply_url: https://www.kancare.ks.gov/
  sources: [ksa-65-28-138, kancare]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: Kansas has no law that bars insurers from excluding gender-affirming care. Read your plan's exclusions. If a claim is denied, appeal with the plan first, then file a complaint with the Kansas Insurance Department. Employer self-funded plans are federally regulated.
    es: Kansas no tiene una ley que prohíba a las aseguradoras excluir la atención de afirmación de género. Revisa las exclusiones de tu plan. Si niegan un reclamo, apela ante el plan y luego presenta una queja ante el Departamento de Seguros de Kansas.
  complaint_url: https://insurance.kansas.gov/consumer-assistance/
  sources: [kid]
