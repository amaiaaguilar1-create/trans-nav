overview:
  en: >-
    Florida is one of the most restrictive states for trans people. You can still change your **name** in circuit
    court (with a required FBI/FDLE fingerprint check), but since January 2024 the driver's license agency will not
    change the sex on an existing license or ID, and the Department of Health has stopped amending the sex on birth
    certificates. A 2023 law (SB 254) bans hormone therapy and surgery for minors and requires adults to see a
    **physician in person** and sign a state consent form; Florida Medicaid and state-funded plans exclude
    gender-affirming care. Both restrictions are being challenged in federal court. Florida has no shield law.
  es: >-
    Florida es uno de los estados más restrictivos para las personas trans. Todavía puedes cambiar tu **nombre** en
    el tribunal de circuito (con una verificación de huellas obligatoria del FBI/FDLE), pero desde enero de 2024 la
    agencia de licencias no cambia el sexo en una licencia o identificación existente, y el Departamento de Salud
    dejó de enmendar el sexo en las actas de nacimiento. Una ley de 2023 (SB 254) prohíbe la terapia hormonal y la
    cirugía para menores y exige que los adultos vean a un **médico en persona** y firmen un formulario estatal de
    consentimiento; Medicaid de Florida y los planes con fondos estatales excluyen la atención de afirmación de
    género. Ambas restricciones están impugnadas en un tribunal federal. Florida no tiene ley escudo.
