review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details from the Eleventh Circuit Self-Help Program page and adult name change packet (read 2026-09-24).
    Org details from each org's own site the same day. Not confirmed: whether any Miami clinic currently prescribes
    gender-affirming hormones under SB 254's physician-only rule. Care Resource's site shows a "coming" banner for
    gender-affirming services but no details; Pridelines lists primary care but not hormones. Reviewer should call
    both, and check whether Planned Parenthood of Florida's Miami centers offer hormone therapy. Legal Services of
    Greater Miami's site did not mention name change help; it is listed for general civil legal aid.
intro:
  en: >-
    Miami-Dade has several LGBTQ community organizations, a trans-led group that helps with name changes, and
    sliding-scale clinics for PrEP and STI testing. Hormone therapy options are limited by Florida's physician-only
    and in-person consent rules, so call clinics before visiting. Name change petitions are filed with the Miami-Dade
    Clerk at the Lawson E. Thomas Courthouse Center downtown.
  es: >-
    Miami-Dade tiene varias organizaciones LGBTQ, un grupo trans que ayuda con cambios de nombre y clínicas con escala
    móvil para PrEP y pruebas de ITS. Las opciones de terapia hormonal están limitadas por las reglas de Florida de
    médico y consentimiento en persona, así que llama antes. Las peticiones de cambio de nombre se presentan ante el
    secretario de Miami-Dade en el Lawson E. Thomas Courthouse Center.
court:
  name: Circuit Court of the Eleventh Judicial Circuit (Miami-Dade), Family Division
  url: https://www.jud11.flcourts.org/
  self_help_url: https://www.jud11.flcourts.org/Family-Court-Self-Help-Program
  filing_fee: 401
  notes:
    en: >-
      File at the Clerk's NEW FILINGS window, 175 NW 1st Avenue, 12th Floor, Miami. The Family Court Self-Help
      Program (Room 2441 in the same building, or the South Dade Justice Center in Cutler Bay; 305-349-7800) reviews
      and notarizes name change packets for a $40 fee. Fingerprint ORI number for Miami-Dade is FL923940Z. The hearing
      date arrives by mail in about 4 to 8 weeks.
    es: >-
      Presenta en la ventanilla NEW FILINGS, 175 NW 1st Avenue, piso 12, Miami. El Programa de Autoayuda (sala 2441,
      o el South Dade Justice Center; 305-349-7800) revisa y notariza los paquetes por $40. El número ORI para huellas
      es FL923940Z.
  sources: [md-packet, md-selfhelp, fnc-miami-prints]
