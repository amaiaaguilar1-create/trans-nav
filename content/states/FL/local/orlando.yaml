intro:
  en: >-
    Central Florida has an LGBTQ center that runs name change clinics, a clinic that offers gender-affirming hormone
    therapy on a sliding scale, and a drop-in center for LGBTQ youth. Name change petitions are filed with the Orange
    County Clerk of Courts at the downtown Orlando courthouse.
  es: >-
    Florida Central tiene un centro LGBTQ con clínicas de cambio de nombre, una clínica con terapia hormonal de
    afirmación de género en escala móvil y un centro para jóvenes LGBTQ. Las peticiones de cambio de nombre se
    presentan ante el secretario del condado de Orange en el tribunal del centro de Orlando.
court:
  name: Circuit Court of the Ninth Judicial Circuit (Orange County), Family Division
  url: https://www.myorangeclerk.com/Divisions/Family/Family-Law
  self_help_url: https://www.myorangeclerk.com/Divisions/Self-Help-Center/Self-Help-Center
  filing_fee: 412.5
  notes:
    en: >-
      File at 425 N. Orange Ave., Suite 320, Orlando. Go first to Family Court Services, room 340, before 3:30 p.m. to
      have your pleadings reviewed and notarized. The Clerk's Self Help Center offers attorney consultations and form
      help. Fingerprint ORI number for Orange County is FL923990Z.
    es: >-
      Presenta en 425 N. Orange Ave., Suite 320, Orlando. Primero ve a Family Court Services, sala 340, antes de las
      3:30 p.m. para revisar y notarizar. El número ORI para huellas es FL923990Z.
  sources: [orange-clerk, fnc-orange-prints]
