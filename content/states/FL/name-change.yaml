      en: Step-by-step guides by county, including fingerprinting ORI numbers and vendors, in English and Spanish.
      es: Guías paso a paso por condado, en inglés y español.
  - title: Advocates for Trans Equality, Florida identity documents
    url: https://transequality.org/documents/florida-identity-documents
    note:
      en: Its detailed Florida guide dates from August 2017 and predates the 2024 license and birth certificate changes.
      es: Su guía detallada de Florida es de agosto de 2017 y no refleja los cambios de 2024.
sources:
  - id: fs-68-07
    url: https://www.flsenate.gov/Laws/Statutes/2025/68.07
    title: Fla. Stat. § 68.07, Change of name
    publisher: The Florida Senate
    kind: statute
    accessed: "2026-09-24"
    quote: Before the court hearing on a petition for a name change, the petitioner must have fingerprints submitted for a state and national criminal history records check, except if a former name is being restored.
  - id: fs-57-082
    url: https://www.flsenate.gov/Laws/Statutes/2025/57.082
    title: Fla. Stat. § 57.082, Determination of civil indigent status
    publisher: The Florida Senate
    kind: statute
    accessed: "2026-09-24"
