litigation:
  - case: Doe v. Ladapo
    court: US Court of Appeals for the Eleventh Circuit (appeal from N.D. Fla. No. 4:23-cv-00114)
    summary:
      en: >-
        Challenge to SB 254's ban on care for minors and its adult restrictions. On June 11, 2024 the district court
        held both unconstitutional and enjoined them. In August 2024 a 2-1 Eleventh Circuit panel stayed that ruling
        pending appeal. Oral argument was held January 15, 2025; the parties then briefed the effect of the Supreme
        Court's June 2025 decision in United States v. Skrmetti.
      es: >-
        Impugnación de la prohibición para menores y las restricciones para adultos de SB 254. El 11 de junio de 2024
        el tribunal de distrito las declaró inconstitucionales. En agosto de 2024 el Undécimo Circuito suspendió el
        fallo mientras se resuelve la apelación.
    effect_today:
      en: The law is fully in effect. Minors cannot start care in Florida, and adults must follow the physician-only, in-person consent rules.
      es: La ley está plenamente vigente. Los menores no pueden iniciar atención en Florida y los adultos deben seguir las reglas de médico y consentimiento en persona.
    last_update: "2025-01-15"
    url: https://www.nclrights.org/our-work/cases/doe-v-ladapo/
    sources: [nclr-doe, blade-doe]
  - case: Dekker v. Weida
    court: US Court of Appeals for the Eleventh Circuit (appeal from N.D. Fla.)
    summary:
      en: >-
        Challenge to Florida's Medicaid exclusion (Rule 59G-1.050(7)) and the state-funds ban in section 286.311. The
        district court held the exclusion unlawful in June 2023; Florida appealed, and supplemental briefs on the
        Skrmetti decision were filed in July 2025.
      es: >-
        Impugnación de la exclusión de Medicaid y la prohibición de fondos estatales. El tribunal de distrito la
        declaró ilegal en junio de 2023; Florida apeló y en julio de 2025 se presentaron escritos sobre Skrmetti.
    effect_today:
      en: Florida Medicaid continues to deny coverage for hormones and surgery for gender dysphoria while the appeal is pending.
      es: Medicaid de Florida sigue negando la cobertura de hormonas y cirugía mientras la apelación está pendiente.
    last_update: "2025-07-14"
    url: https://lambdalegal.org/case/dekker-v-marstiller/
    sources: [lambda-dekker, wusf-dekker]
