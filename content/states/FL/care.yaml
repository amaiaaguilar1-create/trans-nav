status_summary:
  en: >-
    Florida bans hormone therapy, puberty blockers, and surgery for anyone under 18. Adults can get care, but only from
    a **physician** (not a nurse practitioner or physician assistant), and the first consent must be signed **in person**
    with the prescribing physician on a state form. Florida Medicaid and state-funded plans exclude gender-affirming
    care. Federal lawsuits challenging these rules have been pending on appeal since 2023 and 2024, and the laws are
    being enforced.
  es: >-
    Florida prohíbe la terapia hormonal, los bloqueadores de pubertad y la cirugía para menores de 18 años. Los adultos
    pueden recibir atención, pero solo de un **médico** (no de una enfermera practicante ni asistente médico), y el
    primer consentimiento debe firmarse **en persona** con el médico en un formulario estatal. Medicaid de Florida y
    los planes con fondos estatales excluyen la atención de afirmación de género. Las demandas federales siguen en
    apelación y las leyes se están aplicando.
adult_care:
  status: restricted
  detail:
    en: |
      Under SB 254 (2023), codified at section 456.52:
      - Only a **physician** (MD or DO) may prescribe or administer hormones, blockers, or perform surgery for gender transition. Nurse practitioners and physician assistants cannot, which closed or changed many clinic and telehealth programs.
      - Consent must be voluntary, informed, in writing on a form adopted by the Board of Medicine, and given while the **physician is physically in the same room** with you. You cannot start care through telehealth alone.
      - Violating the consent or physician rules is a first-degree misdemeanor for the provider.

      Hormone therapy for adults is still legal. **If you have little money**, in rough order:
      1. Look for a **community health center or HIV/LGBTQ clinic** with a physician who prescribes hormones (for example Hope & Help in the Orlando area; see the city pages). Sliding-scale fees are common. Use findahealthcenter.hrsa.gov.
      2. **Point of Pride's HRT Access Fund** pays for 18 months of telehealth hormone care (applications in May); check first that the partner provider can serve Florida given the in-person rule.
      3. For medications, generic estradiol and spironolactone are inexpensive with discount cards (GoodRx) or Cost Plus Drugs. Testosterone prices vary more.
    es: |
      Según SB 254 (2023), sección 456.52:
      - Solo un **médico** (MD o DO) puede recetar hormonas o bloqueadores o hacer cirugía de transición. Las enfermeras practicantes y asistentes médicos no pueden.
      - El consentimiento debe ser por escrito en un formulario de la Junta de Medicina y darse con el **médico físicamente presente** en la misma sala. No puedes iniciar la atención solo por telesalud.
      - Violar estas reglas es un delito menor de primer grado para el proveedor.

      La terapia hormonal para adultos sigue siendo legal. **Si tienes poco dinero**:
      1. Busca un **centro de salud comunitario o clínica de VIH/LGBTQ** con un médico que recete hormonas (por ejemplo Hope & Help en Orlando). Usa findahealthcenter.hrsa.gov.
      2. El **Fondo de Acceso a TRH de Point of Pride** paga 18 meses de atención por telesalud (solicitudes en mayo); confirma primero que el proveedor pueda atender en Florida.
      3. El estradiol y la espironolactona genéricos son baratos con cupones (GoodRx) o Cost Plus Drugs.
  sources: [fs-456-52, hope-help, hrsa, pop]
minor_care:
  status: prohibited
  detail:
    en: |
      Section 456.52(1) prohibits puberty blockers, hormones, and surgery for gender transition for anyone **under 18**. The only exception is for minors who began treatment before May 17, 2023, who may continue under Board of Medicine rules requiring parental consent. A practitioner who willfully participates in a violation commits a **third-degree felony**. SB 254 also gives Florida courts temporary emergency jurisdiction in custody matters involving this care.

      A federal judge declared the ban unconstitutional in June 2024 (Doe v. Ladapo), but the Eleventh Circuit stayed that ruling in August 2024, so **the ban is in effect**. Families seeking care travel to states without bans; the Campaign for Southern Equality's Trans Youth Emergency Project helps with navigation and costs.
    es: |
      La sección 456.52(1) prohíbe bloqueadores de pubertad, hormonas y cirugía de transición para **menores de 18 años**. La única excepción es para menores que empezaron antes del 17 de mayo de 2023. Un profesional que participe a sabiendas comete un **delito grave de tercer grado**.

      Un juez federal declaró inconstitucional la prohibición en junio de 2024 (Doe v. Ladapo), pero el Undécimo Circuito suspendió ese fallo en agosto de 2024, así que **la prohibición está vigente**. El Proyecto de Emergencia para Jóvenes Trans de Campaign for Southern Equality ayuda a las familias que viajan a otros estados.
  sources: [fs-456-52, nclr-doe, tyep]
medicaid:
  program_name: Florida Medicaid (Statewide Medicaid Managed Care)
  covers_hrt: "no"
  covers_surgery: "no"
  detail:
    en: |
      AHCA Rule 59G-1.050(7) (effective August 21, 2022) says Florida Medicaid does not cover puberty blockers, hormones and hormone antagonists, sex reassignment surgeries, or any other procedures that alter sex characteristics for the treatment of gender dysphoria, and declares them not medically necessary. Section 286.311 (SB 254) also bars Medicaid managed care plans, the state employee health plan, and other public entities from spending state funds on this care.

      A federal court struck down the rule in June 2023 (Dekker v. Weida), but the state appealed and the case is still pending; the state continues to apply the exclusion. Medicaid still covers other care (primary care, labs, mental health) for eligible people. Florida has not expanded Medicaid, so most adults without children or a disability do not qualify. If you are denied a gender-affirming service, the Florida Health Justice Project may be able to help.
    es: |
      La Regla 59G-1.050(7) de AHCA (vigente desde el 21 de agosto de 2022) dice que Medicaid de Florida no cubre bloqueadores de pubertad, hormonas, cirugías de reasignación ni otros procedimientos para tratar la disforia de género. La sección 286.311 también prohíbe a los planes de Medicaid y al plan de empleados estatales gastar fondos estatales en esta atención.

      Un tribunal federal anuló la regla en junio de 2023 (Dekker v. Weida), pero el estado apeló y el caso sigue pendiente; el estado sigue aplicando la exclusión. Medicaid cubre otra atención (primaria, laboratorios, salud mental). Florida no amplió Medicaid, así que la mayoría de los adultos sin hijos ni discapacidad no califican.
  how_to_apply_url: https://ahca.myflorida.com/medicaid
  sources: [rule-59g, fs-286-311, lambda-dekker, wusf-dekker, fhjp]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: >-
      Florida law does not prohibit private health plans from excluding gender-affirming care. Plans bought on
      HealthCare.gov and employer plans vary: read the exclusions list in your plan documents. The state employee
      plan and other state-funded plans may not pay for this care (section 286.311). If a plan denies a claim, appeal
      with the plan first; unresolved problems with state-regulated insurers can be reported to the Department of
      Financial Services. Self-funded employer plans are federally regulated.
    es: >-
      La ley de Florida no prohíbe que los planes privados excluyan la atención de afirmación de género. Revisa las
      exclusiones de tu plan. El plan de empleados estatales no puede pagar esta atención. Si niegan un reclamo, apela
      primero con el plan; luego puedes presentar una queja ante el Departamento de Servicios Financieros.
  complaint_url: https://www.myfloridacfo.com/division/consumers/needourhelp
  sources: [fs-286-311, dfs-help, map-health]
