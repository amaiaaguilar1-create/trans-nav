  notes: >-
    Court details from the King County District Court name-change page and the Superior Court clerk FAQ (2026-09-24).
    Org details read on their own sites for QLaw Foundation, Gender Justice League, Ingersoll Gender Center, Lavender
    Rights Project, Seattle Children's, and Neighborcare. Neighborcare's site does not list gender-affirming hormone
    therapy; it is included as a sliding-scale FQHC only. Could NOT load (marked unverified): Country Doctor Community
    Health Centers (connection refused on countrydoctor.org), UW Medicine (403), Gay City (403). Seattle Counseling
    Service and Lambert House homepages resolved (HTTP 200) but their service details were not read. The Public Health
    Seattle & King County Sexual Health Clinic page URL tried returned 404, so it is not listed; reviewer should add it.
intro:
  en: >-
    Seattle has many trans-led organizations and free legal clinics. File a public name change at any King County
    District Court location, or a sealed (private) gender-related name change at King County Superior Court. Free help
    with the paperwork is available from QLaw Foundation and Gender Justice League.
  es: >-
    Seattle tiene muchas organizaciones dirigidas por personas trans y clínicas legales gratuitas. Presenta un cambio de
    nombre público en cualquier sede del Tribunal de Distrito del Condado de King, o un cambio sellado (privado)
    relacionado con el género en el Tribunal Superior del Condado de King. QLaw Foundation y Gender Justice League
    ayudan gratis con los trámites.
court:
  name: King County District Court (public name changes) and King County Superior Court (sealed name changes)
  url: https://kingcounty.gov/en/court/district-court/courts-jails-legal-system/name-changes
  filing_fee: 98
  notes:
    en: |
      **District Court (public)**: $98 filing fee plus a $203.50 recording fee paid to the King County Recorder's Office; certified copies $5. File in person at any location, by mail, or through the e-filing portal. Hearings at seven courthouses, mostly at 1:00 pm; paying in cash can get a hearing sooner. Bring valid photo ID.

      **Superior Court (sealed, for gender identity)**: $290 filing fee per the clerk's FAQ; the file is sealed and not sent to the recorder. Schedule the hearing through the Ex Parte and Probate Department. Clerk's office: 206-296-9300.

      Both fees can be waived with a Motion and Declaration for Waiver of Civil Fees and Surcharges.
    es: |
      **Tribunal de Distrito (público)**: $98 de presentación más $203.50 de registro pagados a la Oficina del Registrador; copias certificadas $5. Presenta en persona, por correo o en el portal electrónico. Lleva identificación con foto.

      **Tribunal Superior (sellado, por identidad de género)**: $290 según las preguntas frecuentes del secretario; el expediente se sella. La audiencia se programa con el Departamento Ex Parte y Sucesiones. Oficina del secretario: 206-296-9300.

      Ambas tarifas se pueden exentar.
  sources: [kcdc-name-change, kc-clerk-faq]
