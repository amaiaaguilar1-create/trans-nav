status_summary:
  en: >-
    Gender-affirming care is legal and protected for adults and minors in Washington. Apple Health (Medicaid) covers
    hormones, puberty blockers, surgery, and related care; state-regulated insurance may not exclude it; and a shield law
    protects patients, families, and providers from other states' actions. A new federal rule stops federal Medicaid money
    for some care for minors from October 13, 2026; the state says it will use state funds to keep covering it.
  es: >-
    La atención de afirmación de género es legal y está protegida para adultos y menores en Washington. Apple Health
    (Medicaid) cubre hormonas, bloqueadores de pubertad, cirugía y atención relacionada; los seguros regulados por el
    estado no pueden excluirla; y una ley escudo protege a pacientes, familias y proveedores de acciones de otros estados.
    Una nueva regla federal elimina el dinero federal de Medicaid para parte de la atención a menores desde el 13 de
    octubre de 2026; el estado dice que usará fondos estatales para seguir cubriéndola.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. Many community clinics and Planned Parenthood health centers prescribe hormones on an **informed consent** basis (no therapist letter). Telehealth prescribing is legal statewide. RCW 18.130.450 says providing medically necessary gender-affirming care within a provider's scope of practice is not unprofessional conduct.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **Apple Health** at wahealthplanfinder.org. It covers hormones, labs, and surgery.
      2. Go to a **community health center** (FQHC). They charge on a sliding scale and must see you regardless of ability to pay. Find one at findahealthcenter.hrsa.gov and ask whether they offer gender-affirming hormone therapy.
      3. **Planned Parenthood** health centers offer sliding-scale hormone care in several Washington cities.
      4. **Point of Pride's HRT Access Fund** pays for telehealth hormone care (applications open once a year).
      5. Ingersoll Gender Center keeps a directory of trans-friendly providers.
    es: |
      Sin restricciones estatales. Muchas clínicas comunitarias y centros de Planned Parenthood recetan hormonas por **consentimiento informado** (sin carta de terapeuta). La telesalud es legal en todo el estado. RCW 18.130.450 dice que brindar atención de afirmación de género médicamente necesaria no es conducta no profesional.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Apple Health** en wahealthplanfinder.org. Cubre hormonas, laboratorios y cirugía.
      2. Acude a un **centro de salud comunitario**. Cobran en escala móvil y deben atenderte sin importar tu capacidad de pago. Búscalo en findahealthcenter.hrsa.gov.
      3. Los centros de **Planned Parenthood** ofrecen atención hormonal en escala móvil en varias ciudades.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud.
      5. Ingersoll Gender Center tiene un directorio de proveedores.
  sources: [hca-faq, rcw-18-130-450, hrsa, pop-hrt, ingersoll]
minor_care:
  status: available
  detail:
    en: |
      Legal. Care for minors follows clinical guidelines and requires a parent's or guardian's consent; Seattle Children's Gender Clinic offers medical care to adolescents who have started puberty, with parental consent (206-987-2028). Washington's shield law (chapter 7.115 RCW, HB 1469, 2023) bars state agencies and courts from cooperating with other states' investigations, subpoenas, or lawsuits over care that is lawful in Washington, lets people sue over such interference, and protects parents and providers who help a young person get care.

      **Federal change:** a Centers for Medicare & Medicaid Services rule prohibits using federal Medicaid and CHIP money for certain gender-affirming care for minors starting **October 13, 2026**. The Health Care Authority says that if federal funds are unavailable it will use state funds to keep covering medically necessary care for eligible Apple Health clients, and will issue detailed guidance. HCA also notes that state law may not override federal enforcement in every case; families with legal concerns should talk to a lawyer.
    es: |
      Legal. La atención a menores sigue guías clínicas y requiere consentimiento de un padre o tutor; la Gender Clinic de Seattle Children's atiende a adolescentes que ya iniciaron la pubertad, con consentimiento de los padres (206-987-2028). La ley escudo de Washington (capítulo 7.115 RCW, HB 1469, 2023) impide que agencias y tribunales estatales cooperen con investigaciones, citaciones o demandas de otros estados sobre atención legal en Washington, y protege a padres y proveedores.

      **Cambio federal:** una regla de los Centros de Servicios de Medicare y Medicaid prohíbe usar dinero federal de Medicaid y CHIP para cierta atención de afirmación de género a menores desde el **13 de octubre de 2026**. La Autoridad de Atención Médica dice que, si no hay fondos federales, usará fondos estatales para seguir cubriendo la atención médicamente necesaria para clientes elegibles de Apple Health. HCA también advierte que la ley estatal quizá no anule toda acción federal; las familias con dudas legales deben consultar a un abogado.
  sources: [seattle-childrens, rcw-7-115, hb1469, hca-transhealth, hca-faq]
medicaid:
  program_name: Apple Health (Washington Medicaid)
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Apple Health's Transhealth program covers hormone therapy, puberty suppression, speech and voice therapy, behavioral health, labs, surgical consults, gender-affirming surgery and related hospital care, and medically necessary hair removal. Hormones and routine care go through your managed care plan; surgery and hair removal need prior authorization through HCA. For most surgeries HCA generally expects 12 months of hormone therapy and 12 months living in your gender (with exceptions, including for chest surgery), and letters from your providers. By law (RCW 74.09.675) HCA and its plans cannot apply blanket exclusions, and a provider experienced in gender-affirming care must review any denial.

      **Apply** at Washington Healthplanfinder (wahealthplanfinder.org). Questions about gender-affirming coverage can go to applehealth.transhealth@hca.wa.gov.
    es: |
      El programa Transhealth de Apple Health cubre terapia hormonal, supresión de la pubertad, terapia de voz, salud conductual, laboratorios, consultas quirúrgicas, cirugía de afirmación de género y hospitalización relacionada, y depilación médicamente necesaria. Las hormonas y la atención de rutina van por tu plan administrado; la cirugía y la depilación requieren autorización previa de HCA. Por ley (RCW 74.09.675) HCA y sus planes no pueden aplicar exclusiones generales, y un proveedor con experiencia debe revisar cualquier negación.

      **Solicita** en Washington Healthplanfinder (wahealthplanfinder.org).
  how_to_apply_url: https://www.wahealthplanfinder.org/
  sources: [hca-transhealth, hca-faq, rcw-74-09-675, wac-182-531-1675]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      RCW 48.43.0128 bars state-regulated health plans from denying or limiting medically necessary gender-affirming treatment, and from calling procedures like facial feminization, tracheal shave, electrolysis, or chest surgery "cosmetic" as a blanket exclusion. A denial must be reviewed by a provider experienced in gender-affirming care. State employee and school employee plans (PEBB/SEBB) have the same protection (RCW 41.05.017). If your plan denies care, appeal to the plan, then contact the Office of the Insurance Commissioner's consumer advocates (800-562-6900). Self-funded employer plans are federally regulated and may not be covered; the Trans Health Project has appeal templates.
    es: |
      RCW 48.43.0128 prohíbe a los planes regulados por el estado negar o limitar el tratamiento de afirmación de género médicamente necesario, o excluir como "cosmético" procedimientos como feminización facial, reducción de tráquea, electrólisis o cirugía de pecho. Una negación debe revisarla un proveedor con experiencia. Si tu plan niega la atención, apela ante el plan y luego contacta a la Oficina del Comisionado de Seguros (800-562-6900).
  complaint_url: https://www.insurance.wa.gov/file-complaint-or-check-your-complaint-status
  sources: [rcw-48-43-0128, hca-faq, oic-complaint, thp]
