  notes: >-
    Read 2026-09-24: DOL gender designation page, form DLE-520-043 (R/11/19) PDF, DOL name/address change page, DOL
    licensing fees page. Reviewer: (1) confirm the $20 fee for a revised ID card (the fee page lists $20 for replacing a
