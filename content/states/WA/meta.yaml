overview:
  en: >-
    Washington is one of the most protective states for trans people. There is no newspaper publication for name
    changes, and a name change related to gender identity can be filed in Superior Court and sealed automatically.
    Driver's licenses and birth certificates offer M, F, or X on your own signed statement, with no doctor's letter or
    court order. Apple Health (Medicaid) and state-regulated insurance must cover medically necessary gender-affirming
    care, and a shield law (chapter 7.115 RCW, HB 1469) protects patients and providers from other states' actions.
    Federal documents (passport, Social Security) are the exception: their sex fields are currently frozen nationwide.
  es: >-
    Washington es uno de los estados que más protege a las personas trans. Los cambios de nombre no se publican en el
    periódico, y un cambio de nombre relacionado con la identidad de género puede presentarse en el Tribunal Superior y
    sellarse automáticamente. Las licencias de conducir y las actas de nacimiento ofrecen M, F o X con tu propia
    declaración firmada, sin carta médica ni orden judicial. Apple Health (Medicaid) y los seguros regulados por el
    estado deben cubrir la atención de afirmación de género médicamente necesaria, y una ley escudo (capítulo 7.115
    RCW, HB 1469) protege a pacientes y proveedores de acciones de otros estados. Los documentos federales (pasaporte,
    Seguro Social) son la excepción: sus campos de sexo están congelados a nivel nacional.
