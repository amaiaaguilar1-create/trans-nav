overview:
  en: >-
    Wyoming is a restrictive state for trans people. A 2025 law (HB 32, W.S. 8-1-110) defines "sex" in every
    Wyoming law and rule as biological sex at birth and tells state agencies that keep vital statistics to record
    people as male or female by sex at birth, so changing the sex marker on a Wyoming birth certificate is
    effectively no longer possible and the driver's license policy is unclear. Name changes are allowed but require
    four weeks of newspaper publication for most adults. Gender-affirming medical care is banned for people under 18
    (since July 1, 2024), Wyoming Medicaid does not cover transition surgery, and there is no shield law. Adults can
    still get hormone therapy, mostly through telehealth and a few clinics.
  es: >-
    Wyoming es un estado restrictivo para las personas trans. Una ley de 2025 (HB 32, W.S. 8-1-110) define "sexo" en
    todas las leyes y reglamentos de Wyoming como el sexo biológico al nacer y ordena a las agencias que llevan
    estadísticas vitales registrar a las personas como hombre o mujer según el sexo al nacer, por lo que cambiar el
    marcador de sexo en un acta de nacimiento de Wyoming ya no es posible en la práctica y la política para la
    licencia de conducir no está clara. Los cambios de nombre están permitidos, pero la mayoría de los adultos deben
    publicar un aviso en un periódico durante cuatro semanas. La atención médica de afirmación de género está
    prohibida para menores de 18 años (desde el 1 de julio de 2024), Medicaid de Wyoming no cubre cirugías de
    transición y no hay ley escudo. Los adultos todavía pueden recibir terapia hormonal, sobre todo por telesalud y
    en algunas clínicas.
