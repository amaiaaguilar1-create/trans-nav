    title:
      en: Change of name; petition in district court of county of residence; six-month state residency; notice by publication
    url: https://wyoleg.gov/statutes/compress/title01.pdf
  - cite: Wyo. Stat. § 5-3-206(a)(i)
    title:
      en: District court civil filing fee ($160)
    url: https://wyoleg.gov/statutes/compress/title05.pdf
