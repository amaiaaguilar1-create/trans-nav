      en: Statewide LGBTQ+ organization in Cheyenne with a guide to Wyoming name change forms; email kota@wyomingequality.org for help with the process. 307-222-8178.
      es: Organización estatal LGBTQ+ en Cheyenne con una guía de formularios de cambio de nombre; escribe a kota@wyomingequality.org para recibir ayuda. 307-222-8178.
    url: https://www.wyomingequality.org/wehap_document-changes
    phone: "307-222-8178"
    cost: free
    verification: org_website
