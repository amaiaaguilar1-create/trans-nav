sources:
  - id: ws-1-25
    url: https://wyoleg.gov/statutes/compress/title01.pdf
    title: Wyoming Statutes Title 1, Chapter 25, Change of Name (W.S. 1-25-101 to 1-25-104)
    publisher: Wyoming Legislature
    kind: statute
    accessed: "2026-09-24"
    quote: A person petitioning for a change of name shall have been a bona fide resident of Wyoming for at least six (6) months immediately preceding filing the petition.
  - id: ws-5-3-206
    url: https://wyoleg.gov/statutes/compress/title05.pdf
