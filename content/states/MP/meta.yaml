  confidence: medium
  es_status: machine_draft
  notes: >-
    New law: Public Law 24-38 (HB 24-10, signed August 27, 2026) created the CNMI's first general name change statute,
    adding a new Chapter 12 to Title 8, Division 1 of the Commonwealth Code. Its codified section numbers were not yet
    shown on cnmilaw.gov. The birth certificate sex marker rule is 1 CMC § 26018(d), which requires a Superior Court order
    that the sex was changed "by surgical procedure." MAP's MP profile (2026-09-24) shows no youth care ban, no shield
    law, and no insurance nondiscrimination law. The BMV (dps.gov.mp) returned HTTP 401. The Micronesian Legal Services
    Corporation site (mlsc.org) requires JavaScript and could not be verified, so it is not listed.
overview:
  en: >-
    Since August 2026, a new CNMI law lets any resident petition the Superior Court for a name change. The court must
    grant it unless there is substantial evidence of fraud, and the judge can waive newspaper publication for good cause.
    Changing the sex marker is harder. A CNMI birth certificate can be amended only with a Superior Court order finding
    that your sex was changed by surgical procedure. The Bureau of Motor Vehicles has reportedly required a court order
    too. No law bans gender-affirming care, but local access is very limited.
  es: >-
    Desde agosto de 2026, una nueva ley de la CNMI permite a cualquier residente pedir al Tribunal Superior un cambio de
    nombre. El tribunal debe concederlo salvo que haya evidencia sustancial de fraude, y el juez puede eximir la
    publicación en el periódico por causa justificada. Cambiar el marcador de sexo es más difícil. El acta de nacimiento
    de la CNMI solo se puede enmendar con una orden del Tribunal Superior que determine que tu sexo se cambió mediante
    procedimiento quirúrgico. Según se informa, la Oficina de Vehículos también ha exigido una orden judicial. Ninguna ley
    prohíbe la atención de afirmación de género, pero el acceso local es muy limitado.
