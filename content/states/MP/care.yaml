jurisdiction: MP
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: low
  es_status: machine_draft
  notes: >-
    No CNMI law on gender-affirming care was found. MAP's MP profile (checked 2026-09-24) shows no youth care ban, no
    shield law, no Medicaid policy, and no insurance nondiscrimination law. The Commonwealth Medicaid Agency's site
    (medicaid.cnmi.gov) shows only a provider directory, and its main site link could not be found, so no
    how_to_apply_url is given. CHCC's Behavioral Health page loaded but lists no services in plain text. No local
    hormone prescriber could be verified. Plume's map lists no territories.
status_summary:
  en: >-
    Gender-affirming care is legal in the Northern Mariana Islands for adults and minors, and no CNMI law bans it. Local
    access is very limited, Medicaid coverage is unclear, and the main telehealth services do not serve the CNMI.
  es: >-
    La atención de afirmación de género es legal en las Islas Marianas del Norte para adultos y menores, y ninguna ley de
    la CNMI la prohíbe. El acceso local es muy limitado, la cobertura de Medicaid no está clara y los principales
    servicios de telesalud no atienden la CNMI.
adult_care:
  status: available
  detail:
    en: |
      No law restricts adult care. Options:
      1. Ask a primary care provider at the Commonwealth Healthcare Corporation (CHCC) or a community health center (HRSA finder) to prescribe or continue hormones.
      2. If you travel to Guam, Hawaii, or the mainland, see what care is available there.
      3. Apply to national funds (Point of Pride, Genderbands). Check whether they accept CNMI residents.
    es: |
      Ninguna ley restringe la atención para adultos. Opciones:
      1. Pide a un proveedor de atención primaria de la Commonwealth Healthcare Corporation (CHCC) o de un centro de salud comunitario (buscador de HRSA) que recete o continúe tus hormonas.
      2. Si viajas a Guam, Hawái o el continente, averigua qué atención hay allí.
      3. Solicita fondos nacionales (Point of Pride, Genderbands). Verifica si aceptan residentes de la CNMI.
  sources: [map-mp, hrsa, chcc]
minor_care:
  status: available
  detail:
    en: No CNMI law bans gender-affirming care for minors. There is no shield law. Parental consent is required (see also the CNMI Medical Consent Act, 3 CMC ch. 11).
    es: Ninguna ley de la CNMI prohíbe la atención de afirmación de género para menores. No hay ley escudo. Se requiere consentimiento de los padres (ver también la Ley de Consentimiento Médico de la CNMI, 3 CMC cap. 11).
  sources: [map-mp, cmc-t3-health]
medicaid:
  program_name: CNMI Medicaid (Commonwealth Medicaid Agency)
  covers_hrt: unclear
  covers_surgery: unclear
  detail:
    en: The Commonwealth Medicaid Agency publishes no policy on gender-affirming care. Ask for a written coverage decision and appeal any denial.
    es: La Commonwealth Medicaid Agency no publica una política sobre atención de afirmación de género. Pide una decisión de cobertura por escrito y apela cualquier negación.
  sources: [cnmi-medicaid, map-mp]
private_insurance:
  nondiscrimination_protection: false
  detail:
    en: No CNMI law bars insurers from excluding gender-affirming care.
    es: Ninguna ley de la CNMI prohíbe a las aseguradoras excluir la atención de afirmación de género.
  sources: [map-mp]
