  confidence: medium
  es_status: machine_draft
  notes: >-
    Climate ratings are based on the D.C. Code (name change § 16-2501 et seq.; birth records § 7-231.22; shield law
    § 2-1461.01 et seq.), the DMV gender self-designation form, and the DISB 2014 insurance bulletin, all read
    2026-09-24. Cross-checked against MAP's DC profile, which agrees. Care is rated protective on the law, but note that
    Children's National Hospital stopped prescribing gender-affirming medications on August 30, 2025, citing legal
    and regulatory risk. That was a provider decision, not a DC law. Reviewer: Congress has final authority over DC
    law (Home Rule Act) and can override Council acts or attach riders to DC appropriations. I could not
    confirm (WebSearch was unavailable) whether any 2025-2026 congressional action or federal rule has changed the DC
    laws cited here. Please check before marking this reviewed. The DC Center for the LGBT Community site blocked
    automated access (Cloudflare), so that entry is community_reported.
overview:
  en: >-
    DC's own laws protect trans people. You can choose M, F, or X on a DC driver's license or ID just by signing a form.
    There is no newspaper publication for name changes. A DC birth certificate can be reissued with your gender and new
    name if you send a short statement from a licensed provider. Insurers may not exclude transition care, and a 2022
    shield law keeps DC government out of other states' cases against gender-affirming care. Two drawbacks: to change
    your name you must mail notice to your creditors and attend a short remote hearing, and DC's main children's
    hospital stopped prescribing gender-affirming medications in 2025 because of federal pressure.
  es: >-
    Las leyes del Distrito protegen a las personas trans. Puedes elegir M, F o X en tu licencia o identificación de DC
    con solo firmar un formulario. El cambio de nombre no requiere publicación en periódico. Tu acta de nacimiento de DC
    se puede volver a emitir con tu género y tu nuevo nombre si envías una declaración breve de un proveedor de salud
    con licencia. Las aseguradoras no pueden excluir la atención de transición, y una ley escudo de 2022 impide que el
    gobierno de DC colabore con casos de otros estados contra la atención de afirmación de género. Dos desventajas: para
    cambiar tu nombre debes notificar por correo a tus acreedores y asistir a una breve audiencia remota, y el principal
    hospital infantil de DC dejó de recetar medicamentos de afirmación de género en 2025 por presión federal.
