jurisdiction: DC
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Legal framework read 2026-09-24: shield law (D.C. Law 24-257, D.C. Code § 2-1461.01 et seq.), insurance
    nondiscrimination (D.C. Code § 31-2231.11(c), with DISB Bulletin 13-IB-01-30/15 revised Feb 27, 2014; the
    bulletin PDF is a scanned image that I read by OCR). Open items: (1) MEDICAID: I could not load any DHCF page on
    gender-affirming coverage (DHCF search returns "Access denied"). Coverage of hormones and surgery is based on MAP
    ("Medicaid policy explicitly includes coverage") and Whitman-Walker's surgery navigation page, which describes DC
    Medicaid's letter requirements. Find the DHCF policy or transmittal and cite it. (2) MINORS: no DC law restricts
    care for minors, so minor_care is "available". But Children's National Hospital, the main pediatric gender clinic
    in the District, stopped prescribing gender-affirming medications on August 30, 2025, "in light of escalating
    legal and regulatory risks" (its own page). Whitman-Walker's FAQ still describes a youth pathway (ages 10-24, with
    parental consent and a mental health assessment). Confirm it is still active in 2026. (3) FEDERAL: WebSearch was
    unavailable, so I could not check for 2025-2026 federal rules (for example CMS conditions of participation for
    hospitals), congressional riders, or disapproval resolutions aimed at DC's shield law or care for minors. Congress
    can override DC law. Check before review. (4) Planned Parenthood of Metropolitan Washington lists gender-affirming
    care at its DC center; the minimum age was not stated. (5) HIPS lists "Hormones" among clinic services; I could not
    confirm eligibility. (6) La Clínica del Pueblo, SMYAL, and the DC Center sites blocked automated access, so those
    entries are community_reported.
status_summary:
  en: >-
    Gender-affirming care is legal in DC for adults and minors, and a 2022 shield law keeps DC government from helping
    other states punish patients or providers. DC Medicaid covers hormones and surgery, and insurers regulated by DC
    may not exclude transition care. Care for minors has become harder to find: Children's National Hospital stopped
    prescribing gender-affirming medications in August 2025 because of federal legal risk.
  es: >-
    La atención de afirmación de género es legal en DC para adultos y menores, y una ley escudo de 2022 impide que el
    gobierno de DC ayude a otros estados a castigar a pacientes o proveedores. Medicaid de DC cubre hormonas y cirugía,
    y las aseguradoras reguladas por DC no pueden excluir la atención de transición. Para menores es más difícil
    encontrar atención: el Children's National Hospital dejó de recetar medicamentos de afirmación de género en agosto
    de 2025 por riesgo legal federal.
adult_care:
  status: available
  detail:
    en: |
      No DC restriction. Whitman-Walker Health follows an **informed consent** model for adults 18 and older, so no therapist letter is needed to start hormones. Planned Parenthood's DC center and HIPS also list hormone care. Telehealth prescribing is legal.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **DC Medicaid**. It covers hormones, labs, and surgery.
      2. Go to **Whitman-Walker** or another community health center. They charge on a sliding scale and help with insurance enrollment. Find others at findahealthcenter.hrsa.gov.
      3. **Point of Pride's HRT Access Fund** pays for telehealth hormone care (applications each May).
    es: |
      Sin restricciones en DC. Whitman-Walker Health sigue un modelo de **consentimiento informado** para adultos de 18 años o más, así que no necesitas carta de terapeuta para empezar hormonas. El centro de Planned Parenthood en DC y HIPS también ofrecen atención hormonal. La telesalud es legal.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **Medicaid de DC**. Cubre hormonas, laboratorios y cirugía.
      2. Acude a **Whitman-Walker** u otro centro de salud comunitario, que cobran en escala móvil. Busca otros en findahealthcenter.hrsa.gov.
      3. El **Fondo de Acceso a TRH de Point of Pride** paga atención hormonal por telesalud (solicitudes cada mayo).
  sources: [ww-trans-care, pp-dc, hips, hrsa, pop-hrt, map-medicaid]
minor_care:
  status: available
  detail:
    en: |
      **Legal in DC.** No DC law bans or limits gender-affirming care for minors, and the Human Rights Sanctuary Amendment Act of 2022 bars DC agencies from helping other states investigate or punish anyone for providing, receiving, or helping with gender-affirming care. DC also lets people sue anyone who wins a judgment against them elsewhere over this care.

      **Access is limited in practice.** Children's National Hospital stopped prescribing gender-affirming medications (puberty blockers and hormones) on August 30, 2025, citing escalating legal and regulatory risks. Its mental health and support services continue. Whitman-Walker serves young people ages 10 to 24. For people under 18, it requires parental consent and a mental health assessment before starting medication. Call ahead to confirm current availability.
    es: |
      **Legal en DC.** Ninguna ley de DC prohíbe ni limita la atención de afirmación de género para menores, y la Ley de Santuario de Derechos Humanos de 2022 impide que las agencias de DC ayuden a otros estados a investigar o castigar a nadie por brindar, recibir o apoyar esta atención.

      **En la práctica el acceso es limitado.** El Children's National Hospital dejó de recetar medicamentos de afirmación de género el 30 de agosto de 2025, citando riesgos legales y regulatorios crecientes. Sus servicios de salud mental y apoyo continúan. Whitman-Walker atiende a jóvenes de 10 a 24 años. Para menores de 18 requiere consentimiento de los padres y una evaluación de salud mental antes de empezar medicamentos. Llama antes para confirmar.
  sources: [shield-law, childrens-national, ww-trans-care]
medicaid:
  program_name: DC Medicaid
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: >-
      DC Medicaid covers gender-affirming hormones and surgery. For surgery above the waist, Whitman-Walker reports that
      DC Medicaid requires one letter from a behavioral health clinician and one from your medical provider. For
      genital surgery, it requires letters from two independent behavioral health clinicians. Prior authorization is
      required. Apply through District Direct or at an Income Maintenance Administration (IMA) service center
      ((202) 727-5355 to find one).
    es: >-
      Medicaid de DC cubre hormonas y cirugía de afirmación de género. Para cirugía por encima de la cintura, según
      Whitman-Walker, se necesita una carta de un clínico de salud conductual y otra de tu proveedor médico. Para
      cirugía genital se necesitan cartas de dos clínicos de salud conductual independientes. Se requiere autorización
      previa. Solicita en District Direct o en un centro de servicio (llama al (202) 727-5355).
  how_to_apply_url: https://districtdirect.dc.gov/
  sources: [map-medicaid, ww-trans-care, dhcf-medicaid]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      D.C. Code § 31-2231.11(c) bars insurers from limiting coverage because of gender identity or expression. The Department of Insurance, Securities and Banking (DISB) says exclusions like "sex change" or "sex transformation" are prohibited, and that medically necessary treatment for gender dysphoria, **including surgery**, is a covered benefit. Insurers must judge medical necessity using the WPATH Standards of Care (Bulletin 13-IB-01-30/15, revised February 27, 2014).

      This covers plans sold or delivered in DC (individual, small group, large group). It does **not** cover self-funded employer (ERISA) plans or federal employee plans. If your DC-regulated plan denies care, appeal and file a complaint with DISB.
    es: |
      El Código de DC § 31-2231.11(c) prohíbe a las aseguradoras limitar la cobertura por identidad o expresión de género. El Departamento de Seguros, Valores y Banca (DISB) dice que las exclusiones de "cambio de sexo" están prohibidas y que el tratamiento médicamente necesario de la disforia de género, **incluida la cirugía**, es un beneficio cubierto.

      Esto aplica a planes vendidos o entregados en DC. **No** aplica a planes de empleadores autofinanciados (ERISA) ni a planes federales. Si tu plan regulado por DC niega la atención, apela y presenta una queja ante DISB.
  complaint_url: https://disb.dc.gov/complaints
  sources: [disb-bulletin, dc-code-31-2231-11, disb-complaints]
