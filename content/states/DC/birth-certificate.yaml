    publisher: Council of the District of Columbia
    kind: statute
    accessed: "2026-09-24"
    quote: >-
      A new record of live birth shall ... Not be marked "amended" ... The original record of live birth, along with
      any documents submitted pursuant to this section, shall be sealed
  - id: dc-code-16-2503
