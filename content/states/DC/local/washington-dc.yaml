jurisdiction: DC
slug: washington-dc
name: Washington, DC
area:
  en: The District of Columbia. Many of these services also serve residents of nearby Maryland and Virginia.
  es: El Distrito de Columbia. Muchos de estos servicios también atienden a residentes de Maryland y Virginia cercanos.
review:
  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Court details come from the DC Courts name change pages (updated 02/12/2026). Whitman-Walker, HIPS, Planned
    Parenthood, Legal Aid DC, and NLSP were confirmed on their own sites 2026-09-24. SMYAL (Sucuri JS challenge), the
    DC Center (Cloudflare), La Clínica del Pueblo, and TransLAW/jointla.org (captcha) blocked automated access, so they
    are community_reported. Confirm each still operates and its current programs. Casa Ruby is deliberately omitted
    (closed). Legal Aid DC and NLSP do not list name changes as a practice area; they are included for Medicaid and
    public-benefits denials.
intro:
  en: >-
    DC has one courthouse and one set of rules for the whole District. Name changes are filed at DC Superior Court
    (Moultrie Courthouse) and decided at a remote hearing. Whitman-Walker Health anchors trans care and legal help,
    with harm reduction, youth, and Spanish-language programs around it.
  es: >-
    DC tiene un solo tribunal y las mismas reglas para todo el Distrito. Los cambios de nombre se presentan en el
    Tribunal Superior de DC (Moultrie Courthouse) y se deciden en una audiencia remota. Whitman-Walker Health es el
    centro principal de atención trans y ayuda legal, junto con programas de reducción de daños, juventud y servicios
    en español.
court:
  name: Superior Court of the District of Columbia, Civil Actions Branch (21 and older); Family Court Central Intake Center (under 21)
  url: https://www.dccourts.gov/superior-court/superior-court-divisions/civil-division/name-changes-gender-marker-changes-and-vital-records-amendments
  self_help_url: https://www.dccourts.gov/get-legal-help
  filing_fee: 60
  notes:
    en: >-
      Moultrie Courthouse, 500 Indiana Avenue NW, Room 5000, Washington, DC 20001. Phone 202-879-1133. Open Monday to
      Friday 8:30 am to 5 pm and Saturday 9 am to noon. There is an after-hours filing box in the lobby. Hearings are held
      by Webex.
    es: >-
      Moultrie Courthouse, 500 Indiana Avenue NW, Sala 5000, Washington, DC 20001. Teléfono 202-879-1133. Lunes a viernes
      de 8:30 a 5 y sábados de 9 a 12. Hay un buzón de presentación fuera de horario en el vestíbulo. Las audiencias son
      por Webex.
  sources: [court-page, adult-packet]
