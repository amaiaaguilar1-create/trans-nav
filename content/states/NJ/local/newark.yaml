  status: draft
  last_verified: "2026-09-24"
  verified_by: ai-draft
  confidence: medium
  es_status: machine_draft
  notes: >-
    Starter list from org websites and state pages read 2026-09-24. Open items: (1) Essex vicinage page lists
    courthouses but not which building's Civil Division counter takes name change filings; confirm (likely the Hall of
    Records / MLK Justice Building area). (2) Hudson Pride Center street addresses and phone not captured. (3) North
    Hudson Community Action Corporation is an FQHC; whether it prescribes hormones is unverified. (4) Planned
    Parenthood Metropolitan NJ pages returned 403; Newark center address and hormone services not verified. (5) No
    informed-consent HRT clinic inside Newark itself could be confirmed from a primary page; the nearest confirmed
    hospital gender centers are in New Brunswick and Somerville (see care.yaml).
intro:
  en: >-
    North Jersey has the state's densest mix of LGBTQ services: the Newark LGBTQ Community Center, Hudson Pride Center in
    Jersey City and Union City, Hyacinth's HIV and PrEP clinic in Newark, and Garden State Equality's free Name Change
    Project for Bergen, Hudson, and Passaic residents. Name change petitions are filed with the Superior Court in the
    county where you live (for Newark, the Essex vicinage; for Jersey City, Hudson), or online through JEDS.
  es: >-
    El norte de Nueva Jersey tiene la mayor concentración de servicios LGBTQ del estado: el Newark LGBTQ Community
    Center, el Hudson Pride Center en Jersey City y Union City, la clínica de VIH y PrEP de Hyacinth en Newark y el
    Proyecto de Cambio de Nombre gratuito de Garden State Equality para residentes de Bergen, Hudson y Passaic. Las
    peticiones de cambio de nombre se presentan en el Tribunal Superior del condado donde vives (Essex para Newark,
    Hudson para Jersey City) o en línea mediante JEDS.
court:
  name: Superior Court of New Jersey, Essex Vicinage (Law Division, Civil Part)
  url: https://www.njcourts.gov/courts/vicinages/essex
  self_help_url: https://www.njcourts.gov/self-help/name-change
  filing_fee: 250
  notes:
    en: Essex courthouses are on Dr. Martin Luther King Jr. Blvd and West Market Street in Newark; general phone 973-776-9300, weekdays 8:30 am to 4:30 pm. You can skip the counter by filing through JEDS or by mail. Jersey City residents file with the Hudson Vicinage instead. The $250 fee is the same statewide.
    es: Los tribunales de Essex están en Dr. Martin Luther King Jr. Blvd y West Market Street en Newark; teléfono 973-776-9300, de lunes a viernes de 8:30 am a 4:30 pm. Puedes presentar por JEDS o por correo. Los residentes de Jersey City presentan en el condado de Hudson. La tarifa de $250 es igual en todo el estado.
  sources: [essex-vicinage, cn10551]
