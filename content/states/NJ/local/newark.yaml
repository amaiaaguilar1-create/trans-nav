      es: Ayuda legal gratuita para preparar tu petición de cambio de nombre para adultos trans (y menores con consentimiento) en los condados de Bergen, Hudson y Passaic que cumplan límites de ingresos. Ayuda con la exención de tarifas; no paga tarifas. Llama al 973-509-5428.
