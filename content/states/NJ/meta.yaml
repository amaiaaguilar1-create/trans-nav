  notes: >-
    Climate signals from primary sources: Rule 4:72 amendments (no publication, Nov. 2020), Rule 1:38-3 (name change
    records excluded from public access since Sept. 1, 2021), MVC form GENDER1 (self-attestation, M/F/X), N.J.S.A.
    26:8-40.12 as amended by P.L.2018, c.58 (birth certificate self-attestation), P.L.2017, c.176 (insurance and Medicaid
    nondiscrimination), Executive Order 326 (April 2023) and P.L.2026, c.74 (S2260, approved Aug. 20, 2026; bill
    history read from the Legislature's API). MAP lists New Jersey as "2023 EO, 2026 law", consistent with this.
overview:
  en: >-
    New Jersey is one of the most protective states for trans people. Name changes need no newspaper publication and
    the court record is confidential, driver's licenses and birth certificates offer M, F, or X (called
    "undesignated/non-binary" on birth certificates) by signing a self-attestation form, NJ FamilyCare (Medicaid) and
    state-regulated insurance may not discriminate against trans people, and a 2026 law (P.L.2026, c.74) plus Executive
    Order 326 protect patients and providers of gender-affirming care from other states' bans. Federal documents
    (passport, Social Security) are the exception: their sex fields are currently frozen nationwide.
  es: >-
    Nueva Jersey es uno de los estados que más protege a las personas trans. Los cambios de nombre no requieren
    publicación en periódico y el expediente judicial es confidencial, las licencias de conducir y actas de nacimiento
    ofrecen M, F o X (llamado "no designado/no binario" en actas de nacimiento) firmando un formulario de declaración
    propia, NJ FamilyCare (Medicaid) y los seguros regulados por el estado no pueden discriminar a personas trans, y una
    ley de 2026 (P.L.2026, c.74) junto con la Orden Ejecutiva 326 protegen a pacientes y proveedores de atención de
    afirmación de género frente a las prohibiciones de otros estados. Los documentos federales (pasaporte, Seguro
    Social) son la excepción: sus campos de sexo están congelados a nivel nacional.
