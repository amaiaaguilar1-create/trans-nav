status_summary:
  en: >-
    Gender-affirming care is legal and protected for adults and minors in New Jersey. State law bars NJ FamilyCare
    (Medicaid) plans and state-regulated insurers from discriminating against trans people, and a 2026 shield law
    (P.L.2026, c.74) plus Executive Order 326 protect patients and providers from other states' investigations and
    lawsuits. Hospital gender centers, community health centers, and Planned Parenthood offer hormone care.
  es: >-
    La atención de afirmación de género es legal y está protegida para adultos y menores en Nueva Jersey. La ley
    estatal prohíbe que los planes de NJ FamilyCare (Medicaid) y los seguros regulados por el estado discriminen a
    personas trans, y una ley escudo de 2026 (P.L.2026, c.74) junto con la Orden Ejecutiva 326 protegen a pacientes y
    proveedores frente a investigaciones y demandas de otros estados. Centros de género hospitalarios, centros de
    salud comunitarios y Planned Parenthood ofrecen atención hormonal.
adult_care:
  status: available
  detail:
    en: |
      No state restriction. P.L.2026, c.74 (August 20, 2026) writes gender-affirming care into state law as protected "reproductive health care services": New Jersey courts may not apply other states' laws that punish this care, the Governor may not extradite people charged elsewhere for care that is legal here, state courts may not issue subpoenas for out-of-state proceedings targeting it, and licensing boards may not discipline providers for it. Executive Order 326 (2023) already barred state agencies from helping other states' investigations.

      **If you have no insurance and little money**, in rough order:
      1. Apply for **NJ FamilyCare** (free for adults 19 to 64 with income up to 138% of the federal poverty level). See below.
      2. Go to a **community health center** (FQHC). They charge on a sliding scale; find one at findahealthcenter.hrsa.gov and ask whether they prescribe hormones.
      3. **Planned Parenthood** affiliates in New Jersey offer hormone care; call your local center.
      4. **Point of Pride's HRT Access Fund** pays for 18 months of telehealth hormone care (applications each May).
    es: |
      Sin restricciones estatales. P.L.2026, c.74 (20 de agosto de 2026) incluye la atención de afirmación de género en la ley estatal como "servicios de salud reproductiva" protegidos: los tribunales de Nueva Jersey no pueden aplicar leyes de otros estados que castiguen esta atención, el Gobernador no puede extraditar a personas acusadas en otro estado por atención legal aquí, los tribunales no pueden emitir citaciones para procesos de otros estados contra ella y las juntas de licencias no pueden sancionar a proveedores por darla. La Orden Ejecutiva 326 (2023) ya prohibía a las agencias estatales colaborar con investigaciones de otros estados.

      **Si no tienes seguro ni mucho dinero**, en orden aproximado:
      1. Solicita **NJ FamilyCare** (gratis para adultos de 19 a 64 años con ingresos hasta el 138% del nivel federal de pobreza).
      2. Acude a un **centro de salud comunitario** con escala móvil; búscalo en findahealthcenter.hrsa.gov y pregunta si recetan hormonas.
      3. Las afiliadas de **Planned Parenthood** en Nueva Jersey ofrecen atención hormonal.
      4. El **Fondo de Acceso a TRH de Point of Pride** paga 18 meses de atención hormonal por telesalud (solicitudes cada mayo).
  sources: [pl2026-c74, eo-326, njfc-eligibility, hrsa, pop]
minor_care:
  status: available
  detail:
    en: |
      Legal. New Jersey has no ban on gender-affirming care for minors, and the 2026 shield law and Executive Order 326 protect families and providers from other states' actions. Care for minors requires a parent or guardian's consent. Availability is narrower than the law: for example, RWJBarnabas Health's PROUD Gender Center of New Jersey lists hormone therapy and surgery for ages 19 and older. Call ahead to confirm a clinic sees patients under 18 or 19.
    es: |
      Legal. Nueva Jersey no prohíbe la atención de afirmación de género para menores, y la ley escudo de 2026 y la Orden Ejecutiva 326 protegen a familias y proveedores frente a acciones de otros estados. La atención de menores requiere consentimiento de un padre, madre o tutor. La disponibilidad es más limitada que la ley: por ejemplo, el PROUD Gender Center de RWJBarnabas Health ofrece hormonas y cirugía desde los 19 años. Llama antes para confirmar si una clínica atiende a menores.
  sources: [pl2026-c74, eo-326, map-shield, proud-nb]
medicaid:
  program_name: NJ FamilyCare
  covers_hrt: "yes"
  covers_surgery: "yes"
  detail:
    en: |
      Under P.L.2017, c.176 (N.J.S.A. 30:4D-9.1), plans that contract with the state to serve NJ FamilyCare members may not discriminate based on gender identity or expression. That includes denying care related to gender transition, such as hormone therapy, hysterectomy, mastectomy, and vocal training, when the plan covers those services for other reasons. The Movement Advancement Project lists New Jersey Medicaid as covering transgender-related care.

      **Who qualifies**: adults 19 to 64 with income up to 138% of the federal poverty level (about $1,836 a month for one person); higher limits for children and pregnant people. Children under 19 can enroll regardless of immigration status (Cover All Kids).

      **Apply** online at njfamilycare.org or call 1-800-701-0710 (TTY 711).
    es: |
      Según P.L.2017, c.176 (N.J.S.A. 30:4D-9.1), los planes que atienden a miembros de NJ FamilyCare no pueden discriminar por identidad o expresión de género, incluido negar atención relacionada con la transición, como terapia hormonal, histerectomía, mastectomía y entrenamiento vocal, cuando el plan cubre esos servicios por otros motivos.

      **Quién califica**: adultos de 19 a 64 años con ingresos hasta el 138% del nivel federal de pobreza (unos $1,836 al mes para una persona). Los menores de 19 años pueden inscribirse sin importar su estatus migratorio (Cover All Kids).

      **Solicita** en njfamilycare.org o llama al 1-800-701-0710 (TTY 711).
  how_to_apply_url: https://njfamilycare.dhs.state.nj.us/
  sources: [pl2017-c176, map-profile, njfc-eligibility, njfc-home]
private_insurance:
  nondiscrimination_protection: true
  detail:
    en: |
      P.L.2017, c.176 bars state-regulated health insurers, HMOs, and the State and School Employees' Health Benefits plans from denying, limiting, or charging more for coverage because you are transgender, from treating gender identity as a preexisting condition, and from denying transition-related care (for example hormone therapy, hysterectomy, mastectomy, vocal training) that the plan covers for other purposes. If your plan denies care, appeal with the plan first, then file a complaint with the NJ Department of Banking and Insurance. Self-funded employer plans are federally regulated and may not be covered by this law.
    es: |
      P.L.2017, c.176 prohíbe a las aseguradoras y HMO regulados por el estado, y a los planes de beneficios de empleados estatales y escolares, negar, limitar o cobrar más por ser una persona trans, tratar la identidad de género como condición preexistente o negar atención de transición (por ejemplo terapia hormonal, histerectomía, mastectomía, entrenamiento vocal) que el plan cubre para otros fines. Si tu plan niega la atención, apela primero ante el plan y luego presenta una queja ante el Departamento de Banca y Seguros de NJ. Los planes autofinanciados por empleadores se rigen por ley federal y pueden no estar cubiertos.
  complaint_url: https://www.nj.gov/dobi/consumer.htm
  sources: [pl2017-c176, dobi-consumer]
