      en: Free legal guidance and document preparation for trans adults (and minors with parental consent) who live in Bergen, Hudson, or Passaic County and meet income limits, through Northeast New Jersey Legal Services and volunteer attorneys. Does not pay filing fees, but helps you apply for a fee waiver. Call 973-509-5428.
      es: Orientación legal y preparación de documentos gratuitas para adultos trans (y menores con consentimiento de los padres) que viven en los condados de Bergen, Hudson o Passaic y cumplen límites de ingresos, a través de Northeast New Jersey Legal Services y abogados voluntarios. No paga tarifas, pero ayuda a pedir la exención. Llama al 973-509-5428.
    url: https://www.gardenstateequality.org/programs/name-change-project/
    phone: "973-509-5428"
    areas_served:
      en: Bergen, Hudson, and Passaic counties
      es: Condados de Bergen, Hudson y Passaic
    cost: free
    verification: org_website
    sources: [gse-ncp]
  - id: a4te-ncp
    org: a4te
    name: Advocates for Trans Equality, Name Change Project (New Jersey)
    type: name_change_clinic
    pillars: [name_change]
    description:
      en: Connects low-income transgender, nonbinary, and gender nonconforming people in several New Jersey counties with free legal representation for their name change. Apply through A4TE's website.
      es: Conecta a personas trans, no binarias y de género no conforme de bajos ingresos en varios condados de Nueva Jersey con representación legal gratuita para su cambio de nombre.
    url: https://transequality.org/documents/new-jersey-identity-documents
    cost: free
    verification: org_website
    sources: [a4te-nj]
  - id: lsnj-hotline
